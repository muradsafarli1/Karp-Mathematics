<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Problems</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<script src="/mathnet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]]},svg:{fontCache:"global"},startup:{typeset:false}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
.problem-tools{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:10px;margin-bottom:18px}
.problem-archive-status{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:0 0 10px}.problem-archive-status strong{color:var(--text)}
.problem-progress{height:3px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:18px}.problem-progress>i{display:block;height:100%;width:0;background:var(--text);transition:width .2s}
.virtual-cards{position:relative}.virtual-card{position:absolute;box-sizing:border-box;padding:0 7px 14px}
.problem-card-link{display:flex!important;height:100%;min-height:178px;box-sizing:border-box;flex-direction:column;justify-content:flex-start;text-decoration:none!important;background:var(--panel2)!important;border:1px solid transparent!important;border-radius:16px;padding:21px!important;box-shadow:none!important;transition:transform .15s,background .15s}
.problem-card-link:hover{transform:translateY(-2px);background:var(--panel2)!important}
.problem-card-link .tag{align-self:flex-start}.problem-card-link h3{font-family:'Space Grotesk';font-size:21px;line-height:1.14;letter-spacing:-.7px;margin:16px 0 9px;text-align:left!important;color:var(--text)!important}
.problem-meta-primary{font-size:12px;font-weight:800;color:var(--text);margin-top:auto}.problem-meta-secondary{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.archive-loading{padding:45px 0;text-align:center;color:var(--muted)}.empty-archive{padding:70px 0;text-align:center;color:var(--muted)}
@media(max-width:1050px){.problem-tools{grid-template-columns:1fr}.virtual-card{padding-left:6px;padding-right:6px}}
</style>
</head>
<body>
<script>
(async()=>{
  const topicNames={A:'Algebra',C:'Combinatorics',G:'Geometry',N:'Number Theory'};
  let allRows=[],visibleRows=[],query='',topic='All topics',raf=0,pendingRestore=0;

  function esc(x){return escapeHtml(x==null?'':String(x));}
  function stateKey(){return 'karp-problems-state-v2';}
  function saveState(){sessionStorage.setItem(stateKey(),JSON.stringify({query,topic,scrollY:window.scrollY}));}
  function restoreState(){try{const s=JSON.parse(sessionStorage.getItem(stateKey())||'null');if(!s)return 0;query=s.query||'';topic=s.topic||'All topics';return Number(s.scrollY)||0}catch{return 0}}
  function customCategory(p){
    const v=String(p.topic||'').toLowerCase();
    if(v.includes('algebra'))return'A';if(v.includes('geometry'))return'G';if(v.includes('combinator'))return'C';if(v.includes('number')||v.includes('theory'))return'N';return'A';
  }
  function normalizeCustom(p){
    const id=String(p.id||'');const title=p.titleEn||p.title||'KARP Problem';const statement=p.statementEn||p.statement||'';
    const solution=p.solutionEn||p.solution||'';const created=p.createdAt?new Date(p.createdAt).getFullYear():'';
    const category=customCategory(p);
    return {id:'custom-'+id,customId:id,sourceType:'custom',country:'KARP',competition:title,year:p.year||created||'',problemNumber:p.code||'',section:'KARP Problems',language:'English',problemType:'proof only',statement,solutions:solution?[solution]:[],category,difficulty:String(p.difficulty||'').toLowerCase(),hasSolution:!!solution,title};
  }
  function metaPrimary(p){return [p.country,p.year,p.problemNumber].filter(Boolean).join(' · ')||'KARP';}
  function cardHtml(p){
    const custom=p.sourceType==='custom';
    const href=custom
      ?'/problem.html?custom='+encodeURIComponent(p.customId)
      :'/problem.html?id='+encodeURIComponent(p.id)+'&config='+encodeURIComponent(p.sourceConfig||'all')+'&offset='+encodeURIComponent(p.sourceIndex)+(p.sourceShard!=null?'&shard='+encodeURIComponent(p.sourceShard):'');
    const secondary=[p.competition&&p.sourceType!=='custom'?p.competition:'',p.section].filter(Boolean).join(' · ');
    return '<a class="problem-card-link" href="'+href+'" onclick="rememberProblemState()"><div class="tag">'+esc(topicNames[p.category]||'Problem')+'</div><h3>'+esc(custom?(p.title||'KARP Problem'):(p.competition||'MathNet Problem'))+'</h3><div class="problem-meta-primary">'+esc(metaPrimary(p))+'</div>'+(secondary?'<div class="problem-meta-secondary">'+esc(secondary)+'</div>':'')+'</a>';
  }
  function columns(){const w=document.getElementById('cards').clientWidth||1200;if(w>=1180)return 4;if(w>=820)return 3;if(w>=560)return 2;return 1;}
  function renderVirtual(){
    const holder=document.getElementById('cards');if(!holder)return;
    const cols=columns(),rowHeight=205,totalRows=Math.ceil(visibleRows.length/cols);
    holder.style.height=(totalRows*rowHeight)+'px';
    const top=holder.getBoundingClientRect().top+window.scrollY;
    const from=Math.max(0,Math.floor((window.scrollY-top)/rowHeight)-3);
    const to=Math.min(totalRows,from+Math.ceil(window.innerHeight/rowHeight)+8);
    let html='';
    for(let r=from;r<to;r++)for(let col=0;col<cols;col++){const index=r*cols+col;if(index>=visibleRows.length)break;html+='<div class="virtual-card" style="top:'+(r*rowHeight)+'px;left:'+(col*100/cols)+'%;width:'+(100/cols)+'%">'+cardHtml(visibleRows[index])+'</div>';}
    holder.innerHTML=html;
  }
  function applyFilters(){
    const q=query.trim().toLowerCase();
    visibleRows=allRows.filter(p=>{
      if(topic!=='All topics'&&topicNames[p.category]!==topic)return false;
      if(!q)return true;
      return [p.title,p.country,p.competition,p.year,p.problemNumber,p.section,p.sourceBooklet,p.statement].join(' ').toLowerCase().includes(q);
    });
    document.getElementById('count').innerHTML='<strong>'+visibleRows.length.toLocaleString()+'</strong> qualifying problems';
    document.getElementById('no-results').style.display=visibleRows.length?'none':'block';
    renderVirtual();
  }
  window.rememberProblemState=saveState;

  async function init(){
    pendingRestore=restoreState();
    shell('Problems','Problems','<main class="problem-page"><section class="pagehero"><div class="wrap"><div class="eyebrow">01 — Problems</div><h1>MathNet Problems</h1><p class="lead">MathNet and KARP-added olympiad problems in one searchable archive.</p></div></section><section class="section"><div class="wrap" style="max-width:1320px"><div class="problem-tools"><input id="search" class="input" placeholder="Search country, contest, year, P-number or problem text…"><select id="topic" class="select"><option>All topics</option><option>Algebra</option><option>Geometry</option><option>Number Theory</option><option>Combinatorics</option></select></div><div class="problem-archive-status"><span id="status">Opening the problem archive…</span><span id="count">0 qualifying problems</span></div><div class="problem-progress"><i id="progress"></i></div><div id="cards" class="virtual-cards"></div><div id="no-results" class="empty-archive" style="display:none">No qualifying problems match this search.</div></div></section></main>');
    document.getElementById('search').value=query;document.getElementById('topic').value=topic;
    document.getElementById('search').oninput=function(){query=this.value;saveState();applyFilters()};
    document.getElementById('topic').onchange=function(){topic=this.value;saveState();applyFilters()};
    window.addEventListener('scroll',function(){if(!raf)raf=requestAnimationFrame(function(){raf=0;renderVirtual()})});
    window.addEventListener('resize',renderVirtual);

    let customRows=[];
    const manualPromise=api('/api/content').then(d=>(d.problems||[]).map(normalizeCustom)).catch(()=>[]);
    const mathPromise=mathnetLoadAllIndex(function(loaded,total,complete,saved){
      const pct=total?Math.min(100,Math.round(loaded/total*100)):0;
      document.getElementById('progress').style.width=pct+'%';
      document.getElementById('status').textContent=complete?'Complete archive loaded and cached locally.':'Showing available problems now · loading the rest in background… '+loaded.toLocaleString()+' / '+total.toLocaleString();
      if(saved!=null&&!complete)document.getElementById('count').innerHTML='<strong>'+Number(saved).toLocaleString()+'</strong> MathNet problems cached';
    },function(initialRows){
      allRows=[...customRows,...initialRows];applyFilters();
      document.getElementById('status').textContent='Problems are open now · the rest of the archive is loading in background…';
      if(pendingRestore>20&&initialRows.length>20)setTimeout(()=>window.scrollTo({top:pendingRestore,behavior:'auto'}),50);
    });

    customRows=await manualPromise;
    allRows=[...customRows,...allRows.filter(x=>x.sourceType!=='custom')];
    applyFilters();

    allRows=await mathPromise;
    allRows=[...customRows,...allRows.filter(x=>x.sourceType!=='custom')];
    applyFilters();
    document.getElementById('progress').style.width='100%';
    document.getElementById('status').textContent='Complete archive loaded and cached locally.';
    if(pendingRestore>20)setTimeout(()=>window.scrollTo({top:pendingRestore,behavior:'auto'}),80);
  }

  init().catch(e=>{document.body.innerHTML='<div class="error-page"><div><h1>Problem archive could not load</h1><p>'+esc(e.message||String(e))+'</p><a href="/">Return to KARP</a></div></div>'});
})();
</script>
</body>
</html>
