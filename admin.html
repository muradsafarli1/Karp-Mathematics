<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARP — Admin</title><link rel="stylesheet" href="/style.css"><script src="/app.js?v=20260929"></script><style>
.admin-mock-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.admin-mock-card{background:#f7f7f5;border:1px solid #e3e7ea;border-radius:18px;padding:17px;box-shadow:0 7px 24px rgba(20,27,34,.04)}.admin-mock-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.admin-mock-card h3{font:800 17px/1.25 'Space Grotesk';margin:13px 0 5px}.admin-mock-owner,.admin-mock-meta{font-size:9px;color:#78828b;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.admin-mock-card details{margin-top:12px;border-top:1px solid #d9dad8;padding-top:10px}.admin-mock-card summary{cursor:pointer;font-size:9px;font-weight:800;color:#59636c}.admin-mock-questions{display:grid;gap:8px;margin-top:9px}.admin-mock-questions section{background:#f7f7f5;border-radius:11px;padding:9px}.admin-mock-questions strong{font-size:9px}.admin-mock-questions div{margin-top:4px;font-size:9px;line-height:1.6;white-space:pre-wrap}.admin-mock-questions small{display:block;margin-top:5px;color:#8b949c;font-size:7px}.more-row{display:flex;justify-content:center;margin:14px 0}.more-btn{border:0;background:#f7f7f5;border-radius:10px;padding:9px 13px;font-size:9px;font-weight:800;color:#58616a;cursor:pointer}@media(max-width:850px){.admin-mock-grid{grid-template-columns:1fr}}

.live-presence{width:min(calc(100% - 42px),1400px);margin:18px auto 0;padding:14px 16px;border:1px solid #d9dad8;border-radius:18px;background:#f7f7f5;box-shadow:0 8px 28px rgba(20,24,30,.05)}.live-presence-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.live-presence-head strong{font:800 15px/1 'Space Grotesk'}.live-presence-count{font-size:9px;color:#6f7880;font-weight:800}.live-presence-grid{display:flex;gap:8px;overflow:auto}.live-person{min-width:190px;padding:10px 12px;border:1px solid #d9dad8;border-radius:13px;background:#f7f7f5}.live-person-top{display:flex;align-items:center;gap:8px}.live-dot{width:8px;height:8px;border-radius:50%;background:#20a35b;box-shadow:0 0 0 3px rgba(32,163,91,.1);flex:0 0 8px}.live-name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.live-activity{font-size:8px;line-height:1.5;color:#69727b;margin-top:6px}.live-empty{font-size:9px;color:#89929a}
</style><style>
/* Advanced admin visual skin */
.admin,.live-presence,.admin-main,.admin-side{background:#f7f7f5!important;box-shadow:none!important}
.live-presence{border-color:#d9dad8!important}
.admin-mock-card,.live-person,.admin-exam-card,.admin-user-summary,.admin-kpi-bar,.admin-participants{background:#f7f7f5!important;border-color:#d9dad8!important;box-shadow:none!important}
.admin-mock-questions section{background:#f7f7f5!important}
.admin-online-dot,.admin-offline-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:#2a9d57;vertical-align:middle}
.admin-offline-dot{background:#a7a39c}
.admin-exam-card{padding:20px;border:1px solid #d9dad8;border-radius:16px;margin-bottom:12px}
.admin-exam-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.admin-exam-head h3{font:800 20px/1.2 'Space Grotesk';margin:8px 0}
.admin-exam-head p{margin:0;color:#6f665d;font-size:11px}
.admin-exam-counts{display:flex;flex-direction:column;align-items:flex-end}
.admin-exam-counts strong{font:800 26px/1 'Space Grotesk'}
.admin-exam-counts span{color:#6f665d;font-size:9px;margin-top:4px}
.admin-participants{margin-top:15px;overflow:auto;border:1px solid #d9dad8;border-radius:12px;padding:4px}
.admin-user-summary,.admin-kpi-bar{margin-bottom:12px;padding:14px 16px;border-radius:14px}
.admin-kpi-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.admin-kpi-bar div{padding:12px;border-radius:11px;background:#f7f7f5;border:1px solid #d9dad8}
.admin-kpi-bar strong{display:block;font:800 22px/1 'Space Grotesk'}.admin-kpi-bar span{display:block;color:#6f665d;font-size:9px;margin-top:5px}
@media(max-width:800px){.admin-exam-head{flex-direction:column}.admin-exam-counts{align-items:flex-start}.admin-kpi-bar{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script>
let state={type:'problems',editing:null},liveDocs=[],liveUnsub=null,liveTimer=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const u=await requireAdmin();if(!u)return;let db;try{({db}=await fb());const {doc,setDoc}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');const now=new Date().toISOString();await setDoc(doc(db,'publicProfiles',u.id),{uid:u.id,name:u.name||'KARP Admin',nameLower:String(u.name||'KARP Admin').trim().toLowerCase(),photoURL:u.photoURL||'',isAdmin:true,updatedAt:now},{merge:true})}catch(e){console.warn('Could not sync admin public profile',e)}document.getElementById('root').innerHTML=`<header class="top"><div class="wrap nav"><a class="brand" href="/">KARP</a><div class="actions"><span style="color:#aeb7c8">${esc(u.name)}</span><a class="btn" href="/">View site</a><button class="btn" onclick="logout()">Log out</button></div></div></header><section class="live-presence" id="live-presence"><div class="live-presence-head"><strong>Live now</strong><span class="live-presence-count">Loading…</span></div><div class="live-presence-grid"><span class="live-empty">Loading live activity…</span></div></section><main class="admin"><div class="wrap"><div class="admin-grid"><aside class="admin-side"><button class="active" data-type="problems">Problems</button><button data-type="contests">Contests</button><button data-type="articles">Articles</button><button data-type="exams">Exams</button><button data-type="videos">Videos</button><button type="button" onclick="location.href='/mathnet-sync.html'">MathNet Sync</button><button data-type="mocks">Mocks</button><button data-type="users">Users</button></aside><section class="admin-main" id="main"></section></div></div></main>`;initLivePresence(db);document.querySelectorAll('.admin-side button').forEach(b=>b.onclick=()=>{syncCurrent();document.querySelectorAll('.admin-side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.type=b.dataset.type;state.editing=null;render()});render()}
document.addEventListener('DOMContentLoaded',init);
function examList(d){return Array.isArray(d)?d:(d?.exams||[])}
function presenceMillis(v){return v?.toMillis?v.toMillis():Number(v)||0}
function renderLivePresence(){const el=document.getElementById('live-presence');if(!el)return;const now=Date.now(),rows=liveDocs.filter(p=>p.online&&presenceMillis(p.expiresAt)>now).sort((a,b)=>presenceMillis(b.lastSeen)-presenceMillis(a.lastSeen));const people=rows.map(p=>{const a=p.activity||{},where=a.page==='Exam'?'Exam':a.page==='Mock'?'Mock':a.page||'KARP',detail=a.detail||a.label||'Browsing',q=a.question?(' · Problem '+a.question):'';return '<div class="live-person"><div class="live-person-top"><span class="live-dot"></span><span class="live-name">'+escapeHtml(p.name||'KARP Member')+'</span></div><div class="live-activity">'+escapeHtml(where+' · '+detail+q)+'</div></div>'}).join('');el.innerHTML='<div class="live-presence-head"><strong>Live now</strong><span class="live-presence-count">'+rows.length+' online</span></div><div class="live-presence-grid">'+(people||'<span class="live-empty">No active users right now.</span>')+'</div>'}
function initLivePresence(db){}

async function render(){
  const m=document.getElementById('main');if(!m)return;

  if(state.type==='mocks'){
    try{
      const {db}=await fb();
      const {collection,collectionGroup,getDocs,deleteDoc,doc}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
      const [mockSnap,userSnap]=await Promise.all([getDocs(collectionGroup(db,'mockHistory')),getDocs(collection(db,'users'))]);
      const usersById=new Map(userSnap.docs.map(x=>[x.id,x.data()]));
      let mocks=mockSnap.docs.map(x=>{const d=x.data(),owner=x.ref.parent.parent?.id||'';return{...d,id:x.id,ownerUid:owner,ownerName:usersById.get(owner)?.name||'KARP Member',ownerEmail:usersById.get(owner)?.email||''}});
      mocks.sort((a,b)=>new Date(b.completedAt||b.savedAt||b.createdAt||0)-new Date(a.completedAt||a.savedAt||a.createdAt||0));
      m.innerHTML='<div class="admin-head"><div><h2>Mocks</h2><span class="admin-count">'+mocks.length+' saved / completed</span></div></div>'+
        '<div class="bigcard admin-kpi-bar"><div><strong>'+mocks.length+'</strong><span>All mocks</span></div><div><strong>'+mocks.filter(x=>x.status==='completed'||x.completedAt).length+'</strong><span>Completed</span></div><div><strong>'+mocks.filter(x=>x.status==='saved'&&!x.completedAt).length+'</strong><span>Saved drafts</span></div></div>'+
        '<div class="admin-mock-grid">'+(mocks.length?mocks.map(x=>{
          const saved=x.status==='saved'&&!x.completedAt,qs=x.questions||[];
          return '<article class="admin-mock-card"><div class="admin-mock-top"><span class="tag">'+(saved?'SAVED':'COMPLETED')+'</span><button class="btn danger" data-delete-admin-mock="'+escapeHtml(x.ownerUid)+'::'+escapeHtml(x.id)+'">Delete</button></div><h3>'+escapeHtml(x.title||'Untitled Mock')+'</h3><p class="admin-mock-owner">'+escapeHtml(x.ownerName)+' · '+escapeHtml(x.ownerEmail)+'</p><p class="admin-mock-meta">'+escapeHtml(qs.length+' questions · '+(x.minutes||0)+' min · '+(x.completedAt||x.savedAt||x.createdAt?new Date(x.completedAt||x.savedAt||x.createdAt).toLocaleString():'—'))+'</p><details><summary>View questions</summary><div class="admin-mock-questions">'+qs.map((q,i)=>'<section><strong>Q'+(i+1)+'</strong><div>'+richMarkdown(String(q.statement||''))+'</div><small>'+escapeHtml([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</small></section>').join('')+'</div></details></article>';
        }).join(''):'<div class="empty" style="grid-column:1/-1">No mocks have been saved yet.</div>')+'</div>';
      typesetMath(m);
      document.querySelectorAll('[data-delete-admin-mock]').forEach(btn=>btn.onclick=async()=>{
        if(!confirm('Delete this mock permanently?'))return;
        const parts=btn.dataset.deleteAdminMock.split('::');
        try{await deleteDoc(doc(db,'users',parts[0],'mockHistory',parts[1]));toast('Mock deleted.');render()}catch(e){toast(e.message||'Could not delete mock.')}
      });
    }catch(e){m.innerHTML='<div class="bigcard"><h3>Could not load mocks</h3><p>'+escapeHtml(e.message||'Check Firestore permissions.')+'</p></div>'}
    return;
  }

  if(state.type==='users'){
    try{
      const d=await api('/api/admin/users');
      const users=d.users||[];
      const presenceLabel=u=>{
        const a=u.activity||{};
        return a.page?((a.label||a.page)+(a.detail?' · '+a.detail:'')+(a.question?' · Problem '+a.question:'')):'Not active';
      };
      const fmtLast=u=>u.online?'Online now':(u.lastSeen?new Date(u.lastSeen).toLocaleString():'Never');
      m.innerHTML='<div class="admin-head"><div><h2>Users</h2><span class="admin-count">'+users.length+' users</span></div></div>'+
        '<div class="bigcard admin-user-summary"><strong>'+users.filter(u=>u.online).length+'</strong> online · <strong>'+users.filter(u=>!u.online).length+'</strong> offline · last-seen and current activity are shown below.</div>'+
        '<div class="bigcard" style="overflow-x:auto"><table class="table"><thead><tr><th>Status</th><th>Name</th><th>Email</th><th>Role</th><th>Last login</th><th>Last seen</th><th>Current activity</th><th>Logins</th></tr></thead><tbody>'+
        users.slice().sort((x,y)=>Number(y.online)-Number(x.online)||new Date(y.lastLoginAt||0)-new Date(x.lastLoginAt||0)).map(u=>'<tr><td><span class="'+(u.online?'admin-online-dot':'admin-offline-dot')+'"></span>'+ (u.online?'Online':'Offline') +'</td><td>'+esc(u.name||'—')+'</td><td>'+esc(u.email||'—')+'</td><td>'+esc(u.role||'user')+'</td><td>'+(u.lastLoginAt?new Date(u.lastLoginAt).toLocaleString():'Never')+'</td><td>'+fmtLast(u)+'</td><td>'+esc(presenceLabel(u))+'</td><td>'+Number(u.loginCount||0)+'</td></tr>').join('')+
        '</tbody></table></div>';
    }catch(e){m.innerHTML='<div class="bigcard"><h3>Could not load users</h3><p>'+esc(e.message)+'</p></div>'}
    return;
  }

  if(state.type==='exams'){
    try{
      const {db}=await fb();
      const {collection,getDocs}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
      const [examSnap,userSnap,presenceSnap,sessionSnap]=await Promise.all([
        getDocs(collection(db,'exams')),
        getDocs(collection(db,'users')),
        getDocs(collection(db,'presence')),
        getDocs(collection(db,'examSessions'))
      ]);
      const usersById=new Map(userSnap.docs.map(x=>[x.id,x.data()]));
      const presenceByUid=new Map(presenceSnap.docs.map(x=>{const d=x.data()||{},exp=d.expiresAt?.toMillis?d.expiresAt.toMillis():Number(d.expiresAt||0);return[x.id,{...d,online:!!d.online&&exp>Date.now()}]}));
      const sessions=sessionSnap.docs.map(x=>({id:x.id,...x.data()}));
      const fmtTime=v=>v?new Date(v).toLocaleString():'—';
      const fmtDuration=sec=>{const n=Math.max(0,Number(sec||0));if(!n)return'—';const h=Math.floor(n/3600),m=Math.floor((n%3600)/60),ss=n%60;return h?(h+'h '+m+'m'):(m+'m '+ss+'s')};
      const examBase=await Promise.all(examSnap.docs.map(async x=>{
        const [regSnap,subSnap]=await Promise.all([
          getDocs(collection(db,'exams',x.id,'registrations')),
          getDocs(collection(db,'exams',x.id,'submissions'))
        ]);
        return {id:x.id,...x.data(),regs:regSnap.docs.map(d=>({id:d.id,...d.data()})),subs:subSnap.docs.map(d=>({id:d.id,...d.data()}))};
      }));
      const exams=examBase.sort((a,b)=>new Date(String(b.date||b.createdAt||0))-new Date(String(a.date||a.createdAt||0)));
      m.innerHTML='<div class="admin-head"><div><h2>Exams</h2><span class="admin-count">'+exams.length+' exams · participant/session analytics</span></div><button class="btn primary" onclick="newItem()">+ New</button></div>'+
        '<div class="admin-exam-list">'+(exams.length?exams.map(ex=>{
          const regs=ex.regs||[], submissions=ex.subs||[];
          const regIds=regs.map(r=>String(r.userId||r.uid||r.id||'')).filter(Boolean);
          const subIds=submissions.map(r=>String(r.userId||r.uid||r.id||'')).filter(Boolean);
          const esessions=sessions.filter(z=>String(z.examId)===String(ex.id));
          const ids=[...new Set(regIds.concat(subIds,esessions.map(z=>String(z.uid||'')).filter(Boolean)))];
          const people=ids.map(uid=>{
            const u=usersById.get(uid)||{},p=presenceByUid.get(uid)||{},ses=esessions.find(z=>String(z.uid)===uid)||{},reg=regs.find(z=>String(z.userId||z.uid||z.id)===uid)||{};
            const sub=submissions.find(z=>String(z.userId||z.uid||z.id)===uid)||{};
            const startedAt=ses.startedAt||ses.entryAt||sub.startedAt||null;
            const endedAt=ses.endedAt||ses.exitAt||sub.submittedAt||null;
            const durationSeconds=Number(ses.durationSeconds||0)||((startedAt&&endedAt)?Math.max(0,Math.round((Date.parse(endedAt)-Date.parse(startedAt))/1000)):(startedAt&&p.online?Math.max(0,Math.round((Date.now()-Date.parse(startedAt))/1000)):0));
            return {uid,name:u.name||p.name||'KARP Member',email:u.email||'—',online:!!p.online,lastSeen:p.lastSeen?.toDate?p.lastSeen.toDate().toLocaleString():(p.lastSeen?String(p.lastSeen):'—'),activity:p.activity||{},registeredAt:reg.registeredAt||null,startedAt,endedAt,exitObservedAt:ses.exitObservedAt||null,durationSeconds,status:ses.status||((sub.submittedAt)?'completed':'registered'),reason:ses.exitReason||sub.reason||''};
          });
          return '<article class="admin-exam-card"><div class="admin-exam-head"><div><span class="tag">'+escapeHtml(ex.status||'Upcoming')+'</span><h3>'+escapeHtml(ex.titleEn||ex.title||'Untitled exam')+'</h3><p>'+escapeHtml((ex.date||'Date TBA')+' · '+(ex.questions||[]).length+' questions · '+(ex.durationMinutes||60)+' min')+'</p></div><div class="admin-exam-counts"><strong>'+people.length+'</strong><span>tracked participants</span></div></div><details><summary>Participants & session timeline</summary><div class="admin-participants"><table class="table"><thead><tr><th>Status</th><th>Name</th><th>Email</th><th>Registered</th><th>Entered</th><th>Exited</th><th>Time stayed</th><th>Last seen</th><th>Activity</th></tr></thead><tbody>'+
          (people.length?people.map(p=>'<tr><td><span class="'+(p.online?'admin-online-dot':'admin-offline-dot')+'"></span>'+escapeHtml(p.online?'Online':p.status)+'</td><td>'+escapeHtml(p.name)+'</td><td>'+escapeHtml(p.email)+'</td><td>'+fmtTime(p.registeredAt)+'</td><td>'+fmtTime(p.startedAt)+'</td><td>'+fmtTime(p.endedAt||p.exitObservedAt)+'</td><td>'+fmtDuration(p.durationSeconds)+'</td><td>'+escapeHtml(p.online?'Now':p.lastSeen)+'</td><td>'+escapeHtml(p.activity?.label||p.activity?.page||'—')+(p.activity?.question?' · Q'+p.activity.question:'')+'</td></tr>').join(''):'<tr><td colspan="9">No participant session data yet.</td></tr>')+
          '</tbody></table></div></details></article>';
        }).join(''):'<div class="empty">No exams available.</div>')+'</div>'+
        (state.editing?formHtml(state.editing):'');
    }catch(e){console.error(e);m.innerHTML='<div class="bigcard"><h3>Could not load exam analytics</h3><p>'+escapeHtml(e.message||'Deploy the latest Firestore rules.')+'</p></div>'}
    return;
  }

  try{
    const endpoint='/api/admin/'+state.type;
    const d=await api(endpoint);
    const items=state.type==='videos'?(d.videos||[]):(d[state.type]||[]);
    m.innerHTML='<div class="admin-head"><div><h2>'+state.type[0].toUpperCase()+state.type.slice(1)+'</h2><span class="admin-count">'+items.length+' items</span></div><button class="btn primary" onclick="newItem()">+ New</button></div>'+
      '<div class="rows">'+(items.map(x=>'<div class="row"><div><h3>'+esc(x.titleEn||x.title||'Untitled')+'</h3><p>'+esc(x.descriptionEn||x.description||x.excerptEn||x.excerpt||x.topic||'')+(state.type==='contests'?' · '+(x.problems||[]).length+' problems':'')+'</p></div><div>'+esc(x.status||'published')+'</div><div class="right"><button class="btn" data-edit-id="'+esc(x.id)+'">Edit</button> <button class="btn danger" data-remove-id="'+esc(x.id)+'">Delete</button></div></div>').join('')||'<div class="empty">No items found.</div>')+'</div>'+
      (state.editing?formHtml(state.editing):'');
    m.querySelectorAll('[data-edit-id]').forEach(btn=>btn.onclick=()=>editItem(btn.dataset.editId));
    m.querySelectorAll('[data-remove-id]').forEach(btn=>btn.onclick=()=>removeItem(btn.dataset.removeId));
  }catch(e){m.innerHTML='<div class="bigcard"><h3>Could not load content</h3><p>'+esc(e.message)+'</p></div>'}
}function newItem(){if(state.type==='exams')state.editing={id:null,titleEn:'',titleAz:'',descriptionEn:'',descriptionAz:'',date:'',durationMinutes:60,status:'Upcoming',questions:[]};else if(state.type==='contests')state.editing={id:null,titleEn:'',titleAz:'',year:'',type:'Contest',descriptionEn:'',descriptionAz:'',status:'published',problems:[]};else if(state.type==='problems')state.editing={id:null,titleEn:'',titleAz:'',source:'',topic:'',difficulty:'',statementEn:'',statementAz:'',solutionEn:'',solutionAz:'',status:'published'};else if(state.type==='videos')state.editing={id:null,titleEn:'',titleAz:'',descriptionEn:'',descriptionAz:'',thumbnail:'',youtubeUrl:'',videoUrl:'',status:'published'};else state.editing={id:null,titleEn:'',titleAz:'',category:'',excerptEn:'',excerptAz:'',bodyEn:'',bodyAz:'',status:'published'};render()}
function normalizeItem(x){if(!x)return x;if(state.type==='problems')return{...x,titleEn:x.titleEn||x.title||'',titleAz:x.titleAz||'',statementEn:x.statementEn||x.statement||'',statementAz:x.statementAz||'',solutionEn:x.solutionEn||x.solution||'',solutionAz:x.solutionAz||'',source:x.source||x.sourceName||''};if(state.type==='articles')return{...x,titleEn:x.titleEn||x.title||'',titleAz:x.titleAz||'',excerptEn:x.excerptEn||x.excerpt||'',excerptAz:x.excerptAz||'',bodyEn:x.bodyEn||x.body||'',bodyAz:x.bodyAz||''};if(state.type==='contests')return{...x,titleEn:x.titleEn||x.title||'',titleAz:x.titleAz||'',descriptionEn:x.descriptionEn||x.description||'',descriptionAz:x.descriptionAz||'',problems:(x.problems||[]).map((p,i)=>({...p,code:p.code||'A'+(i+1),statementEn:p.statementEn||p.statement||'',statementAz:p.statementAz||'',imageUrl:p.imageUrl||p.image||''}))};if(state.type==='videos')return{...x,titleEn:x.titleEn||x.title||'',titleAz:x.titleAz||'',descriptionEn:x.descriptionEn||x.description||'',descriptionAz:x.descriptionAz||'',thumbnail:x.thumbnail||x.thumbnailUrl||x.image||'',youtubeUrl:x.youtubeUrl||x.youtube||x.url||'',videoUrl:x.videoUrl||x.fileUrl||'',status:x.status||'published'};return{...x,titleEn:x.titleEn||x.title||'',titleAz:x.titleAz||'',descriptionEn:x.descriptionEn||x.description||'',descriptionAz:x.descriptionAz||'',questions:(x.questions||[]).map((q,i)=>({...q,code:q.code||'Q'+(i+1),statementEn:q.statementEn||q.statement||q.text||'',statementAz:q.statementAz||'',imageUrl:q.imageUrl||q.image||''}))}}
async function editItem(id){try{const endpoint=state.type==='exams'?'/api/admin/exams':state.type==='videos'?'/api/admin/videos':'/api/content';const d=await api(endpoint);const list=state.type==='exams'?examList(d):state.type==='videos'?(d.videos||[]):(d[state.type]||[]);state.editing=normalizeItem(list.find(x=>x.id===id));render()}catch(e){toast(e.message)}}
function langFields(x,enKey,azKey,labelEn,labelAz,rows=4){return `<div class="formgrid"><div class="field"><label>${labelEn}</label><textarea class="textarea" id="f-${enKey}" rows="${rows}">${esc(x[enKey]||'')}</textarea></div><div class="field"><label>${labelAz}</label><textarea class="textarea" id="f-${azKey}" rows="${rows}">${esc(x[azKey]||'')}</textarea></div></div>`}
function inputPair(x,enKey,azKey,labelEn,labelAz){return `<div class="formgrid"><div class="field"><label>${labelEn}</label><input class="input" id="f-${enKey}" value="${esc(x[enKey]||'')}"></div><div class="field"><label>${labelAz}</label><input class="input" id="f-${azKey}" value="${esc(x[azKey]||'')}"></div></div>`}
function formHtml(x){if(state.type==='exams')return `<div class="editor-card"><div class="tag">${x.id?'EDIT':'CREATE'} EXAM</div>${inputPair(x,'titleEn','titleAz','Title — English','Title — Azərbaycan dili')}<div class="formgrid"><div class="field"><label>Date / start time</label><input class="input" id="f-date" value="${esc(x.date||'')}" placeholder="2026-09-15 10:00"></div><div class="field"><label>Duration (minutes)</label><input class="input" id="f-durationMinutes" type="number" min="1" value="${Number(x.durationMinutes||60)}"></div><div class="field"><label>Status</label><select class="select" id="f-status"><option ${x.status==='Upcoming'?'selected':''}>Upcoming</option><option ${x.status==='Open'?'selected':''}>Open</option><option ${x.status==='Finished'?'selected':''}>Finished</option></select></div></div>${langFields(x,'descriptionEn','descriptionAz','Description — English','Description — Azərbaycan dili',3)}<div class="editor-section"><div class="editor-section-head"><div><h3>Questions</h3><p>Every question can have an English statement, Azerbaijani statement and an optional image.</p></div><button class="btn" onclick="addQuestion()">+ Add question</button></div><div id="question-editor">${questionEditor(x.questions||[],'exam')}</div></div><button class="btn primary" onclick="saveItem()">Save exam</button> <button class="btn" onclick="syncCurrent();state.editing=null;render()">Cancel</button></div>`;if(state.type==='contests')return `<div class="editor-card"><div class="tag">${x.id?'EDIT':'CREATE'} CONTEST</div>${inputPair(x,'titleEn','titleAz','Contest title — English','Contest title — Azərbaycan dili')}<div class="formgrid"><div class="field"><label>Year</label><input class="input" id="f-year" value="${esc(x.year||'')}"></div><div class="field"><label>Type</label><input class="input" id="f-type" value="${esc(x.type||'Contest')}"></div><div class="field"><label>Status</label><input class="input" id="f-status" value="${esc(x.status||'published')}"></div></div>${langFields(x,'descriptionEn','descriptionAz','Description — English','Description — Azərbaycan dili',4)}<div class="editor-section"><div class="editor-section-head"><div><h3>Contest problems</h3><p>Add A1, A2, A3, … or N1, N2, N3, etc. Each problem may have an optional image.</p></div><button class="btn" onclick="addContestProblem()">+ Add problem</button></div><div id="contest-problem-editor">${questionEditor(x.problems||[],'contest')}</div></div><button class="btn primary" onclick="saveItem()">Save contest</button> <button class="btn" onclick="syncCurrent();state.editing=null;render()">Cancel</button></div>`;if(state.type==='videos')return `<div class="editor-card"><div class="tag">${x.id?'EDIT':'CREATE'} VIDEO</div>${inputPair(x,'titleEn','titleAz','Video title — English','Video title — Azərbaycan dili')}<div class="field"><label>YouTube URL (optional)</label><input class="input" id="f-youtubeUrl" value="${esc(x.youtubeUrl||'')}" placeholder="https://www.youtube.com/watch?v=..."></div><div class="field"><label>Upload video from device</label><input class="input" id="f-videoFile" type="file" accept="video/*"><small style="display:block;margin-top:8px;opacity:.65">Choose a video file from your computer. No app-level file-size limit is enforced.</small>${x.videoUrl?'<div class="admin-upload-current">Current uploaded video is already attached.</div>':''}</div><div class="field"><label>Thumbnail image URL (optional)</label><input class="input" id="f-thumbnail" value="${esc(x.thumbnail||'')}" placeholder="https://.../thumbnail.jpg"></div><div class="field"><label>Upload thumbnail from device</label><input class="input" id="f-thumbnailFile" type="file" accept="image/*"><small style="display:block;margin-top:8px;opacity:.65">Choose an image from your computer. No app-level image-size limit is enforced.</small></div>${langFields(x,'descriptionEn','descriptionAz','Description — English','Description — Azərbaycan dili',4)}<div class="formgrid"><div class="field"><label>Status</label><select class="select" id="f-status"><option value="published" ${x.status!=='draft'?'selected':''}>Published</option><option value="draft" ${x.status==='draft'?'selected':''}>Draft</option></select></div></div><span id="admin-upload-status" class="admin-upload-status"></span><button class="btn primary" onclick="saveItem()">Save video</button> <button class="btn" onclick="syncCurrent();state.editing=null;render()">Cancel</button></div>`
;let fields='';if(state.type==='problems')fields=`${inputPair(x,'titleEn','titleAz','Title — English','Title — Azərbaycan dili')}<div class="field"><label>Source / Contest (optional)</label><input class="input" id="f-source" value="${esc(x.source||'')}" placeholder="e.g. APMO 2026"></div><div class="formgrid"><div class="field"><label>Topic</label><input class="input" id="f-topic" value="${esc(x.topic||'')}"></div><div class="field"><label>Difficulty</label><input class="input" id="f-difficulty" value="${esc(x.difficulty||'')}"></div><div class="field"><label>Status</label><input class="input" id="f-status" value="${esc(x.status||'published')}"></div></div>${langFields(x,'statementEn','statementAz','Problem statement — English','Problem statement — Azərbaycan dili',12)}${langFields(x,'solutionEn','solutionAz','Solution — English','Solution — Azərbaycan dili',18)}`;if(state.type==='articles')fields=`${inputPair(x,'titleEn','titleAz','Title — English','Title — Azərbaycan dili')}<div class="formgrid"><div class="field"><label>Category</label><input class="input" id="f-category" value="${esc(x.category||'')}"></div><div class="field"><label>Status</label><input class="input" id="f-status" value="${esc(x.status||'published')}"></div></div>${langFields(x,'excerptEn','excerptAz','Excerpt — English','Excerpt — Azərbaycan dili',4)}${langFields(x,'bodyEn','bodyAz','Body — English','Body — Azərbaycan dili',16)}`;return `<div class="editor-card"><div class="tag">${x.id?'EDIT':'CREATE'} ${state.type.slice(0,-1).toUpperCase()}</div>${fields}<button class="btn primary" onclick="saveItem()">Save</button> <button class="btn" onclick="syncCurrent();state.editing=null;render()">Cancel</button></div>`}
function questionEditor(items,type){if(!items.length)return `<div class="empty editor-empty">No ${type==='contest'?'contest problems':'questions'} yet. Click “+ Add ${type==='contest'?'problem':'question'}”.</div>`;return items.map((q,i)=>`<div class="question-editor-row"><div class="question-editor-top"><strong>${type==='contest'?esc(q.code||('A'+(i+1))):'Question '+(i+1)}</strong><button class="btn danger" onclick="removeQuestion(${i},'${type}')">Remove</button></div>${type==='contest'?`<div class="field"><label>Problem code</label><input class="input q-code" data-index="${i}" value="${esc(q.code||'A'+(i+1))}" placeholder="A1 / N1"></div>`:''}<div class="field"><label>Statement — English</label><textarea class="textarea q-statement-en" data-index="${i}" rows="10" placeholder="LaTeX is supported. Use standard LaTeX delimiters.">${esc(q.statementEn||q.statement||q.text||'')}</textarea></div><div class="field"><label>Statement — Azərbaycan dili</label><textarea class="textarea q-statement-az" data-index="${i}" rows="10" placeholder="Azərbaycan dilində sual şərti. LaTeX dəstəklənir.">${esc(q.statementAz||'')}</textarea></div><div class="field"><label>Question image URL (optional)</label><input class="input q-image" data-index="${i}" value="${esc(q.imageUrl||'')}" placeholder="https://..."></div>${type==='exam'?`<div class="field"><label>Reference solution — private</label><textarea class="textarea q-solution" data-index="${i}" rows="5">${esc(q.solution||'')}</textarea></div>`:''}</div>`).join('')}
function collectQuestions(type){const rows=[...document.querySelectorAll(type==='contest'?'#contest-problem-editor .question-editor-row':'#question-editor .question-editor-row')];return rows.map((row,i)=>({id:state.editing?.[type==='contest'?'problems':'questions']?.[i]?.id||null,...(type==='contest'?{code:(row.querySelector('.q-code')?.value||('A'+(i+1))).trim()}:{code:'Q'+(i+1)}),statementEn:normalizeMathMarkdown(row.querySelector('.q-statement-en')?.value||''),statementAz:normalizeMathMarkdown(row.querySelector('.q-statement-az')?.value||''),imageUrl:row.querySelector('.q-image')?.value.trim()||'',...(type==='exam'?{solution:normalizeMathMarkdown(row.querySelector('.q-solution')?.value||'')}:{})}));}
function syncCurrent(){if(!state.editing)return;document.querySelectorAll('[id^="f-"]').forEach(e=>{state.editing[e.id.slice(2)]=e.type==='number'?Number(e.value):e.value});if(state.type==='exams')state.editing.questions=collectQuestions('exam');if(state.type==='contests')state.editing.problems=collectQuestions('contest')}
function addQuestion(){syncCurrent();state.editing.questions??=[];state.editing.questions.push({id:null,code:'',statementEn:'',statementAz:'',imageUrl:'',solution:''});render();setTimeout(()=>document.getElementById('question-editor')?.lastElementChild?.scrollIntoView({behavior:'smooth'}),50)}
function addContestProblem(){syncCurrent();state.editing.problems??=[];const n=state.editing.problems.length;state.editing.problems.push({id:null,code:(n<6?'A':'N')+(n+1),statementEn:'',statementAz:'',imageUrl:''});render();setTimeout(()=>document.getElementById('contest-problem-editor')?.lastElementChild?.scrollIntoView({behavior:'smooth'}),50)}
function removeQuestion(i,type){syncCurrent();if(type==='contest')state.editing.problems.splice(i,1);else state.editing.questions.splice(i,1);render()}
async function uploadAdminStorageFile(file,folder){
  const {storage}=await fb();
  const {ref,uploadBytesResumable,getDownloadURL}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js');
  const safeName=(file.name||'upload').replace(/[^a-zA-Z0-9._-]/g,'_');
  const storageRef=ref(storage,folder+'/'+Date.now()+'-'+crypto.randomUUID()+'-'+safeName);
  return await new Promise((resolve,reject)=>{
    const task=uploadBytesResumable(storageRef,file,{contentType:file.type});
    task.on('state_changed',snap=>{
      const pct=snap.totalBytes?Math.round(snap.bytesTransferred/snap.totalBytes*100):0;
      const status=document.getElementById('admin-upload-status');if(status)status.textContent='Uploading '+pct+'%';
    },reject,async()=>{try{resolve(await getDownloadURL(task.snapshot.ref))}catch(e){reject(e)}});
  });
}
async function saveItem(){syncCurrent();const data={};document.querySelectorAll('[id^="f-"]').forEach(e=>data[e.id.slice(2)]=e.type==='number'?Number(e.value):e.value);if(state.type==='exams'){data.durationMinutes=Number(data.durationMinutes)||60;data.questions=(state.editing.questions||[]).map(q=>({...q,statementEn:normalizeMathMarkdown(q.statementEn||''),statementAz:normalizeMathMarkdown(q.statementAz||''),solution:normalizeMathMarkdown(q.solution||'')}))}if(state.type==='contests')data.problems=(state.editing.problems||[]).map(q=>({...q,statementEn:normalizeMathMarkdown(q.statementEn||''),statementAz:normalizeMathMarkdown(q.statementAz||'')}));if(state.type==='problems'){data.statementEn=normalizeMathMarkdown(data.statementEn||'');data.statementAz=normalizeMathMarkdown(data.statementAz||'');data.solutionEn=normalizeMathMarkdown(data.solutionEn||'');data.solutionAz=normalizeMathMarkdown(data.solutionAz||'')}if(state.type==='videos'){
  data.thumbnail=String(data.thumbnail||'').trim();
  data.videoUrl=String(data.videoUrl||'').trim();
  const videoFile=document.getElementById('f-videoFile')?.files?.[0];
  const thumbnailFile=document.getElementById('f-thumbnailFile')?.files?.[0];
  const status=document.getElementById('admin-upload-status');
  if(status)status.textContent='';
  if(videoFile){status&&(status.textContent='Uploading video…');data.videoUrl=await uploadAdminStorageFile(videoFile,'videos');}
  if(thumbnailFile){status&&(status.textContent='Uploading thumbnail…');data.thumbnail=await uploadAdminStorageFile(thumbnailFile,'videos/thumbnails');}
  if(!data.youtubeUrl&&!data.videoUrl){toast('Add a YouTube URL or upload a video file.');return}
  if(status)status.textContent='';
}
try{const x=state.editing;if(x.id)await api(`/api/admin/${state.type}/${x.id}`,{method:'PUT',body:JSON.stringify(data)});else await api(`/api/admin/${state.type}`,{method:'POST',body:JSON.stringify(data)});state.editing=null;toast('Saved successfully');render()}catch(e){toast(e.message)}}
async function removeItem(id){if(!confirm('Delete this item?'))return;try{await api(`/api/admin/${state.type}/${id}`,{method:'DELETE'});toast('Deleted');render()}catch(e){toast(e.message)}}
</script></body></html>
