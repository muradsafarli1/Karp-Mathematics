<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARP — Admin</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script><style>
.admin-mock-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.admin-mock-card{background:#fff;border:1px solid #e3e7ea;border-radius:18px;padding:17px;box-shadow:0 7px 24px rgba(20,27,34,.04)}.admin-mock-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.admin-mock-card h3{font:800 17px/1.25 'Space Grotesk';margin:13px 0 5px}.admin-mock-owner,.admin-mock-meta{font-size:9px;color:#78828b;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.admin-mock-card details{margin-top:12px;border-top:1px solid #edf0f2;padding-top:10px}.admin-mock-card summary{cursor:pointer;font-size:9px;font-weight:800;color:#59636c}.admin-mock-questions{display:grid;gap:8px;margin-top:9px}.admin-mock-questions section{background:#f7f8f9;border-radius:11px;padding:9px}.admin-mock-questions strong{font-size:9px}.admin-mock-questions div{margin-top:4px;font-size:9px;line-height:1.6;white-space:pre-wrap}.admin-mock-questions small{display:block;margin-top:5px;color:#8b949c;font-size:7px}.more-row{display:flex;justify-content:center;margin:14px 0}.more-btn{border:0;background:#eef1f3;border-radius:10px;padding:9px 13px;font-size:9px;font-weight:800;color:#58616a;cursor:pointer}@media(max-width:850px){.admin-mock-grid{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script>
let state={type:'problems',editing:null,mockExpanded:false};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const u=await requireAdmin();if(!u)return;try{const {db}=await fb();const {doc,setDoc}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');const now=new Date().toISOString();await setDoc(doc(db,'publicProfiles',u.id),{uid:u.id,name:u.name||'KARP Admin',nameLower:String(u.name||'KARP Admin').trim().toLowerCase(),photoURL:u.photoURL||'',updatedAt:now},{merge:true})}catch(e){console.warn('Could not sync admin public profile',e)}document.getElementById('root').innerHTML=`<header class="top"><div class="wrap nav"><a class="brand" href="/">KARP</a><div class="actions"><span style="color:#aeb7c8">${esc(u.name)}</span><a class="btn" href="/">View site</a><button class="btn" onclick="logout()">Log out</button></div></div></header><main class="admin"><div class="wrap"><div class="admin-grid"><aside class="admin-side"><button class="active" data-type="problems">Problems</button><button data-type="contests">Contests</button><button data-type="articles">Articles</button><button data-type="exams">Exams</button><button data-type="videos">Videos</button><button type="button" onclick="location.href='/mathnet-sync.html'">MathNet Sync</button><button type="button" onclick="location.href='/admin-messages.html'">Messages</button><button data-type="mocks">Mocks</button><button data-type="users">Users</button></aside><section class="admin-main" id="main"></section></div></div></main>`;document.querySelectorAll('.admin-side button').forEach(b=>b.onclick=()=>{syncCurrent();document.querySelectorAll('.admin-side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.type=b.dataset.type;state.editing=null;render()});render()}
document.addEventListener('DOMContentLoaded',init);
function examList(d){return Array.isArray(d)?d:(d?.exams||[])}
async function render(){const m=document.getElementById('main');if(!m)return;
if(state.type==='mocks'){
  try{
    const {db}=await fb();
    const {collection,collectionGroup,getDocs,deleteDoc}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
    const [mockSnap,userSnap]=await Promise.all([getDocs(collectionGroup(db,'mockHistory')),getDocs(collection(db,'users'))]);
    const usersById=new Map(userSnap.docs.map(x=>[x.id,x.data()]));
    let mocks=mockSnap.docs.map(x=>{const d=x.data(),owner=x.ref.parent.parent?.id||'';return{...d,id:x.id,ownerUid:owner,ownerName:usersById.get(owner)?.name||'KARP Member',ownerEmail:usersById.get(owner)?.email||''}});
    mocks.sort((a,b)=>new Date(b.completedAt||b.savedAt||b.createdAt||0)-new Date(a.completedAt||a.savedAt||a.createdAt||0));
    const visible=state.mockExpanded?mocks:mocks.slice(0,4);
    m.innerHTML='<div class="admin-head"><div><h2>Mocks</h2><span class="admin-count">'+mocks.length+' saved / completed</span></div></div>'+
      '<div class="bigcard" style="margin-bottom:14px"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div class="kpi"><strong>'+mocks.length+'</strong><span>All mocks</span></div><div class="kpi"><strong>'+mocks.filter(x=>x.status==='completed'||x.completedAt).length+'</strong><span>Completed</span></div><div class="kpi"><strong>'+mocks.filter(x=>x.status==='saved'&&!x.completedAt).length+'</strong><span>Saved drafts</span></div></div></div>'+
      '<div class="admin-mock-grid">'+(visible.length?visible.map(x=>{
        const saved=x.status==='saved'&&!x.completedAt;
        const qs=(x.questions||[]);
        return '<article class="admin-mock-card"><div class="admin-mock-top"><span class="tag">'+(saved?'SAVED':'COMPLETED')+'</span><button class="btn danger" data-delete-admin-mock="'+escapeHtml(x.ownerUid)+'::'+escapeHtml(x.id)+'">Delete</button></div><h3>'+escapeHtml(x.title||'Untitled Mock')+'</h3><p class="admin-mock-owner">'+escapeHtml(x.ownerName)+' · '+escapeHtml(x.ownerEmail)+'</p><p class="admin-mock-meta">'+escapeHtml(qs.length+' questions · '+(x.minutes||0)+' min · '+(x.completedAt||x.savedAt||x.createdAt?new Date(x.completedAt||x.savedAt||x.createdAt).toLocaleString():'—'))+'</p><details><summary>View questions</summary><div class="admin-mock-questions">'+qs.map((q,i)=>'<section><strong>Q'+(i+1)+'</strong><div>'+escapeHtml(q.statement||'')+'</div><small>'+escapeHtml([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</small></section>').join('')+'</div></details></article>';
      }).join(''):'<div class="empty" style="grid-column:1/-1">No mocks have been saved yet.</div>')+'</div>'+
      (mocks.length>4?'<div class="more-row"><button class="more-btn" id="admin-more-mocks">'+(state.mockExpanded?'Show less':'More')+' · '+(mocks.length-4)+' more</button></div>':'');
    document.querySelectorAll('[data-delete-admin-mock]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Delete this mock permanently?'))return;
      const parts=b.dataset.deleteAdminMock.split('::');try{
        const {db}=await fb();const {doc,deleteDoc}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
        await deleteDoc(doc(db,'users',parts[0],'mockHistory',parts[1]));toast('Mock deleted.');render();
      }catch(e){toast(e.message||'Could not delete mock.')}
    });
    document.getElementById('admin-more-mocks')?.addEventListener('click',()=>{state.mockExpanded=!state.mockExpanded;render()});
  }catch(e){console.error(e);m.innerHTML='<div class="bigcard"><h3>Could not load mocks</h3><p>'+escapeHtml(e.message||'Check Firestore permissions and deploy the latest rules.')+'</p></div>'}
  return;
}if(state.type==='users'){try{const d=await api('/api/admin/users');m.innerHTML=`<div class="admin-head"><div><h2>Users</h2><span class="admin-count">${d.users.length} users</span></div></div><div class="bigcard"><div style="overflow-x:auto"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Created</th><th>Last login</th><th>Logins</th></tr></thead><tbody>${d.users.slice().sort((a,b)=>new Date(b.lastLoginAt||b.createdAt||0)-new Date(a.lastLoginAt||a.createdAt||0)).map(u=>`<tr><td>${esc(u.name||'—')}</td><td>${esc(u.email||'—')}</td><td>${esc(u.role||'user')}</td><td>${u.createdAt?new Date(u.createdAt).toLocaleString():'—'}</td><td>${u.lastLoginAt?new Date(u.lastLoginAt).toLocaleString():'Never'}</td><td>${Number(u.loginCount||0)}</td></tr>`).join('')}</tbody></table></div></div>`}catch(e){m.innerHTML=`<div class="bigcard"><h3>Could not load users</h3><p>${esc(e.message)}</p></div>`}return}try{const endpoint='/api/admin/'+state.type;const d=await api(endpoint);const items=state.type==='exams'?examList(d):state.type==='videos'?(d.videos||[]):(d[state.type]||[]);m.innerHTML=`<div class="admin-head"><div><h2>${state.type[0].toUpperCase()+state.type.slice(1)}</h2><span class="admin-count">${items.length} items</span></div><button class="btn primary" onclick="newItem()">+ New</button></div><div class="rows">${items.map(x=>`<div class="row"><div><h3>${esc(x.titleEn||x.title||'Untitled')}</h3><p>${esc(x.descriptionEn||x.description||x.excerptEn||x.excerpt||x.topic||'')}${state.type==='contests'?` · ${(x.problems||[]).length} problems`:''}${state.type==='exams'?` · ${(x.questions||[]).length} questions · ${(x.registrationsCount??(x.registrations||[]).length)} registered · ${(x.submissionsCount??(x.submissions||[]).length)} submitted`:''}</p></div><div>${esc(x.status||'published')}</div><div class="right"><button class="btn" onclick="editItem('${esc(x.id)}')">Edit</button> <button class="btn danger" onclick="removeItem('${esc(x.id)}')">Delete</button></div></div>`).join('')||'<div class="empty">No items found.</div>'}</div>${state.editing?formHtml(state.editing):''}`}catch(e){m.innerHTML=`<div class="bigcard"><h3>Could not load content</h3><p>${esc(e.message)}</p></div>`}}
function newItem(){if(state.type==='exams')state.editing={id:null,titleEn:'',titleAz:'',descriptionEn:'',descriptionAz:'',date:'',durationMinutes:60,status:'Upcoming',questions:[]};else if(state.type==='contests')state.editing={id:null,titleEn:'',titleAz:'',year:'',type:'Contest',descriptionEn:'',descriptionAz:'',status:'published',problems:[]};else if(state.type==='problems')state.editing={id:null,titleEn:'',titleAz:'',topic:'',difficulty:'',statementEn:'',statementAz:'',solutionEn:'',solutionAz:'',status:'published'};else if(state.type==='videos')state.editing={id:null,titleEn:'',titleAz:'',descriptionEn:'',descriptionAz:'',thumbnail:'',youtubeUrl:'',status:'published'};else state.editing={id:null,titleEn:'',titleAz:'',category:'',excerptEn:'',excerptAz:'',bodyEn:'',bodyAz:'',status:'published'};render()}
function normalizeItem(x){if(!x)return x;if(state.type==='problems')return{...x,titleEn:x.titleEn||x.title||'',titleAz:x.titleAz||'',statementEn:x.statementEn||x.statement||'',statementAz:x.statementAz||'',solutionEn:x.solutionEn||x.solution||'',solutionAz:x.solutionAz||''};if(state.type==='articles')return{...x,titleEn:x.titleEn||x.title||'',titleAz:x.titleAz||'',excerptEn:x.excerptEn||x.excerpt||'',excerptAz:x.excerptAz||'',bodyEn:x.bodyEn||x.body||'',bodyAz:x.bodyAz||''};if(state.type==='contests')return{...x,titleEn:x.titleEn||x.title||'',titleAz:x.titleAz||'',descriptionEn:x.descriptionEn||x.description||'',descriptionAz:x.descriptionAz||'',problems:(x.problems||[]).map((p,i)=>({...p,code:p.code||'A'+(i+1),statementEn:p.statementEn||p.statement||'',statementAz:p.statementAz||'',imageUrl:p.imageUrl||p.image||''}))};if(state.type==='videos')return{...x,titleEn:x.titleEn||x.title||'',titleAz:x.titleAz||'',descriptionEn:x.descriptionEn||x.description||'',descriptionAz:x.descriptionAz||'',thumbnail:x.thumbnail||x.thumbnailUrl||x.image||'',youtubeUrl:x.youtubeUrl||x.youtube||x.url||'',status:x.status||'published'};return{...x,titleEn:x.titleEn||x.title||'',titleAz:x.titleAz||'',descriptionEn:x.descriptionEn||x.description||'',descriptionAz:x.descriptionAz||'',questions:(x.questions||[]).map((q,i)=>({...q,code:q.code||'Q'+(i+1),statementEn:q.statementEn||q.statement||q.text||'',statementAz:q.statementAz||'',imageUrl:q.imageUrl||q.image||''}))}}
async function editItem(id){try{const endpoint=state.type==='exams'?'/api/admin/exams':state.type==='videos'?'/api/admin/videos':'/api/content';const d=await api(endpoint);const list=state.type==='exams'?examList(d):state.type==='videos'?(d.videos||[]):(d[state.type]||[]);state.editing=normalizeItem(list.find(x=>x.id===id));render()}catch(e){toast(e.message)}}
function langFields(x,enKey,azKey,labelEn,labelAz,rows=4){return `<div class="formgrid"><div class="field"><label>${labelEn}</label><textarea class="textarea" id="f-${enKey}" rows="${rows}">${esc(x[enKey]||'')}</textarea></div><div class="field"><label>${labelAz}</label><textarea class="textarea" id="f-${azKey}" rows="${rows}">${esc(x[azKey]||'')}</textarea></div></div>`}
function inputPair(x,enKey,azKey,labelEn,labelAz){return `<div class="formgrid"><div class="field"><label>${labelEn}</label><input class="input" id="f-${enKey}" value="${esc(x[enKey]||'')}"></div><div class="field"><label>${labelAz}</label><input class="input" id="f-${azKey}" value="${esc(x[azKey]||'')}"></div></div>`}
function formHtml(x){if(state.type==='exams')return `<div class="editor-card"><div class="tag">${x.id?'EDIT':'CREATE'} EXAM</div>${inputPair(x,'titleEn','titleAz','Title — English','Title — Azərbaycan dili')}<div class="formgrid"><div class="field"><label>Date / start time</label><input class="input" id="f-date" value="${esc(x.date||'')}" placeholder="2026-09-15 10:00"></div><div class="field"><label>Duration (minutes)</label><input class="input" id="f-durationMinutes" type="number" min="1" value="${Number(x.durationMinutes||60)}"></div><div class="field"><label>Status</label><select class="select" id="f-status"><option ${x.status==='Upcoming'?'selected':''}>Upcoming</option><option ${x.status==='Open'?'selected':''}>Open</option><option ${x.status==='Finished'?'selected':''}>Finished</option></select></div></div>${langFields(x,'descriptionEn','descriptionAz','Description — English','Description — Azərbaycan dili',3)}<div class="editor-section"><div class="editor-section-head"><div><h3>Questions</h3><p>Every question can have an English statement, Azerbaijani statement and an optional image.</p></div><button class="btn" onclick="addQuestion()">+ Add question</button></div><div id="question-editor">${questionEditor(x.questions||[],'exam')}</div></div><button class="btn primary" onclick="saveItem()">Save exam</button> <button class="btn" onclick="syncCurrent();state.editing=null;render()">Cancel</button></div>`;if(state.type==='contests')return `<div class="editor-card"><div class="tag">${x.id?'EDIT':'CREATE'} CONTEST</div>${inputPair(x,'titleEn','titleAz','Contest title — English','Contest title — Azərbaycan dili')}<div class="formgrid"><div class="field"><label>Year</label><input class="input" id="f-year" value="${esc(x.year||'')}"></div><div class="field"><label>Type</label><input class="input" id="f-type" value="${esc(x.type||'Contest')}"></div><div class="field"><label>Status</label><input class="input" id="f-status" value="${esc(x.status||'published')}"></div></div>${langFields(x,'descriptionEn','descriptionAz','Description — English','Description — Azərbaycan dili',4)}<div class="editor-section"><div class="editor-section-head"><div><h3>Contest problems</h3><p>Add A1, A2, A3, … or N1, N2, N3, etc. Each problem may have an optional image.</p></div><button class="btn" onclick="addContestProblem()">+ Add problem</button></div><div id="contest-problem-editor">${questionEditor(x.problems||[],'contest')}</div></div><button class="btn primary" onclick="saveItem()">Save contest</button> <button class="btn" onclick="syncCurrent();state.editing=null;render()">Cancel</button></div>`;if(state.type==='videos')return `<div class="editor-card"><div class="tag">${x.id?'EDIT':'CREATE'} VIDEO</div>${inputPair(x,'titleEn','titleAz','Video title — English','Video title — Azərbaycan dili')}<div class="field"><label>YouTube URL</label><input class="input" id="f-youtubeUrl" value="${esc(x.youtubeUrl||'')}" placeholder="https://www.youtube.com/watch?v=..."></div><div class="field"><label>Video cover image</label><input class="input" id="f-thumbnailFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small style="display:block;margin-top:8px;opacity:.65">Upload the cover image. It will be stored with the video.</small>${x.thumbnail?`<img src="${esc(x.thumbnail)}" alt="Current thumbnail" style="display:block;width:min(420px,100%);aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-top:14px;border:1px solid var(--line,#30343d)">`:''}</div>${langFields(x,'descriptionEn','descriptionAz','Description — English','Description — Azərbaycan dili',4)}<div class="formgrid"><div class="field"><label>Status</label><select class="select" id="f-status"><option value="published" ${x.status!=='draft'?'selected':''}>Published</option><option value="draft" ${x.status==='draft'?'selected':''}>Draft</option></select></div></div><button class="btn primary" onclick="saveItem()">Save video</button> <button class="btn" onclick="syncCurrent();state.editing=null;render()">Cancel</button></div>`;let fields='';if(state.type==='problems')fields=`${inputPair(x,'titleEn','titleAz','Title — English','Title — Azərbaycan dili')}<div class="formgrid"><div class="field"><label>Topic</label><input class="input" id="f-topic" value="${esc(x.topic||'')}"></div><div class="field"><label>Difficulty</label><input class="input" id="f-difficulty" value="${esc(x.difficulty||'')}"></div><div class="field"><label>Status</label><input class="input" id="f-status" value="${esc(x.status||'published')}"></div></div>${langFields(x,'statementEn','statementAz','Problem statement — English','Problem statement — Azərbaycan dili',12)}${langFields(x,'solutionEn','solutionAz','Solution — English','Solution — Azərbaycan dili',18)}`;if(state.type==='articles')fields=`${inputPair(x,'titleEn','titleAz','Title — English','Title — Azərbaycan dili')}<div class="formgrid"><div class="field"><label>Category</label><input class="input" id="f-category" value="${esc(x.category||'')}"></div><div class="field"><label>Status</label><input class="input" id="f-status" value="${esc(x.status||'published')}"></div></div>${langFields(x,'excerptEn','excerptAz','Excerpt — English','Excerpt — Azərbaycan dili',4)}${langFields(x,'bodyEn','bodyAz','Body — English','Body — Azərbaycan dili',16)}`;return `<div class="editor-card"><div class="tag">${x.id?'EDIT':'CREATE'} ${state.type.slice(0,-1).toUpperCase()}</div>${fields}<button class="btn primary" onclick="saveItem()">Save</button> <button class="btn" onclick="syncCurrent();state.editing=null;render()">Cancel</button></div>`}
function questionEditor(items,type){if(!items.length)return `<div class="empty editor-empty">No ${type==='contest'?'contest problems':'questions'} yet. Click “+ Add ${type==='contest'?'problem':'question'}”.</div>`;return items.map((q,i)=>`<div class="question-editor-row"><div class="question-editor-top"><strong>${type==='contest'?esc(q.code||('A'+(i+1))):'Question '+(i+1)}</strong><button class="btn danger" onclick="removeQuestion(${i},'${type}')">Remove</button></div>${type==='contest'?`<div class="field"><label>Problem code</label><input class="input q-code" data-index="${i}" value="${esc(q.code||'A'+(i+1))}" placeholder="A1 / N1"></div>`:''}<div class="field"><label>Statement — English</label><textarea class="textarea q-statement-en" data-index="${i}" rows="10" placeholder="Use \( ... \) or $$ ... $$ for LaTeX.">${esc(q.statementEn||q.statement||q.text||'')}</textarea></div><div class="field"><label>Statement — Azərbaycan dili</label><textarea class="textarea q-statement-az" data-index="${i}" rows="10" placeholder="Azərbaycan dilində sual şərti. LaTeX dəstəklənir.">${esc(q.statementAz||'')}</textarea></div><div class="field"><label>Question image URL (optional)</label><input class="input q-image" data-index="${i}" value="${esc(q.imageUrl||'')}" placeholder="https://..."></div>${type==='exam'?`<div class="field"><label>Reference solution — private</label><textarea class="textarea q-solution" data-index="${i}" rows="5">${esc(q.solution||'')}</textarea></div>`:''}</div>`).join('')}
function collectQuestions(type){const rows=[...document.querySelectorAll(type==='contest'?'#contest-problem-editor .question-editor-row':'#question-editor .question-editor-row')];return rows.map((row,i)=>({id:state.editing?.[type==='contest'?'problems':'questions']?.[i]?.id||null,...(type==='contest'?{code:(row.querySelector('.q-code')?.value||('A'+(i+1))).trim()}:{code:'Q'+(i+1)}),statementEn:normalizeMathMarkdown(row.querySelector('.q-statement-en')?.value||''),statementAz:normalizeMathMarkdown(row.querySelector('.q-statement-az')?.value||''),imageUrl:row.querySelector('.q-image')?.value.trim()||'',...(type==='exam'?{solution:normalizeMathMarkdown(row.querySelector('.q-solution')?.value||'')}:{})}));}
function syncCurrent(){if(!state.editing)return;document.querySelectorAll('[id^="f-"]:not(#f-thumbnailFile)').forEach(e=>{state.editing[e.id.slice(2)]=e.type==='number'?Number(e.value):e.value});if(state.type==='exams')state.editing.questions=collectQuestions('exam');if(state.type==='contests')state.editing.problems=collectQuestions('contest')}
function addQuestion(){syncCurrent();state.editing.questions??=[];state.editing.questions.push({id:null,code:'',statementEn:'',statementAz:'',imageUrl:'',solution:''});render();setTimeout(()=>document.getElementById('question-editor')?.lastElementChild?.scrollIntoView({behavior:'smooth'}),50)}
function addContestProblem(){syncCurrent();state.editing.problems??=[];const n=state.editing.problems.length;state.editing.problems.push({id:null,code:(n<6?'A':'N')+(n+1),statementEn:'',statementAz:'',imageUrl:''});render();setTimeout(()=>document.getElementById('contest-problem-editor')?.lastElementChild?.scrollIntoView({behavior:'smooth'}),50)}
function removeQuestion(i,type){syncCurrent();if(type==='contest')state.editing.problems.splice(i,1);else state.editing.questions.splice(i,1);render()}
function readImageFile(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(file.size>7*1024*1024)return reject(new Error('Cover image is too large. Please use an image under 7 MB.'));const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Could not read the cover image.'));reader.readAsDataURL(file)})}
async function saveItem(){syncCurrent();const data={};document.querySelectorAll('[id^="f-"]:not(#f-thumbnailFile)').forEach(e=>data[e.id.slice(2)]=e.type==='number'?Number(e.value):e.value);if(state.type==='exams'){data.durationMinutes=Number(data.durationMinutes)||60;data.questions=(state.editing.questions||[]).map(q=>({...q,statementEn:normalizeMathMarkdown(q.statementEn||''),statementAz:normalizeMathMarkdown(q.statementAz||''),solution:normalizeMathMarkdown(q.solution||'')}))}if(state.type==='contests')data.problems=(state.editing.problems||[]).map(q=>({...q,statementEn:normalizeMathMarkdown(q.statementEn||''),statementAz:normalizeMathMarkdown(q.statementAz||'')}));if(state.type==='problems'){data.statementEn=normalizeMathMarkdown(data.statementEn||'');data.statementAz=normalizeMathMarkdown(data.statementAz||'');data.solutionEn=normalizeMathMarkdown(data.solutionEn||'');data.solutionAz=normalizeMathMarkdown(data.solutionAz||'')}if(state.type==='videos'){const file=document.getElementById('f-thumbnailFile')?.files?.[0];try{if(file)data.thumbnail=await readImageFile(file);else data.thumbnail=state.editing.thumbnail||''}catch(e){toast(e.message);return}if(!data.youtubeUrl){toast('YouTube URL is required');return}}try{const x=state.editing;if(x.id)await api(`/api/admin/${state.type}/${x.id}`,{method:'PUT',body:JSON.stringify(data)});else await api(`/api/admin/${state.type}`,{method:'POST',body:JSON.stringify(data)});state.editing=null;toast('Saved successfully');render()}catch(e){toast(e.message)}}
async function removeItem(id){if(!confirm('Delete this item?'))return;try{await api(`/api/admin/${state.type}/${id}`,{method:'DELETE'});toast('Deleted');render()}catch(e){toast(e.message)}}
</script></body></html>
