async function compressAdminImage(file,{maxSide=1400,maxChars=650000}={}){
  if(!file||!file.type.startsWith('image/'))throw new Error('Please choose an image file.');
  let img;
  if(window.createImageBitmap)img=await createImageBitmap(file);
  else img=await new Promise((resolve,reject)=>{
    const reader=new FileReader();reader.onload=()=>{const x=new Image();x.onload=()=>resolve(x);x.onerror=reject;x.src=reader.result;};reader.onerror=reject;reader.readAsDataURL(file);
  });
  const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
  canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close?.();
  let q=.82,url=canvas.toDataURL('image/jpeg',q);
  while(url.length>maxChars&&q>.42){q-=.06;url=canvas.toDataURL('image/jpeg',q);}
  if(url.length>maxChars)throw new Error('Image is still too large after compression.');
  return url;
}

function arrayBufferToBase64(buffer){
  const bytes=new Uint8Array(buffer),step=0x8000;let binary='';
  for(let i=0;i<bytes.length;i+=step)binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+step,bytes.length)));
  return btoa(binary);
}

async function saveJournalAdmin(){
  const editing=state.editing||{},title=document.getElementById('journal-admin-title')?.value.trim(),description=document.getElementById('journal-admin-description')?.value.trim()||'';
  const file=pendingJournalFile,coverFile=document.getElementById('journal-admin-cover')?.files?.[0],status=document.getElementById('journal-admin-progress'),button=document.getElementById('journal-admin-save');
  if(!title){toast('Enter a journal title.');return}
  const isEdit=!!editing.id;
  if(!isEdit&&!file){toast('Choose a PDF file.');return}
  if(file&&(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name))){toast('Please choose a PDF file.');return}

    if(!coverImage&&file){
      try{
        const bytesForCover=new Uint8Array(await file.arrayBuffer());
        const pdfjsLib=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
        pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
        const pdf=await pdfjsLib.getDocument({data:bytesForCover}).promise,first=await pdf.getPage(1),base=first.getViewport({scale:1});
        const viewport=first.getViewport({scale:Math.min(620/base.width,820/base.height)});
        const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(viewport.width));canvas.height=Math.max(1,Math.round(viewport.height));

      for(let i=0;i<oldChunks.docs.length;i+=400){
        const batch=writeBatch(db);oldChunks.docs.slice(i,i+400).forEach(x=>batch.delete(x.ref));await batch.commit();
      }
    }
    for(let index=0;index<totalChunks;index++){
      await setDoc(doc(db,'journalIssues',id,'chunks',String(index).padStart(6,'0')),{index,data:base64.slice(index*chunkSize,(index+1)*chunkSize)},{merge:false});
      if(status)status.textContent='Saving PDF '+(index+1)+' / '+totalChunks+' · '+Math.round(((index+1)/totalChunks)*100)+'%';
    }
    await setDoc(doc(db,'journalIssues',id),{
      id,title,description,fileName:file.name,size:file.size,contentType:'application/pdf',
      chunkCount:totalChunks,coverImage,published:true,viewCount:isEdit?Number(editing.viewCount||0):0,

function formatPresenceDuration(seconds){
  const total=Math.max(0,Math.floor(Number(seconds)||0)),h=Math.floor(total/3600),m=Math.floor((total%3600)/60),s=total%60;
  if(h)return h+'h '+m+'m';
  if(m)return m+'m '+s+'s';
  return s+'s';
}
function presenceDevice(p){
  const type=p.deviceType||'Unknown device',browser=p.browser||'Unknown browser',os=p.os||'Unknown OS';
  return type+' · '+browser+' · '+os+(p.screen?' · '+p.screen:'');
}
function presenceKind(p){
  return (p.userType==='guest'||(!p.uid&&String(p.guestId||'').startsWith('guest_'))) ? 'guest' : 'account';
}
function renderLivePresence(){
  const el=document.getElementById('live-presence');if(!el)return;
  const now=Date.now();
  const rows=(Array.isArray(liveDocs)?liveDocs:[]).filter(p=>p&&p.visitorId);
  const onlineRows=rows.filter(p=>p.online===true&&presenceMillis(p.lastSeen)>0&&presenceMillis(p.lastSeen)<=now+5000&&now-presenceMillis(p.lastSeen)<=75000).sort((a,b)=>presenceMillis(b.lastSeen)-presenceMillis(a.lastSeen));
  const accounts=rows.filter(p=>presenceKind(p)==='account').length;
  const guests=rows.filter(p=>presenceKind(p)==='guest').length;
  const onlinePeople=onlineRows.map(p=>{
    const a=p.activity||{},where=a.page==='Exam'?'Exam':a.page==='Mock'?'Mock':a.page||'KARP',detail=a.detail||a.label||'Browsing',q=a.question?(' · Problem '+a.question):'';
    const who=p.userType==='guest'?'Anonymous visitor':(p.name||'KARP Member');
    const device=presenceDevice(p);
    return '<div class="live-person"><div class="live-person-top"><span class="live-dot"></span><span class="live-name">'+escapeHtml(who)+'</span></div><div class="live-activity">'+escapeHtml(where+' · '+detail+q)+'</div><div class="live-activity">'+escapeHtml(device)+' · Active '+escapeHtml(formatPresenceDuration(p.totalActiveSeconds||0))+'</div></div>';
  }).join('');
  const recent=rows
    .filter(p=>presenceMillis(p.lastSeen)>0)
    .sort((a,b)=>presenceMillis(b.lastSeen)-presenceMillis(a.lastSeen))
    .slice(0,80);
  const recentRows=recent.map(p=>{
    const isOnline=p.online===true&&presenceMillis(p.lastSeen)>0&&presenceMillis(p.lastSeen)<=now+5000&&now-presenceMillis(p.lastSeen)<=75000;
    const who=p.userType==='guest'?'Anonymous visitor':(p.name||'KARP Member');
    const last=presenceMillis(p.lastSeen);
    const a=p.activity||{};
    const location=(a.page||'KARP')+(a.detail?' · '+a.detail:'');
    const status=isOnline?'<span class="visitor-online"></span>Online':'<span class="visitor-offline"></span>Offline';
    const meta=p.userType==='guest'?'Guest / no account':('Account'+(p.email?' · '+p.email:''));
    return '<tr><td><div class="visitor-visitor">'+status+escapeHtml(who)+'</div><div class="visitor-meta">'+escapeHtml(meta)+'</div></td><td>'+escapeHtml(formatPresenceDuration(p.totalActiveSeconds||0))+'</td><td><div class="visitor-device">'+escapeHtml(presenceDevice(p))+'</div><div class="visitor-meta">'+escapeHtml(p.language||'')+'</div></td><td>'+escapeHtml(location)+'</td><td>'+escapeHtml(last?new Date(last).toLocaleString():'—')+'</td></tr>';
  }).join('');
  el.innerHTML='<div class="live-presence-head"><strong>Live now</strong><span class="live-presence-count">'+onlineRows.length+' online · '+onlineRows.filter(p=>presenceKind(p)==='account').length+' accounts · '+onlineRows.filter(p=>presenceKind(p)==='guest').length+' guests</span></div><div class="live-presence-grid">'+(onlinePeople||'<span class="live-empty">No active visitors right now.</span>')+'</div><div class="visitor-analytics"><div class="visitor-analytics-head"><strong>Visitor analytics</strong><span>'+accounts+' account visitors · '+guests+' anonymous browser visitors · showing latest '+recent.length+'</span></div><div class="visitor-analytics-table-wrap">'+(recentRows?'<table class="visitor-analytics-table"><thead><tr><th>Visitor</th><th>Active time</th><th>Device</th><th>Current / last page</th><th>Last seen</th></tr></thead><tbody>'+recentRows+'</tbody></table>':'<div class="visitor-empty">No visitor data yet.</div>')+'</div></div>';
}
function initLivePresence(db){
  try{
    if(liveUnsub)liveUnsub();
    if(liveTimer)clearInterval(liveTimer);
    import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js').then(({collection,onSnapshot})=>{
      liveUnsub=onSnapshot(collection(db,'presence'),snap=>{
        liveDocs=snap.docs.map(d=>({id:d.id,...d.data()}));
        renderLivePresence();
      },e=>{console.warn('KARP live presence listener failed:',e);const el=document.getElementById('live-presence');if(el)el.querySelector('.live-presence-count').textContent='Unavailable';});
    }).catch(e=>console.warn('Could not start live presence:',e));
    liveTimer=setInterval(renderLivePresence,15000);
  }catch(e){console.warn('Could not initialize live presence:',e)}
}

function bookAdminDate(value){
  if(!value)return '—';
  const d=value&&typeof value.toDate==='function'?value.toDate():new Date(value);
  return Number.isNaN(d.getTime())?'—':d.toLocaleString();
}
function bookAdminDuration(value){
  const n=Math.max(0,Number(value||0)),m=Math.floor(n/60),s=Math.floor(n%60),h=Math.floor(m/60);
  return h?h+'h '+(m%60)+'m':m?m+'m '+s+'s':s+'s';
}
function renderBookDetailsPanel(book){

  else if(tab==='downloads'){
    const rows=(d.downloads||[]).slice().sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
    body=rows.length?'<div class="books-admin-detail-table-wrap"><table class="books-admin-detail-table"><thead><tr><th>Who</th><th>Downloaded at</th><th>PDF filename</th></tr></thead><tbody>'+rows.map(x=>'<tr><td><strong>'+esc(x.displayName||x.email||(x.uid?'Signed-in account':'Guest / private window'))+'</strong>'+(x.email?'<br>'+esc(x.email):'')+(x.uid?'<br><span style="color:#737a80">Account</span>':'<br><span style="color:#737a80">Anonymous visitor</span>')+'</td><td>'+esc(bookAdminDate(x.createdAt))+'</td><td>'+esc(x.fileName||book.fileName||book.title||'PDF')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="books-admin-detail-empty">No detailed downloads have been recorded yet.</div>';
    body+='<div class="books-admin-detail-note">Total Downloads counter: '+downloadTotal+'. Detailed records are created when the KARP Download PDF button is used; older downloads and the browser\'s built-in PDF toolbar cannot be reconstructed retroactively.</div>';
  }else{
    const sessions=(d.sessions||[]).slice().sort((a,b)=>new Date(b.startedAt||0)-new Date(a.startedAt||0));
    if(sessions.length){
      body='<div class="books-admin-detail-table-wrap"><table class="books-admin-detail-table"><thead><tr><th>Who</th><th>Entered</th><th>Left / hidden</th><th>Active time</th></tr></thead><tbody>'+sessions.map(x=>{

      }).join('')+'</tbody></table></div>';
    }else{
      const legacy=(d.views||[]).slice().sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));

async function loadBookDetails(bookId,tab='views',refresh=false){
  if(booksAdminDetails.id===bookId&&booksAdminDetails.loaded&&!refresh){booksAdminDetails.tab=tab;await renderBooksAdmin();return}
  booksAdminDetails={id:bookId,tab,loading:true,loaded:false,views:[],sessions:[],downloads:[],error:''};
  await renderBooksAdmin();
  try{
    const {db}=await fb();
    const {collection,getDocs}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
    const [viewSnap,sessionSnap,downloadSnap]=await Promise.all([getDocs(collection(db,'books',bookId,'views')),getDocs(collection(db,'books',bookId,'viewSessions')),getDocs(collection(db,'books',bookId,'downloads'))]);
    if(booksAdminDetails.id!==bookId)return;
    booksAdminDetails={id:bookId,tab,loading:false,loaded:true,views:viewSnap.docs.map(x=>({id:x.id,...x.data()})),sessions:sessionSnap.docs.map(x=>({id:x.id,...x.data()})),downloads:downloadSnap.docs.map(x=>({id:x.id,...x.data()})),error:''};
  }catch(e){if(booksAdminDetails.id===bookId)booksAdminDetails={...booksAdminDetails,loading:false,loaded:true,error:e.message||'Unable to load this book\'s activity.'}}
  await renderBooksAdmin();
}
async function removeBookAdmin(id,title,button){
  if(!confirm('Permanently delete "'+title+'" and its PDF data and analytics? This cannot be undone.'))return;
  if(button){button.disabled=true;button.textContent='Deleting…'}
  try{
    const {db}=await fb();
    const {collection,getDocs,writeBatch,doc,deleteDoc}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
    for(const subcollection of ['chunks','views','viewSessions','downloads']){
      const snap=await getDocs(collection(db,'books',id,subcollection));
      for(let i=0;i<snap.docs.length;i+=400){
        const batch=writeBatch(db);
        snap.docs.slice(i,i+400).forEach(x=>batch.delete(x.ref));
        await batch.commit();
      }
    }
    await deleteDoc(doc(db,'books',id));
    if(state.editing?.id===id){state.editing=null;pendingBookFile=null}
    if(booksAdminDetails.id===id)booksAdminDetails={id:null,tab:'views',loading:false,loaded:false,views:[],sessions:[],downloads:[],error:''};

async function saveBookAdmin(){

function __usersDestroyLive(){
  if(__usersAnalytics.unsubActivity){__usersAnalytics.unsubActivity();__usersAnalytics.unsubActivity=null}
  if(__usersAnalytics.unsubUsers){__usersAnalytics.unsubUsers();__usersAnalytics.unsubUsers=null}
  if(__usersAnalytics.unsubPresence){__usersAnalytics.unsubPresence();__usersAnalytics.unsubPresence=null}
  if(__usersAnalytics.timer){clearInterval(__usersAnalytics.timer);__usersAnalytics.timer=null}
  __usersAnalytics.started=false;
}
function __usersStartLive(db,adminUid){
  __usersAnalytics.db=db;__usersAnalytics.adminUid=adminUid||null;
  if(__usersAnalytics.started)return;
  __usersAnalytics.started=true;
  import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js').then(({collection,onSnapshot})=>{
    __usersAnalytics.unsubUsers=onSnapshot(collection(db,'users'),snap=>{__usersAnalytics.users=snap.docs.map(x=>({id:x.id,...x.data()}));__usersRender()},err=>console.warn('Users listener failed:',err));
    __usersAnalytics.unsubPresence=onSnapshot(collection(db,'presence'),snap=>{__usersAnalytics.presence=snap.docs.map(x=>({id:x.id,...x.data()}));__usersRender()},err=>console.warn('Presence listener failed:',err));
    __usersLoadActivity(db,true);
    __usersAnalytics.timer=setInterval(__usersRender,10000);
  }).catch(err=>{console.warn('Could not start Users analytics:',err);__usersAnalytics.started=false});
}
async function __usersExitDashboard(){
  let previous='problems';
  try{previous=localStorage.getItem('karp_admin_previous_section')||'problems'}catch{}
  if(previous==='users')previous='problems';
  state.type=previous;state.editing=null;
  try{localStorage.setItem('karp_admin_section',previous);const u=new URL(location.href);u.searchParams.set('section',previous);history.replaceState(null,'',u)}catch{}
  document.querySelectorAll('.admin-side button').forEach(b=>b.classList.toggle('active',b.dataset.type===previous));
  await render();
}

      function parseAdminExamInstant(value,offset=4){const raw=String(value||'').trim();if(!raw)return NaN;if(/(?:Z|[+-]\d{2}:?\d{2})$/i.test(raw))return Date.parse(raw);const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);if(m)return Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0))-Number(offset??4)*3600000;return Date.parse(raw)}

async function removeImportedOlympiadCatalog(){
  if(state.type!=='contests')return;
  if(!confirm('Remove all imported IMO/BMO catalog records created by KARP? Manually added contests will be kept.'))return;
  try{
    const {db}=await fb();
    const {collection,getDocs,doc,deleteDoc}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
    const snap=await getDocs(collection(db,'contests'));
    let removed=0;
    for(const item of snap.docs){
      const key=String(item.data()?.catalogKey||'');
      if(key.startsWith('IMO-')||key.startsWith('BMO-')){
        await deleteDoc(doc(db,'contests',item.id));
        removed++;
      }
    }
    toast('Removed '+removed+' imported IMO/BMO records.');
    state.editing=null;render();
  }catch(e){console.error(e);toast(e.message||'Could not remove the imported catalog.');}
}

function examScheduleParts(value,offset=4){
  const raw=String(value||'').trim(),pad=n=>String(n).padStart(2,'0');
  if(!raw)return {date:'',hour:'10',minute:'00',period:'AM'};
  const wall=raw.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(wall){
    const h24=Number(wall[4]||0),h=h24%12||12;
    return {date:wall[1]+'-'+wall[2]+'-'+wall[3],hour:String(h),minute:pad(Number(wall[5]||0)),period:h24>=12?'PM':'AM'};
  }
  const parsed=Date.parse(raw);
  if(Number.isNaN(parsed))return {date:'',hour:'10',minute:'00',period:'AM'};
  const shifted=new Date(parsed+Number(offset??4)*3600000);
  const h24=shifted.getUTCHours(),h=h24%12||12;
  return {date:shifted.toISOString().slice(0,10),hour:String(h),minute:pad(shifted.getUTCMinutes()),period:h24>=12?'PM':'AM'};
}
function timezoneOptions(selected=4){
  return Array.from({length:27},(_,i)=>i-12).map(n=>{
    const label='UTC'+(n>=0?'+':'')+n;
    return '<option value="'+n+'" '+(Number(selected)===n?'selected':'')+'>'+label+'</option>';
  }).join('');
}
function examScheduleEditor(prefix,title,description,value,offset=4){
  const p=examScheduleParts(value,offset);
  const hours=Array.from({length:12},(_,i)=>i+1).map(n=>'<option value="'+n+'" '+(Number(p.hour)===n?'selected':'')+'>'+n+'</option>').join('');
  const minutes=Array.from({length:60},(_,i)=>String(i).padStart(2,'0')).map(n=>'<option value="'+n+'" '+(p.minute===n?'selected':'')+'>'+n+'</option>').join('');
  return '<div class="editor-section"><div class="editor-section-head"><div><h3>'+title+'</h3><p>'+description+'</p></div></div><div class="field"><label>Date</label><input class="input" id="f-'+prefix+'Date" type="date" value="'+esc(p.date)+'"></div><div class="formgrid"><div class="field"><label>Hour</label><select class="select" id="f-'+prefix+'Hour">'+hours+'</select></div><div class="field"><label>Minute</label><select class="select" id="f-'+prefix+'Minute">'+minutes+'</select></div><div class="field"><label>AM / PM</label><select class="select" id="f-'+prefix+'Period"><option value="AM" '+(p.period==='AM'?'selected':'')+'>AM</option><option value="PM" '+(p.period==='PM'?'selected':'')+'>PM</option></select></div><div class="field"><label>Timezone</label><select class="select" id="f-'+prefix+'TimezoneOffset">'+timezoneOptions(offset)+'</select></div></div></div>';
}
function examScheduleISO(prefix,offset){
  const date=document.getElementById('f-'+prefix+'Date')?.value||'';
  if(!date)return '';
  const hour=Number(document.getElementById('f-'+prefix+'Hour')?.value||10)%12;
  const minute=Number(document.getElementById('f-'+prefix+'Minute')?.value||0);
  const period=document.getElementById('f-'+prefix+'Period')?.value||'AM';
  const parts=date.split('-').map(Number);
  if(parts.length!==3||parts.some(n=>!Number.isFinite(n))||minute<0||minute>59)return '';
  const hour24=hour+(period==='PM'?12:0);
  const utcMs=Date.UTC(parts[0],parts[1]-1,parts[2],hour24,minute)-Number(offset??4)*3600000;
  const result=new Date(utcMs);
  return Number.isNaN(result.getTime())?'':result.toISOString();
}

le="display:none;width:min(100%,520px);aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-top:10px;border:1px solid #d9dad8"></div>${langFields(x,'descriptionEn','descriptionAz','Description — English','Description — Azərbaycan dili',4)}<div class="formgrid"><div class="field"><label>Status</label><select class="select" id="f-status"><option value="published" ${x.status!=='draft'?'selected':''}>Published</option><option value="draft" ${x.status==='draft'?'selected':''}>Draft</option></select></div></div><button class="btn primary" onclick="saveItem()">Save video</button> <button class="btn" onclick="syncCurrent();state.editing=null;render()">Cancel</button></div>`;let fields='';if(state.type==='problems')fields=`${inputPair(x,'titleEn','titleAz','Title — English','Title — Azərbaycan dili')}<div class="field"><label>Source / Contest (optional)</label><input class="input" id="f-source" value="${esc(x.source||'')}" placeholder="e.g. APMO 2026"></div><div class="formgrid"><div class="field"><label>Topic</label><input class="input" id="f-topic" value="${esc(x.topic||'')}"></div><div class="field"><label>Difficulty</label><input class="input" id="f-difficulty" value="${esc(x.difficulty||'')}"></div><div class="field"><label>Status</label><input class="input" id="f-status" value="${esc(x.status||'published')}"></div></div>${langFields(x,'statementEn','statementAz','Problem statement — English','Problem statement — Azərbaycan dili',12)}${langFields(x,'solutionEn','solutionAz','Solution — English','Solution — Azərbaycan dili',18)}`;if(state.type==='about')fields='<div class="field"><label>Founder name</label><input class="input" id="f-founderName" value="'+esc(x.founderName||'')+'" placeholder="Founder"></div><div class="field"><label>Founder image URL</label><input class="input" id="f-founderImage" value="'+esc(x.founderImage||'')+'" placeholder="https://.../founder.jpg"><small style="display:block;margin-top:8px;color:var(--muted,#6f665d)">Use a public image URL. if(state.type==='articles')fields=`${inputPair(x,'titleEn','titleAz','Title — English','Title — Azərbaycan dili')}<div class="formgrid"><div class="field"><label>Category</label><input class="input" id="f-category" value="${esc(x.category||'')}"></div><div class="field"><label>Status</label><input class="input" id="f-status" value="${esc(x.status||'published')}"></div></div>${langFields(x,'excerptEn','excerptAz','Excerpt — English','Excerpt — Azərbaycan dili',4)}${langFields(x,'bodyEn','bodyAz','Body — English','Body — Azərbaycan dili',16)}`;return `<div class="editor-card"><div class="tag">${x.id?'EDIT':'CREATE'} ${state.type.slice(0,-1).toUpperCase()}</div>${fields}<button class="btn primary" onclick="saveItem()">Save</button> <button class="btn" onclick="syncCurrent();state.editing=null;render()">Cancel</button></div>`}
function questionEditor(items,type){if(!items.length)return `<div class="empty editor-empty">No ${type==='contest'?'contest problems':'questions'} yet. Click “+ Add ${type==='contest'?'problem':'question'}”.</div>`;return items.map((q,i)=>`<div class="question-editor-row"><div class="question-editor-top"><strong>${type==='contest'?esc(q.code||('A'+(i+1))):'Question '+(i+1)}</strong><button class="btn danger" onclick="removeQuestion(${i},'${type}')">Remove</button></div>${type==='contest'?`<div class="field"><label>Problem code</label><input class="input q-code" data-index="${i}" value="${esc(q.code||'A'+(i+1))}" placeholder="P1 / P2"></div>`:''}<div class="field"><label>Statement — English</label><textarea class="textarea q-statement-en" data-index="${i}" rows="10" placeholder="LaTeX is supported. Use standard LaTeX delimiters.">${esc(q.statementEn||q.statement||q.text||'')}</textarea></div><div class="field"><label>Statement — Azərbaycan dili</label><textarea class="textarea q-statement-az" data-index="${i}" rows="10" placeholder="Azərbaycan dilində sual şərti. LaTeX dəstəklənir.">${esc(q.statementAz||'')}</textarea></div><div class="field"><label>Statement — Turkish</label><textarea class="textarea q-statement-tr" data-index="${i}" rows="10" placeholder="Türkçe soru metni. LaTeX desteklenir.">${esc(q.statementTr||'')}</textarea></div><div class="field"><label>Question image URL (optional)</label><input class="input q-image" data-index="${i}" value="${esc(q.imageUrl||'')}" placeholder="https://..."></div>${type==='exam'?`<div class="field"><label>Reference solution — private</label><textarea class="textarea q-solution" data-index="${i}" rows="5">${esc(q.solution||'')}</textarea></div>`:''}</div>`).join('')}
function collectQuestions(type){const rows=[...document.querySelectorAll(type==='contest'?'#contest-problem-editor .question-editor-row':'#question-editor .question-editor-row')];return rows.map((row,i)=>({id:state.editing?.[type==='contest'?'problems':'questions']?.[i]?.id||null,...(type==='contest'?{code:(row.querySelector('.q-code')?.value||('A'+(i+1))).trim()}:{code:'Q'+(i+1)}),statementEn:normalizeMathMarkdown(row.querySelector('.q-statement-en')?.value||''),statementAz:normalizeMathMarkdown(row.querySelector('.q-statement-az')?.value||''),statementTr:normalizeMathMarkdown(row.querySelector('.q-statement-tr')?.value||''),imageUrl:row.querySelector('.q-image')?.value.trim()||'',...(type==='exam'?{solution:normalizeMathMarkdown(row.querySelector('.q-solution')?.value||'')}:{})}));}
function bindMeetingImagePicker(){
  const input=document.getElementById('f-coverImage-file'),preview=document.getElementById('meeting-image-preview'),status=document.getElementById('meeting-image-status'),current=state.editing?.coverImage||'';
  if(status)status.textContent=current?'Current image saved. Choose a new file to replace it.':'Choose an image from your computer. It will be compressed before saving.';
  if(!input)return;
  input.onchange=async()=>{
    const file=input.files?.[0];if(!file)return;
    try{
      status.textContent='Processing image…';
      pendingMeetingImage=await compressAdminImage(file,{maxSide:1500,maxChars:650000});
      if(preview){preview.src=pendingMeetingImage;preview.style.display='block'}
      status.textContent='New image selected. Save meeting to apply it.';
    }catch(e){input.value='';pendingMeetingImage='';status.textContent=e.message||'Could not process image.';toast(status.textContent)}
  };
}
function bindFounderImagePicker(){
  const input=document.getElementById('f-founderImage-file'),preview=document.getElementById('founder-image-preview'),placeholder=document.getElementById('founder-image-placeholder'),status=document.getElementById('founder-image-status');
  if(!input)return;
  input.onchange=async()=>{
    const file=input.files?.[0];if(!file)return;
    try{
      status.textContent='Processing image…';
      pendingFounderImage=await compressAdminImage(file,{maxSide:1600,maxChars:650000});
      if(preview){preview.src=pendingFounderImage;preview.style.display='block'}
      if(placeholder)placeholder.style.display='none';
      status.textContent='New image selected. Save About to apply it.';
    }catch(e){
      input.value='';pendingFounderImage='';status.textContent=e.message||'Could not process image.';toast(status.textContent);
    }
  };
}
function syncAbout(){
  if(!state.editing)return;
  state.editing.founderName=document.getElementById('f-founderName')?.value||'';
  state.editing.founderTitle=document.getElementById('f-founderTitle')?.value||'';
  state.editing.founderText=document.getElementById('f-founderText')?.value||'';
  state.editing.founderImage=pendingFounderImage||document.getElementById('f-founderImage')?.value||state.editing.founderImage||'';
  state.editing.cards=[...document.querySelectorAll('.about-editor-card')].map(card=>({
    tag:card.querySelector('.about-tag')?.value||'',
    title:card.querySelector('.about-title')?.value||'',
    text:card.querySelector('.about-text')?.value||'',
    imageUrl:card.querySelector('.about-image')?.value||'',
    showImage:!!card.querySelector('.about-show-image')?.checked
  }));
}
function addAboutBox(){syncAbout();state.editing.cards.push({tag:'',title:'',text:'',imageUrl:'',showImage:false});render()}
function removeAboutBox(i){syncAbout();state.editing.cards.splice(i,1);if(!state.editing.cards.length)state.editing.cards.push({tag:'',title:'',text:'',imageUrl:'',showImage:false});render()}
function syncCurrent(){
  if(!state.editing)return;
  if(state.type==='about'){syncAbout();return}
  document.querySelectorAll('[id^="f-"]').forEach(e=>{state.editing[e.id.slice(2)]=e.type==='number'?Number(e.value):e.value});
  if(state.type==='exams'){
    const startDate=document.getElementById('f-startDate')?.value||'';
    const startOffset=Number(document.getElementById('f-startTimezoneOffset')?.value??state.editing.timezoneOffset??4);
    const startISO=examScheduleISO('start',startOffset);
    state.editing.date=startDate&&startISO?startISO:'';
    state.editing.timezoneOffset=startOffset;
    const availableDate=document.getElementById('f-availableDate')?.value||'';
    const availableOffset=Number(document.getElementById('f-availableTimezoneOffset')?.value??state.editing.availableTimezoneOffset??startOffset);
    const availableISO=examScheduleISO('available',availableOffset);
    state.editing.availableAt=availableDate&&availableISO?availableISO:state.editing.date;
    state.editing.availableTimezoneOffset=availableOffset;
    state.editing.questions=collectQuestions('exam');
  }
  if(state.type==='contests')state.editing.problems=collectQuestions('contest');
}
function addQuestion(){syncCurrent();state.editing.questions??=[];state.editing.questions.push({id:null,code:'',statementEn:'',statementAz:'',statementTr:'',imageUrl:'',solution:''});render();setTimeout(()=>document.getElementById('question-editor')?.lastElementChild?.scrollIntoView({behavior:'smooth'}),50)}
function addContestProblem(){const y=window.scrollY;syncCurrent();state.editing.problems??=[];const n=state.editing.problems.length;state.editing.problems.push({id:null,code:'P'+(n+1),statementEn:'',statementAz:'',statementTr:'',imageUrl:''});render();requestAnimationFrame(()=>window.scrollTo(0,y))}
function setContestProblemCount(value){const target=Math.max(0,Math.floor(Number(value)||0));const y=window.scrollY;syncCurrent();state.editing.problems??=[];while(state.editing.problems.length<target){const n=state.editing.problems.length;state.editing.problems.push({id:null,code:(n<6?'A':'N')+(n+1),statementEn:'',statementAz:'',statementTr:'',imageUrl:''})}if(state.editing.problems.length>target)state.editing.problems.length=target;render();requestAnimationFrame(()=>window.scrollTo(0,y))}
function removeQuestion(i,type){syncCurrent();if(type==='contest')state.editing.problems.splice(i,1);else state.editing.questions.splice(i,1);render()}
async function saveItem(){
  if(state.type==='books'){await saveBookAdmin();return}
  syncCurrent();
  if(state.type==='about'){
    const data={
      founderName:state.editing.founderName||'',
      founderImage:state.editing.founderImage||'',
      founderTitle:state.editing.founderTitle||'',
      founderText:state.editing.founderText||'',
      cards:state.editing.cards||[]
    };
    try{
      await api('/api/admin/about/global',{method:'PUT',body:JSON.stringify(data)});
      state.editing=null;toast('About saved successfully');render();
    }catch(e){toast(e.message)}
    return;
  }
  const data={};
  document.querySelectorAll('[id^="f-"]').forEach(e=>data[e.id.slice(2)]=e.type==='number'?Number(e.value):e.value);
  if(state.type==='exams'){
    data.durationMinutes=Math.max(1,Number(data.durationMinutes)||60);
    const startOffset=Number(data.startTimezoneOffset??data.timezoneOffset??4);
    const availableOffset=Number(data.availableTimezoneOffset??startOffset);
    const startDateInput=document.getElementById('f-startDate')?.value||'';
    const availableDateInput=document.getElementById('f-availableDate')?.value||'';
    const startISO=examScheduleISO('start',startOffset);
    const availableISO=examScheduleISO('available',availableOffset);
    if(startDateInput&&!startISO){toast('Please check the exam start date and time.');return}
    if(availableDateInput&&!availableISO){toast('Please check the Available date and time.');return}
    data.date=startISO||state.editing?.date||'';
    data.timezoneOffset=startOffset;
    data.availableAt=availableISO||data.date||'';
    data.availableTimezoneOffset=availableISO?availableOffset:startOffset;
    delete data.startDate;delete data.startHour;delete data.startMinute;delete data.startPeriod;delete data.startTimezoneOffset;
    delete data.availableDate;delete data.availableHour;delete data.availableMinute;delete data.availablePeriod;
    data.questions=(state.editing.questions||[]).map(q=>({...q,statementEn:normalizeMathMarkdown(q.statementEn||''),statementAz:normalizeMathMarkdown(q.statementAz||''),statementTr:normalizeMathMarkdown(q.statementTr||''),solution:normalizeMathMarkdown(q.solution||'')}));
  }
  if(state.type==='contests'){
    data.problems=(state.editing.problems||[]).map(q=>({...q,statementEn:normalizeMathMarkdown(q.statementEn||''),statementAz:normalizeMathMarkdown(q.statementAz||''),statementTr:normalizeMathMarkdown(q.statementTr||'')}));
  }
  if(state.type==='problems'){
    data.statementEn=normalizeMathMarkdown(data.statementEn||'');
    data.statementAz=normalizeMathMarkdown(data.statementAz||'');
    data.solutionEn=normalizeMathMarkdown(data.solutionEn||'');
    data.solutionAz=normalizeMathMarkdown(data.solutionAz||'');
  }
  if(state.type==='videos'){
    if(!data.youtubeUrl){toast('YouTube URL is required');return}
    data.thumbnail=pendingVideoThumbnail||state.editing?.thumbnail||'';
    if(!data.thumbnail){toast('Choose a thumbnail image file.');return}
  }
  if(state.type==='meetings'){
    if(!data.titleEn&&!data.titleAz){toast('Meeting title is required.');return}
    if(!data.startAt){toast('Choose a meeting date and time.');return}
    if(!data.meetingUrl){toast('Meeting link is required.');return}
    try{
      const u=new URL(data.meetingUrl);
      if(!/^https?:$/.test(u.protocol))throw new Error();
      data.meetingUrl=u.toString();
    }catch{toast('Please enter a valid meeting link.');return}
    const localStart=new Date(data.startAt);
    if(Number.isNaN(localStart.getTime())){toast('Meeting date and time is invalid.');return}
    data.startAt=localStart.toISOString();
    data.durationMinutes=Math.max(1,Number(data.durationMinutes)||120);
    data.coverImage=pendingMeetingImage||state.editing?.coverImage||'';
  }
  try{
    const x=state.editing;
    if(x.id) await api('/api/admin/'+state.type+'/'+encodeURIComponent(x.id),{method:'PUT',body:JSON.stringify(data)});
    else await api('/api/admin/'+state.type,{method:'POST',body:JSON.stringify(data)});
    state.editing=null;
    pendingMeetingImage='';
    toast('Saved successfully');
    render();
  }catch(e){toast(e.message)}
}
async function removeItem(id){if(!confirm('Delete this item?'))return;try{await api(`/api/admin/${state.type}/${id}`,{method:'DELETE'});toast('Deleted');render()}catch(e){toast(e.message)}}
</script></body></html>
