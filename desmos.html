<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Desmos</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script><style>
.tool-page{height:calc(100vh - 76px);min-height:0;padding:0;background:var(--bg,#08090b);overflow:hidden}
.tool-inner{width:100%;height:100%;margin:0}
.tool-frame{width:100%;height:100%;border:0;border-radius:0;overflow:hidden;background:#fff;box-shadow:none}
#desmos-calculator,#ggb-element{width:100%;height:100%}
html[data-theme="light"] .tool-page{background:#f7f7f5}
@media(max-width:700px){.tool-page{height:calc(100vh - 76px);padding:0}.tool-frame{border-radius:0}}
.desmos-loading,.desmos-fallback{height:100%;display:grid;place-items:center;align-content:center;gap:10px;text-align:center;font-family:'DM Sans',system-ui,sans-serif;color:#25282d;background:#fff}
.desmos-loading span,.desmos-fallback span{color:#777c84;font-size:12px}
.desmos-spinner{width:28px;height:28px;border:3px solid #d8dadd;border-top-color:#17191c;border-radius:50%;animation:desmosSpin .8s linear infinite}
.desmos-fallback .btn{margin-top:8px}
@keyframes desmosSpin{to{transform:rotate(360deg)}}
</style><script src="https://www.desmos.com/api/v1.8/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script></head><body><script>
shell('Tools','Desmos',`<main class="tool-page"><div class="tool-inner"><div class="tool-frame"><div id="desmos-calculator"><div class="desmos-loading"><div class="desmos-spinner"></div><strong>Loading Desmos…</strong><span>Preparing your graphing workspace</span></div></div></div></div></main>`);
(function(){
  let started=false,attempts=0;
  function start(){
    const el=document.getElementById('desmos-calculator');
    if(!el||started)return;
    if(window.Desmos&&typeof window.Desmos.GraphingCalculator==='function'){
      started=true;
      el.innerHTML='';
      try{
        const calculator=Desmos.GraphingCalculator(el,{keypad:true,graphpaper:true,expressions:true,settingsMenu:true,zoomButtons:true,autosize:true});
        window.__ableDesmos=calculator;
        setTimeout(()=>calculator.resize(),100);
        window.addEventListener('resize',()=>calculator.resize());
      }catch(err){fail();}
      return;
    }
    attempts++;
    if(attempts<30)setTimeout(start,200);else fail();
  }
  function fail(){
    const el=document.getElementById('desmos-calculator');
    if(!el)return;
    el.innerHTML='<div class="desmos-fallback"><strong>Desmos could not be loaded.</strong><span>Refresh the page or open Desmos directly.</span><a class="btn primary" href="https://www.desmos.com/calculator" target="_blank" rel="noopener">Open Desmos</a></div>';
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
  window.addEventListener('load',start);
})();
</script></body></html>
