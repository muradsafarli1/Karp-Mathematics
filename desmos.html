<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Desmos</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script><style>
.tool-page{min-height:calc(100vh - 76px);padding:28px 20px 40px;background:var(--bg,#08090b)}
.tool-inner{width:min(1500px,100%);margin:auto}
.tool-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 0 18px}
.tool-head h1{font-family:'Space Grotesk';font-size:clamp(30px,4vw,48px);letter-spacing:-2px;margin:0}
.tool-head p{margin:5px 0 0;color:#858b96;font-size:14px}
.tool-frame{width:100%;height:calc(100vh - 175px);min-height:620px;border:1px solid #292d34;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.tool-frame iframe{width:100%;height:100%;border:0}
#desmos-calculator{width:100%;height:100%}
html[data-theme="light"] .tool-page{background:#f7f7f5}
html[data-theme="light"] .tool-frame{border-color:#dedfe2;box-shadow:0 15px 45px rgba(0,0,0,.08)}
@media(max-width:700px){.tool-page{padding:18px 10px 25px}.tool-head{margin-bottom:12px}.tool-frame{height:calc(100vh - 145px);min-height:500px;border-radius:10px}}
</style><script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script></head><body><script>
shell('Tools','Desmos',`<main class="tool-page"><div class="tool-inner"><div class="tool-head"><div><h1>Desmos</h1><p>Interactive Graphing Calculator</p></div></div><div class="tool-frame"><div id="desmos-calculator"></div></div></div></main>`);
window.addEventListener('load',()=>{const el=document.getElementById('desmos-calculator');if(el&&window.Desmos)Desmos.GraphingCalculator(el,{keypad:true,graphpaper:true,expressions:true,settingsMenu:true});});
</script></body></html>
