<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Desmos</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script><style>
.tool-page{height:calc(100vh - 76px);min-height:0;padding:0;background:var(--bg,#08090b);overflow:hidden}
.tool-inner{width:100%;height:100%;margin:0}
.tool-frame{width:100%;height:100%;border:0;border-radius:0;overflow:hidden;background:#fff;box-shadow:none}
#desmos-calculator,#ggb-element{width:100%;height:100%}
html[data-theme="light"] .tool-page{background:#f7f7f5}
@media(max-width:700px){.tool-page{height:calc(100vh - 76px);padding:0}.tool-frame{border-radius:0}}
</style><script src="https://www.desmos.com/api/v1.8/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script></head><body><script>
shell('Tools','Desmos',`<main class="tool-page"><div class="tool-inner"><div class="tool-frame"><div id="desmos-calculator"></div></div></div></main>`);
window.addEventListener('load',()=>{
  const el=document.getElementById('desmos-calculator');
  if(!el)return;
  if(window.Desmos){
    Desmos.GraphingCalculator(el,{keypad:true,graphpaper:true,expressions:true,settingsMenu:true});
  }else{
    el.innerHTML='<div style="display:grid;place-items:center;height:100%;font-family:DM Sans,sans-serif;color:#555">Desmos could not be loaded. Please refresh the page.</div>';
  }
});
</script></body></html>
