<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Desmos</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<script src="https://www.desmos.com/api/v1.12/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
<style>
.tool-page{height:calc(100vh - 76px);min-height:0;padding:0;background:var(--bg,#08090b);overflow:hidden}
.tool-inner{width:100%;height:100%}.tool-frame{width:100%;height:100%;border:0;border-radius:0;overflow:hidden;background:#fff}
#desmos-calculator{width:100%;height:100%}
@media(max-width:700px){.tool-page{height:calc(100vh - 76px);padding:0}}
</style>
</head>
<body>
<script>
shell('Tools','Desmos',`<main class="tool-page"><div class="tool-inner"><div id="desmos-calculator" class="tool-frame"></div></div></main>`);
window.addEventListener('load',()=>{
  const el=document.getElementById('desmos-calculator');
  if(el&&window.Desmos){
    window.karpDesmos=Desmos.GraphingCalculator(el,{expressions:true,settingsMenu:true,zoomButtons:true,keypad:true,graphpaper:true,expressionsCollapsed:false,border:false});
    window.karpDesmos.resize();
  }
});
window.addEventListener('resize',()=>window.karpDesmos?.resize());
</script>
</body>
</html>
