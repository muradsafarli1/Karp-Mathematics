<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Desmos</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<style>
.tool-page{height:calc(100vh - 76px);min-height:0;padding:0;background:var(--bg,#08090b);overflow:hidden}
.tool-inner{width:100%;height:100%}
.tool-frame{display:block;width:100%;height:100%;border:0;border-radius:0;background:#fff}
</style>
</head>
<body>
<script>
shell('Tools','Desmos',`<main class="tool-page"><div class="tool-inner"><iframe
  id="desmos-frame"
  class="tool-frame"
  title="Desmos Graphing Calculator"
  src="https://www.desmos.com/calculator?embed"
  allow="clipboard-read; clipboard-write"
  loading="eager"
  referrerpolicy="strict-origin-when-cross-origin"></iframe></div></main>`);
</script>
</body>
</html>
