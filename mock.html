<script>
(async()=>{
 const labels={A:'Algebra',C:'Combinatorics',G:'Geometry',N:'Number Theory'},qs=new URLSearchParams(location.search),reviewId=qs.get('review'),savedId=qs.get('saved');
 let mock=null,timer=null,seconds=0,finished=false,lastSavedBucket=-1,cloudMockHistory=[],cloudActiveMock=null,historyExpanded=false,reviewFromBuilder=false;

 function esc(x){return escapeHtml(x==null?'':String(x))}
 function md(x){return richMarkdown(String(x||''))}
 function renderMath(root){if(!root)return;const run=()=>{if(!window.MathJax?.typesetPromise)return;try{MathJax.typesetClear?.([root]);MathJax.typesetPromise([root]).catch(()=>{})}catch{}};[0,200,700,1500].forEach(ms=>setTimeout(run,ms))}
 async function ensureMath(root){if(!root)return;for(let i=0;i<10&&!window.MathJax?.typesetPromise;i++)await new Promise(r=>setTimeout(r,200));if(window.MathJax?.typesetPromise)try{MathJax.typesetClear?.([root]);await MathJax.typesetPromise([root])}catch{}}
 function cats(){return [...document.querySelectorAll('.mock-cat:checked')].map(x=>x.value)}
 function count(){return Math.max(1,Math.min(30,Number(document.getElementById('mock-count')?.value||6)))}
 function minutes(){return Math.max(1,Math.min(600,Number(document.getElementById('mock-minutes')?.value||60)))}
 function difficulty(){return document.querySelector('input[name="mock-difficulty"]:checked')?.value||'any'}
 function sequence(){const raw=document.getElementById('mock-sequence')?.value.trim();if(!raw)return null;const list=raw.toUpperCase().replace(/[^ACGN,\s]/g,'').split(/[,\s]+/).filter(Boolean);return list.length===count()&&list.every(x=>['A','C','G','N'].includes(x))?list:null}
 function history(){return cloudMockHistory.slice().sort((a,b)=>new Date(b.completedAt||b.savedAt||b.createdAt||0)-new Date(a.completedAt||a.savedAt||a.createdAt||0))}
 function activeLoad(){return cloudActiveMock||(()=>{try{return JSON.parse(localStorage.getItem('karp_active_mock')||'null')}catch{return null}})()}
 async function activeSave(){const data={...mock,active:true,lastUpdatedAt:new Date().toISOString()};localStorage.setItem('karp_active_mock',JSON.stringify(data));cloudActiveMock=data;try{await karpUserRecord('privateState','state',{activeMock:data})}catch(e){console.warn('Could not persist active mock',e)}}
 async function activeClear(){localStorage.removeItem('karp_active_mock');cloudActiveMock=null;try{await karpUserRecord('privateState','state',{activeMock:null})}catch(e){console.warn('Could not clear active mock',e)}}
 function dateText(v){return v?new Date(v).toLocaleString():'—'}
 function safeFileName(x){return String(x||'KARP-Mock').replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,80)||'KARP-Mock'}

 async function saveMockDraft(item=mock){
   if(!item?.id)return;
   const payload={...item,status:item.status==='completed'?'completed':'saved',savedAt:item.savedAt||new Date().toISOString()};
   await karpUserRecord('mockHistory',String(item.id),payload);
   const clean={...payload};cloudMockHistory=[clean,...history().filter(x=>String(x.id)!==String(item.id))];
   return clean;
 }
 async function deleteMock(id){
   if(!confirm('Delete this mock permanently?'))return;
   try{await karpDeleteUserRecord('mockHistory',String(id));cloudMockHistory=history().filter(x=>String(x.id)!==String(id));if(mock&&String(mock.id)===String(id))mock=null;toast('Mock deleted.');renderBuilder()}catch(e){toast(e.message||'Could not delete mock.')}}
 async function downloadMockPdf(item){
   if(!item?.questions?.length)return;
   const root=document.createElement('div');root.className='pdf-export';
   root.innerHTML=(item.questions||[]).map((q,i)=>'<article class="pdf-page"><div class="pdf-brand"><strong>KARP</strong><span>OLYMPIAD MATHEMATICS · PROBLEM SET</span></div><div class="pdf-title">'+esc(item.title||'Mock')+'</div><div class="pdf-meta">'+esc([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</div><div class="pdf-qno">Question '+(i+1)+'</div><div class="pdf-statement">'+md(q.statement)+'</div><div class="pdf-footer"><span>KARP</span><span>'+String(i+1)+' / '+item.questions.length+'</span></div></article>').join('');
   document.body.appendChild(root);
   await ensureMath(root);
   await new Promise(r=>setTimeout(r,500));
   try{
     if(window.html2pdf){await html2pdf().set({margin:0,filename:safeFileName(item.title)+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(root).save();}
     else{const w=window.open('','_blank');w.document.write('<!doctype html><html><head><title>'+esc(item.title)+'</title><style>@page{size:A4;margin:0}.pdf-page{width:210mm;min-height:297mm;padding:16mm 15mm;box-sizing:border-box;break-before:page;font-family:Arial}.pdf-page:first-child{break-before:auto}.pdf-brand{text-align:center;border-bottom:1px solid #ddd;padding-bottom:7mm;margin-bottom:8mm}.pdf-brand strong{font-size:22px;letter-spacing:3px}.pdf-brand span{display:block;font-size:7px;letter-spacing:2px;color:#777;margin-top:2mm}.pdf-title{font-size:17px;font-weight:800;margin-bottom:3mm}.pdf-meta{font-size:8px;color:#666;margin-bottom:9mm}.pdf-qno{font-size:11px;font-weight:800;margin-bottom:5mm}.pdf-statement{font-size:12.5px;line-height:1.75}</style></head><body>'+root.innerHTML+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),600);}
   }catch(e){console.error(e);toast('Could not build the PDF.')}
   root.remove();
 }
 function renderReview(item){
   finished=true;clearInterval(timer);window.onbeforeunload=null;
   document.body.innerHTML='<main class="mock-page"><section class="pagehero"><div class="wrap"><div class="eyebrow">KARP · MOCK REVIEW</div><h1>'+esc(item.title||'Mock')+'</h1><p class="lead">'+esc((item.questions?.length||0)+' questions · '+(item.minutes||0)+' minutes · '+dateText(item.completedAt||item.savedAt))+'</p></div></section><section class="section"><div class="mock-wrap"><section class="mock-review"><div class="review-head"><div><div class="mock-kicker">COMPLETED MOCK</div></div><div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end"><button class="btn" id="download-review">Download PDF</button><button class="btn" id="review-back">← Back to Mocks</button></div></div><div id="review-questions"></div></section></div></section></main>';
   const host=document.getElementById('review-questions');
   (item.questions||[]).forEach((q,i)=>{const sec=document.createElement('section');sec.className='review-question';sec.innerHTML='<h3>Question '+(i+1)+'</h3><div class="session-meta">'+esc([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</div><div class="review-statement">'+md(q.statement)+'</div><div class="review-solution"><button class="btn">Show solution</button><div class="review-solution-body">'+((q.solutions||[]).map((s,j)=>'<div style="margin-top:8px"><div class="mock-kicker">SOLUTION '+(j+1)+'</div>'+md(s)+'</div>').join('')||'<div class="muted">No supplied solution.</div>')+'</div></div>';const b=sec.querySelector('button'),body=sec.querySelector('.review-solution-body');b.onclick=()=>{const open=body.classList.toggle('open');b.textContent=open?'Hide solution':'Show solution';if(open)renderMath(body)};host.appendChild(sec)});
   document.getElementById('review-back').onclick=()=>location.href='/mock.html';document.getElementById('download-review').onclick=()=>downloadMockPdf(item);renderMath(host);
 }
 function limitedCards(items){
   const list=historyExpanded?items:items.slice(0,4),extra=items.length>4;
   const cards=list.map((x,i)=>'<article class="past-card"><span class="past-tag">'+esc(x.status==='saved'?'Saved Mock':x.status==='active'?'In progress':'Completed')+'</span><div class="past-title">'+esc(x.title||'Untitled Mock')+'</div><div class="past-meta">'+esc(dateText(x.completedAt||x.savedAt||x.createdAt))+' · '+esc((x.questions?.length||0)+' questions · '+(x.minutes||0)+' min')+'</div><div class="past-card-actions">'+(x.status==='completed'?'<button class="btn" data-review="'+esc(x.id)+'">Review</button>':'<button class="btn" data-open-saved="'+esc(x.id)+'">Open</button>')+'<button class="btn danger" data-delete="'+esc(x.id)+'">Delete</button></div></article>').join('');
   return cards+(extra?'<div class="more-row" style="grid-column:1/-1"><button class="more-btn" id="more-mocks">'+(historyExpanded?'Show less':'More')+' · '+(items.length-4)+' more</button></div>':'');
 }
 function renderBuilder(){
   shell('Mocks','Mocks','<main class="mock-page"><section class="pagehero"><div class="wrap"><div class="eyebrow">KARP · MOCKS</div><h1>Mocks</h1><p class="lead">Build, save, change and review custom Olympiad mock papers across your devices.</p></div></section><section class="section"><div class="mock-wrap"><section class="past-box"><div class="past-head"><div><div class="mock-kicker">LIBRARY</div><h2 style="font-family:Space Grotesk;font-size:32px;margin:6px 0">Your Mocks</h2><div class="muted">Saved drafts and completed mocks stay in your KARP account.</div></div></div><div id="active-holder"></div><div id="past-grid" class="past-grid"></div></section><section class="mock-builder" style="margin-top:12px"><div class="mock-kicker">CREATE</div><div class="mock-head"><div><h2>Create a Mock</h2><p>Choose a name, topics, questions, time and an optional A/C/G/N sequence.</p></div><div class="mock-kicker">MATHNET</div></div><div class="mock-grid"><div class="mock-field wide"><label class="mock-label">Mock name</label><input id="mock-name" class="input" placeholder="e.g. My Number Theory Mock"></div><div class="mock-field wide"><label class="mock-label">Topics</label><div class="choice-grid"><label class="choice"><input class="mock-cat" type="checkbox" value="A" checked><span>Algebra</span></label><label class="choice"><input class="mock-cat" type="checkbox" value="C" checked><span>Combinatorics</span></label><label class="choice"><input class="mock-cat" type="checkbox" value="G" checked><span>Geometry</span></label><label class="choice"><input class="mock-cat" type="checkbox" value="N" checked><span>Number Theory</span></label></div></div><div class="mock-field"><label class="mock-label">Questions</label><input id="mock-count" class="input" type="number" min="1" max="30" value="6"></div><div class="mock-field"><label class="mock-label">Time limit</label><input id="mock-minutes" class="input" type="number" min="1" max="600" value="60"></div><div class="mock-field"><label class="mock-label">Difficulty</label><div class="difficulty"><label><input type="radio" name="mock-difficulty" value="any" checked><span>Any</span></label><label><input type="radio" name="mock-difficulty" value="easy"><span>Easy</span></label><label><input type="radio" name="mock-difficulty" value="hard"><span>Hard</span></label></div></div><div class="mock-field"><label class="mock-label">Sequence <span style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="mock-sequence" class="input" placeholder="A,A,G,N,C,C"><div class="muted">A / C / G / N</div></div></div><div class="mock-actions"><span id="mock-status" class="mock-status"></span><button class="btn" id="randomize">Randomize</button><button class="btn primary" id="generate">Generate Mock</button></div></section><div id="mock-output" style="margin-top:12px"></div></div></section></main>');
   const past=history(),active=activeLoad();
   if(active&&active.endAt>Date.now()){document.getElementById('active-holder').innerHTML='<div style="margin-top:13px"><button class="active-card" style="display:block;width:100%;text-align:left;border:0;background:#17191c;color:#fff;border-radius:15px;padding:17px;cursor:pointer" id="continue-active"><div class="past-title">Continue · '+esc(active.title||'Active Mock')+'</div><div class="past-meta" style="color:#aeb5bc">'+esc(Math.ceil((active.endAt-Date.now())/60000)+' minutes remaining')+'</div><div class="past-open" style="margin-top:9px;font-size:10px">Resume mock →</div></button></div>';document.getElementById('continue-active').onclick=()=>startMock(active)}else if(active)activeClear();
   const pg=document.getElementById('past-grid');pg.innerHTML=past.length?limitedCards(past):'<div class="muted" style="grid-column:1/-1;padding:9px 0">No saved or completed mocks yet.</div>';
   pg.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>renderReview(past.find(x=>String(x.id)===String(b.dataset.review))));
   pg.querySelectorAll('[data-open-saved]').forEach(b=>b.onclick=()=>{const x=past.find(y=>String(y.id)===String(b.dataset.openSaved));if(x){mock=JSON.parse(JSON.stringify(x));renderPreview()}});
   pg.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMock(b.dataset.delete));
   document.getElementById('more-mocks')?.addEventListener('click',()=>{historyExpanded=!historyExpanded;renderBuilder()});
   document.getElementById('generate').onclick=()=>generate(false);document.getElementById('randomize').onclick=()=>{document.getElementById('mock-sequence').value='';generate(true)};
   if(reviewId){const item=past.find(x=>String(x.id)===String(reviewId));if(item)renderReview(item)}
   if(savedId&&!reviewId){const item=past.find(x=>String(x.id)===String(savedId));if(item){mock=JSON.parse(JSON.stringify(item));renderPreview()}}
 }
 async function generate(randomize){
   if(!(await ensureSignedIn('Create your mock','Sign in or create an account before generating a custom mock.')))return;
   const status=document.getElementById('mock-status'),out=document.getElementById('mock-output'),n=count(),seq=sequence(),raw=document.getElementById('mock-sequence').value.trim(),chosenCats=cats(),diff=difficulty();
   if(!chosenCats.length){status.textContent='Select at least one topic.';return}
   if(raw&&!seq){status.textContent='Sequence must contain exactly '+n+' valid letters.';return}
   const title=(document.getElementById('mock-name').value||'').trim()||'Untitled Mock';status.textContent='Finding proof problems…';out.innerHTML='<div class="mock-preview"><div class="muted">Searching the archive…</div></div>';
   try{
     const result=await mathnetFind({categories:chosenCats,difficulty:diff,sequence:seq,count:n,seed:randomize?Date.now()+Math.floor(Math.random()*99999):Date.now(),onProgress:(found,total,stage)=>{status.textContent=stage==='cache'?'Using cached candidates…':'Scanning MathNet candidates…';out.innerHTML='<div class="mock-preview"><div class="muted">Selecting '+found+' / '+total+' proof problems…</div></div>'}});
     if(!result.questions||result.questions.length<n)throw new Error(result.reason||'Not enough matching proof problems.');
     mock={id:'mock-'+Date.now(),title,minutes:minutes(),questions:result.questions,createdAt:new Date().toISOString(),status:'draft',categories:chosenCats,difficulty:diff,sequence:seq};
     mathnetSaveMock(mock);renderPreview();
   }catch(e){status.textContent=e.message||'Could not build the mock.';out.innerHTML='<div class="mock-preview"><div class="muted">'+esc(e.message||'Could not build the mock.')+'</div></div>'}
 }
 function renderPreview(){
   if(!mock)return;
   const saved=mock.status==='saved'||mock.status==='active';
   const statusLine=saved?'<div class="saved-note">Saved to your KARP account. You can open this mock from another device and continue editing it.</div>':'';
   let html='<div class="mock-preview"><div class="preview-head"><div><div class="mock-kicker">MOCK PAPER · '+(mock.status==='saved'?'SAVED':'READY')+'</div><h2>'+esc(mock.title)+'</h2><div class="muted">'+mock.questions.length+' questions · '+mock.minutes+' minutes · '+esc((mock.difficulty||'any').toUpperCase())+'</div>'+statusLine+'</div><div class="preview-actions"><button class="btn" id="download-mock">Download PDF</button><button class="btn" id="save-mock">'+(saved?'Save changes':'Save Mock')+'</button><button class="btn primary" id="start-mock">Start Mock</button></div></div>';
   mock.questions.forEach((q,i)=>html+='<section class="preview-question" data-q="'+i+'"><div class="preview-qhead"><div><div class="mock-kicker">QUESTION '+(i+1)+' · '+esc(labels[q.category])+'</div><div class="session-meta">'+esc([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</div></div><button class="btn" data-change="'+i+'">Change</button></div><div class="preview-statement">'+md(q.statement)+'</div></section>');
   html+='</div>';document.getElementById('mock-output').innerHTML=html;
   document.getElementById('start-mock').onclick=()=>startMock(mock);
   document.getElementById('save-mock').onclick=async()=>{const b=document.getElementById('save-mock');b.disabled=true;try{mock=await saveMockDraft(mock);toast('Mock saved to your account.');renderPreview()}catch(e){toast(e.message||'Could not save mock.')}finally{b.disabled=false}};
   document.getElementById('download-mock').onclick=()=>downloadMockPdf(mock);
   document.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>replaceQuestion(Number(b.dataset.change)));
   renderMath(document.getElementById('mock-output'));
 }
 async function replaceQuestion(index){
   const q=mock?.questions?.[index];if(!q)return;
   const section=document.querySelector('.preview-question[data-q="'+index+'"]');section?.classList.add('preview-changing');
   const others=(mock.questions||[]).map(x=>x.id).filter(Boolean);
   try{
     const result=await mathnetFind({categories:[q.category],sequence:[q.category],count:1,difficulty:mock.difficulty||'any',excludeIds:others,allowFallback:false,seed:Date.now()+index});
     if(!result.questions?.length)throw new Error('No unused '+labels[q.category]+' problem was found with this difficulty.');
     mock.questions[index]=result.questions[0];
     if(mock.status==='saved')await saveMockDraft(mock);
     renderPreview();toast('Question '+(index+1)+' changed.');
   }catch(e){section?.classList.remove('preview-changing');toast(e.message||'Could not change this question.')}
 }
 async function saveFinished(){
   mock={...mock,status:'completed',completedAt:new Date().toISOString(),active:false};
   await karpUserRecord('mockHistory',String(mock.id),mock);
   cloudMockHistory=[mock,...history().filter(x=>String(x.id)!==String(mock.id))];
   await activeClear();
 }
 function installGuard(on){window.onbeforeunload=on?e=>{e.preventDefault();e.returnValue='Your mock is saved and can be resumed later.'}:null}
 async function startMock(item){
   if(item?.id)mock=JSON.parse(JSON.stringify(item));if(!mock)return;
   try{await saveMockDraft(mock)}catch(e){toast(e.message||'Could not save mock.');return}
   finished=false;mock.status='active';mock.endAt=mock.endAt||Date.now()+Number(mock.minutes||60)*60000;seconds=Math.max(0,Math.ceil((mock.endAt-Date.now())/1000));await activeSave();installGuard(true);renderSession();clearInterval(timer);timer=setInterval(tick,1000)
 }
 function renderSession(){document.body.innerHTML='<main class="mock-session"><header class="mock-top"><div class="mock-kicker">KARP · MOCK IN PROGRESS</div><div class="mock-timer" id="mock-timer">'+clock(seconds)+'</div><div class="mock-session-meta">'+esc(mock.title)+' · '+mock.questions.length+' questions · '+mock.minutes+' min</div></header><div class="mock-paper" id="mock-paper">'+mock.questions.map((q,i)=>'<section class="session-question"><div class="session-qtitle">Question '+(i+1)+'</div><div class="session-meta">'+esc([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</div><div class="session-statement">'+md(q.statement)+'</div></section>').join('')+'<div class="session-bottom"><span class="session-note">This mock is saved to your KARP account while you work.</span><button class="btn primary" id="finish-mock">Finish Mock</button></div></div></main>';document.getElementById('finish-mock').onclick=()=>finishMock(false);renderMath(document.getElementById('mock-paper'));window.scrollTo(0,0)}
 function clock(s){const x=Math.max(0,Number(s||0));return String(Math.floor(x/3600)).padStart(2,'0')+':'+String(Math.floor(x%3600/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}
 function tick(){seconds=Math.max(0,Math.ceil((mock.endAt-Date.now())/1000));const el=document.getElementById('mock-timer');if(el)el.textContent=clock(seconds);const bucket=Math.floor(seconds/3);if(bucket!==lastSavedBucket){lastSavedBucket=bucket;activeSave()}if(seconds<=0)finishMock(true)}
 async function finishMock(auto){if(finished)return;finished=true;clearInterval(timer);installGuard(false);mock={...mock,completedAt:new Date().toISOString(),timedOut:!!auto};try{await saveFinished();renderReview(mock)}catch(e){finished=false;toast(e.message||'Could not save mock history.')}}
 (async()=>{try{await karpMigrateLocalState();const cloud=await karpUserState();cloudMockHistory=Array.isArray(cloud.mocks)?cloud.mocks:[];cloudActiveMock=cloud.activeMock||null;renderBuilder()}catch(e){console.error(e);renderBuilder()}})();
})();
</script>
</body></html>
