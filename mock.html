<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Mocks</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<script src="/mathnet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]]},svg:{fontCache:"global"}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
.mock-page{min-height:calc(100vh - 76px)}
.mock-wrap{width:min(calc(100% - 42px),1120px);margin:0 auto}
.mock-builder,.mock-preview{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:34px}
.mock-head{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;margin-bottom:28px}
.mock-kicker{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:800}
.mock-head h2{font-family:'Space Grotesk';font-size:38px;letter-spacing:-1.6px;margin:8px 0}
.mock-head p{max-width:700px;color:var(--muted);font-size:13px;line-height:1.7;margin:0}
.mock-badge{font-size:10px;letter-spacing:1.5px;font-weight:800;color:var(--muted);padding:9px 12px;border:1px solid var(--line);border-radius:10px;white-space:nowrap}
.mock-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
.mock-field{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:19px}
.mock-field.wide{grid-column:1/-1}
.mock-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:800;margin-bottom:10px}
.choice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.choice{display:block}.choice input{position:absolute;opacity:0}
.choice span{display:flex;justify-content:center;align-items:center;min-height:48px;border:1px solid var(--line);border-radius:11px;background:var(--panel);font-size:12px;color:var(--muted)}
.choice input:checked+span{background:var(--text);color:var(--panel);border-color:var(--text)}
.difficulty{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.difficulty label{flex:1}.difficulty input{position:absolute;opacity:0}.difficulty span{display:block;text-align:center;padding:9px;border-radius:8px;font-size:12px;color:var(--muted)}
.difficulty input:checked+span{background:var(--text);color:var(--panel)}
.mock-number{font-size:20px!important;font-weight:800!important}
.mock-actions{display:flex;align-items:center;gap:9px;margin-top:22px}
.mock-status{margin-right:auto;color:var(--muted);font-size:12px}
.mock-preview{margin-top:18px}
.preview-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.preview-head h2{font-family:'Space Grotesk';font-size:31px;margin:6px 0}
.preview-meta{font-size:12px;color:var(--muted)}
.preview-question{padding:25px 0;border-bottom:1px solid var(--line)}
.preview-question:last-child{border-bottom:0}
.preview-question-title{font-size:12px;font-weight:800;margin-bottom:11px}
.preview-statement{font-size:18px;line-height:1.9}
.preview-actions{display:flex;justify-content:flex-end;margin-top:24px}

.past-mocks-box{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:34px;margin-bottom:18px}
.past-mocks-head{display:flex;justify-content:space-between;align-items:end;gap:16px}
.past-mocks-title{font-family:'Space Grotesk';font-size:32px;letter-spacing:-1.3px;margin:0}
.past-mocks-note{font-size:12px;color:var(--muted);line-height:1.7;margin:7px 0 0}
.past-mocks-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.past-mock-card{appearance:none;width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:left;cursor:pointer;transition:transform .15s}
.past-mock-card:hover{transform:translateY(-2px)}
.past-mock-title{font-size:14px;font-weight:800}.past-mock-date{font-size:11px;color:var(--muted);margin-top:7px}.past-mock-meta{font-size:11px;color:var(--muted);margin-top:14px}
.past-mock-review{margin-top:18px;padding:22px;border-radius:18px;background:var(--panel2)}
.past-mock-review h3{font-family:'Space Grotesk';font-size:24px;margin:0 0 5px}.past-mock-review-meta{font-size:11px;color:var(--muted);margin-bottom:12px}
.past-review-question{padding:18px 0;border-top:1px solid var(--line)}.past-review-statement{font-size:17px;line-height:1.85}.past-review-solution{margin-top:9px}.past-review-body{display:none;margin-top:10px;font-size:16px;line-height:1.85}.past-review-body.open{display:block}
.session-solution{margin-top:10px}.session-solution button{font-size:11px}.session-solution-body{display:none;margin-top:10px;font-size:16px;line-height:1.85}.session-solution-body.open{display:block}
@media(max-width:900px){.past-mocks-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.past-mocks-box{padding:22px}.past-mocks-grid{grid-template-columns:1fr}}
.mock-session{min-height:100vh;background:var(--bg);padding:0 0 55px}
.mock-session-head{position:sticky;top:0;z-index:30;background:var(--bg);padding:22px 20px 18px;text-align:center}
.mock-session-kicker{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:800}
.mock-session-timer{font-family:'Space Grotesk';font-size:70px;font-weight:800;line-height:1;margin:8px 0}
.mock-session-timer.expired{opacity:.5}
.mock-session-meta{font-size:11px;color:var(--muted)}
.mock-session-paper{width:min(calc(100% - 42px),980px);margin:16px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px 38px}
.session-question{padding:36px 0;border-bottom:1px solid var(--line)}
.session-question:last-child{border-bottom:0}
.session-qtitle{font-family:'Space Grotesk';font-weight:800;font-size:16px;margin-bottom:14px}
.session-meta{font-size:11px;color:var(--muted);margin-bottom:15px}
.session-statement{font-size:19px;line-height:1.9}
.session-bottom{padding-top:25px;display:flex;justify-content:flex-end}
@media(max-width:800px){.mock-grid{grid-template-columns:1fr}.mock-field.wide{grid-column:auto}.choice-grid{grid-template-columns:1fr 1fr}.mock-head,.preview-head{flex-direction:column}.mock-session-timer{font-size:52px}.mock-session-paper{padding:24px 20px}}
@media(max-width:520px){.choice-grid{grid-template-columns:1fr}.mock-builder,.mock-preview{padding:22px}.mock-wrap,.mock-session-paper{width:calc(100% - 28px)}}
</style>
</head>
<body>
<script>
(async()=>{
  const labels={A:'Algebra',C:'Combinatorics',G:'Geometry',N:'Number Theory'};
  let mock=null,timer=null,seconds=0,finished=false,finishSaved=false;

  function esc(x){return escapeHtml(x==null?'':String(x));}
  function md(x){return DOMPurify.sanitize(marked.parse(String(x||''),{breaks:true}));}
  function cats(){return Array.from(document.querySelectorAll('.mock-cat:checked')).map(x=>x.value);}
  function count(){return Math.max(1,Math.min(30,Number(document.getElementById('mock-count').value||6)));}
  function minutes(){return Math.max(1,Math.min(600,Number(document.getElementById('mock-minutes').value||60)));}
  function difficulty(){return document.querySelector('input[name="mock-difficulty"]:checked')?.value||'any';}
  function sequence(){
    const raw=document.getElementById('mock-sequence').value.trim();
    if(!raw)return null;
    const list=raw.toUpperCase().replace(/[^ACGN,\s]/g,'').split(/[,\s]+/).filter(Boolean);
    return list.length===count()&&list.every(x=>['A','C','G','N'].includes(x))?list:null;
  }
  function meta(q){
    return [q.country,q.year,q.problemNumber].filter(Boolean).join(' · ');
  }


  function mockHistory(){
    try{return JSON.parse(localStorage.getItem("karp_mock_history")||"[]")}catch{return []}
  }
  function mockDate(v){return v?new Date(v).toLocaleString():"—";}
  function renderPastMocks(){
    const grid=document.getElementById("past-mocks-grid"),reviewHost=document.getElementById("past-mock-review");
    if(!grid)return;
    const items=mockHistory();
    if(!items.length){grid.innerHTML='<div style="grid-column:1/-1;color:var(--muted);font-size:13px;padding:10px 0">No completed mocks yet.</div>';return}
    grid.innerHTML=items.map((x,i)=>'<button type="button" class="past-mock-card" data-past="'+i+'"><div class="past-mock-title">Mock '+(items.length-i)+'</div><div class="past-mock-date">'+esc(mockDate(x.completedAt))+'</div><div class="past-mock-meta">'+esc((x.questions?.length||0)+" questions · "+(x.minutes||0)+" min")+'</div></button>').join("");
    grid.querySelectorAll("[data-past]").forEach(btn=>btn.onclick=()=>{
      const x=items[Number(btn.dataset.past)];
      reviewHost.innerHTML="";
      const review=document.createElement("section");review.className="past-mock-review";
      review.innerHTML='<h3>Mock '+(items.length-Number(btn.dataset.past))+'</h3><div class="past-mock-review-meta">'+esc(mockDate(x.completedAt))+' · '+esc((x.questions?.length||0)+" questions · "+(x.minutes||0)+" min")+'</div>';
      (x.questions||[]).forEach((q,i)=>{
        const sec=document.createElement("div");sec.className="past-review-question";
        sec.innerHTML='<div class="past-review-statement"><strong>Question '+(i+1)+'</strong><div>'+md(q.statement)+'</div></div>';
        const action=document.createElement("div");action.className="past-review-solution";
        const b=document.createElement("button");b.className="btn";b.textContent="Show solution";
        const body=document.createElement("div");body.className="past-review-body";
        body.innerHTML=(q.solutions||[]).map((s,j)=>'<div style="margin-top:8px"><div style="font-size:10px;letter-spacing:1px;color:var(--muted)">SOLUTION '+(j+1)+'</div>'+md(s)+'</div>').join("");
        b.onclick=()=>{const open=body.classList.toggle("open");b.textContent=open?"Hide solution":"Show solution";if(open)typesetMath(body)};
        action.appendChild(b);action.appendChild(body);sec.appendChild(action);review.appendChild(sec);
      });
      reviewHost.appendChild(review);typesetMath(review);
      reviewHost.scrollIntoView({behavior:"smooth",block:"start"});
    });
  }

  function renderBuilder(){
    shell('Mocks','Mocks',`
      <main class="mock-page">
        <section class="pagehero"><div class="wrap"><div class="eyebrow">KARP · MOCKS</div><h1>Custom Mock</h1><p class="lead">Build a clean Olympiad-style paper from the cached English proof archive.</p></div></section>
        <section class="section"><div class="mock-wrap">
          <div class="past-mocks-box">
            <div class="mock-kicker">HISTORY</div>
            <div class="past-mocks-head"><div><h2 class="past-mocks-title">Past Mocks</h2><p class="past-mocks-note">Your completed mocks are listed here with their names and completion dates.</p></div></div>
            <div id="past-mocks-grid" class="past-mocks-grid"></div>
            <div id="past-mock-review"></div>
          </div>
          <div class="mock-builder" style="margin-top:18px">
            <div class="mock-head"><div><div class="mock-kicker">CUSTOM PAPER</div><h2>Choose your setup.</h2><p>Only English problems with supplied proof solutions are used. Solutions are never shown before the mock is finished.</p></div><div class="mock-badge">MATHNET</div></div>
            <div class="mock-grid">
              <div class="mock-field wide"><label class="mock-label">Topics</label><div class="choice-grid">
                <label class="choice"><input class="mock-cat" type="checkbox" value="A" checked><span>Algebra</span></label>
                <label class="choice"><input class="mock-cat" type="checkbox" value="C" checked><span>Combinatorics</span></label>
                <label class="choice"><input class="mock-cat" type="checkbox" value="G" checked><span>Geometry</span></label>
                <label class="choice"><input class="mock-cat" type="checkbox" value="N" checked><span>Number Theory</span></label>
              </div></div>
              <div class="mock-field"><label class="mock-label" for="mock-count">Questions</label><input id="mock-count" class="input mock-number" type="number" min="1" max="30" value="6"></div>
              <div class="mock-field"><label class="mock-label" for="mock-minutes">Time limit</label><input id="mock-minutes" class="input mock-number" type="number" min="1" max="600" value="60"><div class="field-note">minutes</div></div>
              <div class="mock-field"><label class="mock-label">Difficulty</label><div class="difficulty"><label><input type="radio" name="mock-difficulty" value="any" checked><span>Any</span></label><label><input type="radio" name="mock-difficulty" value="easy"><span>Easy</span></label><label><input type="radio" name="mock-difficulty" value="hard"><span>Hard</span></label></div></div>
              <div class="mock-field"><label class="mock-label" for="mock-sequence">Sequence <span style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="mock-sequence" class="input" placeholder="A,A,G,N,C,C"><div class="field-note">A / C / G / N. Leave empty for automatic selection.</div></div>
            </div>
            <div class="mock-actions"><span id="mock-status" class="mock-status"></span><button class="btn" id="randomize">Randomize</button><button class="btn primary" id="generate">Generate Mock</button></div>
          </div>
          <div id="mock-output"></div>
        </div></section>
      </main>`);
    renderPastMocks();
    document.getElementById('generate').onclick=()=>generate(false);
    document.getElementById('randomize').onclick=()=>{document.getElementById('mock-sequence').value='';generate(true);};
  }

  async function generate(randomize){
    const status=document.getElementById('mock-status'),out=document.getElementById('mock-output');
    const n=count(),seq=sequence(),raw=document.getElementById('mock-sequence').value.trim();
    if(!cats().length){status.textContent='Select at least one topic.';return;}
    if(raw&&!seq){status.textContent='Sequence must contain exactly '+n+' valid letters.';return;}
    status.textContent='Preparing the archive…';
    out.innerHTML='<div class="mock-preview"><div class="archive-loading">Searching the local MathNet archive…</div></div>';
    try{
      const result=await mathnetFind({categories:cats(),difficulty:difficulty(),sequence:seq,count:n,seed:randomize?Date.now()+Math.floor(Math.random()*100000):Date.now()});
      if(!result.questions||result.questions.length<n)throw new Error('The archive is still loading. Please generate again after the progress reaches 100%.');
      mock={id:'mock-'+Date.now(),minutes:minutes(),questions:result.questions};
      mathnetSaveMock(mock);
      status.textContent='Ready · '+n+' questions';
      renderPreview();
    }catch(error){
      status.textContent=error.message||'Could not build the mock.';
      out.innerHTML='<div class="mock-preview"><div class="empty">'+esc(error.message||'Could not build the mock.')+'</div></div>';
    }
  }

  function renderPreview(){
    let html='<div class="mock-preview"><div class="preview-head"><div><div class="mock-kicker">READY</div><h2>'+mock.questions.length+' questions</h2><div class="preview-meta">'+mock.minutes+' minutes · English proof archive</div></div><button id="start-mock" class="btn primary">Start Mock</button></div>';
    mock.questions.forEach((q,i)=>{
      html+='<section class="preview-question"><div class="preview-question-title">Question '+(i+1)+' · '+esc(labels[q.category])+'</div><div class="session-meta">'+esc([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</div><div class="preview-statement">'+md(q.statement)+'</div></section>';
    });
    html+='<div class="preview-actions"><button id="start-mock-bottom" class="btn primary">Start Mock</button></div></div>';
    document.getElementById('mock-output').innerHTML=html;
    document.getElementById('start-mock').onclick=startMock;
    document.getElementById('start-mock-bottom').onclick=startMock;
    typesetMath(document.getElementById('mock-output'));
  }

  function startMock(){
    seconds=mock.minutes*60;clearInterval(timer);
    document.body.innerHTML=`
      <main class="mock-session">
        <header class="mock-session-head"><div class="mock-session-kicker">KARP · MOCK IN PROGRESS</div><div id="mock-timer" class="mock-session-timer">${clock(seconds)}</div><div class="mock-session-meta">${mock.questions.length} questions · ${mock.minutes} minutes</div></header>
        <div class="mock-session-paper">
          ${mock.questions.map((q,i)=>'<section class="session-question"><div class="session-qtitle">Question '+(i+1)+'</div><div class="session-meta">'+esc([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</div><div class="session-statement">'+md(q.statement)+'</div></section>').join('')}
          <div class="session-bottom"><button class="btn primary" id="finish-mock">Finish Mock</button></div>
        </div>
      </main>`;
    document.getElementById('finish-mock').onclick=()=>finishMock(false);
    timer=setInterval(tick,1000);
    const paper=document.getElementById('mock-session-paper');
    const forceMath=()=>{
      if(!paper||!window.MathJax?.typesetPromise)return;
      try{
        if(MathJax.typesetClear)MathJax.typesetClear([paper]);
        MathJax.typesetPromise([paper]).catch(()=>{});
      }catch{}
    };
    setTimeout(forceMath,50);
    setTimeout(forceMath,350);
    setTimeout(forceMath,1000);
    window.scrollTo({top:0,behavior:'auto'});
  }

  function clock(s){return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  function tick(){
    const el=document.getElementById('mock-timer');if(!el){clearInterval(timer);return;}
    el.textContent=clock(Math.max(0,seconds));
    if(seconds<=0){el.classList.add('expired');finishMock(true);return;}
    seconds--;
  }

  function finishMock(auto){
    if(finished)return;
    clearInterval(timer);
    finished=true;
    mock={...mock,completedAt:new Date().toISOString(),timedOut:!!auto};
    let history=[];
    try{history=JSON.parse(localStorage.getItem('karp_mock_history')||'[]')}catch{}
    history.unshift(mock);
    localStorage.setItem('karp_mock_history',JSON.stringify(history.slice(0,20)));

    const finish=document.getElementById("finish-mock");
    if(finish){finish.textContent="Mock Finished";finish.disabled=true;finish.classList.remove("primary");}
    const bottom=finish?.parentElement;
    if(bottom){
      const note=document.createElement("span");note.className="session-finished";note.textContent=auto?"Time expired. Solutions are now available below.":"Mock finished. Solutions are now available below.";bottom.insertBefore(note,bottom.firstChild);
      const back=document.createElement("button");back.className="btn";back.textContent="Back to Mocks";back.onclick=()=>location.reload();bottom.appendChild(back);
    }
    document.querySelectorAll(".session-question").forEach((sec,i)=>{
      const q=mock.questions[i];
      const box=document.createElement("div");box.className="session-solution";
      const b=document.createElement("button");b.className="btn";b.textContent="Show solution";
      const body=document.createElement("div");body.className="session-solution-body";
      body.innerHTML=(q.solutions||[]).map((s,j)=>'<div style="margin-top:8px"><div style="font-size:10px;letter-spacing:1px;color:var(--muted)">SOLUTION '+(j+1)+'</div>'+md(s)+'</div>').join("")||'<div style="color:var(--muted)">No supplied solution.</div>';
      b.onclick=()=>{const open=body.classList.toggle("open");b.textContent=open?"Hide solution":"Show solution";if(open)typesetMath(body)};
      box.appendChild(b);box.appendChild(body);sec.appendChild(box);
    });
    typesetMath(document.querySelector(".mock-session-paper"));
  }

  document.addEventListener('DOMContentLoaded',renderBuilder);
})();
</script>
</body>
</html>
