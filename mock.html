<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Mocks</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script><script src="/mathnet-v8.js?v=11"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]],processEnvironments:true,processEscapes:true},svg:{fontCache:"global"},startup:{typeset:false}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
.mock-wrap{width:min(calc(100% - 42px),1120px);margin:0 auto}.mock-page{min-height:calc(100vh - 76px)}
.mock-builder,.past-box,.mock-review,.mock-preview{background:var(--panel);border-radius:22px;padding:30px}
.mock-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.mock-head h2{font-family:'Space Grotesk';font-size:36px;letter-spacing:-1.5px;margin:7px 0}.mock-head p,.muted{color:var(--muted);font-size:12px;line-height:1.7}
.mock-kicker{font-size:10px;letter-spacing:2px;font-weight:800;color:var(--muted);text-transform:uppercase}.mock-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}.mock-field{background:var(--panel2);border-radius:14px;padding:17px}.mock-field.wide{grid-column:1/-1}.mock-label{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:9px}
.choice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.choice input{position:absolute;opacity:0}.choice span{display:flex;align-items:center;justify-content:center;height:44px;border-radius:10px;background:var(--panel);color:var(--muted);font-size:11px}.choice input:checked+span{background:var(--text);color:var(--bg)}
.difficulty{display:flex;background:var(--panel);padding:3px;border-radius:9px}.difficulty label{flex:1}.difficulty input{position:absolute;opacity:0}.difficulty span{display:block;padding:9px;text-align:center;color:var(--muted);font-size:11px;border-radius:7px}.difficulty input:checked+span{background:var(--text);color:var(--bg)}
.mock-actions{display:flex;align-items:center;gap:8px;margin-top:20px}.mock-status{margin-right:auto;color:var(--muted);font-size:11px}
.past-head{display:flex;align-items:end;justify-content:space-between}.past-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.past-card,.active-card{display:block;width:100%;text-align:left;border:0;background:var(--panel2);color:var(--text);border-radius:14px;padding:17px;cursor:pointer}.past-card:hover,.active-card:hover{transform:translateY(-1px)}.past-title{font-size:13px;font-weight:800}.past-meta{font-size:10px;color:var(--muted);margin-top:6px}.past-open{margin-top:12px;font-size:10px;color:var(--muted)}.active-card{background:var(--text);color:var(--bg)}.active-card .past-meta,.active-card .past-open{color:var(--muted)}
.review-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}.review-head h2{font-family:'Space Grotesk';font-size:34px;letter-spacing:-1px;margin:5px 0}.review-question{padding:24px 0;border-top:1px solid var(--line)}.review-question:first-of-type{border-top:0}.review-question h3{font-family:'Space Grotesk';font-size:15px;margin:0 0 12px}.review-statement{font-size:18px;line-height:1.9}.review-solution{margin-top:10px}.review-solution-body{display:none;margin-top:10px;font-size:16px;line-height:1.9}.review-solution-body.open{display:block}
.preview-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding-bottom:20px;border-bottom:1px solid var(--line)}.preview-head h2{font-family:'Space Grotesk';font-size:30px;margin:5px 0}.preview-question{padding:22px 0;border-top:1px solid var(--line)}.preview-statement{font-size:18px;line-height:1.9}
.mock-session{min-height:100vh;background:var(--bg);padding-bottom:55px}.mock-top{position:sticky;top:0;z-index:20;text-align:center;background:var(--bg);padding:18px 15px 15px}.mock-timer{font-family:'Space Grotesk';font-size:66px;font-weight:800;line-height:1;margin:7px 0}.mock-session-meta{font-size:10px;color:var(--muted)}.mock-paper{width:min(calc(100% - 42px),980px);margin:16px auto 0;padding:28px 36px;background:var(--panel);border-radius:22px}.session-question{padding:34px 0;border-top:1px solid var(--line)}.session-question:first-child{border-top:0}.session-qtitle{font-family:'Space Grotesk';font-size:15px;font-weight:800;margin-bottom:10px}.session-meta{font-size:10px;color:var(--muted);margin-bottom:12px}.session-statement{font-size:19px;line-height:1.95}.session-bottom{display:flex;justify-content:flex-end;gap:8px;padding-top:18px}.session-note{margin-right:auto;align-self:center;font-size:11px;color:var(--muted)}
@media(max-width:900px){.past-grid{grid-template-columns:1fr 1fr}.mock-grid{grid-template-columns:1fr}.mock-field.wide{grid-column:auto}.choice-grid{grid-template-columns:1fr 1fr}.mock-head,.preview-head,.review-head{flex-direction:column}.mock-timer{font-size:52px}.mock-paper{padding:22px 20px}}@media(max-width:520px){.mock-wrap{width:calc(100% - 28px)}.mock-builder,.past-box,.mock-review,.mock-preview{padding:21px}.past-grid,.choice-grid{grid-template-columns:1fr}}
</style>
</head><body>
<script>
(async()=>{
  const labels={A:'Algebra',C:'Combinatorics',G:'Geometry',N:'Number Theory'},qs=new URLSearchParams(location.search),reviewId=qs.get('review');
  let mock=null,timer=null,seconds=0,finished=false,leaveGuard=false,lastSavedBucket=-1,cloudMockHistory=[];

  function esc(x){return escapeHtml(x==null?'':String(x))}
  function mathSource(s){return String(s||'').replace(/\\$\\$([\\s\\S]*?)\\$\\$/g,'\\\\[$1\\\\]').replace(/(^|[^\\\\])\\$([^$\\n]+)\\$/g,'$1\\\\($2\\\\)')}
  function md(x){return richMarkdown(String(x||''))}
  function renderMath(root){if(!root)return;const run=()=>{if(!window.MathJax?.typesetPromise)return;try{MathJax.typesetClear?.([root]);MathJax.typesetPromise([root]).catch(()=>{})}catch{}};[0,150,500,1200].forEach(ms=>setTimeout(run,ms))}
  function cats(){return [...document.querySelectorAll('.mock-cat:checked')].map(x=>x.value)}
  function count(){return Math.max(1,Math.min(30,Number(document.getElementById('mock-count').value||6)))}
  function minutes(){return Math.max(1,Math.min(600,Number(document.getElementById('mock-minutes').value||60)))}
  function difficulty(){return document.querySelector('input[name="mock-difficulty"]:checked')?.value||'any'}
  function sequence(){const raw=document.getElementById('mock-sequence').value.trim();if(!raw)return null;const list=raw.toUpperCase().replace(/[^ACGN,\\s]/g,'').split(/[,\\s]+/).filter(Boolean);return list.length===count()&&list.every(x=>['A','C','G','N'].includes(x))?list:null}
  function history(){return cloudMockHistory.slice()}
  function activeLoad(){try{return JSON.parse(localStorage.getItem('karp_active_mock')||'null')}catch{return null}}
  function activeSave(){localStorage.setItem('karp_active_mock',JSON.stringify({...mock,active:true,lastUpdatedAt:new Date().toISOString()}))}
  function activeClear(){localStorage.removeItem('karp_active_mock')}
  function dateText(v){return v?new Date(v).toLocaleString():'—'}

  function renderReview(item){
    finished=true;clearInterval(timer);leaveGuard=false;window.onbeforeunload=null;
    document.body.innerHTML='<main class="mock-page"><section class="pagehero"><div class="wrap"><div class="eyebrow">KARP · MOCK REVIEW</div><h1>'+esc(item.title||'Mock')+'</h1><p class="lead">'+esc((item.questions?.length||0)+' questions · '+(item.minutes||0)+' minutes · '+dateText(item.completedAt))+'</p></div></section><section class="section"><div class="mock-wrap"><section class="mock-review"><div class="review-head"><div><div class="mock-kicker">COMPLETED MOCK</div></div><button class="btn" id="review-back">← Back to Mocks</button></div><div id="review-questions"></div></section></div></section></main>';
    const host=document.getElementById('review-questions');
    (item.questions||[]).forEach((q,i)=>{
      const sec=document.createElement('section');sec.className='review-question';sec.innerHTML='<h3>Question '+(i+1)+'</h3><div class="session-meta">'+esc([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</div><div class="review-statement">'+md(q.statement)+'</div><div class="review-solution"><button class="btn">Show solution</button><div class="review-solution-body">'+((q.solutions||[]).map((s,j)=>'<div style="margin-top:8px"><div class="mock-kicker">SOLUTION '+(j+1)+'</div>'+md(s)+'</div>').join('')||'<div class="muted">No supplied solution.</div>')+'</div></div>';
      const b=sec.querySelector('button'),body=sec.querySelector('.review-solution-body');b.onclick=()=>{const open=body.classList.toggle('open');b.textContent=open?'Hide solution':'Show solution';if(open)renderMath(body)};host.appendChild(sec);
    });
    document.getElementById('review-back').onclick=()=>location.href='/mock.html';renderMath(host);
  }

  function renderBuilder(){
    shell('Mocks','Mocks','<main class="mock-page"><section class="pagehero"><div class="wrap"><div class="eyebrow">KARP · MOCKS</div><h1>Mocks</h1><p class="lead">Build, start and review custom Olympiad mocks.</p></div></section><section class="section"><div class="mock-wrap"><section class="past-box"><div class="past-head"><div><div class="mock-kicker">HISTORY</div><h2 style="font-family:Space Grotesk;font-size:32px;margin:6px 0">Past Mocks</h2><div class="muted">Your finished and active mocks.</div></div></div><div id="active-holder"></div><div id="past-grid" class="past-grid"></div></section><section class="mock-builder"><div class="mock-kicker">CREATE</div><div class="mock-head"><div><h2>Create a Mock</h2><p>Choose a name, topics, questions, time and optional sequence.</p></div><div class="mock-kicker">MATHNET</div></div><div class="mock-grid"><div class="mock-field wide"><label class="mock-label">Mock name</label><input id="mock-name" class="input" placeholder="e.g. My Number Theory Mock"></div><div class="mock-field wide"><label class="mock-label">Topics</label><div class="choice-grid"><label class="choice"><input class="mock-cat" type="checkbox" value="A" checked><span>Algebra</span></label><label class="choice"><input class="mock-cat" type="checkbox" value="C" checked><span>Combinatorics</span></label><label class="choice"><input class="mock-cat" type="checkbox" value="G" checked><span>Geometry</span></label><label class="choice"><input class="mock-cat" type="checkbox" value="N" checked><span>Number Theory</span></label></div></div><div class="mock-field"><label class="mock-label">Questions</label><input id="mock-count" class="input" type="number" min="1" max="30" value="6"></div><div class="mock-field"><label class="mock-label">Time limit</label><input id="mock-minutes" class="input" type="number" min="1" max="600" value="60"></div><div class="mock-field"><label class="mock-label">Difficulty</label><div class="difficulty"><label><input type="radio" name="mock-difficulty" value="any" checked><span>Any</span></label><label><input type="radio" name="mock-difficulty" value="easy"><span>Easy</span></label><label><input type="radio" name="mock-difficulty" value="hard"><span>Hard</span></label></div></div><div class="mock-field"><label class="mock-label">Sequence <span style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="mock-sequence" class="input" placeholder="A,A,G,N,C,C"><div class="muted">A / C / G / N</div></div></div><div class="mock-actions"><span id="mock-status" class="mock-status"></span><button class="btn" id="randomize">Randomize</button><button class="btn primary" id="generate">Generate Mock</button></div></section><div id="mock-output"></div></div></section></main>');
    const past=history(),active=activeLoad();
    if(active&&active.endAt>Date.now()){document.getElementById('active-holder').innerHTML='<div style="margin-top:13px"><button class="active-card" id="continue-active"><div class="past-title">Continue · '+esc(active.title||'Active Mock')+'</div><div class="past-meta">'+esc(Math.ceil((active.endAt-Date.now())/60000)+' minutes remaining')+'</div><div class="past-open">Resume mock →</div></button></div>';document.getElementById('continue-active').onclick=()=>startMock(active)}
    else if(active)activeClear();
    const pg=document.getElementById('past-grid');
    pg.innerHTML=past.length?past.map((x,i)=>'<button type="button" class="past-card" data-past="'+i+'"><div class="past-title">'+esc(x.title||('Mock '+(past.length-i)))+'</div><div class="past-meta">'+esc(dateText(x.completedAt))+'</div><div class="past-open">'+esc((x.questions?.length||0)+' questions · '+(x.minutes||0)+' min')+' · Review →</div></button>').join(''):'<div class="muted" style="grid-column:1/-1;padding:9px 0">No finished mocks yet.</div>';
    pg.querySelectorAll('[data-past]').forEach(b=>b.onclick=()=>renderReview(past[Number(b.dataset.past)]));
    document.getElementById('generate').onclick=()=>generate(false);document.getElementById('randomize').onclick=()=>{document.getElementById('mock-sequence').value='';generate(true)};
    if(reviewId){const item=past.find(x=>String(x.id)===String(reviewId));if(item)renderReview(item)}
  }

  async function generate(randomize){
    if(!(await ensureSignedIn('Create your mock','Sign in or create an account before generating a custom mock.')))return;
    const status=document.getElementById('mock-status'),out=document.getElementById('mock-output'),n=count(),seq=sequence(),raw=document.getElementById('mock-sequence').value.trim();
    if(!cats().length){status.textContent='Select at least one topic.';return}
    if(raw&&!seq){status.textContent='Sequence must contain exactly '+n+' valid letters.';return}
    const title=(document.getElementById('mock-name').value||'').trim()||'Untitled Mock';
    status.textContent='Finding proof problems…';out.innerHTML='<div class="mock-preview"><div class="muted">Searching the archive…</div></div>';
    try{
      const result=await mathnetFind({
        categories:cats(),difficulty:difficulty(),sequence:seq,count:n,
        seed:randomize?Date.now()+Math.floor(Math.random()*99999):Date.now(),
        onProgress:(found,total,stage)=>{
          status.textContent=stage==='cache'?'Using cached candidates…':'Scanning MathNet candidates…';
          out.innerHTML='<div class="mock-preview"><div class="muted">Selecting '+found+' / '+total+' proof problems…</div></div>';
        }
      });
      if(!result.questions||result.questions.length<n)throw new Error(result.reason||'Not enough matching proof problems.');
      mock={id:'mock-'+Date.now(),title,minutes:minutes(),questions:result.questions,createdAt:new Date().toISOString()};
      mathnetSaveMock(mock);renderPreview();
    }catch(e){
      status.textContent=e.message||'Could not build the mock.';
      out.innerHTML='<div class="mock-preview"><div class="muted">'+esc(e.message||'Could not build the mock.')+'</div></div>';
    }
  }

  function renderPreview(){
    let html='<div class="mock-preview"><div class="preview-head"><div><div class="mock-kicker">READY</div><h2>'+esc(mock.title)+'</h2><div class="muted">'+mock.questions.length+' questions · '+mock.minutes+' minutes</div></div><button class="btn primary" id="start-mock">Start Mock</button></div>';
    mock.questions.forEach((q,i)=>html+='<section class="preview-question"><div class="mock-kicker">QUESTION '+(i+1)+' · '+esc(labels[q.category])+'</div><div class="session-meta">'+esc([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</div><div class="preview-statement">'+md(q.statement)+'</div></section>');
    html+='</div>';document.getElementById('mock-output').innerHTML=html;document.getElementById('start-mock').onclick=()=>startMock(mock);renderMath(document.getElementById('mock-output'));
  }
  async function saveFinished(){await karpUserRecord('mockHistory',String(mock.id),{...mock,id:String(mock.id)});cloudMockHistory=[mock,...history().filter(x=>x.id!==mock.id)].slice(0,30);activeClear()}
  function installGuard(on){leaveGuard=on;window.onbeforeunload=on?e=>{e.preventDefault();e.returnValue='Are you sure you want to leave this mock? Your mock is saved and can be resumed later.'}:null}
  function startMock(item){if(item&&item.id)mock=JSON.parse(JSON.stringify(item));if(!mock)return;finished=false;mock.endAt=mock.endAt||Date.now()+Number(mock.minutes||60)*60000;seconds=Math.max(0,Math.ceil((mock.endAt-Date.now())/1000));activeSave();installGuard(true);renderSession();clearInterval(timer);timer=setInterval(tick,1000)}
  function renderSession(){document.body.innerHTML='<main class="mock-session"><header class="mock-top"><div class="mock-kicker">KARP · MOCK IN PROGRESS</div><div class="mock-timer" id="mock-timer">'+clock(seconds)+'</div><div class="mock-session-meta">'+esc(mock.title)+' · '+mock.questions.length+' questions · '+mock.minutes+' min</div></header><div class="mock-paper" id="mock-paper">'+mock.questions.map((q,i)=>'<section class="session-question"><div class="session-qtitle">Question '+(i+1)+'</div><div class="session-meta">'+esc([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</div><div class="session-statement">'+md(q.statement)+'</div></section>').join('')+'<div class="session-bottom"><span class="session-note">Leaving the mock asks for confirmation. You can resume it later.</span><button class="btn primary" id="finish-mock">Finish Mock</button></div></div></main>';document.getElementById('finish-mock').onclick=()=>finishMock(false);renderMath(document.getElementById('mock-paper'));window.scrollTo(0,0)}
  function clock(s){const x=Math.max(0,Number(s||0));return String(Math.floor(x/3600)).padStart(2,'0')+':'+String(Math.floor(x%3600/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}
  function tick(){seconds=Math.max(0,Math.ceil((mock.endAt-Date.now())/1000));const el=document.getElementById('mock-timer');if(el)el.textContent=clock(seconds);const bucket=Math.floor(seconds/2);if(bucket!==lastSavedBucket){lastSavedBucket=bucket;activeSave()}if(seconds<=0)finishMock(true)}
  async function finishMock(auto){if(finished)return;finished=true;clearInterval(timer);installGuard(false);mock={...mock,completedAt:new Date().toISOString(),timedOut:!!auto};try{await saveFinished();renderReview(mock)}catch(e){finished=false;toast(e.message||'Could not save mock history.')}}
  (async()=>{try{await karpMigrateLocalState();const cloud=await karpUserState();cloudMockHistory=Array.isArray(cloud.mocks)?cloud.mocks:[];renderBuilder()}catch(e){console.error(e);renderBuilder()}})();
})();
</script>
</body></html>
