<style>
.mock-wrap{width:min(calc(100% - 42px),1120px);margin:0 auto}.mock-page{min-height:calc(100vh - 76px)}
.mock-builder,.past-box,.mock-review,.mock-preview{background:var(--panel);border-radius:22px;padding:30px}
.mock-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.mock-head h2{font-family:'Space Grotesk';font-size:36px;letter-spacing:-1.5px;margin:7px 0}.mock-head p,.muted{color:var(--muted);font-size:12px;line-height:1.7}
.mock-kicker{font-size:10px;letter-spacing:2px;font-weight:800;color:var(--muted);text-transform:uppercase}.mock-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}.mock-field{background:var(--panel2);border-radius:14px;padding:17px}.mock-field.wide{grid-column:1/-1}.mock-label{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:9px}
.choice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.choice input{position:absolute;opacity:0}.choice span{display:flex;align-items:center;justify-content:center;height:44px;border-radius:10px;background:var(--panel);color:var(--muted);font-size:11px}.choice input:checked+span{background:var(--text);color:var(--bg)}
.difficulty{display:flex;background:var(--panel);padding:3px;border-radius:9px}.difficulty label{flex:1}.difficulty input{position:absolute;opacity:0}.difficulty span{display:block;padding:9px;text-align:center;color:var(--muted);font-size:11px;border-radius:7px}.difficulty input:checked+span{background:var(--text);color:var(--bg)}
.mock-actions{display:flex;align-items:center;gap:8px;margin-top:20px}.mock-status{margin-right:auto;color:var(--muted);font-size:11px}
.past-head{display:flex;align-items:end;justify-content:space-between}.past-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.past-card{display:block;width:100%;text-align:left;position:relative;border:0;background:var(--panel2);color:var(--text);border-radius:14px;padding:17px}.past-card:hover{transform:translateY(-1px)}.past-actions{display:flex;gap:6px;margin-top:13px}.past-actions .btn{font-size:9px!important;padding:7px 10px!important}.past-title{font-size:13px;font-weight:800}.past-meta{font-size:10px;color:var(--muted);margin-top:6px}.past-open{margin-top:12px;font-size:10px;color:var(--muted)}.active-card{display:block;width:100%;text-align:left;border:0;background:var(--text);color:var(--bg);border-radius:14px;padding:17px;cursor:pointer}.active-card .past-meta,.active-card .past-open{color:var(--muted)}
.review-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}.review-head h2{font-family:'Space Grotesk';font-size:34px;letter-spacing:-1px;margin:5px 0}.review-question{padding:24px 0;border-top:1px solid var(--line)}.review-question:first-of-type{border-top:0}.review-question h3{font-family:'Space Grotesk';font-size:15px;margin:0 0 12px}.review-statement{font-size:18px;line-height:1.9}.review-solution{margin-top:10px}.review-solution-body{display:none;margin-top:10px;font-size:16px;line-height:1.9}.review-solution-body.open{display:block}
.preview-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding-bottom:20px;border-bottom:1px solid var(--line)}.preview-head h2{font-family:'Space Grotesk';font-size:30px;margin:5px 0}.preview-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.preview-question{padding:22px 0;border-top:1px solid var(--line)}.preview-qhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}.preview-qhead .btn{font-size:9px;padding:7px 10px}.preview-statement{font-size:18px;line-height:1.9}.preview-changing{opacity:.5;pointer-events:none}
.saved-note{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--panel2);font-size:9px;color:var(--muted)}
.pdf-export{position:fixed;left:0;top:0;width:210mm;opacity:.001;pointer-events:none;z-index:-1;background:#fff;color:#111}.pdf-page{width:210mm;min-height:297mm;padding:16mm 15mm;box-sizing:border-box;background:#fff;break-before:page;page-break-before:always;position:relative}.pdf-page:first-child{break-before:auto;page-break-before:auto}.pdf-brand{text-align:center;border-bottom:1px solid #dfe3e6;padding-bottom:7mm;margin-bottom:8mm}.pdf-brand strong{font:800 22px 'Space Grotesk';letter-spacing:3px}.pdf-brand span{display:block;font:700 7px 'Space Grotesk';letter-spacing:2px;color:#78828b;margin-top:2mm}.pdf-title{font:800 17px 'Space Grotesk';margin-bottom:3mm}.pdf-meta{font-size:8px;color:#68727b;margin-bottom:9mm}.pdf-qno{font:800 11px 'Space Grotesk';margin-bottom:5mm}.pdf-statement{font-size:12.5px;line-height:1.75}.pdf-footer{position:absolute;left:15mm;right:15mm;bottom:8mm;border-top:1px solid #e2e6e9;padding-top:3mm;font-size:7px;color:#87919a;display:flex;justify-content:space-between}
.mock-session{min-height:100vh;background:var(--bg);padding-bottom:55px}.mock-top{position:sticky;top:0;z-index:20;text-align:center;background:var(--bg);padding:18px 15px 15px}.mock-timer{font-family:'Space Grotesk';font-size:66px;font-weight:800;line-height:1;margin:7px 0}.mock-session-meta{font-size:10px;color:var(--muted)}.mock-paper{width:min(calc(100% - 42px),980px);margin:16px auto 0;padding:28px 36px;background:var(--panel);border-radius:22px}.session-question{padding:34px 0;border-top:1px solid var(--line)}.session-question:first-child{border-top:0}.session-qtitle{font-family:'Space Grotesk';font-size:15px;font-weight:800;margin-bottom:10px}.session-meta{font-size:10px;color:var(--muted);margin-bottom:12px}.session-statement{font-size:19px;line-height:1.95}.session-bottom{display:flex;justify-content:flex-end;gap:8px;padding-top:18px}.session-note{margin-right:auto;align-self:center;font-size:11px;color:var(--muted)}
@media(max-width:900px){.past-grid{grid-template-columns:1fr 1fr}.mock-grid{grid-template-columns:1fr}.mock-field.wide{grid-column:auto}.choice-grid{grid-template-columns:1fr 1fr}.mock-head,.preview-head,.review-head{flex-direction:column}.mock-timer{font-size:52px}.mock-paper{padding:22px 20px}}@media(max-width:520px){.mock-wrap{width:calc(100% - 28px)}.mock-builder,.past-box,.mock-review,.mock-preview{padding:21px}.past-grid,.choice-grid{grid-template-columns:1fr}}

.mock-field,.past-card{background:#f7f7f5!important;color:#17191c!important}
.mock-field .muted,.past-meta,.past-open,.mock-head p,.mock-status,.session-meta,.mock-session-meta{color:#6f665d!important}
.mock-timer{color:#17191c}.mock-top{background:#f7f7f5!important}.mock-fullscreen{width:40px;height:40px;padding:0;border-radius:11px;display:inline-grid;place-items:center;font-size:20px;background:#f7f7f5!important;color:#17191c!important;border:1px solid #d7c5ad!important}
.mock-fullscreen-lock{position:fixed;inset:0;z-index:100000;display:none;place-items:center;padding:25px;background:rgba(234,219,199,.97);text-align:center}
.mock-fullscreen-lock.open{display:grid}.mock-fullscreen-lock-card{width:min(520px,100%);padding:40px 28px;border-radius:22px;background:#f7f7f5;box-shadow:0 18px 50px rgba(69,52,34,.12)}
.mock-fullscreen-lock-card h2{font:800 30px/1.05 'Space Grotesk';margin:0 0 12px}.mock-fullscreen-lock-card p{font-size:11px;line-height:1.7;color:#6f665d;margin:0 0 22px}.mock-fullscreen-lock-card .mock-fullscreen{width:52px;height:52px;margin:auto;font-size:24px}
.pdf-export{position:absolute!important;left:-12000px!important;top:0!important;width:210mm!important;opacity:1!important;visibility:visible!important;z-index:0!important;pointer-events:none!important;background:#fff!important;color:#111!important}
@media(max-width:700px){.mock-paper{width:calc(100% - 28px)}.mock-fullscreen{width:38px;height:38px}}

<script>
(async()=>{
  const labels={A:'Algebra',C:'Combinatorics',G:'Geometry',N:'Number Theory'},qs=new URLSearchParams(location.search),reviewId=qs.get('review'),savedId=qs.get('saved');
  let mock=null,timer=null,seconds=0,finished=false,leaveGuard=false,lastSavedBucket=-1,cloudMockHistory=[],manualQuestions=[],manualSearchTimer=0;

  function esc(x){return escapeHtml(x==null?'':String(x))}
  function mathSource(s){return String(s||'').replace(/\\$\\$([\\s\\S]*?)\\$\\$/g,'\\\\[$1\\\\]').replace(/(^|[^\\\\])\\$([^$\\n]+)\\$/g,'$1\\\\($2\\\\)')}
  function md(x){return richMarkdown(String(x||''))}
  async function renderMath(root){
    if(!root)return false;
    if(typeof typesetMath==='function')return typesetMath(root,40);
    if(window.MathJax?.startup?.promise){try{await window.MathJax.startup.promise}catch{}}
    if(window.MathJax?.typesetPromise){
      try{window.MathJax.typesetClear?.([root]);await window.MathJax.typesetPromise([root]);return true}catch(e){console.error('KARP MathJax error',e)}
    }
    return false;
  }
  function cats(){return [...document.querySelectorAll('.mock-cat:checked')].map(x=>x.value)}
  function count(){return Math.max(1,Math.min(30,Number(document.getElementById('mock-count').value||6)))}
  function minutes(){return Math.max(1,Math.min(600,Number(document.getElementById('mock-minutes').value||60)))}
  function difficulty(){return document.querySelector('input[name="mock-difficulty"]:checked')?.value||'any'}
  function sequence(){const raw=document.getElementById('mock-sequence').value.trim();if(!raw)return null;const list=raw.toUpperCase().replace(/[^ACGN,\\s]/g,'').split(/[,\\s]+/).filter(Boolean);return list.length===count()&&list.every(x=>['A','C','G','N'].includes(x))?list:null}
  function history(){return cloudMockHistory.slice()}
  let cloudActiveMock=null;
  function activeLoad(){return cloudActiveMock||(()=>{try{return JSON.parse(localStorage.getItem('karp_active_mock')||'null')}catch{return null}})()}
  async function activeSave(){const data={...mock,active:true,lastUpdatedAt:new Date().toISOString()};localStorage.setItem('karp_active_mock',JSON.stringify(data));cloudActiveMock=data;try{await karpUserRecord('privateState','state',{activeMock:data})}catch(e){console.warn('Could not persist active mock',e)}}
  async function activeClear(){localStorage.removeItem('karp_active_mock');cloudActiveMock=null;try{await karpUserRecord('privateState','state',{activeMock:null})}catch(e){console.warn('Could not clear active mock',e)}}
  async function saveMockDraft(item=mock){
    if(!item?.id)return item;
    const payload={...item,status:item.status==='completed'?'completed':'saved',savedAt:item.savedAt||new Date().toISOString()};
    await karpUserRecord('mockHistory',String(item.id),payload);
    cloudMockHistory=[payload,...history().filter(x=>String(x.id)!==String(item.id))];
    return payload;
  }
  async function deleteMock(id){
    if(!confirm('Delete this mock permanently?'))return;
    try{
      await karpDeleteUserRecord('mockHistory',String(id));
      cloudMockHistory=history().filter(x=>String(x.id)!==String(id));
      toast('Mock deleted.');
      renderBuilder();
    }catch(e){toast(e.message||'Could not delete mock.')}
  }
  function dateText(v){return v?new Date(v).toLocaleString():'—'}
  function renderReview(item){
    window.__karpMockFsCleanup?.();window.__karpMockFsCleanup=null;window.__karpMockActivityCleanup?.();window.__karpMockActivityCleanup=null;
    setKarpActivity({page:'Mock Review',label:'Mock review',detail:item?.title||'Mock',question:null});
    finished=true;clearInterval(timer);leaveGuard=false;window.onbeforeunload=null;
    document.body.innerHTML='<main class="mock-page"><section class="pagehero"><div class="wrap"><div class="eyebrow">KARP · MOCK REVIEW</div><h1>'+esc(item.title||'Mock')+'</h1><p class="lead">'+esc((item.questions?.length||0)+' questions · '+(item.minutes||0)+' minutes · '+dateText(item.completedAt))+'</p></div></section><section class="section"><div class="mock-wrap"><section class="mock-review"><div class="review-head"><div><div class="mock-kicker">COMPLETED MOCK</div></div><button class="btn" id="review-back">← Back to Mocks</button></div><div id="review-questions"></div></section></div></section></main>';
    const host=document.getElementById('review-questions');
    (item.questions||[]).forEach((q,i)=>{
      const sec=document.createElement('section');sec.className='review-question';sec.innerHTML='<h3>Question '+(i+1)+'</h3><div class="session-meta">'+esc([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</div><div class="review-statement">'+md(q.statement)+'</div><div class="review-solution"><button class="btn">Show solution</button><div class="review-solution-body">'+((q.solutions||[]).map((s,j)=>'<div style="margin-top:8px"><div class="mock-kicker">SOLUTION '+(j+1)+'</div>'+md(s)+'</div>').join('')||'<div class="muted">No supplied solution.</div>')+'</div></div>';
      const b=sec.querySelector('button'),body=sec.querySelector('.review-solution-body');b.onclick=()=>{const open=body.classList.toggle('open');b.textContent=open?'Hide solution':'Show solution';if(open)renderMath(body)};host.appendChild(sec);
    });
    document.getElementById('review-back').onclick=()=>location.href='/mock.html';renderMath(host);
  }

  function manualQuestionMeta(q){
    return [q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · ');
  }
  function renderManualSelected(){
    const host=document.getElementById('manual-selected');if(!host)return;
    host.innerHTML=manualQuestions.length
      ? manualQuestions.map((q,i)=>'<div class="manual-row" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:10px;background:#f7f7f5;border:1px solid #d9dad8"><div><strong>'+esc(q.competition||q.title||'Problem')+'</strong><div class="muted">'+esc(manualQuestionMeta(q))+'</div></div><button class="btn" data-manual-remove="'+i+'" type="button">Remove</button></div>').join('')
      : '<div class="muted">No manually selected problems.</div>';
    host.querySelectorAll('[data-manual-remove]').forEach(b=>b.onclick=()=>{manualQuestions.splice(Number(b.dataset.manualRemove),1);renderManualSelected()});
  }
  async function runManualSearch(){
    const input=document.getElementById('manual-search'),host=document.getElementById('manual-results');if(!input||!host)return;
    const q=input.value.trim();if(!q){host.innerHTML='';return}
    host.innerHTML='<div class="muted">Searching…</div>';
    try{
      const results=await mathnetSearch(q,{limit:18});
      const selectedIds=new Set(manualQuestions.map(x=>String(x.id)));
      const list=results.filter(x=>!selectedIds.has(String(x.id)));
      host.innerHTML=list.length?list.map(x=>'<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:10px;background:#f7f7f5;border:1px solid #d9dad8"><div><strong>'+esc(x.competition||x.title||'Problem')+'</strong><div class="muted">'+esc(manualQuestionMeta(x))+'</div></div><button class="btn primary" data-manual-add="'+esc(x.id)+'" type="button">Add</button></div>').join(''):'<div class="muted">No matching problems.</div>';
      host.querySelectorAll('[data-manual-add]').forEach(b=>b.onclick=async()=>{
        const id=b.dataset.manualAdd;if(manualQuestions.length>=count()){toast('You already selected the maximum number of questions.');return}
        try{
          b.disabled=true;
          const full=await mathnetProblemById(id);
          if(!full)throw new Error('Problem could not be loaded.');
          if(manualQuestions.some(x=>String(x.id)===String(full.id)))return;
          manualQuestions.push(full);
          renderManualSelected();runManualSearch();
        }catch(e){toast(e.message||'Could not add problem.');b.disabled=false}
      });
    }catch(e){host.innerHTML='<div class="muted">'+esc(e.message||'Search failed.')+'</div>'}
  }
  function setupManualPicker(){
    const input=document.getElementById('manual-search'),button=document.getElementById('manual-search-btn');
    if(!input)return;
    button.onclick=runManualSearch;
    input.oninput=()=>{clearTimeout(manualSearchTimer);manualSearchTimer=setTimeout(runManualSearch,300)};
    renderManualSelected();
  }

  function renderBuilder(){
    shell('Mocks','Mocks','<main class="mock-page"><section class="pagehero"><div class="wrap"><div class="eyebrow">KARP · MOCKS</div><h1>Mocks</h1><p class="lead">Build, start and review custom Olympiad mocks.</p></div></section><section class="section"><div class="mock-wrap"><section class="mock-builder"><div class="mock-kicker">CREATE</div><div class="mock-head"><div><h2>Create a Mock</h2><p>Choose a name, topics, questions, time and optional sequence.</p></div><div class="mock-kicker">MATHNET</div></div><div class="mock-grid"><div class="mock-field wide"><label class="mock-label">Mock name</label><input id="mock-name" class="input" placeholder="e.g. My Number Theory Mock"></div><div class="mock-field wide"><label class="mock-label">Topics</label><div class="choice-grid"><label class="choice"><input class="mock-cat" type="checkbox" value="A" checked><span>Algebra</span></label><label class="choice"><input class="mock-cat" type="checkbox" value="C" checked><span>Combinatorics</span></label><label class="choice"><input class="mock-cat" type="checkbox" value="G" checked><span>Geometry</span></label><label class="choice"><input class="mock-cat" type="checkbox" value="N" checked><span>Number Theory</span></label></div></div><div class="mock-field"><label class="mock-label">Questions</label><input id="mock-count" class="input" type="number" min="1" max="30" value="6"></div><div class="mock-field"><label class="mock-label">Time limit</label><input id="mock-minutes" class="input" type="number" min="1" max="600" value="60"></div><div class="mock-field"><label class="mock-label">Difficulty</label><div class="difficulty"><label><input type="radio" name="mock-difficulty" value="any" checked><span>Any</span></label><label><input type="radio" name="mock-difficulty" value="easy"><span>Easy</span></label><label><input type="radio" name="mock-difficulty" value="hard"><span>Hard</span></label></div></div><div class="mock-field"><label class="mock-label">Sequence <span style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="mock-sequence" class="input" placeholder="A,A,G,N,C,C"><div class="muted">A / C / G / N</div></div><div class="mock-field wide"><label class="mock-label">Pick problems yourself <span style="text-transform:none;letter-spacing:0">(optional)</span></label><div style="display:flex;gap:8px"><input id="manual-search" class="input" placeholder="Search contest, year, problem number..." autocomplete="off"><button class="btn" id="manual-search-btn" type="button">Search</button></div><div id="manual-results" style="margin-top:10px;display:grid;gap:7px"></div><div id="manual-selected" style="margin-top:10px;display:grid;gap:7px"></div><div class="muted" style="margin-top:7px">Selected problems are included first; the remaining slots can be generated automatically.</div></div></div><div class="mock-actions"><span id="mock-status" class="mock-status"></span><button class="btn" id="randomize">Randomize</button><button class="btn primary" id="generate">Generate Mock</button></div></section><section class="past-box"><div class="past-head"><div><div class="mock-kicker">HISTORY</div><h2 style="font-family:Space Grotesk;font-size:32px;margin:6px 0">Past Mocks</h2><div class="muted">Your finished and active mocks.</div></div></div><div id="active-holder"></div><div id="past-grid" class="past-grid"></div></section><div id="mock-output"></div></div></section></main>');
    setupManualPicker();
    const past=history(),active=activeLoad();
    if(active&&active.endAt>Date.now()){document.getElementById('active-holder').innerHTML='<div style="margin-top:13px"><button class="active-card" id="continue-active"><div class="past-title">Continue · '+esc(active.title||'Active Mock')+'</div><div class="past-meta">'+esc(Math.ceil((active.endAt-Date.now())/60000)+' minutes remaining')+'</div><div class="past-open">Resume mock →</div></button></div>';document.getElementById('continue-active').onclick=()=>startMock(active)}
    else if(active)activeClear();
    const pg=document.getElementById('past-grid');
    setKarpActivity({page:'Mocks',label:'Mock history',detail:'Browsing past mocks',question:null});
    pg.innerHTML=past.length?past.map((x,i)=>'<article class="past-card"><div class="past-title">'+esc(x.title||('Mock '+(past.length-i)))+'</div><div class="past-meta">'+esc(dateText(x.completedAt||x.savedAt||x.createdAt))+'</div><div class="past-open">'+esc((x.questions?.length||0)+' questions · '+(x.minutes||0)+' min')+(x.status==='saved'&&!x.completedAt?' · Saved':' · Completed')+'</div><div class="past-actions">'+(x.status==='saved'&&!x.completedAt?'<button class="btn" data-open="'+esc(x.id)+'">Open</button>':'<button class="btn" data-review="'+esc(x.id)+'">Review</button><button class="btn primary" data-restart="'+esc(x.id)+'">Restart</button>')+'<button class="btn danger" data-delete="'+esc(x.id)+'">Delete</button></div></article>').join(''):'<div class="muted" style="grid-column:1/-1;padding:9px 0">No saved mocks yet.</div>';
    pg.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const x=past.find(y=>String(y.id)===String(b.dataset.open));if(!x)return;mock=JSON.parse(JSON.stringify(x));renderPreview()});
    pg.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const x=past.find(y=>String(y.id)===String(b.dataset.review));if(x)renderReview(x)});
    pg.querySelectorAll('[data-restart]').forEach(b=>b.onclick=()=>{const x=past.find(y=>String(y.id)===String(b.dataset.restart));if(x)restartMock(x)});
    pg.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMock(b.dataset.delete));
    document.getElementById('generate').onclick=()=>generate(false);document.getElementById('randomize').onclick=()=>{document.getElementById('mock-sequence').value='';generate(true)};
    if(reviewId){const item=past.find(x=>String(x.id)===String(reviewId));if(item)renderReview(item)}
    if(savedId&&!reviewId){const item=past.find(x=>String(x.id)===String(savedId));if(item){mock=JSON.parse(JSON.stringify(item));renderPreview()}}
  }

  async function generate(randomize){
    if(!(await ensureSignedIn('Create your mock','Sign in or create an account before generating a custom mock.')))return;
    const status=document.getElementById('mock-status'),out=document.getElementById('mock-output'),n=count(),seq=sequence(),raw=document.getElementById('mock-sequence').value.trim();
    if(!cats().length){status.textContent='Select at least one topic.';return}
    if(raw&&!seq){status.textContent='Sequence must contain exactly '+n+' valid letters.';return}
    if(manualQuestions.length>n){status.textContent='Remove some manually selected problems or increase the question count.';return}
    const title=(document.getElementById('mock-name').value||'').trim()||'Untitled Mock';
    const remaining=n-manualQuestions.length;
    status.textContent=remaining?'Finding remaining proof problems…':'Building your selected mock…';
    out.innerHTML='<div class="mock-preview"><div class="muted">Preparing the mock…</div></div>';
    try{
      let generated=[];
      if(remaining){
        const remainingSequence=seq?seq.slice(manualQuestions.length):null;
        const result=await mathnetFind({
          categories:cats(),difficulty:difficulty(),sequence:remainingSequence,count:remaining,
          excludeIds:manualQuestions.map(q=>String(q.id)),
          seed:randomize?Date.now()+Math.floor(Math.random()*99999):Date.now(),
          onProgress:(found,total,stage)=>{
            status.textContent=stage==='cache'?'Using cached candidates…':'Scanning MathNet candidates…';
            out.innerHTML='<div class="mock-preview"><div class="muted">Selecting '+found+' / '+total+' proof problems…</div></div>';
          }
        });
        if(!result.questions||result.questions.length<remaining)throw new Error(result.reason||'Not enough matching proof problems.');
        generated=result.questions;
      }
      mock={id:'mock-'+Date.now(),title,minutes:minutes(),questions:[...manualQuestions,...generated],createdAt:new Date().toISOString(),status:'draft',categories:cats(),difficulty:difficulty(),sequence:seq,manualSelection:manualQuestions.map(q=>String(q.id))};
      mathnetSaveMock(mock);renderPreview();
    }catch(e){
      status.textContent=e.message||'Could not build the mock.';
      out.innerHTML='<div class="mock-preview"><div class="muted">'+esc(e.message||'Could not build the mock.')+'</div></div>';
    }
  }

  function renderPreview(){
    const saved=mock.status==='saved'||mock.status==='active';
    let html='<div class="mock-preview"><div class="preview-head"><div><div class="mock-kicker">'+(saved?'SAVED':'READY')+'</div><h2>'+esc(mock.title)+'</h2><div class="muted">'+mock.questions.length+' questions · '+mock.minutes+' minutes</div>'+(saved?'<div class="saved-note">Saved in your KARP account.</div>':'')+'</div><div class="preview-actions"><button class="btn" id="save-mock">'+(saved?'Save changes':'Save Mock')+'</button><button class="btn primary" id="start-mock">Start Mock</button></div></div>';
    mock.questions.forEach((q,i)=>html+='<section class="preview-question"><div class="preview-qhead"><div><div class="mock-kicker">QUESTION '+(i+1)+' · '+esc(labels[q.category])+'</div><div class="session-meta">'+esc([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</div></div><button class="btn" data-change="'+i+'">Change</button></div><div class="preview-statement">'+md(q.statement)+'</div></section>');
    html+='</div>';document.getElementById('mock-output').innerHTML=html;
    setKarpActivity({page:'Mock Preview',label:'Mock preview',detail:mock.title,question:null});document.getElementById('start-mock').onclick=()=>startMock(mock);
    document.getElementById('save-mock').onclick=async()=>{const b=document.getElementById('save-mock');b.disabled=true;try{mock=await saveMockDraft(mock);toast('Mock saved.');renderPreview()}catch(e){toast(e.message||'Could not save mock.')}finally{b.disabled=false}};
    document.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>replaceQuestion(Number(b.dataset.change)));
    renderMath(document.getElementById('mock-output'));
  }
  async function replaceQuestion(index){
    const q=mock?.questions?.[index];if(!q)return;const others=(mock.questions||[]).map(x=>x.id).filter(Boolean);const section=document.querySelectorAll('.preview-question')[index];section?.classList.add('preview-changing');
    try{const result=await mathnetFind({categories:[q.category],sequence:[q.category],count:1,difficulty:mock.difficulty||'any',excludeIds:others,allowFallback:false,seed:Date.now()+index});if(!result.questions?.length)throw new Error('No unused '+labels[q.category]+' problem was found.');mock.questions[index]=result.questions[0];if(mock.status==='saved')await saveMockDraft(mock);renderPreview();toast('Question '+(index+1)+' changed.')}catch(e){section?.classList.remove('preview-changing');toast(e.message||'Could not change this question.')}}

  async function saveFinished(){await karpUserRecord('mockHistory',String(mock.id),{...mock,id:String(mock.id)});cloudMockHistory=[mock,...history().filter(x=>x.id!==mock.id)].slice(0,30);activeClear()}
  function installGuard(on){leaveGuard=on;window.onbeforeunload=on?e=>{e.preventDefault();e.returnValue='Are you sure you want to leave this mock? Your mock is saved and can be resumed later.'}:null}
  function installMockAutoSave(){
    const save=()=>{if(mock&&!finished)activeSave().catch(()=>{})};
    document.addEventListener('visibilitychange',save);
    window.addEventListener('pagehide',save);
    window.addEventListener('beforeunload',save);
    return ()=>{document.removeEventListener('visibilitychange',save);window.removeEventListener('pagehide',save);window.removeEventListener('beforeunload',save)};
  }
  let mockAutoSaveCleanup=null;

  async function startMock(item){if(item&&item.id)mock=JSON.parse(JSON.stringify(item));if(!mock)return;try{await saveMockDraft(mock)}catch(e){toast(e.message||'Could not save mock.');return}finished=false;mock.endAt=mock.endAt||Date.now()+Number(mock.minutes||60)*60000;seconds=Math.max(0,Math.ceil((mock.endAt-Date.now())/1000));await activeSave();installGuard(true);renderSession();clearInterval(timer);timer=setInterval(tick,1000)}

  async function requestMockFullscreen(){
    const screen=document.querySelector('.mock-session');
    if(!screen?.requestFullscreen){toast('Fullscreen is not supported by this browser.');return false}
    try{await screen.requestFullscreen();return true}catch(e){console.error('Mock fullscreen error:',e);toast('Please allow fullscreen to start the mock.');return false}
  }
  function installMockFullscreen(){
    window.__karpMockFsCleanup?.();
    const screen=document.querySelector('.mock-session'),lock=document.getElementById('mock-fullscreen-lock'),btn=document.getElementById('mock-fullscreen-button'),lockBtn=document.getElementById('mock-fullscreen-lock-btn');
    const sync=()=>{const full=document.fullscreenElement===screen;lock?.classList.toggle('open',!full);if(btn)btn.textContent=full?'⛶':'⛶';if(!full)setKarpActivity({page:'Mock',label:'Fullscreen required',detail:mock?.title||'Mock',question:null})};
    const handler=()=>sync();
    document.addEventListener('fullscreenchange',handler);
    if(btn)btn.onclick=()=>requestMockFullscreen();
    if(lockBtn)lockBtn.onclick=()=>requestMockFullscreen();
    sync();
    window.__karpMockFsCleanup=()=>document.removeEventListener('fullscreenchange',handler);
  }
  function installMockActivity(){
    window.__karpMockActivityCleanup?.();
    const host=document.getElementById('mock-paper');if(!host)return;
    const update=()=>{
      const qs=[...host.querySelectorAll('.session-question')];if(!qs.length)return;
      let best=0,bestDist=Infinity;
      qs.forEach((q,i)=>{const r=q.getBoundingClientRect(),d=Math.abs(r.top-130);if(r.bottom>90&&d<bestDist){best=i;bestDist=d}});
      setKarpActivity({page:'Mock',label:'Taking mock',detail:mock?.title||'Mock',question:best+1});
    };
    const handler=()=>{clearTimeout(window.__karpMockActivityTimer);window.__karpMockActivityTimer=setTimeout(update,80)};
    window.addEventListener('scroll',handler,{passive:true});update();
    window.__karpMockActivityCleanup=()=>window.removeEventListener('scroll',handler);
  }
  async function restartMock(item){
    const fresh=JSON.parse(JSON.stringify(item||{}));
    fresh.id='mock-'+Date.now()+'-'+Math.floor(Math.random()*10000);delete fresh.completedAt;delete fresh.savedAt;delete fresh.timedOut;delete fresh.endAt;fresh.status='draft';
    await startMock(fresh);
  }

  function renderSession(){
    mockAutoSaveCleanup?.();
    mockAutoSaveCleanup=installMockAutoSave();
    document.body.innerHTML='<main class="mock-session"><header class="mock-top"><div class="mock-kicker">KARP · MOCK IN PROGRESS</div><div class="mock-timer" id="mock-timer">'+clock(seconds)+'</div><div class="mock-session-meta">'+esc(mock.title)+' · '+mock.questions.length+' questions · '+mock.minutes+' min</div><div style="display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" id="session-save">Save</button><button class="mock-fullscreen" id="mock-fullscreen-button" type="button" title="Fullscreen" aria-label="Enter fullscreen">⛶</button></div></header><div class="mock-paper" id="mock-paper">'+mock.questions.map((q,i)=>'<section class="session-question"><div class="session-qtitle">Question '+(i+1)+'</div><div class="session-meta">'+esc([q.country,q.competition,q.year,q.problemNumber].filter(Boolean).join(' · '))+'</div><div class="session-statement">'+md(q.statement)+'</div></section>').join('')+'<div class="session-bottom"><span class="session-note">Fullscreen is required while the mock is in progress. Your mock is saved automatically.</span><button class="btn primary" id="finish-mock">Finish Mock</button></div></div><div class="mock-fullscreen-lock open" id="mock-fullscreen-lock"><div class="mock-fullscreen-lock-card"><div class="mock-kicker">KARP · FULLSCREEN</div><h2>Enter fullscreen to continue</h2><p>The mock stays locked while it is in progress. Use the fullscreen button below to enter and continue.</p><button class="mock-fullscreen" id="mock-fullscreen-lock-btn" type="button" title="Enter fullscreen" aria-label="Enter fullscreen">⛶</button></div></div></main>';
    document.getElementById('finish-mock').onclick=()=>finishMock(false);
    document.getElementById('session-save').onclick=async()=>{try{mock=await saveMockDraft(mock);toast('Mock saved.')}catch(e){toast(e.message||'Could not save mock.')}};
    renderMath(document.getElementById('mock-paper'));window.scrollTo(0,0);
    setKarpActivity({page:'Mock',label:'Fullscreen required',detail:mock.title,question:null});
    installMockFullscreen();installMockActivity();
  }
  function clock(s){const x=Math.max(0,Number(s||0));return String(Math.floor(x/3600)).padStart(2,'0')+':'+String(Math.floor(x%3600/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}
  function tick(){seconds=Math.max(0,Math.ceil((mock.endAt-Date.now())/1000));const el=document.getElementById('mock-timer');if(el)el.textContent=clock(seconds);const bucket=Math.floor(seconds/15);if(bucket!==lastSavedBucket){lastSavedBucket=bucket;activeSave()}if(seconds<=0)finishMock(true)}
  async function finishMock(auto){if(finished)return;mockAutoSaveCleanup?.();mockAutoSaveCleanup=null;finished=true;clearInterval(timer);installGuard(false);mock={...mock,completedAt:new Date().toISOString(),timedOut:!!auto};try{await saveFinished();window.__karpMockFsCleanup?.();window.__karpMockFsCleanup=null;if(document.fullscreenElement)await document.exitFullscreen().catch(()=>{});renderReview(mock)}catch(e){finished=false;toast(e.message||'Could not save mock history.')}}
  (async()=>{try{await karpMigrateLocalState();const cloud=await karpUserState();cloudMockHistory=Array.isArray(cloud.mocks)?cloud.mocks:[];cloudActiveMock=cloud.activeMock||null;renderBuilder()}catch(e){console.error(e);renderBuilder()}})();
})();
</script>
