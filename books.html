<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Books</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<style>
.books-page{min-height:100vh;background:#f7f7f5;color:#17191c}
.books-hero{padding:38px 24px 12px;text-align:center}
.books-hero h1{font-family:'Space Grotesk';font-size:clamp(46px,6vw,76px);line-height:1;letter-spacing:-3px;margin:0}
.books-search-wrap{width:min(560px,calc(100% - 28px));margin:4px auto 30px}
.books-search{width:100%;box-sizing:border-box;padding:13px 17px;border:1px solid #d9dad8;border-radius:12px;background:#eeeeeb;color:#17191c;font:500 13px 'Inter',sans-serif;outline:none}
.books-search:focus{border-color:#b8bbb8;box-shadow:0 0 0 3px rgba(47,120,183,.08)}
.books-grid{width:min(1220px,calc(100% - 42px));margin:0 auto;padding:0 0 80px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:28px 20px}
.book-card{display:block;min-width:0;text-decoration:none;color:inherit}
.book-cover{position:relative;aspect-ratio:0.7071;overflow:hidden;border:1px solid #cfd2ce;border-radius:0;background:#fff;box-shadow:0 9px 22px rgba(30,34,38,.08);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.book-cover img{display:block;width:100%;height:100%;object-fit:cover;background:#fff}
.book-cover-fallback{position:absolute;inset:0;padding:24px 18px;display:flex;flex-direction:column;justify-content:space-between;background:#eeeeeb}
.book-cover-fallback h2{font-family:'Space Grotesk';font-size:21px;line-height:1.08;letter-spacing:-.7px;margin:0;color:#17191c;overflow-wrap:anywhere}
.book-cover-fallback small{font-size:8px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;color:#686d73}
.book-card:hover .book-cover{transform:translateY(-4px);border-color:#aeb3af;box-shadow:0 13px 28px rgba(30,34,38,.13)}
.book-card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px 0}
.book-card-title{font-size:11px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2a2d31}
.book-views{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;color:#666b73;font-size:10px}
.book-views svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.books-empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:#737a80;font-size:13px}
@media(max-width:1120px){.books-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:26px 18px}}
@media(max-width:900px){.books-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px}}
@media(max-width:680px){.books-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 13px}.book-cover-inner{padding:21px 13px 14px 18px}.book-cover h2{font-size:17px}.book-series{font-size:7px}.book-card-title{font-size:10px}}
@media(max-width:480px){.books-grid{grid-template-columns:repeat(2,minmax(0,1fr));width:calc(100% - 28px)}.books-search-wrap{margin-bottom:34px}}
</style>
</head>
<body>
<script>
(async()=>{
  try{
    const {db}=await fb();
    const {collection,getDocs}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
    shell('Books','Books',
      '<main class="books-page">'+
        '<section class="books-hero"><div class="wrap"><h1>Books</h1></div></section>'+
        '<div class="books-search-wrap"><input id="books-search" class="books-search" type="search" placeholder="Search books..." autocomplete="off"></div>'+
        '<section id="books-grid" class="books-grid"><div class="books-empty">Loading books…</div></section>'+
      '</main>'
    );
    const grid=document.getElementById('books-grid'),search=document.getElementById('books-search');
    let books=[];
    const esc=x=>escapeHtml(String(x??''));
    const eye='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.4 12s3.6-5.2 9.6-5.2S21.6 12 21.6 12 18 17.2 12 17.2 2.4 12 2.4 12Z"></path><circle cx="12" cy="12" r="2.7"></circle></svg>';
    const fmt=n=>{n=Math.max(0,Number(n||0));return n>=1000000?(n/1000000).toFixed(1).replace(/\.0$/,'')+'M':n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'K':String(n)};
    function render(){
      const q=String(search.value||'').trim().toLowerCase();
      const filtered=books.filter(b=>String(b.title||b.fileName||'').toLowerCase().includes(q));
      grid.innerHTML=filtered.length?filtered.map(b=>{
        const title=b.title||b.fileName||'Untitled Book';
        return '<a class="book-card" href="/book.html?id='+encodeURIComponent(b.id)+'" aria-label="Open '+esc(title)+'">'+
          '<div class="book-cover">'+(b.coverImage?'<img src="'+esc(b.coverImage)+'" alt="">':'<div class="book-cover-fallback"><small>KARP · OLYMPIAD MATHEMATICS</small><h2>'+esc(title)+'</h2><small>PDF BOOKLET</small></div>')+'</div>'+
          '<div class="book-card-meta"><span class="book-card-title">'+esc(title)+'</span><span class="book-views">'+eye+esc(fmt(b.viewCount))+'</span></div>'+
        '</a>';
      }).join(''):'<div class="books-empty">'+(q?'No books match your search.':'No books have been published yet.')+'</div>';
    }
    search.addEventListener('input',render);
    const snap=await getDocs(collection(db,'books'));
    books=snap.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
    render();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<div class="error-page"><h1>Unable to load books</h1><p>'+escapeHtml(e.message||'Something went wrong.')+'</p><a href="/">← Back to KARP</a></div>';
  }
})();
</script>
</body>
</html>
