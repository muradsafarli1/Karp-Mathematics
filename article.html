<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Article</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script><style>
html[data-theme="light"] .article-paper,
html[data-theme="light"] .article-paper * { color:#17191c !important; }
html[data-theme="light"] mjx-container { color:#17191c !important; }
.article-page .pagehero .wrap{text-align:center}
.article-page .pagehero h1,.article-page .pagehero .eyebrow,.article-page .pagehero .lead{text-align:center}
</style><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]]},svg:{fontCache:"global"}};</script><script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script></head><body><script>
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){location.href='/articles.html';return}try{const d=await api('/api/content');const a=(d.articles||[]).find(x=>x.id===id);if(!a){location.href='/articles.html';return}function render(){const title=localized(a,'title'),excerpt=localized(a,'excerpt'),body=localized(a,'body');shell('Articles',title,`<main class="article-page"><section class="pagehero"><div class="wrap article-wrap"><div class="eyebrow">${escapeHtml(a.category||'Article')}</div><h1>${escapeHtml(title)}</h1><p class="lead">${escapeHtml(excerpt)}</p></div></section><section class="section"><div class="wrap article-wrap"><div style="display:flex;justify-content:flex-end">${languageSwitch()}</div><article class="article-paper detail-content" id="article-content">${escapeHtml(body)}</article><div class="article-actions"><a class="btn" href="/articles.html">← Back to Articles</a></div></div></section></main>`);bindLanguageSwitch(render);typesetMath(document.getElementById('article-content'))}render()}catch(e){console.error(e);document.body.innerHTML=`<div class="error-page"><h1>Unable to load article</h1><p>${escapeHtml(e.message)}</p><a href="/articles.html">← Back to Articles</a></div>`}})();
</script></body></html>
