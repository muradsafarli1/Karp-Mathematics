<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Problem</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js?v=20261105streak1"></script>
<script src="/mathnet-v8.js?v=13"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
html[data-theme="light"] .problem-detail,
html[data-theme="light"] .problem-solution,
html[data-theme="light"] .problem-detail *,
html[data-theme="light"] .problem-solution *,
html[data-theme="light"] .detail-content{color:#17191c!important}
.problem-page .pagehero .wrap{text-align:center!important}
.problem-page .pagehero h1,.problem-page .pagehero .eyebrow{text-align:center!important}
.problem-page .pagehero .lead{display:none!important}
.problem-source{margin-top:10px;color:var(--muted);font-size:13px;text-align:center}
.problem-content-markdown p{margin:0 0 22px}
.problem-content-markdown img{display:block;max-width:100%;height:auto;margin:28px auto;border-radius:10px}
.problem-content-markdown ul,.problem-content-markdown ol{padding-left:28px}
.problem-content-markdown blockquote{margin:22px 0;padding-left:18px;border-left:3px solid var(--panel2);color:var(--muted)}
.solution-group{margin-bottom:34px}
.solution-group:last-child{margin-bottom:0}
.solution-heading{font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
</style>
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]],processEnvironments:true,processEscapes:true},svg:{fontCache:"global"}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
<script>
(async()=>{
  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  const sourceConfig=params.get('config')||'all';
  const sourceIndex=params.get('offset');
  const sourceShard=params.get('shard');
  const customId=params.get('custom');
  if(!id&&!customId){location.href='/problems.html';return}

  function md(value){
    return richMarkdown(String(value||'').trim());
  }

  function labelsForProblem(p){
    var pieces=[p.country,p.year,p.problemNumber].filter(function(x){return x!=null&&String(x).trim()});
    return pieces.join(' · ') || 'MathNet Problem';
  }

  function getSolved(){return cloudSolved||{}}
  // Use the actual loaded problem ID for user Saved/Solved records.
  // MathNet uses "id"; admin-added problems use "custom" and become "custom-<id>".
  function problemStateId(){return String(currentProblem?.id||id||'').trim();}

  function saveRecord(){
    return {id:currentProblem?.id||id,title:currentProblem?.title||'MathNet Problem',topic:currentProblem?.category||'Other',
      category:currentProblem?.category||'',country:currentProblem?.country||'',competition:currentProblem?.competition||'',year:currentProblem?.year||'',
      problemNumber:currentProblem?.problemNumber||'',sourceType:currentProblem?.sourceType||'mathnet',customId:currentProblem?.customId||'',
      sourceConfig:currentProblem?.sourceConfig||'all',sourceIndex:currentProblem?.sourceIndex??0,sourceShard:currentProblem?.sourceShard??null};
  }

  function getSaved(){return cloudSaved||{}}

  async function toggleSave(){
    const button=document.getElementById('save-btn');
    if(button?.dataset.busy==='1')return;
    const u=await ensureSignedIn('Save a problem','Sign in or create an account to save problems and find them later in your account.');if(!u)return;
    const key=problemStateId();
    if(!key||!currentProblem){toast('Problem is still loading. Please try again.');return;}
    if(button){button.dataset.busy='1';button.disabled=true;}
    try{
      if(cloudSaved[key]){
        await karpDeleteUserRecord('saved',key);
        delete cloudSaved[key];
      }else{
        const record=saveRecord();
        await karpUserRecord('saved',key,record);
        cloudSaved[key]=record;
      }
      try{
        const {auth}=await fb();await authReady();
        if(auth.currentUser?.uid){
          const raw=localStorage.getItem('__karp_account_state_v1_'+auth.currentUser.uid);
          const cached=raw?JSON.parse(raw):{};
          const state=cached.state||{solved:{},saved:{},mocks:[],activeMock:null};
          state.saved={...(state.saved||{})};
          if(cloudSaved[key])state.saved[key]=cloudSaved[key];else delete state.saved[key];
          localStorage.setItem('__karp_account_state_v1_'+auth.currentUser.uid,JSON.stringify({savedAt:Date.now(),state}));
        }
      }catch(cacheError){console.warn('Could not refresh saved-problem cache:',cacheError)}
      syncSaveButton();
      toast(cloudSaved[key]?'Problem saved.':'Problem removed from Saved.');
    }catch(error){
      console.error('KARP save problem failed:',error);
      toast('Could not save this problem: '+(error?.message||'Please try again.'));
    }finally{
      if(button){button.dataset.busy='0';button.disabled=false;}
    }
  }

  function syncSaveButton(){
    const b=document.getElementById('save-btn'); if(!b)return;
    b.textContent=getSaved()[problemStateId()]?'Saved ✓':'Save';
  }

  async function toggleSolved(){
    const button=document.getElementById('solved-btn');
    if(button?.dataset.busy==='1')return;
    const u=await ensureSignedIn('Mark a problem solved','Sign in or create an account to keep your solved-problem history and progress.');if(!u)return;
    const key=problemStateId();
    if(!key||!currentProblem){toast('Problem is still loading. Please try again.');return;}
    if(button){button.dataset.busy='1';button.disabled=true;}
    try{
      if(cloudSolved[key]){
        await karpDeleteUserRecord('solved',key);
        delete cloudSolved[key];
      }else{
        const previous=cloudSolved[key];
        const dates=[...(Array.isArray(previous?.dates)?previous.dates:[]),new Date().toISOString()];
        const record={...saveRecord(),dates};
        await karpUserRecord('solved',key,record);
        cloudSolved[key]=record;
        if(typeof karpRecordStreakActivity==='function'){
          await karpRecordStreakActivity('problem_solved',{problemId:key}).catch(error=>console.warn('Solved problem saved, but streak activity could not be recorded:',error));
        }
      }
      try{
        const {auth}=await fb();await authReady();
        if(auth.currentUser?.uid){
          const raw=localStorage.getItem('__karp_account_state_v1_'+auth.currentUser.uid);
          const cached=raw?JSON.parse(raw):{};
          const state=cached.state||{solved:{},saved:{},mocks:[],activeMock:null};
          state.solved={...(state.solved||{})};
          if(cloudSolved[key])state.solved[key]=cloudSolved[key];else delete state.solved[key];
          localStorage.setItem('__karp_account_state_v1_'+auth.currentUser.uid,JSON.stringify({savedAt:Date.now(),state}));
        }
      }catch(cacheError){console.warn('Could not refresh solved-problem cache:',cacheError)}
      syncSolvedButton();
      toast(cloudSolved[key]?'Problem marked as solved.':'Solved status removed.');
    }catch(error){
      console.error('KARP mark solved failed:',error);
      toast('Could not update solved status: '+(error?.message||'Please try again.'));
    }finally{
      if(button){button.dataset.busy='0';button.disabled=false;}
    }
  }

  function syncSolvedButton(){
    const b=document.getElementById('solved-btn');
    if(!b)return;
    const solved=!!getSolved()[problemStateId()];
    b.textContent=solved?'Solved ✓':'Solved';
    b.classList.toggle('solved-active',solved);
  }

  function renderSolutions(){
    const box=document.getElementById('solution-list');
    if(!box)return;
    const solutions=currentProblem.solutions||[];
    box.innerHTML=solutions.map((s,i)=>
      '<div class="solution-group">'
      +'<div class="solution-heading">Solution '+(i+1)+'</div>'
      +'<div class="detail-content problem-content-markdown">'+md(s)+'</div>'
      +'</div>'
    ).join('');
    typesetMath(box);
  }

  window.goBackToProblems=()=>{
    try{
      const ref=document.referrer?new URL(document.referrer,location.href):null;
      if(ref&&ref.origin===location.origin&&ref.pathname.endsWith('/problems.html')){history.back();return;}
    }catch{}
    location.href='/problems.html';
  };
  window.showSolution=()=>{
    const s=document.getElementById('solution-section');
    const b=document.getElementById('solution-btn');
    if(!s)return;
    s.classList.add('open');
    if(b)b.style.display='none';
    renderSolutions();
    setTimeout(()=>s.scrollIntoView({behavior:'smooth',block:'start'}),80);
  };
  window.toggleSave=toggleSave;
  window.toggleSolved=toggleSolved;

  let currentProblem=null;
  let cloudSolved={},cloudSaved={};

  try{
    if(customId){
      const content=await api('/api/custom-problems');
      const p=(content.problems||[]).find(x=>String(x.id)===String(customId));
      if(!p||!String(p.statementEn||p.statement||'').trim()){location.href='/problems.html';return;}
      const statement=p.statementEn||p.statement||'';
      const solution=p.solutionEn||p.solution||'';
      const topic=String(p.topic||'').toLowerCase();
      const category=topic.includes('geometry')?'G':topic.includes('combinator')?'C':topic.includes('number')?'N':'A';
      currentProblem={
        id:'custom-'+String(p.id),customId:String(p.id),sourceType:'custom',country:'',
        competition:p.source||p.sourceName||'',year:'',
        problemNumber:p.code||'',section:'',language:'English',problemType:'proof only',
        statement,solutions:solution?[solution]:[],category,hasSolution:!!solution,
        title:p.titleEn||p.title||'Problem'
      };
    }else{
      currentProblem=await mathnetProblemById(id,sourceConfig,sourceIndex,sourceShard);
      const lang=String(currentProblem?.language||'').toLowerCase();
      const ptype=String(currentProblem?.problemType||'').trim().toLowerCase();
      const proofType=/^proof(?: only| and answer)?$/.test(ptype)||!ptype;
      if(!currentProblem || !currentProblem.hasSolution
        || !(['english','en'].includes(lang)||lang.startsWith('en-'))
        || !proofType){
        location.href='/problems.html';
        return;
      }
    }

    await karpMigrateLocalState();
    const cloud=await karpProblemUserState();
    cloudSolved=cloud.solved||{};
    cloudSaved=cloud.saved||{};
    
    const competition=String(currentProblem.competition||'').trim();
    const sourceParts=[competition,currentProblem.section,currentProblem.problemNumber].filter(Boolean);
    const title=currentProblem.sourceType==='custom'
      ? String(currentProblem.title||sourceParts.join(' — ')||'Problem').trim()
      : (sourceParts.length?sourceParts.join(' — '):(currentProblem.title||'Problem'));
    const sourceMeta=[currentProblem.country,currentProblem.year].filter(Boolean).join(' · ');
    setKarpActivity({page:'Problem',label:'Viewing problem',detail:title,question:null});

    shell('Problems',title,`
      <main class="problem-page">
        <section class="pagehero">
          <div class="wrap" style="max-width:1100px">
            <h1>${escapeHtml(title)}</h1>
          </div>
        </section>
        <section class="section">
          <div class="wrap" style="max-width:1100px">
            <article id="problem-content" class="problem-detail detail-content problem-content-markdown">${md(currentProblem.statement)}</article>
            ${currentProblem.solutions?.length?'<div class="solution-reveal"><button id="solution-btn" class="btn primary" onclick="showSolution()">Show solution</button></div><section id="solution-section" class="problem-solution solution-content"><div id="solution-list"></div></section>':''}
            <div class="detail-actions">
              <button class="btn" type="button" onclick="goBackToProblems()">← Back to Problems</button>
              <div class="detail-actions-right">
                <button type="button" id="save-btn" class="btn save-btn" onclick="toggleSave()">Save ✓</button>
                <button type="button" id="solved-btn" class="btn solved-btn" onclick="toggleSolved()">Solved ✓</button>
              </div>
            </div>
          </div>
        </section>
      </main>`);

    typesetMath(document.getElementById('problem-content'));
    syncSaveButton();
    syncSolvedButton();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<div class="error-page"><div><h1>Unable to load problem</h1><p>'+escapeHtml(e.message||String(e))+'</p><a href="/problems.html">← Back to Problems</a></div></div>';
  }
})();
</script>
</body>
</html>
