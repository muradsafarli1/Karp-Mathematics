<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Problem</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script><style>
html[data-theme="light"] .problem-detail,
html[data-theme="light"] .problem-solution,
html[data-theme="light"] .problem-detail *,
html[data-theme="light"] .problem-solution *,
html[data-theme="light"] .detail-content,
html[data-theme="light"] .detail-content * { color:#17191c !important; }
html[data-theme="light"] .problem-solution { border-color:#d9dbde !important; }
.problem-page .pagehero .wrap{text-align:center!important}
.problem-page .pagehero h1,.problem-page .pagehero .eyebrow{text-align:center!important}
.problem-page .pagehero .lead{display:none!important}
html[data-theme="light"] mjx-container { color:#17191c !important; }
</style><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]]},svg:{fontCache:"global"}};</script><script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script></head><body><script>
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){location.href='/problems.html';return}try{const d=await api('/api/content');const p=(d.problems||[]).find(x=>x.id===id);if(!p){location.href='/problems.html';return}function render(){const title=localized(p,'title'),statement=localized(p,'statement'),solution=localized(p,'solution');shell('Problems',title,`<main class="problem-page"><section class="pagehero"><div class="wrap" style="max-width:920px"><div class="eyebrow">${escapeHtml(p.topic||'Problem')}${p.difficulty?' · '+escapeHtml(p.difficulty):''}</div><h1>${escapeHtml(title)}</h1></div></section><section class="section"><div class="wrap" style="max-width:920px"><div style="display:flex;justify-content:flex-end">${languageSwitch()}</div><article id="problem-content" class="problem-detail detail-content">${escapeHtml(statement||'The problem statement has not been added yet.')}</article>${solution?`<div class="solution-reveal"><button id="solution-btn" class="btn primary" onclick="showSolution()">Show solution</button></div><section id="solution-section" class="problem-solution solution-content"><div class="eyebrow">Solution:</div><div id="solution-content" class="detail-content">${escapeHtml(solution)}</div></section>`:''}<div style="margin-top:55px"><a class="btn" href="/problems.html">← Back to Problems</a></div></div></section></main>`);bindLanguageSwitch(render);typesetMath(document.getElementById('problem-content'))}window.showSolution=()=>{const s=document.getElementById('solution-section'),b=document.getElementById('solution-btn');if(!s)return;s.classList.add('open');if(b)b.style.display='none';typesetMath(document.getElementById('solution-content'));setTimeout(()=>s.scrollIntoView({behavior:'smooth',block:'start'}),80)};render()}catch(e){console.error(e);document.body.innerHTML=`<div class="error-page"><h1>Unable to load problem</h1><p>${escapeHtml(e.message)}</p><a href="/problems.html">← Back to Problems</a></div>`}})();
</script></body></html>
