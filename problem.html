<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Problem</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<script src="/mathnet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
html[data-theme="light"] .problem-detail,
html[data-theme="light"] .problem-solution,
html[data-theme="light"] .problem-detail *,
html[data-theme="light"] .problem-solution *,
html[data-theme="light"] .detail-content{color:#17191c!important}
.problem-page .pagehero .wrap{text-align:center!important}
.problem-page .pagehero h1,.problem-page .pagehero .eyebrow{text-align:center!important}
.problem-page .pagehero .lead{display:none!important}
.problem-source{margin-top:10px;color:var(--muted);font-size:13px;text-align:center}
.problem-content-markdown p{margin:0 0 22px}
.problem-content-markdown img{display:block;max-width:100%;height:auto;margin:28px auto;border-radius:10px}
.problem-content-markdown ul,.problem-content-markdown ol{padding-left:28px}
.problem-content-markdown blockquote{margin:22px 0;padding-left:18px;border-left:3px solid var(--panel2);color:var(--muted)}
.solution-group{margin-bottom:34px}
.solution-group:last-child{margin-bottom:0}
.solution-heading{font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
</style>
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]]},svg:{fontCache:"global"}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
<script>
(async()=>{
  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  const sourceConfig=params.get('config')||'all';
  const sourceIndex=params.get('offset');
  if(!id){location.href='/problems.html';return}

  function md(value){
    const source=String(value||'').trim();
    if(!source)return '';
    if(window.marked) return DOMPurify.sanitize(marked.parse(source,{breaks:true}));
    return escapeHtml(source).replace(/\n/g,'<br>');
  }

  function labelsForProblem(p){
    var pieces=[p.country,p.year,p.problemNumber].filter(function(x){return x!=null&&String(x).trim()});
    return pieces.join(' · ') || 'MathNet Problem';
  }

  function getSolved(){

    try{return JSON.parse(localStorage.getItem('able_solved_problems')||'{}')}catch{return {}}
  }

  function saveRecord(){
    return {id:id,title:currentProblem?.title||'MathNet Problem',topic:currentProblem?.category||'Other',
      country:currentProblem?.country||'',competition:currentProblem?.competition||'',year:currentProblem?.year||'',
      problemNumber:currentProblem?.problemNumber||'',sourceConfig:currentProblem?.sourceConfig||'all',sourceIndex:currentProblem?.sourceIndex||0};
  }

  function getSaved(){
    try{return JSON.parse(localStorage.getItem('karp_saved_mathnet')||'{}')}catch{return {}}
  }

  function toggleSave(){
    const data=getSaved();
    if(data[id]) delete data[id]; else data[id]=saveRecord();
    localStorage.setItem('karp_saved_mathnet',JSON.stringify(data));
    syncSaveButton();
  }

  function syncSaveButton(){
    const b=document.getElementById('save-btn'); if(!b)return;
    b.textContent=getSaved()[id]?'Saved ✓':'Save';
  }

  function toggleSolved(){
    const data=getSolved();
    if(data[id]) delete data[id];
    else data[id]={...saveRecord(),dates:[new Date().toISOString()]};
    localStorage.setItem('able_solved_problems',JSON.stringify(data));
    localStorage.setItem('karp_solved_mathnet',JSON.stringify(data));
    syncSolvedButton();
  }

  function syncSolvedButton(){
    const b=document.getElementById('solved-btn');
    if(!b)return;
    const solved=!!getSolved()[id];
    b.textContent=solved?'Solved ✓':'Solved';
    b.classList.toggle('solved-active',solved);
  }

  function renderSolutions(){
    const box=document.getElementById('solution-list');
    if(!box)return;
    const solutions=currentProblem.solutions||[];
    box.innerHTML=solutions.map((s,i)=>
      '<div class="solution-group">'
      +'<div class="solution-heading">Solution '+(i+1)+'</div>'
      +'<div class="detail-content problem-content-markdown">'+md(s)+'</div>'
      +'</div>'
    ).join('');
    typesetMath(box);
  }

  window.showSolution=()=>{
    const s=document.getElementById('solution-section');
    const b=document.getElementById('solution-btn');
    if(!s)return;
    s.classList.add('open');
    if(b)b.style.display='none';
    renderSolutions();
    setTimeout(()=>s.scrollIntoView({behavior:'smooth',block:'start'}),80);
  };
  window.toggleSave=toggleSave;
  window.toggleSolved=toggleSolved;

  let currentProblem=null;

  try{
    currentProblem=await mathnetProblemById(id,sourceConfig,sourceIndex);
    if(!currentProblem || !currentProblem.hasSolution
      || !['english','en'].includes(currentProblem.language.toLowerCase())
      || !/^(proof only|proof and answer)$/i.test(currentProblem.problemType||'')){
      location.href='/problems.html';
      return;
    }

    const title=currentProblem.title||('MathNet — '+currentProblem.id);
    const source=[currentProblem.country,currentProblem.competition].filter(Boolean).join(' · ');

    shell('Problems',title,`
      <main class="problem-page">
        <section class="pagehero">
          <div class="wrap" style="max-width:1100px">
            <div class="eyebrow">${escapeHtml(labelsForProblem(currentProblem))}</div>
            <h1>${escapeHtml(title)}</h1>
            <div class="problem-source">${escapeHtml([currentProblem.country,currentProblem.competition,currentProblem.year,currentProblem.problemNumber].filter(Boolean).join(" · "))}</div>
          </div>
        </section>
        <section class="section">
          <div class="wrap" style="max-width:1100px">
            <article id="problem-content" class="problem-detail detail-content problem-content-markdown">${md(currentProblem.statement)}</article>
            ${currentProblem.solutions?.length?'<div class="solution-reveal"><button id="solution-btn" class="btn primary" onclick="showSolution()">Show solution</button></div><section id="solution-section" class="problem-solution solution-content"><div id="solution-list"></div></section>':''}
            <div class="detail-actions">
              <button class="btn" type="button" onclick="goBackToProblems()">← Back to Problems</button>
              <div class="detail-actions-right">
                <button id="save-btn" class="btn save-btn" onclick="toggleSave()">Save ✓</button>
                <button id="solved-btn" class="btn solved-btn" onclick="toggleSolved()">Solved ✓</button>
              </div>
            </div>
          </div>
        </section>
      </main>`);

    typesetMath(document.getElementById('problem-content'));
    syncSaveButton();
    syncSolvedButton();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<div class="error-page"><div><h1>Unable to load problem</h1><p>'+escapeHtml(e.message||String(e))+'</p><a href="/problems.html">← Back to Problems</a></div></div>';
  }
})();
</script>
</body>
</html>
