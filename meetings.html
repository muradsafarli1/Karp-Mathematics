<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Meetings</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js?v=20261006m"></script>
<style>
.meetings-page{min-height:100vh}.meetings-wrap{width:min(calc(100% - 42px),1220px);margin:0 auto}
.meeting-section{margin-top:34px}.meeting-section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:13px}.meeting-section-head h3{font:800 19px/1.1 'Space Grotesk';margin:0;letter-spacing:-.6px}.meeting-section-head span{font-size:10px;color:#777e86}
.meeting-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.meeting-card{position:relative;overflow:hidden;border:1px solid #d9dad8;border-radius:20px;background:#fff;box-shadow:0 10px 28px rgba(20,24,30,.055);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;min-height:365px;display:flex;flex-direction:column}
.meeting-card:hover{box-shadow:0 14px 34px rgba(20,24,30,.07);border-color:#c9cccf}
.meeting-cover{height:175px;background:linear-gradient(135deg,#eceeea,#f8f8f6);position:relative;overflow:hidden}.meeting-cover img{width:100%;height:100%;object-fit:cover;display:block}.meeting-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.28));pointer-events:none}
.meeting-status{position:absolute;left:15px;top:14px;z-index:2;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.92);border:1px solid rgba(220,222,224,.9);font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#444b53}
.meeting-body{padding:20px 20px 18px;display:flex;flex:1;flex-direction:column}.meeting-topic{font-size:9px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#737a83;margin-bottom:9px}.meeting-body h2{font:800 22px/1.15 'Space Grotesk';letter-spacing:-.7px;margin:0 0 9px;color:#17191c}.meeting-body p{font-size:11px;line-height:1.65;color:#666b73;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.meeting-meta{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:auto;padding-top:17px;font-size:10px;color:#636a72}.meeting-meta strong{color:#17191c}.meeting-actions{display:flex;gap:8px;align-items:center;margin-top:14px}.meeting-actions .btn{font-size:10px}.meeting-open-note{font-size:9px;color:#727982;margin-left:auto;text-align:right;line-height:1.35}.meeting-empty{padding:55px 20px;text-align:center;border:1px dashed #d9dad8;border-radius:18px;color:#7b828a;font-size:12px}
@media(max-width:980px){.meeting-grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.meetings-wrap{width:calc(100% - 28px)}.meeting-grid{grid-template-columns:1fr}.meeting-cover{height:165px}}
</style>
</head>
<body>
<script>
(async()=>{
  try{
    const d=await api('/api/meetings');
    const meetings=d.meetings||[];
    setKarpActivity({page:'Meetings',label:'Meeting list',detail:'Browsing upcoming meetings',question:null});
    const lang=currentLanguage();
    const titleOf=x=>localized(x,'title',lang)||x.titleEn||x.titleAz||x.title||'Meeting';
    const topicOf=x=>localized(x,'topic',lang)||x.topicEn||x.topicAz||x.topic||'';
    const descOf=x=>localized(x,'description',lang)||x.descriptionEn||x.descriptionAz||x.description||'';
    const startMs=x=>Date.parse(String(x.startAt||x.date||''));
    const duration=x=>Math.max(1,Number(x.durationMinutes||120));
    const statusOf=x=>{
      const start=startMs(x),end=start+duration(x)*60000;
      if(!Number.isNaN(start)&&Date.now()>=start&&Date.now()<end)return'LIVE NOW';
      if(!Number.isNaN(end)&&Date.now()>=end)return'ENDED';
      return x.status==='draft'?'DRAFT':'UPCOMING';
    };
    const timeText=x=>{
      const ms=startMs(x);if(Number.isNaN(ms))return'Date TBA';
      return new Date(ms).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
    };
    function countdown(x){
      const ms=startMs(x);if(Number.isNaN(ms))return'';
      const diff=ms-Date.now();if(diff<=0)return statusOf(x)==='LIVE NOW'?'Live now':'Ended';
      const total=Math.floor(diff/1000),days=Math.floor(total/86400),hours=Math.floor((total%86400)/3600),mins=Math.floor((total%3600)/60);
      return days?('Starts in '+days+'d '+hours+'h'):('Starts in '+hours+'h '+mins+'m');
    }
    function action(x){
      const st=statusOf(x),registered=!!x.registeredByCurrentUser;
      if(st==='LIVE NOW'){
        return registered&&x.meetingUrl
          ?'<a class="btn primary" href="'+escapeHtml(x.meetingUrl)+'" target="_blank" rel="noopener noreferrer">Enter Meeting →</a>'
          :'<button class="btn primary" data-register-id="'+escapeHtml(x.id)+'">Register →</button>';
      }
      if(st==='ENDED')return'<button class="btn" type="button" disabled>Meeting ended</button>';
      if(registered)return'<button class="btn" type="button" disabled>Registered</button>';
      return'<button class="btn primary" data-register-id="'+escapeHtml(x.id)+'">Register →</button>';
    }
    function card(x){
      const st=statusOf(x);
      return '<article class="meeting-card" data-meeting-id="'+escapeHtml(x.id)+'">'+
        '<div class="meeting-cover">'+(x.coverImage?'<img src="'+escapeHtml(x.coverImage)+'" alt="">':'')+'<span class="meeting-status">'+st+'</span></div>'+
        '<div class="meeting-body"><div class="meeting-topic">'+escapeHtml(topicOf(x)||'KARP Meeting')+'</div><h2>'+escapeHtml(titleOf(x))+'</h2><p>'+escapeHtml(descOf(x))+'</p>'+
        '<div class="meeting-meta"><span><strong>'+escapeHtml(timeText(x))+'</strong></span><span>'+escapeHtml(duration(x)+' min')+'</span><span>'+escapeHtml(String(x.registrationCount||0))+' registered</span></div>'+
        '<div class="meeting-actions">'+action(x)+'<span class="meeting-open-note">'+escapeHtml(countdown(x))+'</span></div></div></article>';
    }
    const upcoming=meetings.filter(x=>statusOf(x)!=='ENDED');
    const past=meetings.filter(x=>statusOf(x)==='ENDED').reverse();
    shell('Meetings','Meetings','<main class="meetings-page"><section class="pagehero"><div class="wrap"><h1>Meetings</h1></div></section><section class="section"><div class="meetings-wrap">'+
      '<div class="meeting-section"><div class="meeting-section-head"><h3>Upcoming</h3><span>'+upcoming.length+' scheduled</span></div><div class="meeting-grid">'+(upcoming.length?upcoming.map(card).join(''):'<div class="meeting-empty" style="grid-column:1/-1">No meetings are scheduled yet.</div>')+'</div></div>'+
      (past.length?'<div class="meeting-section"><div class="meeting-section-head"><h3>Past meetings</h3><span>'+past.length+' ended</span></div><div class="meeting-grid">'+past.slice(0,6).map(card).join('')+'</div></div>':'')+
      '</div></section></main>');
    const register=async id=>{
      if(!(await ensureSignedIn('Register for this meeting','Sign in or create an account before registering for or entering a meeting.')))return;
      try{await api('/api/meetings/'+encodeURIComponent(id)+'/register',{method:'POST'});location.reload()}catch(e){toast(e.message)}
    };
    function bindRegisterButtons(){
      document.querySelectorAll('[data-register-id]').forEach(b=>b.onclick=()=>register(b.dataset.registerId));
    }
    function refreshCards(){
      meetings.forEach(x=>{
        const card=document.querySelector('[data-meeting-id="'+CSS.escape(String(x.id))+'"]');
        if(!card)return;
        const st=card.querySelector('.meeting-status'),actions=card.querySelector('.meeting-actions'),note=card.querySelector('.meeting-open-note');
        if(st)st.textContent=statusOf(x);
        if(actions){
          actions.querySelectorAll('[data-register-id]').forEach(b=>{b.onclick=()=>register(b.dataset.registerId)});
          const fresh=action(x),tmp=document.createElement('div');tmp.innerHTML=fresh;
          actions.innerHTML='';
          while(tmp.firstChild)actions.appendChild(tmp.firstChild);
          actions.querySelectorAll('[data-register-id]').forEach(b=>b.onclick=()=>register(b.dataset.registerId));
        }
        if(note)note.textContent=countdown(x);
      });
    }
    bindRegisterButtons();
    bindLanguageSwitch(()=>location.reload());
    setInterval(refreshCards,15000);
  }catch(e){console.error(e);document.body.innerHTML='<div class="error-page"><h1>Unable to load meetings</h1><p>'+escapeHtml(e.message||'')+'</p><a href="/">← Back to KARP</a></div>'}
})();
</script>
</body>
</html>
