<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Articles</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<style>
.cards .card{text-align:center!important}
.card h3{font-size:28px!important;line-height:1.18!important;letter-spacing:-1px!important;margin-top:32px!important;text-align:center!important}
</style>
</head>
<body>
<script>
(async()=>{
  try{
    const d=await api('/api/content');
    const articles=d.articles||[];
    function render(list){
      return list.map(a=>`<article class="card article-card" style="cursor:pointer" onclick="location.href='/article.html?id=${encodeURIComponent(a.id)}'"><div class="tag">${escapeHtml(a.category||'Article')}</div><h3>${escapeHtml(localized(a,'title')||a.titleEn||a.titleAz||a.title||'Untitled article')}</h3><p>${escapeHtml(localized(a,'excerpt')||a.excerptEn||a.excerptAz||a.excerpt||'')}</p></article>`).join('')||'<div class="empty">No articles found.</div>';
    }
    shell('Articles','Articles',`<main class="articles-page"><section class="pagehero"><div class="wrap"><div class="eyebrow">03 — Articles</div><h1>Learn the ideas,<br>not just the answers.</h1><p class="lead">Handouts built around reusable olympiad techniques — including limits, substitutions, symmetry and other methods worth remembering.</p></div></section><section class="section"><div class="wrap"><div class="toolbar"><input id="articleSearch" class="input" type="search" placeholder="Search articles..." aria-label="Search articles"></div><div id="articleCards" class="cards">${render(articles)}</div></div></section>`);
    const input=document.getElementById('articleSearch');
    input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();document.getElementById('articleCards').innerHTML=render(articles.filter(a=>[a.title,a.titleEn,a.titleAz,a.category,a.excerpt,a.excerptEn,a.excerptAz,a.body,a.bodyEn,a.bodyAz].filter(Boolean).some(v=>String(v).toLowerCase().includes(q))));});
  }catch(e){console.error(e);document.body.innerHTML=`<div class="error-page"><h1>Unable to load articles</h1><p>${escapeHtml(e.message)}</p><a href="/">← Back to KARP</a></div>`}
})();
</script>
</body>
</html>
