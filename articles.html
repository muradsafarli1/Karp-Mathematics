<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Articles</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<style>
.cards .card{text-align:center!important;position:relative;padding-bottom:54px!important}.content-read-count{position:absolute;right:18px;bottom:17px;font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.card h3{font-size:28px!important;line-height:1.18!important;letter-spacing:-1px!important;margin-top:32px!important;text-align:center!important}
</style>
</head>
<body>
<script>
(async()=>{
  try{
    const d=await api('/api/content');
    const articles=d.articles||[];
    function render(list){
      return list.map(a=>{const n=Math.max(0,Number(a.readCount||0));return `<article class="card article-card" data-read-id="${escapeHtml(a.id)}" style="cursor:pointer"><div class="tag">${escapeHtml(a.category||'Article')}</div><h3>${escapeHtml(localized(a,'title')||a.titleEn||a.titleAz||a.title||'Untitled article')}</h3><p>${escapeHtml(localized(a,'excerpt')||a.excerptEn||a.excerptAz||a.excerpt||'')}</p><span class="content-read-count">${n===1?'1 read':n.toLocaleString()+' reads'}</span></article>`}).join('')||'<div class="empty">No articles found.</div>';
    }
    shell('Articles','Articles',`<main class="articles-page"><section class="pagehero"><div class="wrap"><h1>Articles</h1></div></section><section class="section"><div class="wrap"><div class="toolbar"><input id="articleSearch" class="input" type="search" placeholder="Search articles..." aria-label="Search articles"></div><div id="articleCards" class="cards">${render(articles)}</div></div></section></main>`);
    const readHost=document.getElementById('articleCards');
    readHost.addEventListener('click',async event=>{
      const card=event.target.closest('[data-read-id]');
      if(!card)return;
      event.preventDefault();
      await markKarpRead('article',card.dataset.readId);
      location.href='/article.html?id='+encodeURIComponent(card.dataset.readId);
    });
    const input=document.getElementById('articleSearch');
    input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();document.getElementById('articleCards').innerHTML=render(articles.filter(a=>[a.title,a.titleEn,a.titleAz,a.category,a.excerpt,a.excerptEn,a.excerptAz,a.body,a.bodyEn,a.bodyAz].filter(Boolean).some(v=>String(v).toLowerCase().includes(q))));});
  }catch(e){console.error(e);document.body.innerHTML=`<div class="error-page"><h1>Unable to load articles</h1><p>${escapeHtml(e.message)}</p><a href="/">← Back to KARP</a></div>`}
})();
</script>
</body>
</html>
