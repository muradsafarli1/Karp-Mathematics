<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Exams</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js"></script>
<style>
.exams-wrap{width:min(calc(100% - 42px),1180px);margin:0 auto}.exam-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.exam-card{background:var(--panel);border:0;border-radius:18px;padding:24px}.exam-card .tag{margin-bottom:13px}.exam-card h2{font-family:'Space Grotesk';font-size:24px;letter-spacing:-.8px;margin:0 0 10px}.exam-card p{color:var(--muted);font-size:12px;line-height:1.7;min-height:58px}.exam-meta{display:flex;justify-content:space-between;gap:10px;margin:18px 0;color:var(--muted);font-size:10px}.exam-card-actions{display:flex;gap:7px}.exam-card-actions .btn{font-size:10px}
.public-note{margin-bottom:14px;padding:12px 14px;border-radius:12px;background:var(--panel2);color:var(--muted);font-size:11px;line-height:1.6}
@media(max-width:980px){.exam-grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.exams-wrap{width:calc(100% - 28px)}.exam-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>
(async()=>{
  try{
    const u=await me();
    const d=await api('/api/exams');
    const history=u?(await api('/api/exams/history').catch(()=>({history:[]}))).history||[]:[];
    const completed=new Set(history.map(h=>h.examId)),now=Date.now();
    const parseDate=e=>e.date?Date.parse(String(e.date).replace(' ','T')):NaN;
    function renderCard(e){
      const dt=parseDate(e),past=completed.has(e.id)||e.status==='Finished'||(!Number.isNaN(dt)&&dt+Number(e.durationMinutes||60)*60000<now);
      const title=localized(e,'title'),desc=localized(e,'description');
      const action=past
        ?'<a class="btn primary" href="/exam.html?id='+encodeURIComponent(e.id)+'">View exam →</a>'
        :'<button class="btn primary" data-register-id="'+escapeHtml(e.id)+'">'+(u?'Register / Start →':'Sign in to register →')+'</button>';
      return '<article class="exam-card"><div class="tag">'+(past?'Past':(e.status||'Upcoming'))+' · '+formatDuration(e.durationMinutes)+'</div><h2>'+escapeHtml(title)+'</h2><p>'+escapeHtml(desc)+'</p><div class="exam-meta"><span>'+escapeHtml(e.date||'Date TBA')+'</span><span>'+((e.questions||[]).length)+' questions</span></div><div class="exam-card-actions">'+action+'</div></article>';
    }
    shell('Exams','Exams','<main><section class="pagehero"><div class="wrap"><div class="eyebrow">04 — Exams</div><h1>Test yourself.<br>Under pressure.</h1><p class="lead">Browse every KARP exam. Registration and starting an active exam require an account; public exam information stays visible.</p></div></section><section class="section"><div class="exams-wrap"><div class="public-note">'+(u?'You are signed in.':'You are browsing as a guest. Sign in only when an action such as registration or starting an exam needs your account.')+'</div><div class="exam-grid">'+((d.exams||[]).map(renderCard).join('')||'<div class="empty">No exams available yet.</div>')+'</div></div></section></main>');
    document.querySelectorAll('[data-register-id]').forEach(b=>b.onclick=()=>registerAndOpen(b.dataset.registerId));
    window.registerAndOpen=async id=>{
      if(!(await ensureSignedIn('Register for this exam','Sign in or create an account before registering for or starting an exam.')))return;
      try{await api('/api/exams/'+encodeURIComponent(id)+'/register',{method:'POST'});location.href='/exam.html?id='+encodeURIComponent(id)}
      catch(e){toast(e.message)}
    };
  }catch(e){console.error(e);document.body.innerHTML='<div class="error-page"><h1>Unable to load exams</h1><p>'+escapeHtml(e.message)+'</p><a href="/">← Back to KARP</a></div>'}
})();
</script>
</body></html>
