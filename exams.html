<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Exams</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js"></script>
<style>
.exams-wrap{width:min(calc(100% - 42px),1180px);margin:0 auto;padding-top:66px;padding-bottom:34px}
.exam-group+.exam-group{margin-top:42px}
.exam-section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 18px;padding:0 0 12px;border-bottom:1px solid #dedfdc}
.exam-section-heading h2{font-family:'Space Grotesk';font-size:22px;line-height:1.2;letter-spacing:-.55px;font-weight:700;margin:0;color:#17191c}
.exam-section-count{font-size:11px;color:#666b73;white-space:nowrap}
.exam-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.exams-wrap .exam-card{display:flex;flex-direction:column;min-width:0;min-height:280px;padding:23px 22px 19px;background:#eeeeeb!important;border:1px solid #d5d5d1!important;border-radius:16px;color:#17191c!important;box-shadow:0 4px 16px rgba(20,24,30,.035)!important;transition:border-color .18s ease,transform .18s ease}
.exams-wrap .exam-card:hover{border-color:#b9bbb6!important;transform:translateY(-2px)}
.exam-card-head{text-align:center;padding:3px 5px 18px}
.exams-wrap .exam-card h2{font-family:'Space Grotesk';font-size:22px;line-height:1.25;letter-spacing:-.55px;font-weight:700;text-align:center;margin:0;color:#17191c}
.exams-wrap .exam-card p{font-size:12px;line-height:1.65;text-align:center;min-height:0;margin:10px auto 0;max-width:38ch;color:#666b73!important}
.exam-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;margin:0;padding:15px 0;border-top:1px solid #d7d7d2;border-bottom:1px solid #d7d7d2;color:#17191c;font-size:12px}
.exam-meta-item{display:flex;flex-direction:column;gap:5px;min-width:0}
.exam-meta-item span{font-size:10px;line-height:1.2;letter-spacing:.02em;color:#777b82}
.exam-meta-item strong{font-size:12px;line-height:1.35;font-weight:650;color:#292c30;overflow-wrap:anywhere}
.exam-card-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:16px;margin-top:auto}
.exam-participation-count{font-size:10px;line-height:1.45;color:#666b73;max-width:125px}
.exam-card-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-left:auto}
.exam-card-actions .btn{font-size:11px;line-height:1.2;padding:10px 15px;min-height:38px;border-radius:10px;white-space:nowrap}
.exam-empty{padding:17px 0 2px;margin:0;color:#777b82;font-size:12px;line-height:1.65}
@media(max-width:980px){.exam-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.exams-wrap{width:calc(100% - 28px)}.exam-grid{grid-template-columns:1fr;gap:12px}.exams-wrap .exam-card{min-height:0;padding:22px 20px 18px}.exam-group+.exam-group{margin-top:34px}.exam-section-heading h2{font-size:20px}}
@media(prefers-reduced-motion:reduce){.exams-wrap .exam-card{transition:none}.exams-wrap .exam-card:hover{transform:none}}
</style>
</head>
<body>
<script>
(async()=>{
  try{
    const d=await api('/api/exams');
    const currentUser=await me(),isAdmin=currentUser?.role==='admin';
    const now=Date.now();
    setKarpActivity({page:'Exams',label:'Exam list',detail:'Browsing available exams',question:null});

function parseExamInstant(value,offset=4){
  const raw=String(value||'').trim();
  if(!raw)return NaN;
  if(/(?:Z|[+-]\d{2}:?\d{2})$/i.test(raw))return Date.parse(raw);
  const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(m)return Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0))-Number(offset??4)*3600000;
  return Date.parse(raw);
}
    function parseDate(e){return parseExamInstant(e.date,e.timezoneOffset??4)}
    function stateOf(e){
      const status=String(e.status||'').toLowerCase();
      const releaseAt=parseExamInstant(e.availableAt||e.date,e.availableTimezoneOffset??e.timezoneOffset??4);
      const released=!Number.isNaN(releaseAt)?releaseAt<=now:['open','active','finished'].includes(status);
      return {dt:parseDate(e),active:released,upcoming:!released};
    }
    function dateLabel(e,dt){
      if(!Number.isNaN(dt)){
        const shifted=new Date(dt+Number(e.timezoneOffset??4)*3600000);
        return shifted.toLocaleDateString('en-GB',{timeZone:'UTC',day:'numeric',month:'short',year:'numeric'});
      }
      return 'To be announced';
    }
    function timeLabel(dt,offset=4){
      if(Number.isNaN(dt))return 'To be announced';
      const shifted=new Date(dt+Number(offset??4)*3600000);
      return shifted.toLocaleTimeString('en-US',{timeZone:'UTC',hour:'numeric',minute:'2-digit',hour12:true})+' (UTC'+(Number(offset??4)>=0?'+':'')+Number(offset??4)+')';
    }
    function renderCard(e,isUpcoming){
      const state=stateOf(e);
      const title=localized(e,'title')||'Exam',desc=localized(e,'description')||'';
      const duration=formatDuration(Number(e.durationMinutes||60));
      const questionCount=Array.isArray(e.questions)?e.questions.length:0;
      const completed=!!e.completedByCurrentUser;
      const previewAction=isAdmin?'<a class="btn exam-preview-btn" target="_blank" rel="noopener" href="/exam.html?id='+encodeURIComponent(e.id)+'&preview=1">Preview</a>':'';
      const action=isUpcoming
        ?previewAction
        :(previewAction+(completed?'<a class="btn" href="/exam.html?id='+encodeURIComponent(e.id)+'&review=1">Completed</a>':'<a class="btn primary" href="/exam.html?id='+encodeURIComponent(e.id)+'">Open →</a>'));
      const count=Math.max(0,Number(e.participatedCount||0));
      const countText=!isUpcoming
        ?count+(count===1?' person participated':' people participated')
        :'';
      return '<article class="exam-card"><div class="exam-card-head"><h2>'+escapeHtml(title)+'</h2>'+(desc?'<p>'+escapeHtml(desc)+'</p>':'')+'</div><div class="exam-meta"><div class="exam-meta-item"><span>Date</span><strong>'+escapeHtml(dateLabel(e,state.dt))+'</strong></div><div class="exam-meta-item"><span>Start time</span><strong>'+escapeHtml(timeLabel(state.dt,e.timezoneOffset??4))+'</strong></div><div class="exam-meta-item"><span>Duration</span><strong>'+escapeHtml(duration)+'</strong></div><div class="exam-meta-item"><span>Questions</span><strong>'+questionCount+'</strong></div></div><div class="exam-card-footer">'+(countText?'<span class="exam-participation-count">'+escapeHtml(countText)+'</span>':'')+'<div class="exam-card-actions">'+action+'</div></div></article>';
    }
    function renderSection(label,exams,isUpcoming){
      const emptyText=isUpcoming?'No upcoming exams.':'No available exams yet.';
      return '<section class="exam-group"><div class="exam-section-heading"><h2>'+label+'</h2><span class="exam-section-count">'+exams.length+(exams.length===1?' exam':' exams')+'</span></div>'+(exams.length?'<div class="exam-grid">'+exams.map(e=>renderCard(e,isUpcoming)).join('')+'</div>':'<p class="exam-empty">'+emptyText+'</p>')+'</section>';
    }

    const allExams=d.exams||[];
    const upcoming=allExams.filter(e=>stateOf(e).upcoming);
    const available=allExams.filter(e=>!stateOf(e).upcoming);
    upcoming.sort((a,b)=>{
      const da=parseDate(a),db=parseDate(b);
      return (Number.isNaN(da)?Infinity:da)-(Number.isNaN(db)?Infinity:db);
    });
    available.sort((a,b)=>{
      const da=parseDate(a),db=parseDate(b);
      if(Number.isNaN(da))return Number.isNaN(db)?0:1;
      if(Number.isNaN(db))return -1;
      return db-da;
    });

    shell('Exams','Exams','<main><section class="pagehero"><div class="wrap"><h1>Exams</h1></div></section><section class="section" style="padding-top:0!important"><div class="exams-wrap">'+renderSection('Upcoming',upcoming,true)+renderSection('Available',available,false)+'</div></section></main>');
  }catch(e){console.error(e);document.body.innerHTML='<div class="error-page"><h1>Unable to load exams</h1><p>'+escapeHtml(e.message)+'</p><a href="/">← Back to KARP</a></div>'}
})();
</script>
</body></html>
