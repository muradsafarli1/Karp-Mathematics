<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Exams</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js"></script>
<style>
.exams-wrap{width:min(calc(100% - 42px),1180px);margin:0 auto;padding-top:66px;padding-bottom:34px}
.exam-group+.exam-group{margin-top:42px}
.exam-section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 18px;padding:0 0 12px;border-bottom:1px solid #dedfdc}
.exam-section-heading h2{font-family:'Space Grotesk';font-size:22px;line-height:1.2;letter-spacing:-.55px;font-weight:700;margin:0;color:#17191c}
.exam-section-count{font-size:11px;color:#666b73;white-space:nowrap}
.exam-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.exams-wrap .exam-card{position:relative;display:flex;flex-direction:column;min-width:0;min-height:286px;padding:25px 23px 20px;background:linear-gradient(145deg,#f2f2ef 0%,#e9eae6 100%)!important;border:1px solid #d2d4cf!important;border-radius:19px;color:#17191c!important;box-shadow:0 8px 22px rgba(20,24,30,.045)!important;transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease;overflow:hidden}
.exams-wrap .exam-card:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:#c9cfcc}
.exams-wrap .exam-card:hover{border-color:#aeb5b0!important;box-shadow:0 12px 28px rgba(20,24,30,.075)!important;transform:translateY(-2px)}
.exam-card-head{text-align:left;padding:2px 2px 19px}
.exams-wrap .exam-card h2{font-family:'Space Grotesk';font-size:23px;line-height:1.2;letter-spacing:-.7px;font-weight:750;text-align:left;margin:0;color:#17191c}
.exams-wrap .exam-card p{font-size:12px;line-height:1.6;text-align:left;min-height:0;margin:9px 0 0;max-width:40ch;color:#666b73!important}
.exam-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0;padding:0;border:0;color:#17191c;font-size:12px}
.exam-meta-item{display:flex;flex-direction:column;gap:7px;min-width:0;padding:14px 13px;background:rgba(255,255,255,.43);border:1px solid rgba(211,214,209,.9);border-radius:13px}
.exam-meta-item span{font-size:10px;line-height:1.2;letter-spacing:.04em;text-transform:uppercase;color:#737a78}
.exam-meta-item strong{font-family:'Space Grotesk';font-size:16px;line-height:1.3;font-weight:700;color:#222625;overflow-wrap:anywhere}
.exam-meta.prominent{gap:10px}
.exam-meta.prominent .exam-meta-item{padding:16px 14px;min-height:84px;justify-content:center}
.exam-meta.prominent .exam-meta-item span{font-size:10px;letter-spacing:.09em}
.exam-meta.prominent .exam-meta-item strong{font-size:clamp(22px,2vw,30px);line-height:1.05;letter-spacing:-.7px}
.exam-card-footer{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:18px;margin-top:auto}
.exam-card-footnote{display:flex;flex-direction:column;gap:5px;min-width:0;max-width:65%;font-size:10px;line-height:1.45;color:#737a78}
.exam-card-footnote strong{font-size:11px;font-weight:650;color:#414744;overflow-wrap:anywhere}
.exam-participation-count{font-size:10px;line-height:1.45;color:#666b73;max-width:125px}
.exam-card-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin-left:auto}
.exam-card-actions .btn{font-size:11px;line-height:1.2;padding:10px 14px;min-height:38px;border-radius:10px;white-space:nowrap}
.exam-empty{padding:17px 0 2px;margin:0;color:#777b82;font-size:12px;line-height:1.65}
@media(max-width:980px){.exam-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.exams-wrap{width:calc(100% - 28px)}.exam-grid{grid-template-columns:1fr;gap:12px}.exams-wrap .exam-card{min-height:0;padding:22px 20px 18px}.exam-group+.exam-group{margin-top:34px}.exam-section-heading h2{font-size:20px}}
@media(prefers-reduced-motion:reduce){.exams-wrap .exam-card{transition:none}.exams-wrap .exam-card:hover{transform:none}}
</style>
</head>
<body>
<script>
(async()=>{
  try{
    const d=await api('/api/exams');
    const currentUser=await me(),isAdmin=currentUser?.role==='admin';
    const now=Date.now();
    setKarpActivity({page:'Exams',label:'Exam list',detail:'Browsing available exams',question:null});

function parseExamInstant(value,offset=4){
  const raw=String(value||'').trim();
  if(!raw)return NaN;
  if(/(?:Z|[+-]\d{2}:?\d{2})$/i.test(raw))return Date.parse(raw);
  const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(m)return Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0))-Number(offset??4)*3600000;
  return Date.parse(raw);
}
    function parseDate(e){return parseExamInstant(e.date,e.timezoneOffset??4)}
    function stateOf(e){
      const status=String(e.status||'').toLowerCase();
      const releaseAt=parseExamInstant(e.availableAt||e.date,e.availableTimezoneOffset??e.timezoneOffset??4);
      const released=!Number.isNaN(releaseAt)?releaseAt<=now:['open','active','finished'].includes(status);
      return {dt:parseDate(e),active:released,upcoming:!released};
    }
    function dateLabel(e,dt){
      if(!Number.isNaN(dt)){
        const shifted=new Date(dt+Number(e.timezoneOffset??4)*3600000);
        return shifted.toLocaleDateString('en-GB',{timeZone:'UTC',day:'numeric',month:'short',year:'numeric'});
      }
      return 'To be announced';
    }
    function timeLabel(dt,offset=4){
      if(Number.isNaN(dt))return 'To be announced';
      const shifted=new Date(dt+Number(offset??4)*3600000);
      return shifted.toLocaleTimeString('en-US',{timeZone:'UTC',hour:'numeric',minute:'2-digit',hour12:true})+' (UTC'+(Number(offset??4)>=0?'+':'')+Number(offset??4)+')';
    }
    function renderCard(e,isUpcoming){
      const state=stateOf(e),registered=!!e.registeredByCurrentUser;
      const title=localized(e,'title')||'Exam',desc=localized(e,'description')||'';
      const durationMinutes=Number(e.durationMinutes||60);
      const durationLabel=durationMinutes>=60?(Math.floor(durationMinutes/60)+(durationMinutes%60?'h '+(durationMinutes%60)+'m':'h')):(durationMinutes+' min');
      const questionCount=Array.isArray(e.questions)?e.questions.length:0;
      const completed=!!e.completedByCurrentUser;
      const previewAction=isAdmin?'<a class="btn exam-preview-btn" target="_blank" rel="noopener" href="/exam.html?id='+encodeURIComponent(e.id)+'&preview=1">Preview</a>':'';
      const action=isUpcoming
        ?(previewAction+(registered?'<button class="btn" type="button" disabled>Registered</button>':'<button class="btn primary" type="button" data-register-id="'+escapeHtml(e.id)+'">Register →</button>'))
        :(previewAction+(completed?'<a class="btn" href="/exam.html?id='+encodeURIComponent(e.id)+'&review=1">Completed</a>':'<a class="btn primary" href="/exam.html?id='+encodeURIComponent(e.id)+'">Open →</a>'));
      const count=isUpcoming?Math.max(0,Number(e.registrationCount||0)):Math.max(0,Number(e.participatedCount||0));
      const countText=count>0
        ?count+(count===1?(isUpcoming?' person registered':' person participated'):(isUpcoming?' people registered':' people participated'))
        :'';
      const meta=isUpcoming
        ?'<div class="exam-meta"><div class="exam-meta-item"><span>Date</span><strong>'+escapeHtml(dateLabel(e,state.dt))+'</strong></div><div class="exam-meta-item"><span>Start time</span><strong>'+escapeHtml(timeLabel(state.dt,e.timezoneOffset??4))+'</strong></div><div class="exam-meta-item"><span>Duration</span><strong>'+escapeHtml(durationLabel)+'</strong></div><div class="exam-meta-item"><span>Questions</span><strong>'+questionCount+'</strong></div></div>'
        :'<div class="exam-meta prominent"><div class="exam-meta-item"><span>Duration</span><strong>'+escapeHtml(durationLabel)+'</strong></div><div class="exam-meta-item"><span>Questions</span><strong>'+questionCount+'</strong></div></div>';
      const startedText=dateLabel(e,state.dt)+' · '+timeLabel(state.dt,e.timezoneOffset??4);
      return '<article class="exam-card"><div class="exam-card-head"><h2>'+escapeHtml(title)+'</h2>'+(desc?'<p>'+escapeHtml(desc)+'</p>':'')+'</div>'+meta+'<div class="exam-card-footer"><div class="exam-card-footnote">'+(!isUpcoming?'<span>Started:</span><strong>'+escapeHtml(startedText)+'</strong>':'')+(countText?'<span class="exam-participation-count">'+escapeHtml(countText)+'</span>':'')+'</div><div class="exam-card-actions">'+action+'</div></div></article>';
    }

    function renderSection(label,exams,isUpcoming){
      const emptyText=isUpcoming?'No upcoming exams.':'No available exams yet.';
      return '<section class="exam-group"><div class="exam-section-heading"><h2>'+label+'</h2><span class="exam-section-count">'+exams.length+(exams.length===1?' exam':' exams')+'</span></div>'+(exams.length?'<div class="exam-grid">'+exams.map(e=>renderCard(e,isUpcoming)).join('')+'</div>':'<p class="exam-empty">'+emptyText+'</p>')+'</section>';
    }

    const allExams=d.exams||[];
    const upcoming=allExams.filter(e=>stateOf(e).upcoming);
    const available=allExams.filter(e=>!stateOf(e).upcoming);
    upcoming.sort((a,b)=>{
      const da=parseDate(a),db=parseDate(b);
      return (Number.isNaN(da)?Infinity:da)-(Number.isNaN(db)?Infinity:db);
    });
    available.sort((a,b)=>{
      const da=parseDate(a),db=parseDate(b);
      if(Number.isNaN(da))return Number.isNaN(db)?0:1;
      if(Number.isNaN(db))return -1;
      return db-da;
    });

    shell('Exams','Exams','<main><section class="pagehero"><div class="wrap"><h1>Exams</h1></div></section><section class="section" style="padding-top:0!important"><div class="exams-wrap">'+renderSection('Upcoming',upcoming,true)+renderSection('Available',available,false)+'</div></section></main>');
    window.registerAndOpen=async id=>{
      if(!(await ensureSignedIn('Register for this exam','Sign in or create an account before registering for an exam.')))return;
      try{
        await api('/api/exams/'+encodeURIComponent(id)+'/register',{method:'POST'});
        location.href='/exams.html';
      }catch(e){toast(e.message)}
    };
    document.querySelectorAll('[data-register-id]').forEach(b=>b.onclick=()=>registerAndOpen(b.dataset.registerId));
  }catch(e){console.error(e);document.body.innerHTML='<div class="error-page"><h1>Unable to load exams</h1><p>'+escapeHtml(e.message)+'</p><a href="/">← Back to KARP</a></div>'}
})();
</script>
</body></html>
