<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARP — Exams</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script></head><body><script>
(async()=>{try{const u=await requireUser();if(!u)return;const d=await api('/api/exams');const history=await api('/api/exams/history').catch(()=>({history:[]}));const completed=new Set((history.history||[]).map(h=>h.examId));const now=Date.now();const parseDate=e=>e.date?Date.parse(e.date.replace(' ','T')):NaN;function render(){const cards=(d.exams||[]).map(e=>{const date=parseDate(e),past=completed.has(e.id)||e.status==='Finished'||(!Number.isNaN(date)&&date+e.durationMinutes*60000<now),title=localized(e,'title'),desc=localized(e,'description');return `<article class="exam-card"><div class="tag">${past?'Past':(e.status||'Upcoming')} · ${formatDuration(e.durationMinutes)}</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(desc)}</p><div class="exam-meta"><span>${escapeHtml(e.date||'Date TBA')}</span><span>${e.questions?.length||0} questions</span></div><div class="exam-card-actions">${past?`<a class="btn primary" href="/exam.html?id=${encodeURIComponent(e.id)}">View exam →</a>`:`<button class="btn primary" onclick="registerAndOpen('${escapeHtml(e.id)}')">Register / Start →</button>`}</div></article>`}).join('');shell('Exams','Exams',`<section class="pagehero"><div class="wrap"><div class="eyebrow">04 — Exams</div><h1>Test yourself.<br>Under pressure.</h1><p class="lead">Register for timed KARP exams. Once you finish, your attempt is recorded and you can return later to view the questions again.</p></div></section><section class="section"><div class="wrap"><div class="exam-grid">${cards||'<div class="empty">No exams available yet.</div>'}</div>${history.history?.length?`<div class="history-block"><div class="eyebrow">Your history</div><h2>Previous attempts</h2><div class="history-list">${history.history.map(h=>`<div class="history-row"><span>${escapeHtml(localized(h,'title'))}</span><span>${new Date(h.submittedAt).toLocaleString()}</span></div>`).join('')}</div></div>`:''}</div></section>`)}render();window.registerAndOpen=async id=>{try{await api('/api/exams/'+encodeURIComponent(id)+'/register',{method:'POST'});location.href='/exam.html?id='+encodeURIComponent(id)}catch(e){toast(e.message)}}}catch(e){console.error(e);document.body.innerHTML=`<div class="error-page"><h1>Unable to load exams</h1><p>${escapeHtml(e.message)}</p><a href="/">← Back to KARP</a></div>`}})();
</script></body></html>
