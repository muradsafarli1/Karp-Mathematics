<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Admin Messages</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js?v=20260929"></script>
<style>
.admin-messages{padding:42px 0 80px;background:#fff}.am-wrap{width:min(calc(100% - 42px),1360px);margin:auto}
.am-hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.am-hero h1{font:800 38px/1 'Space Grotesk';letter-spacing:-1.5px;margin:5px 0}.am-hero p{font-size:11px;color:#7b848d;margin:7px 0 0}.am-stat{border:1px solid #e4e8eb;border-radius:15px;padding:13px 17px;text-align:right;background:#fff}.am-stat strong{display:block;font:800 25px/1 'Space Grotesk'}.am-stat span{display:block;color:#818b95;font-size:8px;text-transform:uppercase;letter-spacing:1.2px;margin-top:4px}
.am-grid{display:grid;grid-template-columns:300px 300px minmax(0,1fr);gap:12px}.am-panel{background:#fff;border:1px solid #e2e6ea;border-radius:20px;min-height:720px;overflow:hidden;box-shadow:0 9px 30px rgba(20,27,34,.045)}.am-panel-head{padding:18px 19px;border-bottom:1px solid #edf0f2}.am-panel-head h2{font:800 17px/1 'Space Grotesk';margin:0}.am-panel-head p{font-size:9px;color:#8a939c;margin:6px 0 0}.am-search{padding:11px;border-bottom:1px solid #edf0f2}.am-search input{height:40px;border-radius:12px}.am-users,.am-list{padding:8px;max-height:624px;overflow:auto}.am-user{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;color:#22272d;padding:10px;border-radius:12px;cursor:pointer}.am-user:hover,.am-user.active{background:#f4f7f5}.am-user strong{display:block;font-size:11px}.am-user small{display:block;color:#8a939c;font-size:8px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.am-avatar{width:44px;height:44px;flex:0 0 44px;border-radius:50%;object-fit:cover;background:#f0f2f4;color:#616b74;display:grid;place-items:center;font-weight:800;font-size:12px;overflow:hidden;border:1px solid #e4e8eb}
.am-conv{width:100%;border:1px solid transparent;text-align:left;background:transparent;color:#22272d;border-radius:13px;padding:11px;cursor:pointer;margin-bottom:5px;display:block}.am-conv:hover{background:#f6f7f8}.am-conv.active{background:#edf8f2;border-color:#d7eddf}.am-conv-title{font-weight:800;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.am-conv-meta{font-size:8px;color:#858e97;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.am-conv-foot{display:flex;justify-content:space-between;gap:8px;margin-top:5px}.am-type{font-size:7px;color:#149653;text-transform:uppercase;font-weight:800;letter-spacing:1px}.am-time{font-size:7px;color:#9aa2ab}
.am-chat{height:720px;display:flex;flex-direction:column}.am-chat-head{padding:16px 20px;border-bottom:1px solid #e9ecef;display:flex;align-items:center;gap:11px}.am-chat-head h2{font:800 17px/1 'Space Grotesk';margin:0}.am-chat-head p{font-size:8px;color:#89929b;margin:4px 0 0}.am-chat-list{flex:1;overflow:auto;padding:22px clamp(16px,3vw,34px);display:flex;flex-direction:column;gap:7px;background:radial-gradient(circle at 25px 25px,rgba(100,110,120,.06) 1px,transparent 1.5px) 0 0/30px 30px,#fafbfc}.am-msg{position:relative;max-width:72%;padding:10px 12px 21px;border-radius:16px;background:#fff;border:1px solid #e1e5e8;align-self:flex-start;font-size:11px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 3px 12px rgba(27,35,42,.045)}.am-msg.mine{align-self:flex-end;background:#eaf8ef;border-color:#cfe8d8}.am-msg-meta{position:absolute;right:9px;bottom:5px;font-size:7px;color:#8d969e}.am-compose{display:flex;align-items:flex-end;gap:9px;padding:11px;border-top:1px solid #e8ebee;background:#fff}.am-compose textarea{min-height:44px;max-height:140px;resize:none;border-radius:14px}.am-compose .btn{min-width:75px;height:44px}.am-empty{display:grid;place-items:center;min-height:180px;padding:25px;text-align:center;color:#8a939c;font-size:10px;line-height:1.7}
@media(max-width:1150px){.am-grid{grid-template-columns:280px 280px minmax(0,1fr)}}@media(max-width:950px){.am-grid{grid-template-columns:1fr}.am-panel{min-height:auto}.am-users,.am-list{max-height:300px}.am-chat{height:560px}.am-hero{align-items:flex-start;flex-direction:column}.am-stat{text-align:left}}
</style>
</head>
<body>
<script>
(async()=>{
 const u=await requireAdmin();if(!u)return;
 const {db}=await fb();
 const fs=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
 const {collection,query,where,getDocs,getDoc,doc,setDoc,collectionGroup,onSnapshot,Timestamp,writeBatch}=fs;
 const esc=x=>escapeHtml(x==null?'':String(x));
 const fid=(a,b)=>a<b?a+'_'+b:b+'_'+a;
 const time=v=>{if(!v)return '';const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'':d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};
 const date=v=>{if(!v)return '';const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'':d.toLocaleDateString([],{day:'2-digit',month:'short'})};
 const avatar=p=>p?.photoURL?'<img class="am-avatar" src="'+esc(p.photoURL)+'" alt="">':'<div class="am-avatar">'+esc(String(p?.name||'K').trim().charAt(0).toUpperCase())+'</div>';
 let users=[],convs=[],selected=null,usersUnsub=null,convUnsub=null,msgUnsub=null;
 const profileCache=new Map();
 async function profile(uid){if(profileCache.has(uid))return profileCache.get(uid);const s=await getDoc(doc(db,'publicProfiles',uid));const p=s.exists()?{uid,...s.data()}:{uid,name:'KARP Member',photoURL:''};profileCache.set(uid,p);return p}
 async function loadUsers(){try{const s=await getDocs(collection(db,'users'));users=s.docs.map(x=>({uid:x.id,...x.data()})).filter(x=>x.uid!==u.id).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));renderUsers(users)}catch(e){console.error(e);document.getElementById('am-users').innerHTML='<div class="am-empty">Could not load users.<br>Check that the latest Firestore rules are deployed.</div>'}}
 function renderUsers(list){const el=document.getElementById('am-users');el.innerHTML=list.length?list.map(x=>'<button class="am-user '+(selected?.targetUid===x.uid?'active':'')+'" data-user="'+esc(x.uid)+'">'+avatar({name:x.name,photoURL:x.photoURL})+'<span><strong>'+esc(x.name||'KARP Member')+'</strong><small>'+esc(x.email||'')+'</small></span></button>').join(''):'<div class="am-empty">No users found.</div>';el.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>startSupport(users.find(x=>x.uid===b.dataset.user)))}
 async function enrichConv(s){const d=s.data(),members=Array.isArray(d.members)?d.members:[],profiles=[];for(const id of members)profiles.push(await profile(id));return{id:s.id,...d,profiles}}
 async function renderConvs(){const el=document.getElementById('am-convs');convs.sort((a,b)=>(b.lastMessageAt?.toMillis?b.lastMessageAt.toMillis():0)-(a.lastMessageAt?.toMillis?a.lastMessageAt.toMillis():0));el.innerHTML=convs.length?convs.map(x=>{const names=(x.profiles||[]).filter(p=>p.uid!==u.id).map(p=>p.name||'KARP Member');const title=x.type==='group'?(x.name||'Group'):x.type==='support'?'Admin support · '+(names[0]||'Member'):names.join(' ↔ ')||'Conversation';const type=x.type==='group'?'Group':x.type==='support'?'Support':'Direct';return '<button class="am-conv '+(selected?.id===x.id?'active':'')+'" data-conv="'+esc(x.id)+'"><div class="am-conv-title">'+esc(title)+'</div><div class="am-conv-meta">'+esc(x.lastMessage||'No messages yet')+'</div><div class="am-conv-foot"><span class="am-type">'+esc(type)+'</span><span class="am-time">'+esc(date(x.lastMessageAt)||'')+'</span></div></button>'}).join(''):'<div class="am-empty">No conversations yet.</div>';el.querySelectorAll('[data-conv]').forEach(b=>b.onclick=()=>openConversation(convs.find(x=>x.id===b.dataset.conv)));document.getElementById('conv-count').textContent=String(convs.length)}
 async function refreshConvs(snap){try{convs=await Promise.all(snap.docs.map(enrichConv));await renderConvs()}catch(e){console.error('Conversation load error',e);document.getElementById('am-convs').innerHTML='<div class="am-empty">Could not load conversations.<br>Please deploy the latest Firestore rules.</div>'}}
 async function ensureSupport(target){const id='support_'+fid(u.id,target.uid),now=Timestamp.now();await setDoc(doc(db,'conversations',id),{id,type:'support',members:[u.id,target.uid].sort(),status:'accepted',createdBy:u.id,lastMessage:'',lastMessageAt:null,createdAt:now,updatedAt:now},{merge:true});selected={id,targetUid:target.uid};return convs.find(x=>x.id===id)||enrichConv(await getDoc(doc(db,'conversations',id)))} 
 async function startSupport(target){if(!target)return;try{const c=await ensureSupport(target);await refreshConvs(await getDocs(query(collection(db,'conversations'),where('status','==','accepted'))));await openConversation(convs.find(x=>x.id===c.id)||c)}catch(e){console.error(e);toast(e?.code==='permission-denied'?'Firebase rules have not been deployed yet.':'Could not open admin chat.')}}
 function openEmpty(){selected=null;if(msgUnsub){msgUnsub();msgUnsub=null}document.getElementById('am-chat').innerHTML='<div class="am-empty" style="height:100%">Select a conversation or choose a user to message them.</div>';renderConvs()}
 async function openConversation(item){if(!item)return;selected=item;renderUsers(users);renderConvs();if(msgUnsub){msgUnsub();msgUnsub=null}
  const other=(item.profiles||[]).find(p=>p.uid!==u.id)||{name:item.type==='group'?(item.name||'Group'):'KARP Member',photoURL:''};
  document.getElementById('am-chat').innerHTML='<header class="am-chat-head">'+avatar(other)+'<div><h2>'+esc(item.type==='group'?(item.name||'Group'):item.type==='support'?'Admin support · '+(other.name||'Member'):(other.name||'Conversation'))+'</h2><p>'+esc(item.type==='group'?'Group conversation':item.type==='support'?'Support conversation with a KARP member':'Direct conversation')+'</p></div></header><div id="am-chat-list" class="am-chat-list"></div><form id="am-compose" class="am-compose"><textarea id="am-input" class="textarea" maxlength="4000" rows="1" placeholder="Write a message…"></textarea><button class="btn primary" type="submit">Send</button></form>';
  const list=document.getElementById('am-chat-list');
  msgUnsub=onSnapshot(query(collection(db,'conversations',item.id,'messages')),snap=>{const docs=snap.docs.slice().sort((a,b)=>(a.data().createdAt?.toMillis?a.data().createdAt.toMillis():0)-(b.data().createdAt?.toMillis?b.data().createdAt.toMillis():0));list.innerHTML=docs.map(x=>{const m=x.data();return '<div class="am-msg '+(m.senderId===u.id?'mine':'')+'">'+esc(m.text||'')+'<span class="am-msg-meta">'+esc(time(m.createdAt))+'</span></div>'}).join('')||'<div class="am-empty" style="margin:auto">No messages yet.</div>';list.scrollTop=list.scrollHeight},e=>{console.error('Admin message read error',e);list.innerHTML='<div class="am-empty" style="margin:auto">Could not load messages.<br>Deploy the latest Firestore rules and refresh.</div>'});
  const input=document.getElementById('am-input');input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('am-compose').requestSubmit()}});
  document.getElementById('am-compose').onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;const btn=e.currentTarget.querySelector('button[type=submit]');btn.disabled=true;try{const now=Timestamp.now(),ref=doc(collection(db,'conversations',item.id,'messages')),batch=writeBatch(db);batch.set(ref,{senderId:u.id,senderName:u.name||'KARP Admin',text,createdAt:now});batch.update(doc(db,'conversations',item.id),{lastMessage:text.slice(0,140),lastMessageSenderId:u.id,lastMessageAt:now,updatedAt:now});await batch.commit();input.value='';input.focus()}catch(err){console.error('Admin send error',err);toast(err?.code==='permission-denied'?'Firebase rules have not been deployed yet.':'Message could not be sent.')}finally{btn.disabled=false}};
 }
 const body='<main class="admin-messages"><div class="am-wrap"><div class="am-hero"><div><div class="eyebrow">KARP · ADMIN</div><h1>Messages</h1><p>One live inbox for direct chats, groups and admin support conversations.</p></div><div class="am-stat"><strong id="conv-count">0</strong><span>Conversations</span></div></div><div class="am-grid"><section class="am-panel"><div class="am-panel-head"><h2>Users</h2><p>Start support with any registered member.</p></div><div class="am-search"><input id="am-search" class="input" placeholder="Search name or email"></div><div id="am-users" class="am-users"></div></section><section class="am-panel"><div class="am-panel-head"><h2>All conversations</h2><p>Direct, group and support chats are listed here.</p></div><div id="am-convs" class="am-list"></div></section><section class="am-panel" id="am-chat"><div class="am-empty" style="height:100%">Select a conversation or choose a user to message them.</div></section></div></div></main>';
 shell('','Admin Messages',body);
 document.getElementById('am-search').addEventListener('input',()=>{const q=document.getElementById('am-search').value.trim().toLowerCase();renderUsers(users.filter(x=>String(x.name||'').toLowerCase().includes(q)||String(x.email||'').toLowerCase().includes(q)))});
 await loadUsers();
 convUnsub=onSnapshot(collection(db,'conversations'),snap=>refreshConvs(snap),e=>{console.error('Admin conversations error',e);document.getElementById('am-convs').innerHTML='<div class="am-empty">Could not load conversations.<br>Please check Firebase rules and refresh.</div>'});
 window.addEventListener('beforeunload',()=>{usersUnsub?.();convUnsub?.();msgUnsub?.()});
})();
</script>
</body></html>
