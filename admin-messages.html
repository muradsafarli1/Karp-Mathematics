<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Admin Messages</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js"></script>
<style>
.admin-messages{padding:55px 0 80px}.am-wrap{width:min(calc(100% - 42px),1320px);margin:auto}
.am-grid{display:grid;grid-template-columns:320px 1fr;gap:14px}.am-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-height:700px;overflow:hidden}
.am-panel-head{padding:18px 20px;border-bottom:1px solid var(--line)}.am-panel-head h2{font:700 18px/1 'Space Grotesk';margin:0}.am-panel-head p{font-size:10px;color:var(--muted);margin:5px 0 0}
.am-users{padding:9px;display:grid;gap:6px;max-height:625px;overflow:auto}.msg-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--panel2);display:grid;place-items:center;flex:0 0 42px;font-size:12px;font-weight:800;overflow:hidden}.am-user{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;color:var(--text);padding:10px;border-radius:11px;cursor:pointer}.am-user:hover,.am-user.active{background:var(--panel2)}.am-user strong{display:block;font-size:11px}.am-user small{display:block;color:var(--muted);font-size:8px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am-list{padding:9px;max-height:300px;overflow:auto}.am-conv{width:100%;border:0;text-align:left;background:var(--panel2);color:var(--text);border-radius:11px;padding:11px;cursor:pointer;margin-bottom:6px}.am-conv.active{outline:2px solid var(--line)}.am-conv-title{font-weight:800;font-size:11px}.am-conv-meta{font-size:9px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am-chat{height:390px;display:flex;flex-direction:column}.am-chat-head{padding:16px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.am-chat-head h2{font:700 17px/1 'Space Grotesk';margin:0}.am-chat-head p{font-size:9px;color:var(--muted);margin:4px 0 0}.am-chat-list{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px}.am-msg{position:relative;max-width:72%;padding:8px 10px 18px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);align-self:flex-start;font-size:11px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.am-msg.mine{align-self:flex-end;background:color-mix(in srgb,#16a05d 16%,var(--panel))}.am-msg-meta{position:absolute;right:8px;bottom:4px;font-size:7px;color:var(--muted)}.am-compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.am-compose textarea{min-height:42px;max-height:120px;resize:none}.am-compose .btn{min-width:72px}
.am-search{margin:12px}.am-search input{height:40px}.am-empty{display:grid;place-items:center;min-height:180px;padding:25px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}
@media(max-width:1000px){.am-grid{grid-template-columns:1fr}.am-panel{min-height:auto}.am-users{max-height:320px}.am-chat{height:500px}}
</style>
</head>
<body>
<script>
(async()=>{
 const u=await requireAdmin();if(!u)return;
 const {db}=await fb();
 const fs=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
 const {collection,query,where,getDocs,getDoc,doc,setDoc,addDoc,updateDoc,orderBy,onSnapshot,Timestamp}=fs;
 const esc=x=>escapeHtml(x==null?'':String(x));
 const avatar=(p)=>p?.photoURL?'<img class="msg-avatar" src="'+esc(p.photoURL)+'" alt="">':'<div class="msg-avatar">'+esc(String(p?.name||'K').trim().charAt(0).toUpperCase())+'</div>';
 const fid=(a,b)=>a<b?a+'_'+b:b+'_'+a;
 const time=v=>{const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'':d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};
 let users=[],convs=[],selected=null,selectedProfile=null,unsub=null;
 async function profile(uid){const s=await getDoc(doc(db,'publicProfiles',uid));return s.exists()?{uid,...s.data()}:{uid,name:'KARP Member',photoURL:''}}
 async function loadUsers(){const s=await getDocs(collection(db,'users'));users=s.docs.map(x=>({uid:x.id,...x.data()})).filter(x=>x.uid!==u.id).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));renderUsers(users);}
 function renderUsers(list){const el=document.getElementById('am-users');el.innerHTML=list.length?list.map(x=>'<button class="am-user" data-user="'+esc(x.uid)+'">'+avatar({name:x.name,photoURL:x.photoURL})+'<span><strong>'+esc(x.name||'KARP Member')+'</strong><small>'+esc(x.email||'')+'</small></span></button>').join(''):'<div class="am-empty">No users found.</div>';el.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>startSupport(users.find(x=>x.uid===b.dataset.user)).catch(e=>{console.error(e);toast('Could not open user chat.')}));}
 async function profilesFor(items){const out=[];for(const id of items)out.push(await profile(id));return out}
 async function loadConversations(){const s=await getDocs(query(collection(db,'conversations'),where('status','==','accepted')));convs=[];for(const x of s.docs){const d=x.data();convs.push({id:x.id,...d,profiles:await profilesFor(d.members||[])});}convs.sort((a,b)=>(b.lastMessageAt?.toMillis?b.lastMessageAt.toMillis():0)-(a.lastMessageAt?.toMillis?a.lastMessageAt.toMillis():0));renderConvs();}
 function renderConvs(){const el=document.getElementById('am-convs');el.innerHTML=convs.length?convs.map(x=>'<button class="am-conv '+(selected?.id===x.id?'active':'')+'" data-conv="'+esc(x.id)+'"><div class="am-conv-title">'+esc(x.type==='group'?(x.name||'Group'):x.profiles.map(p=>p.name||'KARP Member').join(' ↔ '))+'</div><div class="am-conv-meta">'+esc(x.lastMessage||'No messages yet')+'</div></button>').join(''):'<div class="am-empty">No conversations yet.</div>';el.querySelectorAll('[data-conv]').forEach(b=>b.onclick=()=>openConversation(convs.find(x=>x.id===b.dataset.conv)));}
 async function ensureSupport(target){const id='support_'+fid(u.id,target.uid),now=Timestamp.now();await setDoc(doc(db,'conversations',id),{id,type:'support',members:[u.id,target.uid].sort(),status:'accepted',createdBy:u.id,lastMessage:'',lastMessageAt:null,createdAt:now,updatedAt:now},{merge:true});await loadConversations();return convs.find(x=>x.id===id);}
 async function startSupport(target){if(!target)return;const c=await ensureSupport(target);await openConversation(c);}
 function openEmpty(){selected=null;selectedProfile=null;if(unsub){unsub();unsub=null}document.getElementById('am-chat').innerHTML='<div class="am-empty">Select a conversation or choose a user to message them.</div>';renderConvs();}
 async function openConversation(item){if(!item)return;selected=item;selectedProfile=(item.profiles||[]).find(x=>x.uid!==u.id)||null;renderConvs();if(unsub){unsub();unsub=null}
  document.getElementById('am-chat').innerHTML='<header class="am-chat-head">'+avatar(selectedProfile||{name:'KARP'})+'<div><h2>'+esc(item.type==='group'?(item.name||'Group'):(selectedProfile?.name||'Conversation'))+'</h2><p>'+esc(item.type==='support'?'Admin support chat':item.type==='group'?'Group conversation':'Direct conversation')+'</p></div></header><div id="am-chat-list" class="am-chat-list"></div><form id="am-compose" class="am-compose"><textarea id="am-input" class="textarea" maxlength="4000" rows="1" placeholder="Write a message"></textarea><button class="btn primary" type="submit">Send</button></form>';
  const list=document.getElementById('am-chat-list');
  unsub=onSnapshot(query(collection(db,'conversations',item.id,'messages'),orderBy('createdAt','asc')),s=>{list.innerHTML=s.docs.map(x=>{const m=x.data();return '<div class="am-msg '+(m.senderId===u.id?'mine':'')+'">'+esc(m.text||'')+'<span class="am-msg-meta">'+esc(time(m.createdAt))+'</span></div>'}).join('')||'<div class="am-empty">No messages yet.</div>';list.scrollTop=list.scrollHeight},e=>{console.error(e);toast('Could not load this conversation.')});
  document.getElementById('am-compose').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('am-input'),text=input.value.trim();if(!text)return;try{const now=Timestamp.now();await addDoc(collection(db,'conversations',item.id,'messages'),{senderId:u.id,senderName:u.name||'KARP Admin',text,createdAt:now});await updateDoc(doc(db,'conversations',item.id),{lastMessage:text.slice(0,140),lastMessageSenderId:u.id,lastMessageAt:now,updatedAt:now});input.value='';input.focus()}catch(err){console.error(err);toast('Message could not be sent.')}};
 }
 shell('','Admin Messages','<main class="admin-messages"><div class="am-wrap"><div class="eyebrow">KARP · MODERATION</div><h1 class="am-title">Messages</h1><p class="am-sub">Review conversations and send direct messages to any registered user.</p><div class="am-grid"><section class="am-panel"><div class="am-panel-head"><h2>Users</h2><p>Start an admin support chat.</p></div><div class="am-search"><input id="am-search" class="input" placeholder="Search name or email"></div><div id="am-users" class="am-users"></div></section><section class="am-panel"><div class="am-panel-head"><h2>Conversations</h2><p>All accepted chats and admin support chats.</p></div><div id="am-convs" class="am-list"></div><div id="am-chat" class="am-chat"><div class="am-empty">Select a conversation or choose a user to message them.</div></div></section></div></div></main>');
 document.getElementById('am-search').addEventListener('input',()=>{const q=document.getElementById('am-search').value.trim().toLowerCase();renderUsers(users.filter(x=>String(x.name||'').toLowerCase().includes(q)||String(x.email||'').toLowerCase().includes(q)))});
 await loadUsers();await loadConversations();
 window.addEventListener('beforeunload',()=>{if(unsub)unsub()});
})();
</script>
</body></html>
