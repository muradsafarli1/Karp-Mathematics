<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Calculator</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjs@latest/lib/browser/math.js"></script>
<style>
.calc-page{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:48px 18px;background:var(--bg)}
.calculator{width:min(460px,100%);background:var(--panel2);border-radius:25px;padding:18px;box-shadow:0 25px 80px rgba(0,0,0,.2)}
.calc-top{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 14px}.calc-title{font-family:'Space Grotesk';font-size:26px;font-weight:800;letter-spacing:-1px;margin:0}.calc-mode{font-size:10px;color:var(--muted)}
.calc-screen{background:var(--bg);border-radius:18px;padding:16px 18px;margin-bottom:12px;min-height:94px;display:flex;flex-direction:column;justify-content:flex-end}
.calc-expression{min-height:20px;text-align:right;color:var(--muted);font-size:12px;overflow:auto;white-space:nowrap}.calc-result{margin-top:4px;text-align:right;font-family:'Space Grotesk';font-size:38px;font-weight:700;line-height:1.1;overflow:auto;white-space:nowrap}
.calc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.calc-btn{height:52px;border:0;border-radius:12px;background:var(--panel);color:var(--text);font-size:15px;font-weight:700;cursor:pointer}.calc-btn:hover{background:var(--bg)}.calc-btn.fn{font-size:12px;color:var(--muted)}.calc-btn.op{background:var(--panel);font-size:19px}.calc-btn.equals{background:var(--text);color:var(--bg);font-size:19px}.calc-btn.danger{color:#c36}.span2{grid-column:span 2}
@media(max-width:520px){.calculator{padding:14px}.calc-btn{height:48px}.calc-result{font-size:32px}.calc-grid{gap:6px}}
</style>
</head>
<body>
<script>
shell('Tools','Calculator',\`<main class="calc-page"><section class="calculator">
  <div class="calc-top"><h1 class="calc-title">Calculator</h1><span class="calc-mode">Expression mode</span></div>
  <div class="calc-screen"><div id="calc-expression" class="calc-expression"></div><div id="calc-result" class="calc-result">0</div></div>
  <div class="calc-grid">
    <button class="calc-btn danger" data-act="clear">AC</button><button class="calc-btn fn" data-act="back">DEL</button><button class="calc-btn fn" data-val="(">(</button><button class="calc-btn fn" data-val=")">)</button><button class="calc-btn op" data-val="/">÷</button>
    <button class="calc-btn fn" data-val="sin(">sin</button><button class="calc-btn fn" data-val="cos(">cos</button><button class="calc-btn fn" data-val="tan(">tan</button><button class="calc-btn fn" data-val="sqrt(">√</button><button class="calc-btn op" data-val="*">×</button>
    <button class="calc-btn fn" data-val="log(">log</button><button class="calc-btn fn" data-val="ln(">ln</button><button class="calc-btn fn" data-val="pi">π</button><button class="calc-btn fn" data-val="e">e</button><button class="calc-btn op" data-val="-">−</button>
    <button class="calc-btn fn" data-val="^2">x²</button><button class="calc-btn fn" data-val="^">xʸ</button><button class="calc-btn" data-val="7">7</button><button class="calc-btn" data-val="8">8</button><button class="calc-btn" data-val="9">9</button>
    <button class="calc-btn fn" data-val="!">x!</button><button class="calc-btn" data-val=".">.</button><button class="calc-btn" data-val="4">4</button><button class="calc-btn" data-val="5">5</button><button class="calc-btn" data-val="6">6</button>
    <button class="calc-btn fn" data-act="neg">±</button><button class="calc-btn" data-val="0">0</button><button class="calc-btn" data-val="1">1</button><button class="calc-btn" data-val="2">2</button><button class="calc-btn" data-val="3">3</button>
    <button class="calc-btn span2" data-act="ans">ANS</button><button class="calc-btn op" data-val="+">+</button><button class="calc-btn equals span2" data-act="eval">=</button>
  </div>
</section></main>\`);

let expr='',last=0;
const expressionEl=()=>document.getElementById('calc-expression'),resultEl=()=>document.getElementById('calc-result');
function display(){expressionEl().textContent=expr;resultEl().textContent=expr?'':String(last)}
function insert(v){if(!expr&&/^[+*/^)]/.test(v))return;expr+=v;display()}
function clearCalc(){expr='';last=0;display()}
function backCalc(){expr=expr.slice(0,-1);display()}
function normalize(s){return s.replace(/π/g,'pi').replace(/−/g,'-')}
function calculate(){
  try{
    const src=normalize(expr||'0');
    const value=math.evaluate(src);
    last=Number.isFinite(value)?value:String(value);
    document.getElementById('calc-result').textContent=String(last);
    document.getElementById('calc-expression').textContent=expr;
    expr='';
  }catch{document.getElementById('calc-result').textContent='Error'}
}
function negate(){expr=expr?'-('+expr+')':'-';display()}
function ans(){expr+=String(last);display()}
document.querySelectorAll('.calc-btn').forEach(b=>b.onclick=()=>{const v=b.dataset.val,a=b.dataset.act;if(v!=null)insert(v);else if(a==='clear')clearCalc();else if(a==='back')backCalc();else if(a==='eval')calculate();else if(a==='neg')negate();else if(a==='ans')ans()});
document.addEventListener('keydown',e=>{
  const map={Enter:'eval',Escape:'clear',Backspace:'back'};
  if(map[e.key]){e.preventDefault();document.querySelector('[data-act="'+map[e.key]+'"]')?.click();return}
  if(/[0-9.+\-*/^()!]/.test(e.key))insert(e.key);
});
display();
</script>
</body>
</html>
