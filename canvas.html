<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Drawing</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://unpkg.com/@excalidraw/excalidraw@0.18.1/index.css">
<script src="/app.js?v=drawing-20261023"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "@excalidraw/excalidraw": "https://esm.sh/@excalidraw/excalidraw@0.18.1?external=react,react-dom"
  }
}
</script>
<style>
html,body{height:100%;overflow:hidden}
body{background:#f4f4f1;color:#17191c}
.footer{display:none!important}
.drawing-page{height:calc(100vh - 72px);min-height:420px;display:flex;flex-direction:column;overflow:hidden;background:#f4f4f1}
.drawing-head{height:54px;min-height:54px;display:flex;align-items:center;gap:11px;padding:0 16px;background:#fff;border-bottom:1px solid #e5e6e2;box-sizing:border-box}
.drawing-mark{width:31px;height:31px;display:grid;place-items:center;background:#263b5b;color:#fff;border-radius:9px;font:800 14px/1 "Space Grotesk",system-ui}
.drawing-head-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
.drawing-head-copy strong{font:750 14px/1.2 "Space Grotesk",system-ui;letter-spacing:-.25px}
.drawing-head-copy span{font:10px/1.2 Inter,system-ui;color:#868b90}
.drawing-actions{margin-left:auto;display:flex;align-items:center;gap:7px;min-width:0}
.drawing-save-state{font:10px Inter,system-ui;color:#727981;white-space:nowrap;margin-right:5px}
.drawing-action{height:32px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 11px;border:1px solid #dfe1de;border-radius:9px;background:#fff;color:#343a40;font:650 11px Inter,system-ui;cursor:pointer;white-space:nowrap}
.drawing-action:hover{background:#f3f4f1;border-color:#cbd0cb}
.drawing-action.primary{background:#263b5b;color:#fff;border-color:#263b5b}
.drawing-action.primary:hover{background:#1c2e49}
.drawing-stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#fff}
#drawing-mount{height:100%;width:100%;min-height:0}
#drawing-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;color:#636a72;font:12px/1.7 Inter,system-ui;text-align:center;padding:24px;z-index:2}
#drawing-loading[hidden]{display:none}
.drawing-credit{height:23px;flex:0 0 23px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;background:#fafaf8;border-top:1px solid #e5e6e2;color:#83888d;font:9px Inter,system-ui}
.drawing-credit strong{color:#505862;font-weight:700}
@media(max-width:650px){
 .drawing-page{height:calc(100vh - 62px);min-height:390px}
 .drawing-head{padding:0 8px;gap:7px;height:49px;min-height:49px}
 .drawing-mark{width:27px;height:27px}
 .drawing-head-copy strong{font-size:12px}
 .drawing-head-copy span{display:none}
 .drawing-actions{gap:4px}
 .drawing-save-state{display:none}
 .drawing-action{height:30px;padding:0 7px;font-size:10px}
 .drawing-credit{padding:0 7px}
}
</style>
</head>
<body>
<script type="module">
shell('Tools','Drawing','<main class="drawing-page"><header class="drawing-head"><div class="drawing-mark">K</div><div class="drawing-head-copy"><strong>Drawing</strong><span>A freeform workspace for mathematical thinking</span></div><div class="drawing-actions"><span class="drawing-save-state" id="drawing-save-state">Loading your board…</span><button class="drawing-action" id="drawing-import" type="button">Import</button><button class="drawing-action" id="drawing-backup" type="button">Download backup</button><button class="drawing-action primary" id="drawing-clear" type="button">Clear board</button></div></header><section class="drawing-stage"><div id="drawing-mount"></div><div id="drawing-loading" role="status">Loading the drawing workspace…</div></section><footer class="drawing-credit"><span><strong>KARP Drawing</strong> · Autosaves in this browser</span><span>Excalidraw-powered workspace</span></footer><input id="drawing-file" type="file" accept=".excalidraw,.json,application/json" hidden></main>');
const storageKey = "karp_drawing_excalidraw_v1";
const loading = document.getElementById("drawing-loading");
const status = document.getElementById("drawing-save-state");
const setStatus = (value) => { if (status) status.textContent = value; };
let api = null;
let saveTimer = null;
let latestScene = null;
let loadReady = false;

function readSavedScene() {
  try {
    const raw = localStorage.getItem(storageKey);
    if (!raw) return null;
    const value = JSON.parse(raw);
    if (value && Array.isArray(value.elements)) return value;
  } catch (error) {
    console.warn("Could not read the saved Drawing board:", error);
  }
  return null;
}
function safeAppState(state) {
  const keys = [
    "viewBackgroundColor", "gridSize", "currentItemFontFamily",
    "currentItemStrokeColor", "currentItemBackgroundColor", "currentItemFillStyle",
    "currentItemStrokeWidth", "currentItemStrokeStyle", "currentItemRoughness",
    "currentItemOpacity", "currentItemRoundness", "theme"
  ];
  const result = {};
  for (const key of keys) {
    if (state && Object.prototype.hasOwnProperty.call(state, key)) result[key] = state[key];
  }
  result.theme = "light";
  return result;
}
function updateDownloadSnapshot(elements, appState, files) {
  latestScene = {
    type: "excalidraw",
    version: 2,
    source: "https://karpmathematics.org",
    elements,
    appState: safeAppState(appState),
    files: files || {}
  };
}
function persistScene() {
  if (!latestScene) return;
  try {
    localStorage.setItem(storageKey, JSON.stringify(latestScene));
    setStatus("Saved in this browser");
  } catch (error) {
    console.warn("KARP Drawing autosave failed:", error);
    setStatus("Storage full — download a backup");
  }
}
function onChange(elements, appState, files) {
  updateDownloadSnapshot(elements, appState, files);
  if (!loadReady) return;
  setStatus("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistScene, 400);
}
function downloadBackup() {
  const data = latestScene || readSavedScene() || {
    type: "excalidraw", version: 2, source: "https://karpmathematics.org",
    elements: [], appState: { viewBackgroundColor: "#ffffff", theme: "light" }, files: {}
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "KARP-Drawing-" + new Date().toISOString().slice(0, 10) + ".excalidraw";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
document.getElementById("drawing-backup").addEventListener("click", downloadBackup);
document.getElementById("drawing-clear").addEventListener("click", () => {
  if (!api || !confirm("Clear every object on this board? Download a backup first if you need to keep it.")) return;
  api.updateScene({ elements: [] });
  setStatus("Board cleared");
});
document.getElementById("drawing-import").addEventListener("click", () => document.getElementById("drawing-file").click());
document.getElementById("drawing-file").addEventListener("change", async (event) => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  try {
    const value = JSON.parse(await file.text());
    if (!value || !Array.isArray(value.elements)) throw new Error("This file is not a valid Excalidraw board.");
    localStorage.setItem(storageKey, JSON.stringify({
      type: "excalidraw", version: 2, source: value.source || "KARP Drawing",
      elements: value.elements,
      appState: safeAppState(value.appState || { theme: "light", viewBackgroundColor: "#ffffff" }),
      files: value.files || {}
    }));
    setStatus("Board imported — reopening…");
    location.reload();
  } catch (error) {
    console.error("Drawing import failed:", error);
    setStatus(error && error.message ? error.message : "Could not import this board");
  } finally {
    event.target.value = "";
  }
});

try {
  const [ReactModule, ReactDOMModule, ExcalidrawModule] = await Promise.all([
    import("react"),
    import("react-dom/client"),
    import("@excalidraw/excalidraw")
  ]);
  const React = ReactModule.default || ReactModule;
  const createRoot = ReactDOMModule.createRoot;
  const Excalidraw = ExcalidrawModule.Excalidraw;
  if (!React || !createRoot || !Excalidraw) throw new Error("The drawing editor could not be initialized.");
  const saved = readSavedScene();
  const initialData = saved ? {
    elements: saved.elements,
    appState: safeAppState(saved.appState || { theme: "light", viewBackgroundColor: "#ffffff" }),
    files: saved.files || {}
  } : {
    elements: [],
    appState: { theme: "light", viewBackgroundColor: "#ffffff" },
    files: {}
  };
  latestScene = {
    type: "excalidraw", version: 2, source: "https://karpmathematics.org",
    elements: initialData.elements, appState: initialData.appState, files: initialData.files
  };
  const root = createRoot(document.getElementById("drawing-mount"));
  root.render(React.createElement(Excalidraw, {
    initialData,
    excalidrawAPI: (value) => { api = value; },
    onChange,
    theme: "light",
    name: "KARP Drawing",
    autoFocus: true
  }));
  loading.hidden = true;
  loadReady = true;
  setStatus(saved ? "Board restored from this browser" : "Ready · autosave enabled");
} catch (error) {
  console.error("KARP Drawing initialization failed:", error);
  loading.hidden = false;
  loading.innerHTML = "The Drawing editor could not load. Check your internet connection and reload the page.<br><br><span style='font-size:10px'>" + String(error && error.message || error).replace(/[&<>"]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[ch])) + "</span>";
  setStatus("Editor unavailable");
}
</script>
</body>
</html>
