<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARP — Canvas</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script>
<style>
body{background:#f5f5f2;color:#17191c}.kc-app{height:calc(100vh - 76px);min-height:500px;display:flex;flex-direction:column;overflow:hidden;background:#f5f5f2}.kc-head{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #e0e1df;background:#fff}.kc-mark{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#202327;color:#fff;font:700 13px 'Space Grotesk'}.kc-head-main{flex:1;min-width:0}.kc-head h1{font:700 15px 'Space Grotesk';margin:0}.kc-head p{font:10px Inter,Arial,sans-serif;color:#8a8e94;margin:2px 0 0}.kc-actions{display:flex;gap:5px}.kc-btn{height:31px;border:1px solid #d9dbde;border-radius:8px;background:#fff;color:#34383e;padding:0 9px;font:500 11px Inter,Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;white-space:nowrap}.kc-btn:hover{background:#f1f2f2}.kc-btn.primary{background:#202327;color:#fff;border-color:#202327}.kc-btn:disabled{opacity:.38;cursor:default}.kc-work{display:flex;flex:1;min-height:0;overflow:hidden}.kc-tools{width:50px;flex:0 0 50px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:#fff;border-right:1px solid #e1e2e0}.kc-tool{width:39px;height:38px;border:1px solid transparent;border-radius:9px;background:transparent;color:#555b64;display:grid;place-items:center;cursor:pointer}.kc-tool svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.kc-tool:hover{background:#f4f5f5}.kc-tool.active{background:#e9edf7;border-color:#d7deee;color:#315aab}.kc-sep{height:1px;width:25px;background:#e2e3e1;margin:3px 0}.kc-panel{width:181px;flex:0 0 181px;box-sizing:border-box;padding:13px 11px;border-right:1px solid #e1e2e0;background:#fff;overflow:auto}.kc-panel h2{font:700 11px Inter,Arial,sans-serif;margin:0 0 10px}.kc-label{display:block;font:10px Inter,Arial,sans-serif;color:#7c8188;margin:13px 0 7px}.kc-row{display:flex;align-items:center;gap:7px}.kc-color{width:31px;height:29px;border:1px solid #d7d9dc;border-radius:7px;padding:2px;background:#fff;cursor:pointer}.kc-range{width:100%;accent-color:#3a424c}.kc-value{min-width:28px;text-align:right;font:10px Inter,Arial,sans-serif;color:#656b72}.kc-select{width:100%;height:31px;border:1px solid #d7d9dc;border-radius:7px;background:#fff;color:#33383e;padding:0 7px;font:11px Inter,Arial,sans-serif}.kc-panel .kc-btn{width:100%;margin-top:8px}.kc-help{font:10px/1.6 Inter,Arial,sans-serif;color:#8a8f95;margin:14px 0 0}.kc-zone{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#eceeeb}.kc-topline{height:39px;flex:0 0 39px;display:flex;align-items:center;gap:7px;padding:0 11px;border-bottom:1px solid #dfe1dd;background:#f7f7f5}.kc-boardname{font:600 11px Inter,Arial,sans-serif;color:#4a4f56;flex:1}.kc-zoom{display:flex;align-items:center;gap:4px}.kc-zoom .kc-btn{width:28px;padding:0;font-size:14px}.kc-zoom-value{width:38px;text-align:center;font:10px Inter,Arial,sans-serif;color:#6d7279}.kc-viewport{position:relative;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#c9cbc8 transparent}.kc-pad{width:max-content;height:max-content;min-width:100%;min-height:100%;display:flex;align-items:flex-start;padding:25px;box-sizing:border-box}#kc-board{display:block;flex:0 0 auto;border:1px solid #fff;box-shadow:0 3px 22px #191d220e;touch-action:none;user-select:none;background:#fff}#kc-board[data-tool="pen"],#kc-board[data-tool="highlighter"],#kc-board[data-tool="line"],#kc-board[data-tool="arrow"],#kc-board[data-tool="rect"],#kc-board[data-tool="ellipse"]{cursor:crosshair}#kc-board[data-tool="text"]{cursor:text}#kc-board[data-tool="eraser"]{cursor:cell}.kc-status{height:27px;flex:0 0 27px;border-top:1px solid #dedfdd;background:#fafaf9;display:flex;align-items:center;gap:8px;padding:0 11px;font:10px Inter,Arial,sans-serif;color:#858a90}.kc-dot{width:6px;height:6px;border-radius:50%;background:#54a47b}.kc-spacer{flex:1}.kc-hint{position:absolute;left:50%;bottom:37px;transform:translateX(-50%);padding:7px 11px;border:1px solid #dedfdd;border-radius:8px;background:#ffffffed;box-shadow:0 4px 16px #0000000a;font:10px Inter,Arial,sans-serif;color:#6d737a;white-space:nowrap;pointer-events:none}.kc-text-editor{position:fixed;z-index:1000;display:none;width:250px;padding:8px;background:#fff;border:1px solid #d7d9dc;border-radius:10px;box-shadow:0 10px 32px #0002}.kc-text-editor input{width:100%;box-sizing:border-box;border:1px solid #e0e2e5;border-radius:6px;padding:9px;font:13px Inter,Arial,sans-serif}.kc-text-editor small{display:block;color:#8a8f95;font:10px Inter,Arial,sans-serif;margin:6px 2px 0}.kc-hidden{display:none!important}
@media(max-width:800px){.kc-panel{width:154px;flex-basis:154px;padding:10px 8px}.kc-head p{display:none}}@media(max-width:580px){.kc-app{height:calc(100vh - 68px);min-height:475px}.kc-head{padding:0 7px;gap:6px}.kc-head h1{font-size:13px}.kc-actions{gap:3px}.kc-actions .kc-btn{padding:0 5px;font-size:10px}.kc-tools{width:40px;flex-basis:40px;padding:6px 2px;gap:3px}.kc-tool{width:35px;height:35px}.kc-panel{width:124px;flex-basis:124px;padding:8px 6px}.kc-topline{padding:0 6px}.kc-pad{padding:10px}.kc-hint{max-width:calc(100% - 20px);width:max-content;white-space:normal;text-align:center}}
</style></head><body>
<template id="kc-template"><main class="kc-app">
<header class="kc-head"><div class="kc-mark">K</div><div class="kc-head-main"><h1>KARP Canvas</h1><p>A quiet space for mathematical thinking</p></div><div class="kc-actions"><button class="kc-btn" id="kc-undo">↶ Undo</button><button class="kc-btn" id="kc-redo">↷ Redo</button><button class="kc-btn" id="kc-clear">Clear</button><button class="kc-btn primary" id="kc-export">Export PNG ↓</button></div></header>
<div class="kc-work"><aside class="kc-tools" aria-label="Canvas tools">
<button class="kc-tool active" data-tool="select" title="Select and move (V)"><svg viewBox="0 0 24 24"><path d="M5 3.5 18.5 14l-6.2.7-3.2 5.5Z"/></svg></button>
<button class="kc-tool" data-tool="pen" title="Pen (P)"><svg viewBox="0 0 24 24"><path d="m4 20 4.2-1L19 8.2a2.3 2.3 0 0 0-3.2-3.2L5 15.8 4 20Z"/></svg></button>
<button class="kc-tool" data-tool="highlighter" title="Highlighter (H)"><svg viewBox="0 0 24 24"><path d="m4 15 8-8 5 5-8 8H4Z M12 7l3-3 5 5-3 3M3 21h18"/></svg></button>
<button class="kc-tool" data-tool="eraser" title="Eraser (E)"><svg viewBox="0 0 24 24"><path d="m4 15 9.8-10a2 2 0 0 1 2.8 0l3.4 3.4a2 2 0 0 1 0 2.8L11 21H7Z M9 10l7 7M13 21h8"/></svg></button>
<button class="kc-tool" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M4 6V4h16v2M12 4v16M8 20h8"/></svg></button><div class="kc-sep"></div>
<button class="kc-tool" data-tool="line" title="Line"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg></button><button class="kc-tool" data-tool="arrow" title="Arrow"><svg viewBox="0 0 24 24"><path d="M4 20 20 4M9 4h11v11"/></svg></button><button class="kc-tool" data-tool="rect" title="Rectangle"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/></svg></button><button class="kc-tool" data-tool="ellipse" title="Ellipse"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6.5"/></svg></button><div class="kc-sep"></div>
<button class="kc-tool" id="kc-add-image" title="Add image or paste with Ctrl+V"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 5"/></svg></button>
</aside>
<aside class="kc-panel"><h2>Style & background</h2><label class="kc-label" for="kc-color">Stroke color</label><input class="kc-color" type="color" id="kc-color" value="#22252a">
<label class="kc-label" for="kc-width">Stroke width</label><div class="kc-row"><input class="kc-range" id="kc-width" type="range" min="1" max="12" value="3"><span class="kc-value" id="kc-width-label">3 px</span></div>
<label class="kc-label" for="kc-font">Text size</label><select class="kc-select" id="kc-font"><option value="18">Small</option><option value="26" selected>Medium</option><option value="36">Large</option><option value="48">Extra large</option></select>
<label class="kc-label" for="kc-pattern">Canvas background</label><select class="kc-select" id="kc-pattern"><option value="plain">Plain</option><option value="dots" selected>Dots</option><option value="grid">Grid</option><option value="lines">Ruled lines</option></select>
<label class="kc-label" for="kc-paper">Paper color</label><input class="kc-color" type="color" id="kc-paper" value="#ffffff">
<button class="kc-btn" id="kc-bg-image">Choose background image</button><button class="kc-btn" id="kc-bg-remove">Remove background image</button>
<input class="kc-hidden" id="kc-image-file" type="file" accept="image/*"><input class="kc-hidden" id="kc-bg-file" type="file" accept="image/*">
<p class="kc-help">Paste images with Ctrl+V. Select objects to move or resize. Delete removes the selected object.</p></aside>
<section class="kc-zone"><div class="kc-topline"><div class="kc-boardname">Untitled board</div><div class="kc-zoom"><button class="kc-btn" id="kc-zout">−</button><span class="kc-zoom-value" id="kc-zoom-label">100%</span><button class="kc-btn" id="kc-zin">+</button><button class="kc-btn" id="kc-fit">Fit</button></div></div>
<div class="kc-viewport" id="kc-viewport" tabindex="0"><div class="kc-pad"><svg id="kc-board" data-tool="select" width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" aria-label="KARP Canvas board">
<defs><pattern id="kc-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d7dbde"/></pattern><pattern id="kc-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e2e4e5"/></pattern><pattern id="kc-lines" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 27.5H28" fill="none" stroke="#dce2e9"/></pattern><marker id="kc-arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#252a31"/></marker></defs>
<rect id="kc-bg" width="1600" height="1000" fill="#fff"/><image id="kc-bg-img" x="0" y="0" width="1600" height="1000" preserveAspectRatio="xMidYMid slice" visibility="hidden"/><rect id="kc-bg-pattern" width="1600" height="1000" fill="url(#kc-dots)" pointer-events="none"/><g id="kc-items"></g><g id="kc-selection"></g></svg></div></div>
<div class="kc-status"><span class="kc-dot"></span><span id="kc-status">Saved locally</span><span class="kc-spacer"></span><span id="kc-tool-name">Select</span><span>·</span><span>Ctrl+V to paste image</span></div><div class="kc-hint" id="kc-hint">A simple space for diagrams, notes and ideas.</div></section></div>
<div class="kc-text-editor" id="kc-text-editor"><input id="kc-text-input" placeholder="Type something…"><small>Enter to add · Esc to cancel</small></div></main></template>
<script>
shell('Tools','KARP Canvas',document.getElementById('kc-template').innerHTML);
(function(){
const W=1600,H=1000,KEY='karp_canvas_v1',board=document.getElementById('kc-board'),viewport=document.getElementById('kc-viewport'),itemsEl=document.getElementById('kc-items'),selEl=document.getElementById('kc-selection'),bg=document.getElementById('kc-bg'),bgImg=document.getElementById('kc-bg-img'),bgPat=document.getElementById('kc-bg-pattern'),color=document.getElementById('kc-color'),widthInput=document.getElementById('kc-width'),fontInput=document.getElementById('kc-font'),patternInput=document.getElementById('kc-pattern'),paperInput=document.getElementById('kc-paper'),editor=document.getElementById('kc-text-editor'),textInput=document.getElementById('kc-text-input');
let state={items:[],background:{color:'#ffffff',pattern:'dots',image:null}},undoStack=[],redoStack=[],tool='select',selected=null,zoom=1,gesture=null,space=false,pan=null,textDraft=null,clipboard=null,saveTimer=0;
const names={select:'Select',pen:'Pen',highlighter:'Highlighter',eraser:'Eraser',text:'Text',line:'Line',arrow:'Arrow',rect:'Rectangle',ellipse:'Ellipse'},hints={select:'Select, move or resize objects. Ctrl+C / Ctrl+V duplicates.',pen:'Draw freely on the board.',highlighter:'Highlight an important step.',eraser:'Click an item to remove it.',text:'Click anywhere to add text.',line:'Drag to draw a line.',arrow:'Drag to draw an arrow.',rect:'Drag to draw a rectangle.',ellipse:'Drag to draw an ellipse.'};
const clone=o=>JSON.parse(JSON.stringify(o)),uid=()=>'kc_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
function setStatus(v){document.getElementById('kc-status').textContent=v||'Saved locally'}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));setStatus('Saved locally')}catch(e){setStatus('Storage full — export your board')}}function saveSoon(){setStatus('Saving…');clearTimeout(saveTimer);saveTimer=setTimeout(save,180)}
function pushUndo(){undoStack.push(clone(state));if(undoStack.length>50)undoStack.shift();redoStack=[];historyButtons()}function historyButtons(){document.getElementById('kc-undo').disabled=!undoStack.length;document.getElementById('kc-redo').disabled=!redoStack.length}
function pt(e){const r=board.getBoundingClientRect();return{x:Math.max(0,Math.min(W,(e.clientX-r.left)*W/Math.max(1,r.width))),y:Math.max(0,Math.min(H,(e.clientY-r.top)*H/Math.max(1,r.height)))}}
function svg(tag,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs||{}).forEach(([k,v])=>el.setAttribute(k,String(v)));return el}function find(i){return state.items.find(x=>x.id===i)}function pathD(ps){return ps.map((p,i)=>(i?'L':'M')+p.x.toFixed(2)+' '+p.y.toFixed(2)).join(' ')}
function bounds(it){if(it.type==='path'){const xs=it.points.map(p=>p.x),ys=it.points.map(p=>p.y);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(1,Math.max(...xs)-Math.min(...xs)),h:Math.max(1,Math.max(...ys)-Math.min(...ys))}}if(it.type==='text'){const ls=it.text.split('\n'),f=it.fontSize||26;return{x:it.x,y:it.y,w:Math.max(f*1.2,...ls.map(s=>s.length*f*.61)),h:Math.max(f*1.25,ls.length*f*1.25)}}return{x:Math.min(it.x,it.x+it.w),y:Math.min(it.y,it.y+it.h),w:Math.max(1,Math.abs(it.w)),h:Math.max(1,Math.abs(it.h))}}
function draw(it){let el;if(it.type==='path'){el=svg('path',{d:pathD(it.points),fill:'none',stroke:it.mode==='highlighter'?'#ffe45e':it.color,'stroke-width':it.mode==='highlighter'?Math.max(12,it.width*4):it.width,'stroke-opacity':it.mode==='highlighter'?'.38':1,'stroke-linecap':'round','stroke-linejoin':'round'})}else if(it.type==='line'||it.type==='arrow'){el=svg('line',{x1:it.x,y1:it.y,x2:it.x+it.w,y2:it.y+it.h,stroke:it.color,'stroke-width':it.width,'stroke-linecap':'round'});if(it.type==='arrow')el.setAttribute('marker-end','url(#kc-arrowhead)')}else if(it.type==='rect')el=svg('rect',{x:it.x,y:it.y,width:it.w,height:it.h,fill:'none',stroke:it.color,'stroke-width':it.width,rx:2});else if(it.type==='ellipse')el=svg('ellipse',{cx:it.x+it.w/2,cy:it.y+it.h/2,rx:Math.max(1,Math.abs(it.w)/2),ry:Math.max(1,Math.abs(it.h)/2),fill:'none',stroke:it.color,'stroke-width':it.width});else if(it.type==='image')el=svg('image',{x:it.x,y:it.y,width:it.w,height:it.h,href:it.data,preserveAspectRatio:'none'});else if(it.type==='text'){el=svg('text',{x:it.x,y:it.y,fill:it.color,'font-size':it.fontSize,'font-family':'Inter,Arial,sans-serif','dominant-baseline':'hanging'});it.text.split('\n').forEach((s,i)=>{const t=svg('tspan',{x:it.x,dy:i?it.fontSize*1.25:0});t.textContent=s;el.appendChild(t)})}if(el){el.dataset.itemId=it.id;itemsEl.appendChild(el)}return el}
function drawSelection(){selEl.innerHTML='';if(!selected)return;const it=find(selected);if(!it){selected=null;return}const b=bounds(it),p=7,x=b.x-p,y=b.y-p,w=b.w+2*p,h=b.h+2*p;selEl.appendChild(svg('rect',{x,y,width:w,height:h,fill:'none',stroke:'#436dc5','stroke-width':1.5,'stroke-dasharray':'5 4','pointer-events':'none'}));selEl.appendChild(svg('circle',{cx:x+w,cy:y+h,r:6,fill:'#fff',stroke:'#436dc5','stroke-width':1.8,'data-handle':'resize',cursor:'nwse-resize'}))}
function render(){bg.setAttribute('fill',state.background.color||'#fff');bgImg.setAttribute('visibility',state.background.image?'visible':'hidden');if(state.background.image)bgImg.setAttribute('href',state.background.image);else bgImg.removeAttribute('href');bgPat.setAttribute('fill',state.background.pattern==='plain'?'none':'url(#kc-'+state.background.pattern+')');patternInput.value=state.background.pattern;paperInput.value=state.background.color;itemsEl.innerHTML='';state.items.forEach(draw);drawSelection();historyButtons()}
function toolSet(t){tool=t;board.dataset.tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));document.getElementById('kc-tool-name').textContent=names[t];document.getElementById('kc-hint').textContent=hints[t]||''}
function node(i){return itemsEl.querySelector('[data-item-id="'+CSS.escape(i)+'"]')}
function addText(d,value){value=String(value||'').trim();if(!value)return;if(d.id){pushUndo();const it=find(d.id);if(it)it.text=value}else{pushUndo();const it={id:uid(),type:'text',x:d.p.x,y:d.p.y,text:value,color:color.value,fontSize:Number(fontInput.value)||26};state.items.push(it);selected=it.id}render();saveSoon()}
function openText(e,p,existing){textDraft={p,id:existing||null};editor.style.left=Math.min(innerWidth-270,Math.max(5,e.clientX+6))+'px';editor.style.top=Math.min(innerHeight-64,Math.max(5,e.clientY+6))+'px';editor.style.display='block';textInput.value=existing?find(existing)?.text||'':'';textInput.focus();textInput.select()}
function closeText(ok){if(!textDraft)return;const d=textDraft;textDraft=null;editor.style.display='none';if(ok)addText(d,textInput.value)}
function imageFile(file,isBackground){if(!file||!file.type.startsWith('image/'))return;const rd=new FileReader();rd.onload=()=>{const data=String(rd.result||'');if(isBackground){pushUndo();state.background.image=data;render();saveSoon();return}const im=new Image();im.onload=()=>{const scale=Math.min(1,500/Math.max(1,im.naturalWidth),400/Math.max(1,im.naturalHeight)),w=im.naturalWidth*scale,h=im.naturalHeight*scale,x=Math.max(0,Math.min(W-w,viewport.scrollLeft/zoom+W/2-w/2)),y=Math.max(0,Math.min(H-h,viewport.scrollTop/zoom+H/2-h/2));pushUndo();const it={id:uid(),type:'image',x,y,w,h,data};state.items.push(it);selected=it.id;render();saveSoon();toolSet('select')};im.onerror=()=>setStatus('Image could not be opened');im.src=data};rd.onerror=()=>setStatus('Image could not be read');rd.readAsDataURL(file)}
function erase(i){const n=state.items.findIndex(x=>x.id===i);if(n<0)return;pushUndo();state.items.splice(n,1);if(selected===i)selected=null;render();saveSoon()}
function moveItem(it,dx,dy){if(it.type==='path')it.points=it.points.map(p=>({x:p.x+dx,y:p.y+dy}));else{it.x+=dx;it.y+=dy}}
function resizeItem(it,b,n){const sx=n.w/Math.max(1,b.w),sy=n.h/Math.max(1,b.h),tr=p=>({x:n.x+(p.x-b.x)*sx,y:n.y+(p.y-b.y)*sy});if(it.type==='path')it.points=it.points.map(tr);else if(it.type==='text'){it.x=n.x;it.y=n.y;it.fontSize=Math.max(10,Math.min(96,it.fontSize*(sx+sy)/2))}else{it.x=n.x;it.y=n.y;it.w=n.w;it.h=n.h}}
function start(e){if(e.button===1||(space&&e.button===0)){pan={x:e.clientX,y:e.clientY,l:viewport.scrollLeft,t:viewport.scrollTop};board.setPointerCapture(e.pointerId);e.preventDefault();return}if(e.button!==0)return;const p=pt(e),t=e.target.closest&&e.target.closest('[data-item-id]'),hit=t&&t.dataset.itemId,handle=e.target.closest&&e.target.closest('[data-handle]');if(tool==='select'){if(handle&&selected){const it=find(selected);pushUndo();gesture={kind:'resize',id:it.id,start:p,b:bounds(it),node:node(it.id)};board.setPointerCapture(e.pointerId);return}if(hit){selected=hit;drawSelection();const it=find(hit);pushUndo();gesture={kind:'move',id:hit,start:p,node:node(hit)};board.setPointerCapture(e.pointerId);return}selected=null;drawSelection();return}if(tool==='eraser'){if(hit)erase(hit);return}if(tool==='text'){openText(e,p,null);return}if(tool==='pen'||tool==='highlighter'){pushUndo();const it={id:uid(),type:'path',points:[p],color:color.value,width:Number(widthInput.value),mode:tool},el=svg('path',{fill:'none',stroke:tool==='highlighter'?'#ffe45e':it.color,'stroke-width':tool==='highlighter'?Math.max(12,it.width*4):it.width,'stroke-opacity':tool==='highlighter'?'.38':1,'stroke-linecap':'round','stroke-linejoin':'round'});itemsEl.appendChild(el);gesture={kind:'path',it,el};board.setPointerCapture(e.pointerId);e.preventDefault();return}if(['line','arrow','rect','ellipse'].includes(tool)){pushUndo();const it={id:uid(),type:tool,x:p.x,y:p.y,w:0,h:0,color:color.value,width:Number(widthInput.value)},el=draw(it);gesture={kind:'shape',it,el,start:p};board.setPointerCapture(e.pointerId);e.preventDefault()}}
function shapeUpdate(el,it){if(it.type==='line'||it.type==='arrow'){el.setAttribute('x1',it.x);el.setAttribute('y1',it.y);el.setAttribute('x2',it.x+it.w);el.setAttribute('y2',it.y+it.h)}else if(it.type==='rect'){el.setAttribute('x',Math.min(it.x,it.x+it.w));el.setAttribute('y',Math.min(it.y,it.y+it.h));el.setAttribute('width',Math.abs(it.w));el.setAttribute('height',Math.abs(it.h))}else{el.setAttribute('cx',it.x+it.w/2);el.setAttribute('cy',it.y+it.h/2);el.setAttribute('rx',Math.abs(it.w)/2);el.setAttribute('ry',Math.abs(it.h)/2)}}
function moving(e){if(pan){viewport.scrollLeft=pan.l-e.clientX+pan.x;viewport.scrollTop=pan.t-e.clientY+pan.y;return}if(!gesture)return;const p=pt(e),g=gesture,dx=p.x-g.start.x,dy=p.y-g.start.y;if(g.kind==='path'){g.it.points.push(p);g.el.setAttribute('d',pathD(g.it.points))}else if(g.kind==='shape'){g.it.w=dx;g.it.h=dy;shapeUpdate(g.el,g.it)}else if(g.kind==='move')g.node?.setAttribute('transform','translate('+dx+' '+dy+')');else if(g.kind==='resize'){const b=g.b,n={x:b.x,y:b.y,w:Math.max(8,b.w+dx),h:Math.max(8,b.h+dy)};g.n=n;g.node?.setAttribute('transform','translate('+n.x+' '+n.y+') scale('+(n.w/b.w)+' '+(n.h/b.h)+') translate('+(-b.x)+' '+(-b.y)+')')}}
function ending(e){if(pan){pan=null;try{board.releasePointerCapture(e.pointerId)}catch{}return}if(!gesture)return;const g=gesture,p=pt(e),dx=p.x-g.start.x,dy=p.y-g.start.y;gesture=null;if(g.kind==='path'){if(g.it.points.length>1){state.items.push(g.it);selected=g.it.id}else{g.el.remove();undoStack.pop()}}else if(g.kind==='shape'){if(g.it.type==='rect'){g.it.x=Math.min(g.it.x,g.it.x+g.it.w);g.it.y=Math.min(g.it.y,g.it.y+g.it.h);g.it.w=Math.abs(g.it.w);g.it.h=Math.abs(g.it.h)}if(Math.abs(g.it.w)>4||Math.abs(g.it.h)>4){state.items.push(g.it);selected=g.it.id}else{g.el.remove();undoStack.pop()}}else if(g.kind==='move'){const it=find(g.id);if(it&&(Math.abs(dx)>.1||Math.abs(dy)>.1))moveItem(it,dx,dy);else{g.node?.removeAttribute('transform');undoStack.pop()}}else if(g.kind==='resize'){const it=find(g.id);if(it&&g.n)resizeItem(it,g.b,g.n)}render();saveSoon();historyButtons();try{board.releasePointerCapture(e.pointerId)}catch{}}
function undo(){if(!undoStack.length)return;redoStack.push(clone(state));state=undoStack.pop();selected=null;render();saveSoon()}function redo(){if(!redoStack.length)return;undoStack.push(clone(state));state=redoStack.pop();selected=null;render();saveSoon()}
function setZoom(z){zoom=Math.max(.35,Math.min(2.5,z));board.style.width=W*zoom+'px';board.style.height=H*zoom+'px';document.getElementById('kc-zoom-label').textContent=Math.round(zoom*100)+'%'}function fit(){setZoom(Math.max(.35,Math.min(1,(viewport.clientWidth-50)/W,(viewport.clientHeight-50)/H)));viewport.scrollLeft=0;viewport.scrollTop=0}
function duplicate(){const source=clipboard||find(selected);if(!source)return;pushUndo();const cp=clone(source);cp.id=uid();if(cp.type==='path')cp.points=cp.points.map(p=>({x:p.x+20,y:p.y+20}));else{cp.x+=20;cp.y+=20}state.items.push(cp);selected=cp.id;render();saveSoon()}
function paste(e){if(e.target.closest&&e.target.closest('input,textarea,select'))return;const its=Array.from(e.clipboardData?.items||[]),im=its.find(i=>i.type&&i.type.startsWith('image/'));if(im){const f=im.getAsFile();if(f){e.preventDefault();imageFile(f,false)}return}if(clipboard){e.preventDefault();duplicate();return}const text=e.clipboardData?.getData('text/plain')||'';if(text.trim()){e.preventDefault();const p={x:viewport.scrollLeft/zoom+W/3,y:viewport.scrollTop/zoom+H/3};pushUndo();const it={id:uid(),type:'text',x:p.x,y:p.y,text:text.trim(),color:color.value,fontSize:Number(fontInput.value)};state.items.push(it);selected=it.id;render();saveSoon()}}
function keys(e){if(e.code==='Space'&&!e.repeat&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){space=true;board.style.cursor='grab';e.preventDefault();return}const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}if(mod&&k==='y'){e.preventDefault();redo();return}if(mod&&k==='c'&&selected&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){clipboard=clone(find(selected));e.preventDefault();return}/* Ctrl+V is handled by the paste event so external images are not intercepted. */if((k==='delete'||k==='backspace')&&selected&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();erase(selected);return}if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||mod||e.altKey)return;const map={v:'select',p:'pen',h:'highlighter',e:'eraser',t:'text',l:'line',a:'arrow',r:'rect',o:'ellipse'};if(map[k])toolSet(map[k])}
function exportPng(){const xml=new XMLSerializer().serializeToString(board),blob=new Blob(['<?xml version="1.0" encoding="UTF-8"?>',xml],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');ctx.fillStyle=state.background.color||'#fff';ctx.fillRect(0,0,W,H);ctx.drawImage(img,0,0,W,H);c.toBlob(b=>{if(b){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='karp-canvas.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}},'image/png')}catch(e){setStatus('Export failed')}URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);setStatus('Export failed')};img.src=url}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>toolSet(b.dataset.tool));board.addEventListener('pointerdown',start);board.addEventListener('pointermove',moving);board.addEventListener('pointerup',ending);board.addEventListener('pointercancel',ending);board.addEventListener('dblclick',e=>{const n=e.target.closest&&e.target.closest('[data-item-id]'),it=n&&find(n.dataset.itemId);if(it&&it.type==='text')openText(e,{x:it.x,y:it.y},it.id)});
document.getElementById('kc-undo').onclick=undo;document.getElementById('kc-redo').onclick=redo;document.getElementById('kc-clear').onclick=()=>{if(confirm('Clear everything on this board?')){pushUndo();state.items=[];state.background.image=null;selected=null;render();saveSoon()}};document.getElementById('kc-export').onclick=exportPng;document.getElementById('kc-zin').onclick=()=>setZoom(zoom*1.15);document.getElementById('kc-zout').onclick=()=>setZoom(zoom/1.15);document.getElementById('kc-fit').onclick=fit;
widthInput.oninput=()=>document.getElementById('kc-width-label').textContent=widthInput.value+' px';color.onchange=()=>{const it=find(selected);if(it&&it.type!=='image'){pushUndo();it.color=color.value;render();saveSoon()}};widthInput.onchange=()=>{const it=find(selected);if(it&&it.type!=='image'){pushUndo();it.width=Number(widthInput.value);render();saveSoon()}};
patternInput.onchange=()=>{pushUndo();state.background.pattern=patternInput.value;render();saveSoon()};paperInput.onchange=()=>{pushUndo();state.background.color=paperInput.value;render();saveSoon()};
document.getElementById('kc-bg-image').onclick=()=>document.getElementById('kc-bg-file').click();document.getElementById('kc-bg-remove').onclick=()=>{if(state.background.image){pushUndo();state.background.image=null;render();saveSoon()}};document.getElementById('kc-image-file').onchange=e=>{if(e.target.files[0])imageFile(e.target.files[0],false);e.target.value=''};document.getElementById('kc-bg-file').onchange=e=>{if(e.target.files[0])imageFile(e.target.files[0],true);e.target.value=''};
textInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();closeText(true)}else if(e.key==='Escape')closeText(false)};textInput.onblur=()=>{if(textDraft)setTimeout(()=>{if(textDraft&&document.activeElement!==textInput)closeText(true)},120)};
window.addEventListener('paste',paste);window.addEventListener('keydown',keys);window.addEventListener('keyup',e=>{if(e.code==='Space'){space=false;board.style.cursor='default'}});window.addEventListener('blur',()=>{space=false;pan=null});viewport.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.08:1/1.08))}},{passive:false});
try{const r=localStorage.getItem(KEY),v=r&&JSON.parse(r);if(v&&Array.isArray(v.items)&&v.background)state=v}catch(e){console.warn(e)}render();setZoom(1);historyButtons();requestAnimationFrame(fit);window.addEventListener('resize',()=>{if(zoom<=1)fit()});
})();
