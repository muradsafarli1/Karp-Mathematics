<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Messages</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js?v=20261022chat3"></script>
<style>
:root{--wa-bg:#f5f6f4;--wa-panel:#fff;--wa-line:#e5e7e5;--wa-soft:#f0f2f0;--wa-ink:#17191c;--wa-muted:#7b8289;--wa-accent:#263b5b}
.chat-app{height:calc(100vh - 72px);min-height:650px;background:var(--wa-bg);padding:18px;box-sizing:border-box}
.chat-window{height:100%;max-width:1420px;margin:auto;display:grid;grid-template-columns:330px minmax(0,1fr) 270px;border:1px solid #dfe2df;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 14px 45px rgba(23,25,28,.07)}
.chat-left{border-right:1px solid var(--wa-line);display:flex;flex-direction:column;min-width:0;background:#fff}
.chat-brand{height:64px;padding:0 18px;border-bottom:1px solid var(--wa-line);display:flex;align-items:center;justify-content:space-between}
.chat-brand strong{font:800 20px/1 "Space Grotesk";letter-spacing:-.5px}.chat-brand span{font-size:9px;color:var(--wa-muted)}
.chat-left-tools{padding:10px;border-bottom:1px solid var(--wa-line);display:flex;gap:7px}.chat-search{flex:1;min-width:0;border:1px solid #dfe2df;border-radius:10px;background:#f7f8f7;padding:9px 11px;font:11px Inter,system-ui;outline:none}.chat-search:focus{border-color:#b8bec4}
.icon-btn,.text-btn{border:1px solid #dfe2df;background:#fff;border-radius:10px;cursor:pointer;color:#343a40}.icon-btn{width:36px;height:36px;font-size:16px}.text-btn{padding:8px 10px;font-size:10px;font-weight:800}.text-btn.primary{background:var(--wa-accent);border-color:var(--wa-accent);color:#fff}
.chat-tabs{display:flex;padding:8px 10px;gap:4px;border-bottom:1px solid var(--wa-line)}.chat-tab{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;font-size:9px;font-weight:800;color:#737a80;cursor:pointer}.chat-tab.active{background:#eef1f3;color:#1d2329}
.chat-list{overflow:auto;flex:1}.chat-row{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid #f0f1f0;cursor:pointer}.chat-row:hover,.chat-row.active{background:#f6f7f6}.chat-avatar{width:43px;height:43px;min-width:43px;border-radius:50%;overflow:hidden;background:#e7eaeb;color:#263b5b;display:grid;place-items:center;font-size:11px;font-weight:900}.chat-avatar img{width:100%;height:100%;object-fit:cover}.chat-row-main{min-width:0;flex:1}.chat-row-top{display:flex;justify-content:space-between;gap:7px}.chat-row-name{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-row-time{font-size:8px;color:#90969b;white-space:nowrap}.chat-row-preview{margin-top:4px;font-size:9px;color:#7b8289;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-unread{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:99px;background:var(--wa-accent);color:#fff;font-size:8px;font-weight:900;padding:0 4px}
.chat-main{display:grid;grid-template-rows:64px minmax(0,1fr) 64px;min-width:0;min-height:0;background:#f3f5f3;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:11px;padding:0 18px;background:#fff;border-bottom:1px solid var(--wa-line)}.chat-head-copy{min-width:0;flex:1}.chat-head-name{font-size:12px;font-weight:850}.chat-head-status{font-size:9px;color:#7b8289;margin-top:3px}.chat-head-actions{display:flex;gap:6px}
.chat-messages{overflow-y:auto;overflow-x:hidden;min-height:0;padding:22px 8%;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain;scroll-behavior:auto;background:linear-gradient(rgba(243,245,243,.96),rgba(243,245,243,.96)),radial-gradient(circle at 20% 20%,#e9ecea 1px,transparent 1px);background-size:auto,18px 18px}
.day-divider{align-self:center;margin:8px 0 10px;padding:5px 9px;border-radius:8px;background:#fff;border:1px solid #e3e6e3;color:#838a90;font-size:8px;font-weight:800}
.msg{max-width:min(72%,620px);padding:8px 10px;border-radius:10px;background:#fff;border:1px solid #e1e4e1;box-shadow:0 1px 1px rgba(0,0,0,.02);align-self:flex-start;position:relative}.msg.mine{align-self:flex-end;background:#e8edf2;border-color:#dce3e9}.msg-author{font-size:8px;color:#263b5b;font-weight:850;margin-bottom:3px}.msg-text{font-size:10px;line-height:1.6;color:#30363c;white-space:pre-wrap;overflow-wrap:anywhere}.msg-meta{font-size:7px;color:#8c9297;text-align:right;margin-top:4px}
.chat-composer{display:flex;align-items:center;min-height:64px;box-sizing:border-box;gap:8px;padding:10px 14px;background:#fff;border-top:1px solid var(--wa-line)}.chat-composer textarea{flex:1;min-width:0;height:42px;max-height:110px;resize:none;border:1px solid #dfe2df;border-radius:11px;padding:10px;font:11px Inter,system-ui;outline:none}.chat-composer textarea:focus{border-color:#b8bec4}.send-btn{width:42px;height:42px;border:0;border-radius:11px;background:var(--wa-accent);color:#fff;font-size:16px;cursor:pointer}
.chat-right{border-left:1px solid var(--wa-line);background:#fff;padding:18px;overflow:auto}.profile-card{text-align:center;padding:10px 0 18px;border-bottom:1px solid var(--wa-line)}.profile-card .chat-avatar{width:74px;height:74px;margin:auto;font-size:18px}.profile-name{font-size:13px;font-weight:850;margin-top:10px}.profile-sub{font-size:9px;color:var(--wa-muted);margin-top:4px}.detail-section{padding:17px 0;border-bottom:1px solid var(--wa-line)}.detail-title{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:#8a9095;margin-bottom:9px}.detail-line{font-size:10px;color:#454b51;line-height:1.65}.friend-chip{display:flex;align-items:center;gap:7px;padding:7px;border-radius:8px;background:#f7f8f7;margin-top:5px}.friend-chip .chat-avatar{width:25px;height:25px;min-width:25px;font-size:7px}.friend-chip span{font-size:9px;font-weight:750}
.empty-chat{height:100%;display:grid;place-items:center;text-align:center;color:#838a90;font-size:11px;padding:30px}.empty-chat strong{display:block;color:#343a40;font-size:16px;margin-bottom:5px}
.modal-back{position:fixed;inset:0;background:rgba(17,21,24,.35);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}.modal-back.open{display:flex}.chat-modal{width:min(520px,100%);max-height:min(720px,90vh);overflow:auto;background:#fff;border:1px solid #dfe2df;border-radius:16px;box-shadow:0 25px 70px rgba(0,0,0,.15)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--wa-line);display:flex;justify-content:space-between;align-items:center}.modal-head strong{font-size:14px}.modal-body{padding:15px}.modal-search{width:100%;box-sizing:border-box;border:1px solid #dfe2df;border-radius:10px;padding:10px;font:11px Inter,system-ui;margin-bottom:10px}.contact{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #edf0ed;border-radius:10px;margin:6px 0}.contact-main{flex:1;min-width:0}.contact-main strong{font-size:10px}.contact-main small{display:block;color:#858b91;font-size:8px;margin-top:2px}.contact-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.modal-foot{padding:12px 15px;border-top:1px solid var(--wa-line);display:flex;justify-content:flex-end;gap:6px}
.group-picks{display:grid;gap:5px;max-height:300px;overflow:auto}.group-pick{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #edf0ed;border-radius:8px}.group-pick input{margin-left:auto}
@media(max-width:1050px){.chat-window{grid-template-columns:290px minmax(0,1fr)}.chat-right{display:none}}
@media(max-width:700px){.chat-app{padding:0;height:calc(100vh - 62px)}.chat-window{border-radius:0;border:0;grid-template-columns:1fr}.chat-left{display:none}.chat-window.mobile-list .chat-left{display:flex}.chat-window.mobile-list .chat-main{display:none}.chat-main{height:calc(100vh - 62px)}.chat-messages{padding:16px 5%}.msg{max-width:84%}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="/">KARP</a><nav class="navlinks"><a href="/problems.html">Problems</a><a href="/contests.html">Contests</a><a href="/exams.html">Exams</a><a href="/daily-problem.html">Daily Problem</a><a href="/mock.html">Mocks</a><a href="/books.html">Books</a><a href="/videos.html">Videos</a><a href="/journal.html">Journal</a><a href="/meetings.html">Meetings</a><a class="active" href="/chat.html">Chat</a><a href="/about.html">About</a></nav><div class="actions" id="nav-actions"><a class="btn ghost" href="/login.html">Login</a><a class="btn primary" href="/signup.html">Join Us</a></div></div></header>
<main class="chat-app"><div class="chat-window" id="chat-window">
<aside class="chat-left"><div class="chat-brand"><div><strong>Messages</strong><span style="display:block;margin-top:4px">KARP community</span></div><button class="icon-btn" id="profileBtn" title="Profile">⋯</button></div>
<div class="chat-left-tools"><input id="chatSearch" class="chat-search" placeholder="Search conversations"><button class="icon-btn" id="newChat" title="New chat">＋</button></div>
<div class="chat-tabs"><button class="chat-tab active" data-list="chats">Chats</button><button class="chat-tab" data-list="friends">Friends</button><button class="chat-tab" data-list="requests">Requests</button></div>
<div class="chat-list" id="chatList"></div></aside>
<section class="chat-main"><div class="chat-head"><button class="icon-btn" id="backMobile" style="display:none">‹</button><div class="chat-avatar" id="headAvatar">K</div><div class="chat-head-copy"><div class="chat-head-name" id="headName">KARP Messages</div><div class="chat-head-status" id="headStatus">Private conversations for KARP members</div></div><div class="chat-head-actions"><button class="text-btn" id="inviteBtn">Invite</button><button class="text-btn" id="infoBtn">Info</button></div></div>
<div class="chat-messages" id="messages"><div class="empty-chat"><div><strong>Your messages</strong>Select a conversation or start a new one.</div></div></div>
<div class="chat-composer"><textarea id="composer" placeholder="Write a message…" disabled></textarea><button class="send-btn" id="send" disabled>➤</button></div></section>
<aside class="chat-right" id="details"><div class="empty-chat"><div><strong>KARP Messages</strong>Choose a conversation to see its details.</div></div></aside>
</div></main>
<div class="modal-back" id="modal"><div class="chat-modal"><div class="modal-head"><strong id="modalTitle">New chat</strong><button class="icon-btn" id="modalClose">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<script>
(async()=>{
const {db,auth}=await import('/karp-firebase.js');
const fs=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
const au=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js');
const {collection,doc,getDoc,getDocs,query,where,orderBy,limit,onSnapshot,addDoc,setDoc,updateDoc,serverTimestamp}=fs;
let user=null,meProfile={},conversations=[],friends=[],incoming=[],outgoing=[],selected=null,messages=[],unsubConv=null,unsubMsg=null,listMode='chats';
const esc=window.escapeHtml||((x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const verified=()=>!!user&&user.emailVerified===true;
function updateChatNav(u){
  const box=document.getElementById('nav-actions');
  if(!box)return;
  if(!u){
    box.innerHTML='<a class="btn ghost" href="/login.html">Login</a><a class="btn primary" href="/signup.html">Join Us</a>';
    return;
  }
  const name=String(u.displayName||u.email||'KARP Member').trim();
  const initial=esc(name.charAt(0).toUpperCase()||'K');
  const img=u.photoURL?'<img src="'+esc(u.photoURL)+'" alt="" style="width:32px;height:32px;border-radius:50%;object-fit:cover">':'<span style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e8edf2;color:#263b5b;font-weight:900">'+initial+'</span>';
  box.innerHTML='<a href="/account.html" aria-label="Account" title="Account" style="display:flex;align-items:center">'+img+'</a>';
}
const displayName=()=>String(meProfile.name||user?.displayName||(user?.email||'').split('@')[0]||'KARP Member').slice(0,100);
const photo=()=>String(meProfile.photoURL||user?.photoURL||'');
const avatar=(name,url,cls='chat-avatar')=>'<span class="'+cls+'">'+(url?'<img src="'+esc(url)+'" alt="">':esc(String(name||'K').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'K'))+'</span>';
const fmt=v=>{if(!v)return'';const d=v?.toDate?v.toDate():new Date(v);if(Number.isNaN(d.getTime()))return'';const n=new Date(),same=d.toDateString()===n.toDateString();return same?d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([], {day:'2-digit',month:'short'})};
const modal=(title,body,foot='')=>{document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot;document.getElementById('modal').classList.add('open')};
const closeModal=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('modalClose').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function requireUser(){if(!verified()){window.showAuthPrompt?.('Sign in to use Messages','Create or verify your KARP account to send messages and connect with other members.');return false}return true}
async function loadProfile(){if(!user)return;try{const s=await getDoc(doc(db,'publicProfiles',user.uid));if(s.exists())meProfile=s.data()||{};else{meProfile={uid:user.uid,name:displayName(),nameLower:displayName().toLowerCase(),photoURL:photo()};await setDoc(doc(db,'publicProfiles',user.uid),{...meProfile,updatedAt:new Date().toISOString()},{merge:true})}}catch(e){console.warn(e)}}
async function loadFriends(){if(!user)return;try{const s=await getDocs(query(collection(db,'friendships'),where('members','array-contains',user.uid)));friends=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>Array.isArray(x.members)&&x.members.includes(user.uid));}catch(e){console.warn('friends',e);friends=[]}}
async function loadRequests(){if(!user)return;try{const [a,b]=await Promise.all([getDocs(query(collection(db,'friendRequests'),where('toUid','==',user.uid))),getDocs(query(collection(db,'friendRequests'),where('fromUid','==',user.uid)))]);incoming=a.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending');outgoing=b.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending')}catch(e){console.warn('requests',e);incoming=[];outgoing=[]}}
async function loadConversations(){if(!user)return;try{const s=await getDocs(query(collection(db,'conversations'),where('members','array-contains',user.uid)));conversations=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>Date.parse(b.updatedAt||b.createdAt||0)-Date.parse(a.updatedAt||a.createdAt||0))}catch(e){console.warn('conversations',e);conversations=[]}}
async function hydratePeople(ids){const map=new Map();await Promise.all([...new Set(ids.filter(Boolean))].map(async id=>{try{const s=await getDoc(doc(db,'publicProfiles',id));if(s.exists())map.set(id,{uid:id,...s.data()})}catch{}}));return map}
function otherId(c){return c.type==='direct'?c.members.find(x=>x!==user.uid)||'':''}
async function conversationPeople(){const ids=[];conversations.forEach(c=>c.members?.forEach(id=>{if(id!==user.uid)ids.push(id)}));friends.forEach(f=>f.members?.forEach(id=>{if(id!==user.uid)ids.push(id)}));incoming.forEach(r=>{if(r.fromUid&&r.fromUid!==user.uid)ids.push(r.fromUid)});outgoing.forEach(r=>{if(r.toUid&&r.toUid!==user.uid)ids.push(r.toUid)});return hydratePeople(ids)}
let people=new Map();
async function renderList(){const list=document.getElementById('chatList');people=await conversationPeople();const q=(document.getElementById('chatSearch').value||'').trim().toLowerCase();let html='';
if(listMode==='requests'){html=incoming.length?incoming.map(r=>{const p=people.get(r.fromUid)||{};return '<div class="contact" style="margin:8px"><div>'+avatar(p.name||'K',p.photoURL)+'</div><div class="contact-main"><strong>'+esc(p.name||'KARP Member')+'</strong><small>Wants to connect with you</small></div><div class="contact-actions"><button class="text-btn primary" data-accept="'+r.id+'">Accept</button><button class="text-btn" data-reject="'+r.id+'">Decline</button></div></div>'}).join(''):'<div class="empty-chat"><div>No pending requests.</div></div>'}
else if(listMode==='friends'){const arr=friends.map(f=>{const id=f.members.find(x=>x!==user.uid),p=people.get(id)||{};return{id,p}}).filter(x=>!q||String(x.p.name||'').toLowerCase().includes(q));html=arr.length?arr.map(x=>'<div class="chat-row" data-person="'+x.id+'">'+avatar(x.p.name,x.p.photoURL)+'<div class="chat-row-main"><div class="chat-row-top"><span class="chat-row-name">'+esc(x.p.name||'KARP Member')+'</span></div><div class="chat-row-preview">Friend · tap to message</div></div></div>').join(''):'<div class="empty-chat"><div>No friends yet.<br>Use ＋ to find KARP members.</div></div>'}
else{const arr=conversations.filter(c=>{const p=c.type==='direct'?people.get(otherId(c)):null;const name=c.type==='group'?c.name:(p?.name||'KARP Member');return !q||name.toLowerCase().includes(q)});html=arr.length?arr.map(c=>{const p=c.type==='direct'?people.get(otherId(c)):null,name=c.type==='group'?c.name:(p?.name||'KARP Member'),url=c.type==='group'?'':p?.photoURL;return '<div class="chat-row '+(selected?.id===c.id?'active':'')+'" data-conv="'+c.id+'">'+avatar(name,url)+'<div class="chat-row-main"><div class="chat-row-top"><span class="chat-row-name">'+esc(name)+'</span><span class="chat-row-time">'+esc(fmt(c.updatedAt||c.createdAt))+'</span></div><div class="chat-row-preview">'+esc(c.lastMessage||'No messages yet')+'</div></div></div>'}).join(''):'<div class="empty-chat"><div><strong>No conversations</strong>Start a new chat with a KARP friend.</div></div>'}
list.innerHTML=html;
list.querySelectorAll('[data-conv]').forEach(x=>x.onclick=()=>openConversation(x.dataset.conv));
list.querySelectorAll('[data-person]').forEach(x=>x.onclick=()=>startDirect(x.dataset.person));
list.querySelectorAll('[data-accept]').forEach(x=>x.onclick=()=>acceptRequest(x.dataset.accept));
list.querySelectorAll('[data-reject]').forEach(x=>x.onclick=()=>rejectRequest(x.dataset.reject));
}
async function openConversation(id){const c=conversations.find(x=>x.id===id);if(!c)return;selected=c;if(unsubMsg)unsubMsg();document.getElementById('headName').textContent=c.type==='group'?c.name:(people.get(otherId(c))?.name||'KARP Member');const p=c.type==='direct'?people.get(otherId(c)):null;document.getElementById('headAvatar').outerHTML=avatar(c.type==='group'?c.name:(p?.name||'K'),c.type==='direct'?p?.photoURL:'','chat-avatar');document.getElementById('headStatus').textContent=c.type==='group'?((c.members?.length||0)+' members'):'Private conversation';document.getElementById('composer').disabled=false;document.getElementById('send').disabled=false;renderDetails(c,p);document.getElementById('chat-window').classList.remove('mobile-list');const mq=window.matchMedia('(max-width:700px)');if(mq.matches)document.getElementById('backMobile').style.display='grid';unsubMsg=onSnapshot(query(collection(db,'conversations',id,'messages'),orderBy('createdAt','asc'),limit(500)),s=>{messages=s.docs.map(d=>({id:d.id,...d.data()}));renderMessages()});}
function renderMessages(){const e=document.getElementById('messages');if(!messages.length){e.innerHTML='<div class="empty-chat"><div><strong>No messages yet</strong>Start the conversation.</div></div>';return}let last='';e.innerHTML=messages.map(m=>{const d=m.createdAt?.toDate?m.createdAt.toDate():new Date(m.createdAt||Date.now()),day=d.toLocaleDateString([], {day:'numeric',month:'long',year:'numeric'}),divider=day!==last?(last=day?'<div class="day-divider">'+esc(day)+'</div>':''):'';return divider+'<div class="msg '+(m.senderId===user.uid?'mine':'')+'">'+(selected?.type==='group'&&m.senderId!==user.uid?'<div class="msg-author">'+esc(m.senderName||'KARP Member')+'</div>':'')+'<div class="msg-text">'+esc(m.text||'')+'</div><div class="msg-meta">'+esc(fmt(m.createdAt))+'</div></div>'}).join('');e.scrollTop=e.scrollHeight}
async function renderDetails(c,p){const ids=(c.members||[]).filter(x=>x!==user.uid),mp=await hydratePeople(ids);document.getElementById('details').innerHTML='<div class="profile-card">'+avatar(c.type==='group'?c.name:(p?.name||'KARP Member'),p?.photoURL)+'<div class="profile-name">'+esc(c.type==='group'?c.name:(p?.name||'KARP Member'))+'</div><div class="profile-sub">'+(c.type==='group'?'KARP group':'KARP member')+'</div></div><div class="detail-section"><div class="detail-title">Members</div>'+ids.map(id=>{const x=mp.get(id)||{};return '<div class="friend-chip">'+avatar(x.name||'K',x.photoURL)+'<span>'+esc(x.name||'KARP Member')+'</span></div>'}).join('')+'</div><div class="detail-section"><div class="detail-title">Actions</div><button class="text-btn" style="width:100%;margin-bottom:7px" id="detailInvite">Invite to KARP</button>'+(c.type==='direct'?'<button class="text-btn" style="width:100%" id="detailGroup">Create group with this person</button>':'')+'</div>';document.getElementById('detailInvite').onclick=invite;document.getElementById('detailGroup')?.addEventListener('click',()=>openGroup([otherId(c)]))}
async function sendMessage(){if(!requireUser()||!selected)return;const e=document.getElementById('composer'),text=e.value.trim();if(!text)return;e.value='';try{await addDoc(collection(db,'conversations',selected.id,'messages'),{senderId:user.uid,senderName:displayName(),senderPhoto:photo(),text,createdAt:serverTimestamp()});await updateDoc(doc(db,'conversations',selected.id),{lastMessage:text.slice(0,180),lastSenderId:user.uid,updatedAt:new Date().toISOString()})}catch(err){e.value=text;alert(err.message||'Could not send message.')} }
document.getElementById('send').onclick=sendMessage;document.getElementById('composer').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};document.getElementById('chatSearch').oninput=renderList;
async function startDirect(uid){if(!requireUser())return;await loadFriends();const friend=friends.some(f=>f.members?.includes(uid));if(!friend){modal('Connect first','<p style="font-size:11px;line-height:1.6;color:#555d65">You can message members after you are connected.</p>','<button class="text-btn" id="modalFind">Find & connect</button>');document.getElementById('modalFind').onclick=()=>openNewChat();return}const id=[user.uid,uid].sort().join('_');try{await setDoc(doc(db,'conversations',id),{type:'direct',status:'accepted',members:[user.uid,uid].sort(),createdBy:user.uid,updatedAt:new Date().toISOString(),lastMessage:''},{merge:true});await loadConversations();await renderList();openConversation(id)}catch(e){alert(e.message||'Could not start chat.')}}
async function acceptRequest(id){if(!requireUser())return;const r=incoming.find(x=>x.id===id);if(!r)return;try{await updateDoc(doc(db,'friendRequests',id),{status:'accepted',respondedAt:new Date().toISOString()});const fid=[user.uid,r.fromUid].sort().join('_');await setDoc(doc(db,'friendships',fid),{members:[user.uid,r.fromUid].sort(),status:'accepted',requestId:id,createdAt:new Date().toISOString()},{merge:true});await loadFriends();await loadRequests();listMode='friends';await renderList()}catch(e){alert(e.message||'Could not accept request.')}}
async function rejectRequest(id){const r=incoming.find(x=>x.id===id);if(!r)return;try{await updateDoc(doc(db,'friendRequests',id),{status:'rejected',respondedAt:new Date().toISOString()});await loadRequests();renderList()}catch(e){alert(e.message||'Could not decline request.')}}
async function openNewChat(){if(!requireUser())return;modal('New conversation','<input id="peopleSearch" class="modal-search" placeholder="Search KARP members by name…"><div id="peopleResults"><div style="font-size:10px;color:#7b8289">Search for a member to connect.</div></div>');const input=document.getElementById('peopleSearch');let timer;input.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>searchPeople(input.value),180)};input.focus();searchPeople('')}
async function searchPeople(term){const box=document.getElementById('peopleResults');if(!box)return;try{const s=await getDocs(query(collection(db,'publicProfiles'),limit(200)));const q=term.trim().toLowerCase();const arr=s.docs.map(d=>({uid:d.id,...d.data()})).filter(p=>p.uid!==user.uid&&(!q||String(p.name||'').toLowerCase().includes(q)||String(p.email||'').toLowerCase().includes(q))).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'en',{sensitivity:'base'})).slice(0,50);const friendIds=new Set(friends.flatMap(f=>f.members||[]));box.innerHTML=arr.length?arr.map(p=>{const isFriend=friendIds.has(p.uid),pendingIn=incoming.some(r=>r.fromUid===p.uid),pendingOut=outgoing.some(r=>r.toUid===p.uid);return '<div class="contact">'+avatar(p.name,p.photoURL)+'<div class="contact-main"><strong>'+esc(p.name||'KARP Member')+'</strong><small>KARP member</small></div><div class="contact-actions">'+(isFriend?'<button class="text-btn primary" data-open-person="'+p.uid+'">Message</button>':pendingIn?'<button class="text-btn" data-accept="'+(incoming.find(r=>r.fromUid===p.uid)?.id||'')+'">Accept</button>':pendingOut?'<button class="text-btn">Invited</button>':'<button class="text-btn primary" data-add="'+p.uid+'">Connect</button>')+'</div></div>'}).join(''):'<div style="padding:18px;text-align:center;font-size:10px;color:#7b8289">No members found.</div>';box.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>sendRequest(b.dataset.add));box.querySelectorAll('[data-open-person]').forEach(b=>{closeModal();startDirect(b.dataset.openPerson)});box.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>{closeModal();acceptRequest(b.dataset.accept)})}catch(e){box.innerHTML='<div style="font-size:10px;color:#9b2c2c">Could not load members.</div>'}}
async function sendRequest(uid){if(!requireUser())return;const id=user.uid+'_'+uid+'_'+Date.now().toString(36);try{await setDoc(doc(db,'friendRequests',id),{fromUid:user.uid,toUid:uid,status:'pending',createdAt:new Date().toISOString()});await loadRequests();await searchPeople(document.getElementById('peopleSearch')?.value||'')}catch(e){alert(e.message||'Could not send request.')}}
function invite(){const url=location.origin+'/signup.html?invite='+encodeURIComponent(user?.uid||'');navigator.clipboard?.writeText(url).then(()=>alert('Invite link copied.')).catch(()=>window.prompt('Copy this invite link:',url))}
function openGroup(initial=[]){if(!requireUser())return;const friendIds=[...new Set(friends.flatMap(f=>f.members||[]).filter(id=>id!==user.uid))];modal('New group','<input id="groupName" class="modal-search" placeholder="Group name"><div class="group-picks">'+friendIds.map(id=>{const p=people.get(id)||{};return '<label class="group-pick">'+avatar(p.name,p.photoURL)+'<span style="font-size:10px;font-weight:750">'+esc(p.name||'KARP Member')+'</span><input type="checkbox" value="'+id+'" '+(initial.includes(id)?'checked':'')+'></label>'}).join('')+'</div>','<button class="text-btn" id="groupCancel">Cancel</button><button class="text-btn primary" id="groupCreate">Create group</button>');document.getElementById('groupCancel').onclick=closeModal;document.getElementById('groupCreate').onclick=async()=>{const name=document.getElementById('groupName').value.trim();const ids=[...document.querySelectorAll('.group-pick input:checked')].map(x=>x.value);if(!name||!ids.length)return;const members=[user.uid,...ids];try{const r=await addDoc(collection(db,'conversations'),{type:'group',status:'accepted',members,createdBy:user.uid,name,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),lastMessage:''});closeModal();await loadConversations();await renderList();openConversation(r.id)}catch(e){alert(e.message||'Could not create group.')}}}
document.getElementById('newChat').onclick=openNewChat;document.getElementById('inviteBtn').onclick=invite;document.getElementById('infoBtn').onclick=()=>{if(selected){const p=selected.type==='direct'?people.get(otherId(selected)):null;renderDetails(selected,p)}else invite()};document.getElementById('profileBtn').onclick=()=>{if(!verified())return requireUser();modal('Your KARP profile','<div class="profile-card" style="border:0">'+avatar(displayName(),photo())+'<div class="profile-name">'+esc(displayName())+'</div><div class="profile-sub">'+esc(user.email||'')+'</div></div>','<button class="text-btn" id="closeProfile">Close</button>');document.getElementById('closeProfile').onclick=closeModal};document.getElementById('backMobile').onclick=()=>document.getElementById('chat-window').classList.add('mobile-list');
document.querySelectorAll('.chat-tab').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.chat-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');listMode=b.dataset.list;await renderList()});
au.onAuthStateChanged(auth,async u=>{user=u||null;updateChatNav(user);if(!verified()){document.getElementById('composer').disabled=true;document.getElementById('send').disabled=true;document.getElementById('chatList').innerHTML='<div class="empty-chat"><div><strong>Sign in to Messages</strong>Create or verify your KARP account to connect with other members.</div></div>';return}await loadProfile();await loadFriends();await loadRequests();await loadConversations();await renderList()});
})();
</script>
</body></html>
