.modal-back{position:fixed;inset:0;background:rgba(17,21,24,.35);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}.modal-back.open{display:flex}.chat-modal{width:min(520px,100%);max-height:min(720px,90vh);overflow:auto;background:#fff;border:1px solid #dfe2df;border-radius:16px;box-shadow:0 25px 70px rgba(0,0,0,.15)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--wa-line);display:flex;justify-content:space-between;align-items:center}.modal-head strong{font-size:14px}.modal-body{padding:15px}.modal-search{width:100%;box-sizing:border-box;border:1px solid #dfe2df;border-radius:10px;padding:10px;font:11px Inter,system-ui;margin-bottom:10px}.contact{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #edf0ed;border-radius:10px;margin:6px 0}.contact-main{flex:1;min-width:0}.contact-main strong{font-size:10px}.contact-main small{display:block;color:#858b91;font-size:8px;margin-top:2px}.contact-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.modal-foot{padding:12px 15px;border-top:1px solid var(--wa-line);display:flex;justify-content:flex-end;gap:6px}
.group-picks{display:grid;gap:5px;max-height:300px;overflow:auto}.group-pick{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #edf0ed;border-radius:8px}.group-pick input{margin-left:auto}

<script>
(async()=>{
const {db,auth}=await import('/karp-firebase.js');
const fs=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
const au=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js');
const {collection,doc,getDoc,getDocs,query,where,orderBy,limit,limitToLast,onSnapshot,addDoc,setDoc,updateDoc,deleteDoc,increment,serverTimestamp}=fs;
let user=null,meProfile={},conversations=[],friends=[],incoming=[],outgoing=[],selected=null,messages=[],unsubConv=null,unsubMsg=null,unsubIncoming=null,unsubOutgoing=null,listMode='chats',sendingMessage=false;
const presenceUnsubs=new Map(),presenceByUid=new Map(),unreadMessageUnsubs=new Map(),liveUnreadByConversation=new Map(),unreadInitialized=new Set(),persistedUnreadByConversation=new Map();
let searchPresenceIds=new Set();
let presenceRenderTimer=null;
const esc=window.escapeHtml||((x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const signedIn=()=>!!user;
function updateChatNav(u){
  const box=document.getElementById('nav-actions');
  if(!box)return;
  if(!u){
    box.innerHTML='<a class="btn ghost" href="/login.html">Login</a><a class="btn primary" href="/signup.html">Join Us</a>';
    return;
  }
  const name=String(meProfile.name||u.displayName||'Member').trim();
  const initial=esc(name.charAt(0).toUpperCase()||'K');
  // KARP's saved profile photo is authoritative here; Firebase Auth photoURL
  // may be the user's Google/Gmail avatar rather than the KARP account image.
  const profilePhoto=String(meProfile.photoURL||'').trim();
  const img=profilePhoto?'<img src="'+esc(profilePhoto)+'" alt="" style="width:32px;height:32px;border-radius:50%;object-fit:cover">':'<span style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e8edf2;color:#263b5b;font-weight:900">'+initial+'</span>';
  box.innerHTML='<a href="/account.html" aria-label="Account" title="Account" style="display:flex;align-items:center">'+img+'</a>';
}
const displayName=()=>String(meProfile.name||user?.displayName||'KARP Member').slice(0,100);
const photo=()=>String(meProfile.photoURL||'');
const avatar=(name,url,cls='chat-avatar')=>'<span class="'+cls+'">'+(url?'<img src="'+esc(url)+'" alt="">':esc(String(name||'K').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'K'))+'</span>';
const fmt=v=>{if(!v)return'';const d=v?.toDate?v.toDate():new Date(v);if(Number.isNaN(d.getTime()))return'';const n=new Date(),same=d.toDateString()===n.toDateString();return same?d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([], {day:'2-digit',month:'short'})};
const modal=(title,body,foot='')=>{document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot;document.getElementById('modal').classList.add('open')};
const closeModal=()=>{document.getElementById('modal').classList.remove('open');searchPresenceIds.clear();if(user)syncPresenceListeners(trackedPersonIds());};
document.getElementById('modalClose').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function requireUser(){if(!signedIn()){window.showAuthPrompt?.('Sign in to KARP','Sign in to send messages and connect with KARP members.');return false}return true}
function chatErrorMessage(error,fallback='This action could not be completed.'){
  const message=String(error?.message||''),code=String(error?.code||'').toLowerCase(),lower=message.toLowerCase();
  if(code==='permission-denied'||lower.includes('missing or insufficient permissions')||lower.includes('permission-denied')||lower.includes('permission denied')){
    return 'This action could not be completed. Refresh the page and try again.';
  }
  return message||fallback;
}
async function loadProfile(){if(!user)return;try{const s=await getDoc(doc(db,'publicProfiles',user.uid));if(s.exists())meProfile=s.data()||{};else{meProfile={uid:user.uid,name:displayName(),nameLower:displayName().toLowerCase(),photoURL:photo()};await setDoc(doc(db,'publicProfiles',user.uid),{...meProfile,updatedAt:new Date().toISOString()},{merge:true})}}catch(e){console.warn(e)}}
async function loadFriends(){
  if(!user)return;
  const uid=user.uid;
  const map=new Map();
  try{
    const s=await getDocs(query(collection(db,'friendships'),where('members','array-contains',uid)));
    s.docs.forEach(d=>{
      const x={id:d.id,...d.data()};
      if(x.status==='accepted'&&Array.isArray(x.members)&&x.members.includes(uid))map.set(d.id,x);
    });
  }catch(e){console.warn('friendship list read',e)}

  // Accepted requests are the source of truth for the connection as well.
  // This keeps the contact visible even if a friendship document was delayed or missing.
  try{
    const [inSnap,outSnap]=await Promise.all([
      getDocs(query(collection(db,'friendRequests'),where('toUid','==',uid))),
      getDocs(query(collection(db,'friendRequests'),where('fromUid','==',uid)))
    ]);
    [...inSnap.docs,...outSnap.docs].forEach(d=>{
      const r={id:d.id,...d.data()};
      if(r.status!=='accepted'||!r.fromUid||!r.toUid||r.fromUid===r.toUid)return;
      const members=[r.fromUid,r.toUid].sort();
      const fid=members.join('_');
      if(!map.has(fid))map.set(fid,{id:fid,members,status:'accepted',requestId:r.id,createdAt:r.createdAt||new Date().toISOString()});
    });
  }catch(e){console.warn('accepted request friend fallback',e)}

  friends=[...map.values()];
}
async function loadRequests(){
  if(!user)return;
  if(unsubIncoming){unsubIncoming();unsubIncoming=null}
  if(unsubOutgoing){unsubOutgoing();unsubOutgoing=null}
  const inQ=query(collection(db,'friendRequests'),where('toUid','==',user.uid));
  const outQ=query(collection(db,'friendRequests'),where('fromUid','==',user.uid));
  return new Promise(resolve=>{
    let incomingReady=false,outgoingReady=false,resolved=false;
    const finish=()=>{if(incomingReady&&outgoingReady&&!resolved){resolved=true;resolve()}};
    unsubIncoming=onSnapshot(inQ,s=>{
      incoming=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending');
      incomingReady=true;finish();
      refreshRequestViews().catch(e=>console.warn('refresh incoming request view',e));
    },e=>{console.error('incoming requests listener',e);incomingReady=true;finish()});
    unsubOutgoing=onSnapshot(outQ,s=>{
      outgoing=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending');
      outgoingReady=true;finish();
      refreshRequestViews().catch(e=>console.warn('refresh outgoing request view',e));
    },e=>{console.error('outgoing requests listener',e);outgoingReady=true;finish()});
  });
}
async function refreshRequestsFromServer(){
  if(!user)return;
  const uid=user.uid;
  const [inSnap,outSnap]=await Promise.all([
    getDocs(query(collection(db,'friendRequests'),where('toUid','==',uid))),
    getDocs(query(collection(db,'friendRequests'),where('fromUid','==',uid)))
  ]);
  if(!user||user.uid!==uid)return;
  incoming=inSnap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending');
  outgoing=outSnap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending');
  await refreshRequestViews();
}
async function refreshRequestViews(){
  if(!user)return;
  await renderList().catch(e=>console.warn('render request view',e));
  const search=document.getElementById('peopleSearch');
  if(search)await searchPeople(search.value).catch(e=>console.warn('refresh member search',e));
}
async function repairAcceptedRelationships(){
  if(!user)return;
  const uid=user.uid;
  try{
    const [inSnap,outSnap]=await Promise.all([
      getDocs(query(collection(db,'friendRequests'),where('toUid','==',uid))),
      getDocs(query(collection(db,'friendRequests'),where('fromUid','==',uid)))
    ]);
    if(!user||user.uid!==uid)return;
    const accepted=new Map();
    [...inSnap.docs,...outSnap.docs].forEach(d=>{
      const r={id:d.id,...d.data()};
      if(r.status==='accepted'&&r.fromUid&&r.toUid&&r.fromUid!==r.toUid)accepted.set(r.id,r);
    });
    const known=new Set(friends.map(f=>f.id));
    for(const r of accepted.values()){
      if(!user||user.uid!==uid)return;
      const members=[r.fromUid,r.toUid].sort();
      const fid=members.join('_');
      if(!known.has(fid)){
        try{
          await setDoc(doc(db,'friendships',fid),{
            members,status:'accepted',requestId:r.id,createdAt:r.createdAt||new Date().toISOString()
          },{merge:true});
          known.add(fid);
        }catch(e){console.warn('repair accepted KARP friendship; will try the accepted request fallback',r.id,e)}
      }
      // Leave conversation creation lazy. Selecting this friend or accepting
      // the request creates/repairs the direct chat; rewriting every accepted
      // conversation at every login caused unnecessary Firestore traffic.
    }
  }catch(e){console.warn('scan accepted KARP requests',e)}
}
async function ensureDirectConversation(otherUid){
  if(!user||!otherUid||otherUid===user.uid)throw new Error('Invalid conversation members.');
  const members=[user.uid,otherUid].sort();
  const id=members.join('_');
  const stage=(name,fn)=>Promise.resolve().then(fn).catch(error=>{
    try{error.karpStage=name}catch{}
    console.error('KARP private-chat step failed: '+name,error);
    throw error;
  });

  // Use the accepted relationship already verified by loadFriends(). This
  // avoids querying the entire friendships collection again when opening a chat.
  let friend=friends.find(item=>
    item.status==='accepted'
    &&item.id===id
    &&Array.isArray(item.members)
    &&members.every(member=>item.members.includes(member))
  );
  let friendRequestId=String(friend?.requestId||'');

  // If no cached accepted relationship exists, verify the accepted request
  // directly. The document is included in the direct-conversation write so
  // the Firestore rule can validate the exact pair even if a legacy friendship
  // document was not saved correctly.
  if(!friend){
    const requests=await stage('checking the accepted connection',async()=>{
      const [inSnap,outSnap]=await Promise.all([
        getDocs(query(collection(db,'friendRequests'),where('toUid','==',user.uid))),
        getDocs(query(collection(db,'friendRequests'),where('fromUid','==',user.uid)))
      ]);
      return [...inSnap.docs,...outSnap.docs].map(d=>({id:d.id,...d.data()}));
    });
    const accepted=requests.find(r=>r.status==='accepted'&&(
      (r.fromUid===user.uid&&r.toUid===otherUid)
      ||(r.toUid===user.uid&&r.fromUid===otherUid)
    ));
    if(!accepted)throw new Error('This member is not connected to you yet.');
    friendRequestId=accepted.id;
    friend={id,members,status:'accepted',requestId:accepted.id,createdAt:accepted.createdAt||new Date().toISOString()};
    friends=[...friends.filter(item=>item.id!==id),friend];
  }

  const conversationRef=doc(db,'conversations',id);
  let existing=null,readSucceeded=false;
  try{
    existing=await stage('reading the private conversation',()=>getDoc(conversationRef));
    readSucceeded=true;
  }catch(error){
    // A legacy document with stale member metadata may not be readable under
    // member-only rules. The following write can repair it only when the
    // request is accepted or the friendship is accepted.
    if(error?.code!=='permission-denied')throw error;
  }
  if(existing?.exists()){
    const saved=existing.data()||{};
    const valid=saved.type==='direct'
      &&saved.status==='accepted'
      &&Array.isArray(saved.members)
      &&saved.members.length===2
      &&members.every(member=>saved.members.includes(member));
    if(valid){
      const at=conversations.findIndex(item=>item.id===id);
      const local={id,...saved};
      if(at>=0)conversations[at]={...conversations[at],...local};
      else conversations.unshift(local);
      return id;
    }
  }

  // A few legacy friendships lack requestId. Fetch it when possible, without
  // making this auxiliary lookup a blocker if the friendship itself is valid.
  if(!friendRequestId){
    try{
      const [inSnap,outSnap]=await stage('checking the accepted invitation reference',async()=>{
        return await Promise.all([
          getDocs(query(collection(db,'friendRequests'),where('toUid','==',user.uid))),
          getDocs(query(collection(db,'friendRequests'),where('fromUid','==',user.uid)))
        ]);
      });
      const accepted=[...inSnap.docs,...outSnap.docs].map(d=>({id:d.id,...d.data()})).find(r=>
        r.status==='accepted'&&(
          (r.fromUid===user.uid&&r.toUid===otherUid)
          ||(r.toUid===user.uid&&r.fromUid===otherUid)
        )
      );
      if(accepted)friendRequestId=accepted.id;
    }catch(requestLookupError){
      console.warn('Could not resolve the legacy friendship request ID; the accepted friendship rule will still be used:',requestLookupError);
    }
  }

  const now=new Date().toISOString();
  const patch={
    type:'direct',
    status:'accepted',
    members,
    ...(friendRequestId?{friendRequestId}:{})
  };
  if(readSucceeded&&!existing?.exists()){
    patch.createdAt=now;
    patch.updatedAt=now;
    patch.lastMessage='';
  }else if(!readSucceeded){
    patch.updatedAt=now;
  }
  await stage('saving the private conversation',()=>setDoc(conversationRef,patch,{merge:true}));

  const previous=existing?.exists()?existing.data()||{}:{};
  const local={...previous,...patch,id};
  const at=conversations.findIndex(item=>item.id===id);
  if(at>=0)conversations[at]={...conversations[at],...local};
  else conversations.unshift(local);
  return id;
}

function presenceExpiryMillis(value){
  if(value?.toMillis)return value.toMillis();
  if(value?.toDate)return value.toDate().getTime();
  if(typeof value==='number')return value;
  const parsed=Date.parse(value||'');
  return Number.isFinite(parsed)?parsed:0;
}
function isPersonOnline(uid){
  const p=presenceByUid.get(uid);
  return !!p?.online&&presenceExpiryMillis(p.expiresAt)>Date.now();
}
function presenceText(uid){
  const online=isPersonOnline(uid);
  return '<span data-presence-label="'+esc(uid)+'" class="chat-row-presence '+(online?'online':'offline')+'">'+(online?'Online':'Offline')+'</span>';
}
function personAvatar(name,url,uid){
  const online=isPersonOnline(uid);
  return '<span class="presence-avatar-wrap" data-presence-uid="'+esc(uid)+'" title="'+(online?'Online':'Offline')+'">'+avatar(name,url)+'<span class="presence-dot '+(online?'online':'offline')+'" aria-label="'+(online?'Online':'Offline')+'" title="'+(online?'Online':'Offline')+'"></span></span>';
}
function updatePresenceDom(){
  document.querySelectorAll('.presence-avatar-wrap[data-presence-uid]').forEach(el=>{
    const online=isPersonOnline(el.dataset.presenceUid);
    el.title=online?'Online':'Offline';
    const dot=el.querySelector('.presence-dot');
    if(dot){dot.classList.toggle('online',online);dot.classList.toggle('offline',!online);dot.title=online?'Online':'Offline';dot.setAttribute('aria-label',online?'Online':'Offline');}
  });
  document.querySelectorAll('[data-presence-label]').forEach(el=>{

    el.textContent=online?'Online':'Offline';
    el.classList.toggle('online',online);el.classList.toggle('offline',!online);
  });

function schedulePresenceRender(){
  if(presenceRenderTimer)clearTimeout(presenceRenderTimer);
  presenceRenderTimer=setTimeout(updatePresenceDom,60);
}
if(!window.__karpChatPresenceTicker){
  window.__karpChatPresenceTicker=setInterval(()=>{if(user)updatePresenceDom();},15000);
}
function syncPresenceListeners(ids){
  if(!user)return;
  const wanted=new Set([...ids,...searchPresenceIds].filter(id=>id&&id!==user.uid));
  for(const [uid,unsubscribe] of presenceUnsubs){
    if(!wanted.has(uid)){unsubscribe();presenceUnsubs.delete(uid);presenceByUid.delete(uid);}
  }
  for(const uid of wanted){
    if(presenceUnsubs.has(uid))continue;
    const unsubscribe=onSnapshot(doc(db,'chatPresence',uid),snap=>{
      presenceByUid.set(uid,snap.exists()?snap.data():null);
      schedulePresenceRender();
    },error=>{
      presenceByUid.set(uid,null);
      console.warn('KARP chat presence listener failed:',error);
      schedulePresenceRender();
    });
    presenceUnsubs.set(uid,unsubscribe);
  }
}
function updateSelectedPresence(){
  const status=document.getElementById('headPresence');
  if(!status)return;
  const uid=selected?.type==='direct'?otherId(selected):'';
  if(!uid){status.textContent=selected?.type==='group'?'Group conversation':'';status.style.color='';return;}
  const online=isPersonOnline(uid);
  status.textContent=online?'Online':'Offline';
  status.style.color=online?'#238553':'#7b8289';
}
function syncUnreadMessageListeners(){
  if(!user)return;
  const activeIds=new Set(conversations.map(c=>c.id));
  for(const [id,unsubscribe] of unreadMessageUnsubs){
    if(!activeIds.has(id)){
      unsubscribe();unreadMessageUnsubs.delete(id);liveUnreadByConversation.delete(id);
      unreadInitialized.delete(id);persistedUnreadByConversation.delete(id);
    }
  }
  for(const c of conversations){
    const id=c.id;
    const persisted=Math.max(0,Number(c['unread_'+user.uid]||0));
    if(!liveUnreadByConversation.has(id))liveUnreadByConversation.set(id,persisted);
    if(!persistedUnreadByConversation.has(id))persistedUnreadByConversation.set(id,persisted);
    if(unreadMessageUnsubs.has(id))continue;
    const messageQuery=query(collection(db,'conversations',id,'messages'),orderBy('createdAt','desc'),limit(1));
    const unsubscribe=onSnapshot(messageQuery,snap=>{
      const latest=conversations.find(item=>item.id===id);
      if(!unreadInitialized.has(id)){
        unreadInitialized.add(id);
        if(!liveUnreadByConversation.has(id))liveUnreadByConversation.set(id,Math.max(0,Number(latest?.['unread_'+user.uid]||0)));
        return;
      }
      if(selected?.id===id){liveUnreadByConversation.set(id,0);return;}
      let count=Math.max(Number(liveUnreadByConversation.get(id)||0),Number(latest?.['unread_'+user.uid]||0));
      for(const change of snap.docChanges()){
        if(change.type!=='added')continue;
        const message=change.doc.data()||{};
        if(message.senderId&&message.senderId!==user.uid)count++;
      }
      if(count!==Number(liveUnreadByConversation.get(id)||0)){
        liveUnreadByConversation.set(id,count);
        schedulePresenceRender();
      }
    },error=>console.warn('KARP unread-message listener failed:',id,error));
    unreadMessageUnsubs.set(id,unsubscribe);
  }
}
async function loadConversations(){
  if(!user)return;
  if(unsubConv){unsubConv();unsubConv=null;}
  const q=query(collection(db,'conversations'),where('members','array-contains',user.uid));
  unsubConv=onSnapshot(q,s=>{
    const next=s.docs.map(d=>({id:d.id,...d.data()}));
    next.forEach(c=>{
      const id=c.id,current=Math.max(0,Number(c['unread_'+user.uid]||0));
      const previous=persistedUnreadByConversation.get(id);
      if(previous!==undefined&&current<previous)liveUnreadByConversation.set(id,current);
      else if(!liveUnreadByConversation.has(id))liveUnreadByConversation.set(id,current);
      persistedUnreadByConversation.set(id,current);
    });
    conversations=next.sort((a,b)=>Date.parse(b.updatedAt||b.createdAt||0)-Date.parse(a.updatedAt||a.createdAt||0));
    syncUnreadMessageListeners();
    updateSelectedPresence();
    renderList().catch(e=>console.warn('render conversations',e));
  },e=>console.error('conversation listener',e));
}
async function hydratePeople(ids){const map=new Map();await Promise.all([...new Set(ids.filter(Boolean))].map(async id=>{try{const s=await getDoc(doc(db,'publicProfiles',id));if(s.exists())map.set(id,{uid:id,...s.data()})}catch{}}));return map}
function otherId(c){return c.type==='direct'?c.members.find(x=>x!==user.uid)||'':''}
function trackedPersonIds(){
  const ids=[];
  conversations.forEach(c=>c.members?.forEach(id=>{if(id!==user?.uid)ids.push(id)}));
  friends.forEach(f=>f.members?.forEach(id=>{if(id!==user?.uid)ids.push(id)}));
  incoming.forEach(r=>{if(r.fromUid&&r.fromUid!==user?.uid)ids.push(r.fromUid)});
  outgoing.forEach(r=>{if(r.toUid&&r.toUid!==user?.uid)ids.push(r.toUid)});
  return [...new Set(ids)];
}
async function conversationPeople(){
  const ids=trackedPersonIds();
  syncPresenceListeners(ids);
  return hydratePeople(ids);
}
let people=new Map();
async function renderList(){
  const list=document.getElementById('chatList');
  if(!list||!user)return;
  people=await conversationPeople();

    }).join(''):'<div class="empty-chat"><div>No pending requests.</div></div>';
  }else if(listMode==='friends'){
    const arr=friends.map(f=>{
      const id=f.members.find(x=>x!==user.uid),p=people.get(id)||{};
      return{id,p};
    }).filter(x=>!q||String(x.p.name||'').toLowerCase().includes(q));
    html=arr.length?arr.map(x=>
      '<div class="chat-row" data-person="'+x.id+'">'+personAvatar(x.p.name,x.p.photoURL,x.id)+'<div class="chat-row-main"><div class="chat-row-top"><span class="chat-row-name">'+esc(x.p.name||'Member')+'</span>'+presenceText(x.id)+'</div></div></div>'
    ).join(''):'<div class="empty-chat"><div>No friends yet.<br>Use ＋ to find KARP members.</div></div>';
  }else{
    const chatItems=[];
    const seen=new Set();
    conversations.forEach(c=>{
      const other=c.type==='direct'?otherId(c):'';
      if(c.type==='direct'&&other)seen.add(other);
      const p=c.type==='direct'?people.get(other):null;
      const name=c.type==='group'?c.name:(p?.name||'Member');
      if(!q||name.toLowerCase().includes(q)){
        const stored=Number(c['unread_'+user.uid]||0);
        const live=Number(liveUnreadByConversation.get(c.id)||0);
        chatItems.push({
          kind:'conversation',id:c.id,personId:other,data:c,name,
          url:c.type==='group'?'':p?.photoURL,
          unread:selected?.id===c.id?0:Math.max(stored,live)
        });
      }
    });
    friends.forEach(f=>{
      const other=f.members?.find(x=>x!==user.uid);
      if(!other||seen.has(other))return;
      const p=people.get(other)||{};
      const name=p.name||'Member';
      if(!q||name.toLowerCase().includes(q)){
        chatItems.push({kind:'friend',id:other,personId:other,data:null,name,url:p.photoURL,unread:0});
      }
    });
    chatItems.sort((a,b)=>{
      const ta=a.data?.updatedAt||a.data?.createdAt||'';
      const tb=b.data?.updatedAt||b.data?.createdAt||'';
      return Date.parse(tb||0)-Date.parse(ta||0);
    });
    html=chatItems.length?chatItems.map(x=>{
      const picture=x.personId?personAvatar(x.name,x.url,x.personId):avatar(x.name,x.url);
      const meta=x.personId?presenceText(x.personId):'';
      if(x.kind==='conversation'){
        return '<div class="chat-row '+(selected?.id===x.id?'active':'')+'" data-conv="'+x.id+'">'+picture+'<div class="chat-row-main"><div class="chat-row-top"><span class="chat-row-name">'+esc(x.name)+'</span>'+meta+'<span class="chat-row-meta"><span class="chat-row-time">'+esc(fmt(x.data.updatedAt||x.data.createdAt))+'</span>'+(x.unread?'<span class="chat-unread" aria-label="'+esc(x.unread)+' unread messages" title="'+esc(x.unread)+' unread messages">'+esc(x.unread>99?'99+':x.unread)+'</span>':'')+'</span></div><div class="chat-row-preview">'+esc(x.data.lastMessage||'No messages yet')+'</div></div></div>';
      }
      return '<div class="chat-row" data-person="'+x.personId+'">'+picture+'<div class="chat-row-main"><div class="chat-row-top"><span class="chat-row-name">'+esc(x.name)+'</span>'+meta+'</div></div></div>';
    }).join(''):'<div class="empty-chat"><div><strong>No conversations</strong>Start a new chat with a KARP friend.</div></div>';
  }
  list.innerHTML=html;
  list.querySelectorAll('[data-conv]').forEach(x=>x.onclick=()=>openConversation(x.dataset.conv));
  list.querySelectorAll('[data-person]').forEach(x=>x.onclick=()=>startDirect(x.dataset.person));
  list.querySelectorAll('[data-accept]').forEach(x=>x.onclick=()=>acceptRequest(x.dataset.accept));
  list.querySelectorAll('[data-reject]').forEach(x=>x.onclick=()=>rejectRequest(x.dataset.reject));
}
async function openConversation(id){
  const c=conversations.find(x=>x.id===id);
  if(!c)return;
  selected=c;
  if(unsubMsg)unsubMsg();
  const p=c.type==='direct'?people.get(otherId(c)):null;
  const headDisplayName=c.type==='group'?c.name:(p?.name||'Member');
  document.getElementById('headName').textContent=headDisplayName;
  updateSelectedPresence();
  liveUnreadByConversation.set(id,0);
  const headAvatar=document.getElementById('headAvatar');
  if(headAvatar){headAvatar.innerHTML=(c.type==='direct'&&p?.photoURL?'<img src="'+esc(p.photoURL)+'" alt="">':esc(String(headDisplayName||'K').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'K'));}
    document.getElementById('composer').disabled=false;
  document.getElementById('send').disabled=false;
  document.getElementById('chat-window').classList.remove('mobile-list');
  const mq=window.matchMedia('(max-width:700px)');
  if(mq.matches)document.getElementById('backMobile').style.display='grid';

  try{
    await updateDoc(doc(db,'conversations',id),{['unread_'+user.uid]:0});
  }catch(e){console.warn('mark conversation read',e)}
  conversations=conversations.map(x=>x.id===id?{...x,['unread_'+user.uid]:0}:x);
  // Keep the newest 500 messages. An ascending limit(500) returns the oldest
  // messages and can make every later message appear missing in busy chats.
  unsubMsg=onSnapshot(query(collection(db,'conversations',id,'messages'),orderBy('createdAt','asc'),limitToLast(500)),s=>{
    messages=s.docs.map(d=>({id:d.id,...d.data()}));
    renderMessages();
    updateDoc(doc(db,'conversations',id),{['unread_'+user.uid]:0}).catch(()=>{});
  },e=>console.error('message listener',e));
  renderList().catch(()=>{});
}
function renderMessages(){
  const e=document.getElementById('messages');
  if(!messages.length){
    e.innerHTML='<div class="empty-chat"><div><strong>No messages yet</strong></div></div>';
    return;
  }
  const first=messages[0];
  const firstDate=first.createdAt?.toDate?first.createdAt.toDate():new Date(first.createdAt||Date.now());
  const dateLabel=Number.isNaN(firstDate.getTime())?'':firstDate.toLocaleDateString([], {day:'numeric',month:'long',year:'numeric'});
  e.innerHTML=(dateLabel?'<div class="day-divider conversation-date">'+esc(dateLabel)+'</div>':'')+
    messages.map(m=>{
      const mine=m.senderId===user.uid;
      return '<div class="msg '+(mine?'mine':'')+'">'+
        (!mine&&selected?.type==='group'?'<div class="msg-author">'+esc(m.senderName||'Member')+'</div>':'')+
        '<div class="msg-text">'+esc(m.deletedAt?'This message was deleted':(m.text||''))+'</div>'+
        '<div class="msg-meta">'+esc(fmt(m.createdAt))+'</div>'+
        (mine&&!m.deletedAt?'<button class="msg-delete" title="Delete message" aria-label="Delete message" data-delete-msg="'+m.id+'">⋮</button>':'')+
      '</div>';
    }).join('');
  e.querySelectorAll('[data-delete-msg]').forEach(b=>b.onclick=()=>deleteMessage(b.dataset.deleteMsg));
  e.scrollTop=e.scrollHeight;
}
async function deleteMessage(messageId){
  if(!requireUser()||!selected||!messageId)return;
  const index=messages.findIndex(x=>x.id===messageId);
  const m=messages[index];
  if(!m||m.senderId!==user.uid)return;
  try{
    await deleteDoc(doc(db,'conversations',selected.id,'messages',messageId));
    if(index===messages.length-1){
      const previous=messages[index-1];
      await updateDoc(doc(db,'conversations',selected.id),{
        lastMessage:previous?.text?String(previous.text).slice(0,180):'',
        lastSenderId:previous?.senderId||'',
        updatedAt:new Date().toISOString()
      }).catch(()=>{});
    }
  }catch(e){console.error('Could not delete message:',e);alert(chatErrorMessage(e,'Could not delete message.'))}
}

async function sendMessage(){
  if(!requireUser()||!selected||sendingMessage)return;
  const e=document.getElementById('composer'),sendButton=document.getElementById('send'),text=e.value.trim();
  if(!text)return;
  const conversation=selected;
  sendingMessage=true;
  e.disabled=true;sendButton.disabled=true;
  try{
    // Write the message first. Only this write determines whether the send
    // itself succeeded; updating preview/unread metadata is a separate step.
    await addDoc(collection(db,'conversations',conversation.id,'messages'),{
      senderId:user.uid,senderName:displayName(),senderPhoto:photo(),text,createdAt:serverTimestamp()
    });
    e.value='';
    const updateData={
      lastMessage:text.slice(0,180),
      lastSenderId:user.uid,
      updatedAt:new Date().toISOString()
    };
    (conversation.members||[]).filter(uid=>uid!==user.uid).forEach(uid=>{
      updateData['unread_'+uid]=increment(1);
    });
    try{
      await updateDoc(doc(db,'conversations',conversation.id),updateData);
    }catch(metadataError){
      // The message is already saved and visible in the live message stream.
      // Do not restore the text or report a false send failure, which caused
      // users to resend messages that had already been stored.
      console.warn('Message sent, but conversation preview/unread metadata did not update:',metadataError);
    }
  }catch(err){
    console.error('KARP message write failed:',err);
    const denied=err?.code==='permission-denied'||String(err?.message||'').toLowerCase().includes('insufficient permissions');
    alert(denied
      ?'This conversation could not accept the message. Refresh the page, reopen the conversation, and try again.'
      :'Message was not sent. '+(err?.message||'Please try again.'));
  }finally{
    sendingMessage=false;
    e.disabled=!user||!selected;
    sendButton.disabled=!user||!selected;
    // Disabling the textarea while sending causes the browser to drop focus.
    // Restore it as soon as it is enabled so consecutive messages need no
    // extra click. Do not steal focus if the user switched conversations.
    requestAnimationFrame(()=>{
      if(user&&selected?.id===conversation.id&&!e.disabled){
        e.focus({preventScroll:true});
      }
    });
  }
}
document.getElementById('send').onclick=sendMessage;document.getElementById('composer').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};document.getElementById('chatSearch').oninput=renderList;
async function startDirect(uid){
  if(!requireUser()||!uid)return;
  await loadFriends();
  const friend=friends.some(f=>f.status==='accepted'&&f.members?.includes(uid));
  if(!friend){
    modal('Connect first','<p style="font-size:11px;line-height:1.6;color:#555d65">You can message members after you are connected.</p>','<button class="text-btn" id="modalFind">Find & connect</button>');
    document.getElementById('modalFind').onclick=()=>openNewChat();
    return;
  }
  try{
    const id=await ensureDirectConversation(uid);
    const existingIndex=conversations.findIndex(x=>x.id===id);
    const existing=existingIndex>=0?conversations[existingIndex]:{};
    const local={...existing,id,type:'direct',status:'accepted',members:[user.uid,uid].sort(),
      createdAt:existing.createdAt||new Date().toISOString(),
      updatedAt:existing.updatedAt||new Date().toISOString(),
      lastMessage:existing.lastMessage||''};
    if(existingIndex>=0)conversations[existingIndex]={...existing,...local};
    else conversations.unshift(local);
    await renderList();
    await openConversation(id);
  }catch(e){
    console.error('start direct chat failed while verifying the accepted friendship or repairing the direct conversation:',e);
    const denied=e?.code==='permission-denied'||String(e?.message||'').toLowerCase().includes('insufficient permissions');
    if(denied){
      const step=String(e?.karpStage||'opening the private conversation');
      alert('KARP could not open this private chat while '+step+'. Check that Hosting and Firestore rules have both been deployed. The exact error is recorded in the browser console.');
    }else{
      alert(chatErrorMessage(e,'Could not start chat.'));
    }
  }
}
async function acceptRequest(id){
  if(!requireUser())return;
  const r=incoming.find(x=>x.id===id);
  if(!r)return;
  const members=[user.uid,r.fromUid].sort();
  const fid=members.join('_');
  const now=new Date().toISOString();
  let stage='accepting the invitation';
  try{
    // Accept the request first. The friendship rule explicitly permits the
    // recipient to make this transition from pending -> accepted.
    await updateDoc(doc(db,'friendRequests',id),{
      status:'accepted',
      respondedAt:now
    });

    stage='saving the friendship';
    try{
      await setDoc(doc(db,'friendships',fid),{
        members,
        status:'accepted',
        requestId:id,
        createdAt:r.createdAt||now,
        updatedAt:now
      },{merge:true});
    }catch(friendshipError){
      // Accepted requests are sufficient for the secure direct-conversation
      // rule; do not strand an already accepted connection on this repair.
      console.warn('Friendship save failed; continuing with accepted-request validation:',friendshipError);
    }

    stage='creating the private conversation';
    await ensureDirectConversation(r.fromUid);

    // Update the local UI immediately; realtime listeners will reconcile it.
    const localFriend={id:fid,members,status:'accepted',requestId:id,createdAt:r.createdAt||now,updatedAt:now};
    const friendIndex=friends.findIndex(x=>x.id===fid);
    if(friendIndex>=0)friends[friendIndex]={...friends[friendIndex],...localFriend};
    else friends.unshift(localFriend);

    const localConversation={
      id:fid,
      type:'direct',
      status:'accepted',
      members,
      updatedAt:now,
      lastMessage:''
    };
    const conversationIndex=conversations.findIndex(x=>x.id===fid);
    if(conversationIndex>=0)conversations[conversationIndex]={...conversations[conversationIndex],...localConversation};
    else conversations.unshift(localConversation);

    stage='refreshing contacts and conversations';
    await Promise.all([loadFriends(),loadConversations(),refreshRequestsFromServer()]);
    listMode='chats';
    document.querySelectorAll('.chat-tab').forEach(b=>b.classList.toggle('active',b.dataset.list==='chats'));
    await renderList();
    await openConversation(fid);
  }catch(e){
    console.error('accept request failed during '+stage,e);
    console.error('Could not complete connection during '+stage+':',e);
    alert('Could not complete the connection ('+stage+'). '+chatErrorMessage(e,'Please refresh and try again.'));
  }
}
async function rejectRequest(id){const r=incoming.find(x=>x.id===id);if(!r)return;try{await updateDoc(doc(db,'friendRequests',id),{status:'rejected',respondedAt:new Date().toISOString()});await refreshRequestsFromServer()}catch(e){console.error('reject request',e);alert(chatErrorMessage(e,'Could not decline request.'))}}
async function openNewChat(){
  if(!requireUser())return;
  modal('New conversation','<input id="peopleSearch" class="modal-search" placeholder="Search KARP members by name…" autocomplete="off"><div id="peopleResults"><div style="padding:12px 2px;font-size:10px;color:#7b8289">Loading KARP members…</div></div>','<button type="button" class="text-btn" id="newChatClose">Close</button>');
  const input=document.getElementById('peopleSearch');
  let timer=null;
  input.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>searchPeople(input.value),180)};
  input.onkeydown=e=>{if(e.key==='Escape')closeModal()};
  document.getElementById('newChatClose').onclick=closeModal;
  input.focus({preventScroll:true});
  await searchPeople('');
}
let publicMembersCache=null,publicMembersPromise=null;
async function getPublicMembers(){
  if(publicMembersCache)return publicMembersCache;
  if(!publicMembersPromise){
    publicMembersPromise=getDocs(collection(db,'publicProfiles')).then(s=>{
      publicMembersCache=s.docs.map(d=>({uid:d.id,...d.data()}));
      return publicMembersCache;
    }).catch(error=>{
      publicMembersPromise=null;
      throw error;
    });
  }
  return publicMembersPromise;
}
async function searchPeople(term){
  const box=document.getElementById('peopleResults');
  if(!box)return;
  const search=String(term||'').trim().toLowerCase();
  box.innerHTML='<div style="padding:12px 2px;font-size:10px;color:#7b8289">Loading members…</div>';
  try{
    const all=await getPublicMembers();
    if(!document.getElementById('peopleResults'))return;
    const arr=all.filter(p=>p.uid!==user.uid&&(!search||String(p.name||'').toLowerCase().includes(search)))
      .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'en',{sensitivity:'base'}))
      .slice(0,60);
    searchPresenceIds=new Set(arr.map(p=>p.uid));
    syncPresenceListeners(trackedPersonIds());
    const friendIds=new Set(friends.flatMap(f=>f.members||[]));
    box.innerHTML=arr.length?arr.map(p=>{
      const isFriend=friendIds.has(p.uid);
      const pendingIn=incoming.some(r=>r.fromUid===p.uid);
      const pendingOut=outgoing.some(r=>r.toUid===p.uid);
      const action=isFriend
        ?'<button type="button" class="text-btn primary" data-open-person="'+p.uid+'">Message</button>'
        :pendingIn
          ?'<button type="button" class="text-btn primary" data-accept="'+(incoming.find(r=>r.fromUid===p.uid)?.id||'')+'">Accept</button>'
          :pendingOut
            ?'<button type="button" class="text-btn" disabled>Request sent</button>'
            :'<button type="button" class="text-btn primary" data-add="'+p.uid+'">Connect</button>';
      return '<div class="contact">'+personAvatar(p.name,p.photoURL,p.uid)+'<div class="contact-main"><strong>'+esc(p.name||'Member')+'</strong><small>'+(isFriend?'Connected':pendingIn?'Wants to connect':pendingOut?'Invitation pending':'KARP member')+'</small></div><div class="contact-actions">'+action+'</div></div>';
    }).join(''):'<div style="padding:18px;text-align:center;font-size:10px;color:#7b8289">'+(search?'No members match that name.':'No other KARP members were found.')+'</div>';
    box.querySelectorAll('[data-add]').forEach(button=>button.onclick=async()=>{
      button.disabled=true;button.textContent='Sending…';
      try{
        await sendRequest(button.dataset.add);
        await searchPeople(document.getElementById('peopleSearch')?.value||'');
      }catch(error){
        console.error('KARP connection request could not be sent:',error);
        button.disabled=false;button.textContent='Connect';
        const note=document.createElement('div');
        note.style.cssText='font-size:10px;color:#9b2c2c;padding:6px 2px';
        note.textContent='Could not send the request. '+(error?.message||'Please try again.');
        box.prepend(note);
      }
    });
    box.querySelectorAll('[data-open-person]').forEach(button=>button.onclick=()=>{closeModal();startDirect(button.dataset.openPerson)});
    box.querySelectorAll('[data-accept]').forEach(button=>button.onclick=async()=>{
      closeModal();
      await acceptRequest(button.dataset.accept);
    });
  }catch(error){
    console.error('KARP member directory failed to load:',error);
    box.innerHTML='<div style="padding:12px 2px;font-size:10px;line-height:1.6;color:#9b2c2c">Could not load the member list. '+esc(error?.message||'Please refresh the page and try again.')+'</div><button type="button" class="text-btn" id="retryPeopleSearch">Retry</button>';
    document.getElementById('retryPeopleSearch')?.addEventListener('click',()=>{publicMembersCache=null;publicMembersPromise=null;searchPeople(document.getElementById('peopleSearch')?.value||'')});
  }
}
async function sendRequest(uid){
  if(!requireUser()||!uid||uid===user.uid)return;
  if(outgoing.some(r=>r.toUid===uid)){await searchPeople(document.getElementById('peopleSearch')?.value||'');return}
  const id=user.uid+'_'+uid+'_'+Date.now().toString(36);
  try{
    await setDoc(doc(db,'friendRequests',id),{fromUid:user.uid,toUid:uid,status:'pending',createdAt:new Date().toISOString()});
  }catch(e){
    console.error('send KARP connection request',e);
    alert('Could not send the connection request: '+chatErrorMessage(e,'Please try again.'));
    return;
  }
  // A successful write is already persisted; refresh failures must not show a false send-error.
  await refreshRequestsFromServer().catch(e=>console.warn('refresh after sending request',e));
}
function invite(){const url=location.origin+'/signup.html?invite='+encodeURIComponent(user?.uid||'');navigator.clipboard?.writeText(url).then(()=>alert('Invite link copied.')).catch(()=>window.prompt('Copy this invite link:',url))}
function openGroup(initial=[]){if(!requireUser())return;const friendIds=[...new Set(friends.flatMap(f=>f.members||[]).filter(id=>id!==user.uid))];modal('New group','<input id="groupName" class="modal-search" placeholder="Group name"><div class="group-picks">'+friendIds.map(id=>{const p=people.get(id)||{};return '<label class="group-pick">'+personAvatar(p.name,p.photoURL,p.uid)+'<span style="font-size:10px;font-weight:750">'+esc(p.name||'Member')+'</span><input type="checkbox" value="'+id+'" '+(initial.includes(id)?'checked':'')+'></label>'}).join('')+'</div>','<button class="text-btn" id="groupCancel">Cancel</button><button class="text-btn primary" id="groupCreate">Create group</button>');document.getElementById('groupCancel').onclick=closeModal;document.getElementById('groupCreate').onclick=async()=>{const name=document.getElementById('groupName').value.trim();const ids=[...document.querySelectorAll('.group-pick input:checked')].map(x=>x.value);if(!name||!ids.length)return;const members=[user.uid,...ids];try{const r=await addDoc(collection(db,'conversations'),{type:'group',status:'accepted',members,createdBy:user.uid,name,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),lastMessage:''});closeModal();await loadConversations();await renderList();openConversation(r.id)}catch(e){console.error('Could not create group:',e);alert(chatErrorMessage(e,'Could not create group.'))}}}
const newChatButton=document.getElementById('newChat');
newChatButton.type='button';
newChatButton.addEventListener('click',async event=>{
  event.preventDefault();event.stopPropagation();
  try{await openNewChat()}
  catch(error){
    console.error('Could not open KARP new conversation dialog:',error);
    const message=esc(error?.message||'Please refresh the page and try again.');
    modal('New conversation','<div style="padding:12px 2px;font-size:11px;line-height:1.6;color:#8b3434">Could not load the member list. '+message+'</div>','<button type="button" class="text-btn" id="newChatErrorClose">Close</button>');
    document.getElementById('newChatErrorClose').onclick=closeModal;
  }
});
document.getElementById('inviteBtn').onclick=invite;document.getElementById('profileBtn').onclick=()=>{if(!signedIn())return requireUser();modal('Your KARP profile','<div class="profile-card" style="border:0">'+avatar(displayName(),photo())+'<div class="profile-name">'+esc(displayName())+'</div><div class="profile-sub">KARP member</div></div>','<button class="text-btn" id="closeProfile">Close</button>');document.getElementById('closeProfile').onclick=closeModal};document.getElementById('backMobile').onclick=()=>document.getElementById('chat-window').classList.add('mobile-list');
document.querySelectorAll('.chat-tab').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.chat-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');listMode=b.dataset.list;await renderList()});
au.onAuthStateChanged(auth,async u=>{
  if(unsubIncoming){unsubIncoming();unsubIncoming=null}
  if(unsubOutgoing){unsubOutgoing();unsubOutgoing=null}
  if(unsubConv){unsubConv();unsubConv=null}
  if(unsubMsg){unsubMsg();unsubMsg=null}
  for(const unsubscribe of presenceUnsubs.values())unsubscribe();
  presenceUnsubs.clear();presenceByUid.clear();
  for(const unsubscribe of unreadMessageUnsubs.values())unsubscribe();
  unreadMessageUnsubs.clear();liveUnreadByConversation.clear();unreadInitialized.clear();persistedUnreadByConversation.clear();
  conversations=[];friends=[];incoming=[];outgoing=[];selected=null;messages=[];
  user=u||null;updateChatNav(user);
  if(!user){
    meProfile={};conversations=[];friends=[];incoming=[];outgoing=[];selected=null;messages=[];
    document.getElementById('composer').disabled=true;document.getElementById('send').disabled=true;
    document.getElementById('chatList').innerHTML='<div class="empty-chat"><div><strong>Sign in to KARP</strong>Sign in to connect with other members.</div></div>';
    return;
  }
  await loadProfile();
  updateChatNav(user); // Re-render after the KARP profile (not Google Auth) photo has loaded.
  await loadFriends();
  await loadRequests();
  await loadConversations();
  await repairAcceptedRelationships();
  await Promise.all([loadFriends(),loadConversations()]);
  await renderList();
});
})();
</script>
