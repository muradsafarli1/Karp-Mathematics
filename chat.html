<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARP — Chat</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js?v=chat-20261022"></script>
<style>
.chat-page{width:min(1160px,calc(100% - 32px));margin:auto;padding:28px 0 70px}.chat-shell{display:grid;grid-template-columns:220px 1fr;min-height:720px;border:1px solid #d9dad8;border-radius:16px;overflow:hidden;background:#fafbf9}.chat-side{background:#f1f2ef;border-right:1px solid #d9dad8;padding:18px 11px}.chat-side h1{font:800 24px "Space Grotesk";margin:4px 10px}.chat-side p{font-size:10px;color:#747b82;line-height:1.5;margin:6px 10px 18px}.chat-side button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:9px;font-size:11px;font-weight:750;color:#555c63;cursor:pointer}.chat-side button:hover,.chat-side button.active{background:#fff;color:#17191c}.chat-label{font-size:9px;color:#92979c;font-weight:800;text-transform:uppercase;letter-spacing:.7px;padding:16px 10px 5px}.chat-main{min-width:0;background:#fafbf9}.chat-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid #dedfdb;background:#fff}.chat-head h2{font:800 19px "Space Grotesk";margin:0}.chat-head small{display:block;font-size:9px;color:#7a8086;margin-top:3px}.chat-btn{border:1px solid #d0d3ce;background:#fff;color:#30363c;border-radius:9px;padding:8px 11px;font-size:10px;font-weight:750;cursor:pointer}.chat-btn.primary{background:#263b5b;color:#fff;border-color:#263b5b}.chat-compose{display:none;padding:15px;background:#f3f4f1;border-bottom:1px solid #dedfdb}.chat-compose.open{display:block}.chat-input{width:100%;box-sizing:border-box;border:1px solid #d0d3ce;border-radius:9px;background:#fff;padding:10px;font:11px Inter,system-ui;margin-bottom:8px}.chat-title{font-weight:700}.chat-body{min-height:130px;resize:vertical}.chat-row{display:flex;justify-content:flex-end;gap:7px}.chat-feed{padding:16px;display:grid;gap:12px}.chat-tools{display:flex;gap:7px}.chat-search{flex:1;border:1px solid #d0d3ce;border-radius:9px;padding:9px 10px;font-size:10px;background:#fff}.chat-post{background:#fff;border:1px solid #d9dad8;border-radius:13px;padding:15px}.chat-post-head{display:flex;gap:9px;align-items:center}.chat-avatar{width:34px;height:34px;min-width:34px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#263b5b;color:#fff;font-size:10px;font-weight:800}.chat-avatar img{width:100%;height:100%;object-fit:cover}.chat-user{font-size:10px;font-weight:800}.chat-meta{font-size:9px;color:#858b91}.chat-tag{margin-left:auto;padding:4px 7px;border:1px solid #e0e2de;border-radius:999px;font-size:8px;font-weight:800;color:#687077;background:#f5f6f3}.chat-post h3{font-size:16px;line-height:1.35;margin:13px 0 7px}.chat-text{font-size:12px;line-height:1.8;color:#41474d;white-space:pre-wrap;overflow-wrap:anywhere}.chat-actions{display:flex;gap:7px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid #eceeea}.chat-vote{border:1px solid #dfe1dd;background:#f7f8f6;border-radius:8px;padding:6px 9px;font-size:10px;font-weight:800;cursor:pointer}.chat-comments{margin-top:11px;padding-top:11px;border-top:1px solid #eceeea;display:grid;gap:8px}.chat-comment{display:flex;gap:8px}.chat-comment .chat-avatar{width:27px;height:27px;min-width:27px;font-size:8px}.chat-comment-text{font-size:10px;line-height:1.6;color:#454b51}.chat-comment-text b{color:#263b5b}.chat-live{display:none;height:620px;grid-template-rows:auto 1fr auto;background:#eef0ed}.chat-live.open{display:grid}.chat-live-head{padding:13px 18px;background:#fff;border-bottom:1px solid #dedfdb}.chat-live-head b{font-size:11px}.chat-live-head span{font-size:9px;color:#7b8187;margin-left:7px}.chat-messages{padding:15px 18px;overflow:auto;display:flex;flex-direction:column;gap:7px}.bubble{max-width:72%;padding:8px 10px;background:#fff;border:1px solid #dfe1dd;border-radius:11px;align-self:flex-start}.bubble.mine{align-self:flex-end;background:#e5ebf3}.bubble b{display:block;font-size:9px;color:#263b5b}.bubble p{font-size:10px;line-height:1.5;margin:2px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bubble time{display:block;text-align:right;font-size:7px;color:#888e94}.chat-send{display:flex;gap:7px;padding:11px;background:#fff;border-top:1px solid #dedfdb}.chat-send textarea{flex:1;min-height:40px;max-height:100px;resize:none;border:1px solid #d0d3ce;border-radius:9px;padding:9px;font:11px Inter,system-ui}
@media(max-width:720px){.chat-page{width:100%;padding:0 0 40px}.chat-shell{grid-template-columns:1fr;border-radius:0;border-left:0;border-right:0}.chat-side{display:flex;gap:4px;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid #d9dad8}.chat-side h1,.chat-side p,.chat-label{display:none}.chat-side button{width:auto;white-space:nowrap}.chat-live{height:calc(100vh - 190px)}}
</style></head><body>
<script>
(async function(){
document.body.innerHTML='<header class="top"><div class="wrap nav"><a class="brand" href="/">KARP</a><nav class="navlinks"><a href="/problems.html">Problems</a><a href="/contests.html">Contests</a><a href="/exams.html">Exams</a><a href="/daily-problem.html">Daily Problem</a><a href="/mock.html">Mocks</a><a href="/books.html">Books</a><a href="/videos.html">Videos</a><a href="/journal.html">Journal</a><a href="/meetings.html">Meetings</a><a class="active" href="/chat.html">Chat</a><a href="/about.html">About</a></nav><div class="actions" id="nav-actions"><a class="btn ghost" href="/login.html">Login</a><a class="btn primary" href="/signup.html">Join Us</a></div></div></header><main class="chat-page"><div class="chat-shell"><aside class="chat-side"><h1>KARP Chat</h1><p>Problems, proofs and mathematics — together.</p><div class="chat-label">Community</div><button class="active" data-view="feed">Discussions</button><button data-view="live">Live Chat</button><div class="chat-label">Topics</div><button data-tag="Olympiad">Olympiad</button><button data-tag="Geometry">Geometry</button><button data-tag="Algebra">Algebra</button><button data-tag="Number Theory">Number Theory</button></aside><section class="chat-main"><div class="chat-head"><div><h2 id="heading">Community</h2><small id="sub">Ask questions, share solutions and discuss olympiad mathematics.</small></div><button class="chat-btn primary" id="new">New post</button></div><div class="chat-compose" id="compose"><input id="title" class="chat-input chat-title" maxlength="180" placeholder="Title — e.g. A geometry problem I cannot finish"><textarea id="body" class="chat-input chat-body" maxlength="12000" placeholder="Write your question, proof or idea. LaTeX is supported."></textarea><div class="chat-row"><select id="tag" class="chat-input" style="width:auto"><option>General</option><option>Olympiad</option><option>Geometry</option><option>Algebra</option><option>Number Theory</option><option>Combinatorics</option></select><button class="chat-btn" id="cancel">Cancel</button><button class="chat-btn primary" id="post">Post</button></div></div><div class="chat-feed" id="feed"><div>Loading…</div></div><div class="chat-live" id="live"><div class="chat-live-head"><b>General · Live Chat</b><span>Real-time community room</span></div><div class="chat-messages" id="messages"></div><div class="chat-send"><textarea id="message" maxlength="4000" placeholder="Message the community…"></textarea><button class="chat-btn primary" id="send">Send</button></div></div></section></div></main>';
if(window.updateNavUser)updateNavUser();
const {db,auth}=await import('/karp-firebase.js');
const fs=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
const au=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js');
const {collection,query,orderBy,limit,onSnapshot,addDoc,doc,updateDoc,increment,serverTimestamp}=fs;
let user=null,profile={},posts=[],tag='All',comments=new Map();
const esc=escapeHtml,name=()=>String(profile.name||user?.displayName||(user?.email||'').split('@')[0]||'KARP Member').slice(0,100),ok=()=>!!user&&user.emailVerified===true;
const av=(n,u)=>'<span class="chat-avatar">'+(u?'<img src="'+esc(u)+'">':esc(String(n||'K').trim()[0].toUpperCase()))+'</span>';
const tm=v=>{const m=v?.toMillis?v.toMillis():Date.parse(v||'');return m?new Date(m).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'just now'};
function render(){let a=posts.filter(p=>tag==='All'||p.tag===tag);const q=(document.getElementById('search')?.value||'').toLowerCase();if(q)a=a.filter(p=>(p.title+' '+p.body+' '+p.displayName+' '+p.tag).toLowerCase().includes(q));const f=document.getElementById('feed');if(!a.length){f.innerHTML='<div class="chat-empty">No discussions yet.</div>';return}f.innerHTML='<div class="chat-tools"><input id="search" class="chat-search" placeholder="Search discussions…"></div>'+a.map(p=>{const cs=comments.get(p.id)||[];return '<article class="chat-post"><div class="chat-post-head">'+av(p.displayName,p.photoURL)+'<div><div class="chat-user">'+esc(p.displayName)+'</div><div class="chat-meta">'+esc(tm(p.createdAt))+'</div></div><span class="chat-tag">'+esc(p.tag||'General')+'</span></div><h3>'+esc(p.title)+'</h3><div class="chat-text">'+esc(p.body).replace(/\n/g,'<br>')+'</div><div class="chat-actions"><button class="chat-vote" data-v="'+p.id+'">▲ '+Number(p.score||0)+'</button><span class="chat-meta">'+cs.length+' comment'+(cs.length===1?'':'s')+'</span></div><div class="chat-comments">'+cs.slice(-20).map(c=>'<div class="chat-comment">'+av(c.displayName,c.photoURL)+'<div class="chat-comment-text"><b>'+esc(c.displayName)+'</b> · '+esc(tm(c.createdAt))+'<br>'+esc(c.text).replace(/\n/g,'<br>')+'</div></div>').join('')+(ok()?'<div style="display:flex;gap:6px"><input class="chat-input" data-ci="'+p.id+'" maxlength="2000" placeholder="Write a comment…"><button class="chat-btn" data-reply="'+p.id+'">Reply</button></div>':'')+'</div></article>'}).join('');const s=document.getElementById('search');if(s)s.oninput=render}
function renderMessages(a){const e=document.getElementById('messages');e.innerHTML=a.length?a.map(m=>'<div class="bubble '+(m.senderId===user?.uid?'mine':'')+'"><b>'+esc(m.displayName||'KARP Member')+'</b><p>'+esc(m.text)+'</p><time>'+esc(tm(m.createdAt))+'</time></div>').join(''):'<div style="padding:30px;text-align:center;font-size:10px;color:#777">No messages yet.</div>';e.scrollTop=e.scrollHeight}
document.querySelectorAll('.chat-side button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chat-side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.view){const live=b.dataset.view==='live';document.getElementById('feed').style.display=live?'none':'grid';document.getElementById('compose').style.display=live?'none':'block';document.getElementById('live').classList.toggle('open',live);document.getElementById('heading').textContent=live?'Live Chat':'Community';document.getElementById('sub').textContent=live?'Real-time mathematics community room.':'Ask questions, share solutions and discuss olympiad mathematics.'}else{tag=b.dataset.tag;document.getElementById('feed').style.display='grid';document.getElementById('compose').style.display='block';document.getElementById('live').classList.remove('open');render()}});
document.getElementById('new').onclick=()=>{if(!ok()){showAuthPrompt?.('Sign in to post','Verify your KARP account before starting a discussion.');return}document.getElementById('compose').classList.add('open');document.getElementById('title').focus()};
document.getElementById('cancel').onclick=()=>document.getElementById('compose').classList.remove('open');
document.getElementById('post').onclick=async()=>{if(!ok())return;const title=document.getElementById('title').value.trim(),body=document.getElementById('body').value.trim();if(!title||!body)return;await addDoc(collection(db,'chatPosts'),{uid:user.uid,displayName:name(),photoURL:profile.photoURL||user.photoURL||'',title,body,tag:document.getElementById('tag').value,score:0,createdAt:serverTimestamp(),solved:false});document.getElementById('title').value='';document.getElementById('body').value='';document.getElementById('compose').classList.remove('open')};
document.getElementById('send').onclick=async()=>{if(!ok()){showAuthPrompt?.('Sign in to chat','Verify your KARP account before sending messages.');return}const e=document.getElementById('message'),text=e.value.trim();if(!text)return;e.value='';await addDoc(collection(db,'chatRooms','general','messages'),{senderId:user.uid,displayName:name(),photoURL:profile.photoURL||user.photoURL||'',text,createdAt:serverTimestamp()})};
document.getElementById('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('send').click()}};
document.getElementById('feed').onclick=async e=>{const v=e.target.closest('[data-v]');if(v){if(!ok())return;await updateDoc(doc(db,'chatPosts',v.dataset.v),{score:increment(1)});return}const r=e.target.closest('[data-reply]');if(r&&ok()){const input=r.parentElement.querySelector('[data-ci]'),text=input.value.trim();if(text)await addDoc(collection(db,'chatPosts',r.dataset.reply,'comments'),{uid:user.uid,displayName:name(),photoURL:profile.photoURL||user.photoURL||'',text,createdAt:serverTimestamp()});input.value=''}};
onSnapshot(query(collection(db,'chatPosts'),orderBy('createdAt','desc'),limit(100)),s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));posts.forEach(p=>{if(comments.has(p.id))return;comments.set(p.id,[]);onSnapshot(query(collection(db,'chatPosts',p.id,'comments'),orderBy('createdAt','asc'),limit(50)),x=>{comments.set(p.id,x.docs.map(d=>({id:d.id,...d.data()})));render()})});render()});
onSnapshot(query(collection(db,'chatRooms','general','messages'),orderBy('createdAt','asc'),limit(150)),s=>renderMessages(s.docs.map(d=>({id:d.id,...d.data()}))));
au.onAuthStateChanged(auth,async u=>{user=u||null;profile={};if(user){try{const p=await fs.getDoc(fs.doc(db,'users',user.uid));if(p.exists())profile=p.data()||{}}catch{}}updateNavUser?.();render()});
})();
</script></body></html>
