<style>
:root{--wa-bg:#f5f6f4;--wa-panel:#fff;--wa-line:#e5e7e5;--wa-soft:#f0f2f0;--wa-ink:#17191c;--wa-muted:#7b8289;--wa-accent:#263b5b}

.chat-left-tools{padding:10px;border-bottom:1px solid var(--wa-line);display:flex;gap:7px}.chat-search{flex:1;min-width:0;border:1px solid #dfe2df;border-radius:10px;background:#f7f8f7;padding:9px 11px;font:11px Inter,system-ui;outline:none}.chat-search:focus{border-color:#b8bec4}
.icon-btn,.text-btn{border:1px solid #dfe2df;background:#fff;border-radius:10px;cursor:pointer;color:#343a40}.icon-btn{width:36px;height:36px;font-size:16px}.text-btn{padding:8px 10px;font-size:10px;font-weight:800}.text-btn.primary{background:var(--wa-accent);border-color:var(--wa-accent);color:#fff}
.chat-tabs{display:flex;padding:8px 10px;gap:4px;border-bottom:1px solid var(--wa-line)}.chat-tab{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;font-size:9px;font-weight:800;color:#737a80;cursor:pointer}.chat-tab.active{background:#eef1f3;color:#1d2329}
.chat-list{overflow:auto;flex:1}.chat-row{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid #f0f1f0;cursor:pointer}.chat-row:hover,.chat-row.active{background:#f6f7f6}.chat-avatar{width:43px;height:43px;min-width:43px;border-radius:50%;overflow:hidden;background:#e7eaeb;color:#263b5b;display:grid;place-items:center;font-size:11px;font-weight:900}.chat-avatar img{width:100%;height:100%;object-fit:cover}.chat-row-main{min-width:0;flex:1}.chat-row-top{display:flex;justify-content:space-between;gap:7px}.chat-row-name{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-row-time{font-size:8px;color:#90969b;white-space:nowrap}.chat-row-preview{margin-top:4px;font-size:9px;color:#7b8289;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-row-meta{display:flex;align-items:center;gap:5px;white-space:nowrap}.chat-unread{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:99px;background:var(--wa-accent);color:#fff;font-size:8px;font-weight:900;padding:0 5px}.msg-delete{position:absolute;right:5px;top:5px;width:18px;height:18px;border:0;border-radius:50%;background:#fff;color:#8a8f93;font-size:11px;line-height:18px;display:none;cursor:pointer;padding:0}.msg:hover .msg-delete{display:block}
.chat-main{display:grid;grid-template-rows:64px minmax(0,1fr) 64px;min-width:0;min-height:0;background:#f3f5f3;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:11px;padding:0 18px;background:#fff;border-bottom:1px solid var(--wa-line)}.chat-head-copy{min-width:0;flex:1}.chat-head-name{font-size:12px;font-weight:850}.chat-head-status{font-size:9px;color:#7b8289;margin-top:3px}.chat-head-actions{display:flex;gap:6px}
.chat-messages{overflow-y:auto;overflow-x:hidden;min-height:0;padding:24px clamp(28px,7vw,110px);display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain;scroll-behavior:auto;background:linear-gradient(rgba(243,245,243,.96),rgba(243,245,243,.96)),radial-gradient(circle at 20% 20%,#e9ecea 1px,transparent 1px);background-size:auto,18px 18px}
.day-divider{align-self:center;margin:8px 0 10px;padding:5px 9px;border-radius:8px;background:#fff;border:1px solid #e3e6e3;color:#838a90;font-size:8px;font-weight:800}

.chat-composer{display:flex;align-items:center;min-height:64px;box-sizing:border-box;gap:8px;padding:10px 14px;background:#fff;border-top:1px solid var(--wa-line)}.chat-composer textarea{flex:1;min-width:0;height:42px;max-height:110px;resize:none;border:1px solid #dfe2df;border-radius:11px;padding:10px;font:11px Inter,system-ui;outline:none}.chat-composer textarea:focus{border-color:#b8bec4}.send-btn{width:42px;height:42px;border:0;border-radius:11px;background:var(--wa-accent);color:#fff;font-size:16px;cursor:pointer}
.chat-right{display:none}.profile-card{text-align:center;padding:10px 0 18px;border-bottom:1px solid var(--wa-line)}.profile-card .chat-avatar{width:74px;height:74px;margin:auto;font-size:18px}.profile-name{font-size:13px;font-weight:850;margin-top:10px}.profile-sub{font-size:9px;color:var(--wa-muted);margin-top:4px}.detail-section{padding:17px 0;border-bottom:1px solid var(--wa-line)}.detail-title{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:#8a9095;margin-bottom:9px}.detail-line{font-size:10px;color:#454b51;line-height:1.65}.friend-chip{display:flex;align-items:center;gap:7px;padding:7px;border-radius:8px;background:#f7f8f7;margin-top:5px}.friend-chip .chat-avatar{width:25px;height:25px;min-width:25px;font-size:7px}.friend-chip span{font-size:9px;font-weight:750}
.empty-chat{height:100%;display:grid;place-items:center;text-align:center;color:#838a90;font-size:11px;padding:30px}.empty-chat strong{display:block;color:#343a40;font-size:16px;margin-bottom:5px}
.modal-back{position:fixed;inset:0;background:rgba(17,21,24,.35);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}.modal-back.open{display:flex}.chat-modal{width:min(520px,100%);max-height:min(720px,90vh);overflow:auto;background:#fff;border:1px solid #dfe2df;border-radius:16px;box-shadow:0 25px 70px rgba(0,0,0,.15)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--wa-line);display:flex;justify-content:space-between;align-items:center}.modal-head strong{font-size:14px}.modal-body{padding:15px}.modal-search{width:100%;box-sizing:border-box;border:1px solid #dfe2df;border-radius:10px;padding:10px;font:11px Inter,system-ui;margin-bottom:10px}.contact{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #edf0ed;border-radius:10px;margin:6px 0}.contact-main{flex:1;min-width:0}.contact-main strong{font-size:10px}.contact-main small{display:block;color:#858b91;font-size:8px;margin-top:2px}.contact-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.modal-foot{padding:12px 15px;border-top:1px solid var(--wa-line);display:flex;justify-content:flex-end;gap:6px}
.group-picks{display:grid;gap:5px;max-height:300px;overflow:auto}.group-pick{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #edf0ed;border-radius:8px}.group-pick input{margin-left:auto}
@media(max-width:1050px){.chat-window{grid-template-columns:320px minmax(0,1fr)}.chat-right{display:none}}
@media(max-width:700px){.chat-app{padding:0;height:calc(100vh - 62px)}.chat-window{border-radius:0;border:0;grid-template-columns:1fr}.chat-left{display:none}.chat-window.mobile-list .chat-left{display:flex}.chat-window.mobile-list .chat-main{display:none}.chat-main{height:calc(100vh - 62px)}.chat-messages{padding:16px 5%}.msg{max-width:84%}}
</style>

<main class="chat-app"><div class="chat-window" id="chat-window">
<aside class="chat-left"><div class="chat-brand"><div><strong>Messages</strong><span style="display:block;margin-top:4px">KARP community</span></div><button class="icon-btn" id="profileBtn" title="Profile">⋯</button></div>

<script>
(async()=>{
const {db,auth}=await import('/karp-firebase.js');
const fs=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
const au=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js');
const {collection,doc,getDocs,query,where,orderBy,limit,onSnapshot,addDoc,setDoc,updateDoc,deleteDoc,increment,serverTimestamp}=fs;
let user=null,meProfile={},conversations=[],friends=[],incoming=[],outgoing=[],selected=null,messages=[],unsubConv=null,unsubMsg=null,unsubIncoming=null,unsubOutgoing=null,listMode='chats';
const esc=window.escapeHtml||((x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const signedIn=()=>!!user;
function updateChatNav(u){
  const box=document.getElementById('nav-actions');
  if(!box)return;
  if(!u){
    box.innerHTML='<a class="btn ghost" href="/login.html">Login</a><a class="btn primary" href="/signup.html">Join Us</a>';
    return;
  }
  const name=String(u.displayName||u.email||'KARP Member').trim();
  const initial=esc(name.charAt(0).toUpperCase()||'K');
  const img=u.photoURL?'<img src="'+esc(u.photoURL)+'" alt="" style="width:32px;height:32px;border-radius:50%;object-fit:cover">':'<span style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e8edf2;color:#263b5b;font-weight:900">'+initial+'</span>';
  box.innerHTML='<a href="/account.html" aria-label="Account" title="Account" style="display:flex;align-items:center">'+img+'</a>';
}
const displayName=()=>String(meProfile.name||user?.displayName||(user?.email||'').split('@')[0]||'KARP Member').slice(0,100);
const photo=()=>String(meProfile.photoURL||user?.photoURL||'');
const avatar=(name,url,cls='chat-avatar')=>'<span class="'+cls+'">'+(url?'<img src="'+esc(url)+'" alt="">':esc(String(name||'K').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'K'))+'</span>';
const fmt=v=>{if(!v)return'';const d=v?.toDate?v.toDate():new Date(v);if(Number.isNaN(d.getTime()))return'';const n=new Date(),same=d.toDateString()===n.toDateString();return same?d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([], {day:'2-digit',month:'short'})};
const modal=(title,body,foot='')=>{document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot;document.getElementById('modal').classList.add('open')};
const closeModal=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('modalClose').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function requireUser(){if(!signedIn()){window.showAuthPrompt?.('Sign in to KARP','Sign in to send messages and connect with KARP members.');return false}return true}
async function loadProfile(){if(!user)return;try{const s=await getDoc(doc(db,'publicProfiles',user.uid));if(s.exists())meProfile=s.data()||{};else{meProfile={uid:user.uid,name:displayName(),nameLower:displayName().toLowerCase(),photoURL:photo()};await setDoc(doc(db,'publicProfiles',user.uid),{...meProfile,updatedAt:new Date().toISOString()},{merge:true})}}catch(e){console.warn(e)}}
async function loadFriends(){
  if(!user)return;
  const uid=user.uid;
  const map=new Map();
  try{
    const s=await getDocs(query(collection(db,'friendships'),where('members','array-contains',uid)));
    s.docs.forEach(d=>{
      const x={id:d.id,...d.data()};
      if(x.status==='accepted'&&Array.isArray(x.members)&&x.members.includes(uid))map.set(d.id,x);
    });
  }catch(e){console.warn('friendship list read',e)}

  // Accepted requests are the source of truth for the connection as well.
  // This keeps the contact visible even if a friendship document was delayed or missing.
  try{
    const [inSnap,outSnap]=await Promise.all([
      getDocs(query(collection(db,'friendRequests'),where('toUid','==',uid))),
      getDocs(query(collection(db,'friendRequests'),where('fromUid','==',uid)))
    ]);
    [...inSnap.docs,...outSnap.docs].forEach(d=>{
      const r={id:d.id,...d.data()};
      if(r.status!=='accepted'||!r.fromUid||!r.toUid||r.fromUid===r.toUid)return;
      const members=[r.fromUid,r.toUid].sort();
      const fid=members.join('_');
      if(!map.has(fid))map.set(fid,{id:fid,members,status:'accepted',requestId:r.id,createdAt:r.createdAt||new Date().toISOString()});
    });
  }catch(e){console.warn('accepted request friend fallback',e)}

  friends=[...map.values()];
}
async function loadRequests(){
  if(!user)return;
  if(unsubIncoming){unsubIncoming();unsubIncoming=null}
  if(unsubOutgoing){unsubOutgoing();unsubOutgoing=null}
  const inQ=query(collection(db,'friendRequests'),where('toUid','==',user.uid));
  const outQ=query(collection(db,'friendRequests'),where('fromUid','==',user.uid));
  return new Promise(resolve=>{
    let incomingReady=false,outgoingReady=false,resolved=false;
    const finish=()=>{if(incomingReady&&outgoingReady&&!resolved){resolved=true;resolve()}};
    unsubIncoming=onSnapshot(inQ,s=>{
      incoming=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending');
      incomingReady=true;finish();
      refreshRequestViews().catch(e=>console.warn('refresh incoming request view',e));
    },e=>{console.error('incoming requests listener',e);incomingReady=true;finish()});
    unsubOutgoing=onSnapshot(outQ,s=>{
      outgoing=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending');
      outgoingReady=true;finish();
      refreshRequestViews().catch(e=>console.warn('refresh outgoing request view',e));
    },e=>{console.error('outgoing requests listener',e);outgoingReady=true;finish()});
  });
}
async function refreshRequestsFromServer(){
  if(!user)return;
  const uid=user.uid;
  const [inSnap,outSnap]=await Promise.all([
    getDocs(query(collection(db,'friendRequests'),where('toUid','==',uid))),
    getDocs(query(collection(db,'friendRequests'),where('fromUid','==',uid)))
  ]);
  if(!user||user.uid!==uid)return;
  incoming=inSnap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending');
  outgoing=outSnap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending');
  await refreshRequestViews();
}
async function refreshRequestViews(){
  if(!user)return;
  await renderList().catch(e=>console.warn('render request view',e));
  const search=document.getElementById('peopleSearch');
  if(search)await searchPeople(search.value).catch(e=>console.warn('refresh member search',e));
}
async function repairAcceptedRelationships(){
  if(!user)return;
  const uid=user.uid;
  try{
    const [inSnap,outSnap]=await Promise.all([
      getDocs(query(collection(db,'friendRequests'),where('toUid','==',uid))),
      getDocs(query(collection(db,'friendRequests'),where('fromUid','==',uid)))
    ]);
    if(!user||user.uid!==uid)return;
    const accepted=new Map();
    [...inSnap.docs,...outSnap.docs].forEach(d=>{
      const r={id:d.id,...d.data()};
      if(r.status==='accepted'&&r.fromUid&&r.toUid&&r.fromUid!==r.toUid)accepted.set(r.id,r);
    });
    const known=new Set(friends.map(f=>f.id));
    for(const r of accepted.values()){
      if(!user||user.uid!==uid)return;
      const members=[r.fromUid,r.toUid].sort();
      const fid=members.join('_');
      if(!known.has(fid)){
        try{
          await setDoc(doc(db,'friendships',fid),{
            members,status:'accepted',requestId:r.id,createdAt:r.createdAt||new Date().toISOString()
          },{merge:true});
          known.add(fid);
        }catch(e){console.warn('repair accepted KARP friendship',r.id,e);continue}
      }
      try{
        await ensureDirectConversation(r.fromUid===uid?r.toUid:r.fromUid);
      }catch(e){console.warn('repair accepted KARP conversation',r.id,e)}
    }
  }catch(e){console.warn('scan accepted KARP requests',e)}
}
async function ensureDirectConversation(otherUid){
  if(!user||!otherUid||otherUid===user.uid)throw new Error('Invalid conversation members.');
  const members=[user.uid,otherUid].sort();
  const id=members.join('_');

  // Do not trust the local friends array here: it can contain a synthetic entry
  // built from accepted requests. Verify the real Firestore friendship document.
  const friendshipSnap=await getDocs(query(
    collection(db,'friendships'),
    where('members','array-contains',user.uid)
  ));
  const realFriend=friendshipSnap.docs.find(d=>{
    const data=d.data()||{};
    return d.id===id&&data.status==='accepted'&&Array.isArray(data.members)&&members.every(x=>data.members.includes(x));
  });

  if(!realFriend){
    const [inSnap,outSnap]=await Promise.all([
      getDocs(query(collection(db,'friendRequests'),where('toUid','==',user.uid))),
      getDocs(query(collection(db,'friendRequests'),where('fromUid','==',user.uid)))
    ]);
    const accepted=[...inSnap.docs,...outSnap.docs]
      .map(d=>({id:d.id,...d.data()}))
      .find(r=>r.status==='accepted'&&(
        (r.fromUid===user.uid&&r.toUid===otherUid) ||
        (r.toUid===user.uid&&r.fromUid===otherUid)
      ));
    if(!accepted)throw new Error('This member is not connected to you yet.');

    const createdAt=accepted.createdAt||new Date().toISOString();
    await setDoc(doc(db,'friendships',id),{
      members,
      status:'accepted',
      requestId:accepted.id,
      createdAt
    },{merge:true});
  }

  const localFriend={id,members,status:'accepted'};
  const fi=friends.findIndex(x=>x.id===id);
  if(fi>=0)friends[fi]={...friends[fi],...localFriend};
  else friends.push(localFriend);

  await setDoc(doc(db,'conversations',id),{
    type:'direct',
    status:'accepted',
    members,
    updatedAt:new Date().toISOString(),
    lastMessage:''
  },{merge:true});
  return id;
}
async function loadConversations(){
  if(!user)return;
  if(unsubConv){unsubConv();unsubConv=null}
  const q=query(collection(db,'conversations'),where('members','array-contains',user.uid));
  unsubConv=onSnapshot(q,s=>{
    conversations=s.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>Date.parse(b.updatedAt||b.createdAt||0)-Date.parse(a.updatedAt||a.createdAt||0));
    renderList().catch(e=>console.warn('render conversations',e));
  },e=>console.error('conversation listener',e));
}
async function hydratePeople(ids){const map=new Map();await Promise.all([...new Set(ids.filter(Boolean))].map(async id=>{try{const s=await getDoc(doc(db,'publicProfiles',id));if(s.exists())map.set(id,{uid:id,...s.data()})}catch{}}));return map}
function otherId(c){return c.type==='direct'?c.members.find(x=>x!==user.uid)||'':''}
async function conversationPeople(){const ids=[];conversations.forEach(c=>c.members?.forEach(id=>{if(id!==user.uid)ids.push(id)}));friends.forEach(f=>f.members?.forEach(id=>{if(id!==user.uid)ids.push(id)}));incoming.forEach(r=>{if(r.fromUid&&r.fromUid!==user.uid)ids.push(r.fromUid)});outgoing.forEach(r=>{if(r.toUid&&r.toUid!==user.uid)ids.push(r.toUid)});return hydratePeople(ids)}
let people=new Map();
async function renderList(){const list=document.getElementById('chatList');people=await conversationPeople();const q=(document.getElementById('chatSearch').value||'').trim().toLowerCase();let html='';
if(listMode==='requests'){html=incoming.length?incoming.map(r=>{const p=people.get(r.fromUid)||{};return '<div class="contact" style="margin:8px"><div>'+avatar(p.name||'K',p.photoURL)+'</div><div class="contact-main"><strong>'+esc(p.name||'KARP Member')+'</strong><small>Wants to connect with you</small></div><div class="contact-actions"><button class="text-btn primary" data-accept="'+r.id+'">Accept</button><button class="text-btn" data-reject="'+r.id+'">Decline</button></div></div>'}).join(''):'<div class="empty-chat"><div>No pending requests.</div></div>'}
else if(listMode==='friends'){const arr=friends.map(f=>{const id=f.members.find(x=>x!==user.uid),p=people.get(id)||{};return{id,p}}).filter(x=>!q||String(x.p.name||'').toLowerCase().includes(q));html=arr.length?arr.map(x=>'<div class="chat-row" data-person="'+x.id+'">'+avatar(x.p.name,x.p.photoURL)+'<div class="chat-row-main"><div class="chat-row-top"><span class="chat-row-name">'+esc(x.p.name||'KARP Member')+'</span></div><div class="chat-row-preview">Friend · tap to message</div></div></div>').join(''):'<div class="empty-chat"><div>No friends yet.<br>Use ＋ to find KARP members.</div></div>'}
else{
  const chatItems=[];
  const seen=new Set();
  conversations.forEach(c=>{
    const other=c.type==='direct'?otherId(c):'';
    if(c.type==='direct'&&other)seen.add(other);
    const p=c.type==='direct'?people.get(other):null;
    const name=c.type==='group'?c.name:(p?.name||'KARP Member');
    if(!q||name.toLowerCase().includes(q)){
      chatItems.push({kind:'conversation',id:c.id,personId:other,data:c,name,url:c.type==='group'?'':p?.photoURL,unread:Number(c['unread_'+user.uid]||0)});
    }
  });
  // A friendship is itself enough to show the person in Chats even if the conversation
  // document has not appeared yet or an older conversation record is missing.
  friends.forEach(f=>{
    const other=f.members?.find(x=>x!==user.uid);
    if(!other||seen.has(other))return;
    const p=people.get(other)||{};
    const name=p.name||'KARP Member';
    if(!q||name.toLowerCase().includes(q)){
      chatItems.push({kind:'friend',id:other,personId:other,data:null,name,url:p.photoURL});
    }
  });
  chatItems.sort((a,b)=>{
    const ta=a.data?.updatedAt||a.data?.createdAt||'';
    const tb=b.data?.updatedAt||b.data?.createdAt||'';
    return Date.parse(tb||0)-Date.parse(ta||0);
  });
  html=chatItems.length?chatItems.map(x=>x.kind==='conversation'
    ? '<div class="chat-row '+(selected?.id===x.id?'active':'')+'" data-conv="'+x.id+'">'+avatar(x.name,x.url)+'<div class="chat-row-main"><div class="chat-row-top"><span class="chat-row-name">'+esc(x.name)+'</span><span class="chat-row-meta"><span class="chat-row-time">'+esc(fmt(x.data.updatedAt||x.data.createdAt))+'</span>'+(x.unread?'<span class="chat-unread">'+esc(x.unread>99?'99+':x.unread)+'</span>':'')+'</span></div><div class="chat-row-preview">'+esc(x.data.lastMessage||'No messages yet')+'</div></div></div>'
    : '<div class="chat-row" data-person="'+x.personId+'">'+avatar(x.name,x.url)+'<div class="chat-row-main"><div class="chat-row-top"><span class="chat-row-name">'+esc(x.name)+'</span></div><div class="chat-row-preview">Friend · start conversation</div></div></div>'
  ).join(''):'<div class="empty-chat"><div><strong>No conversations</strong>Start a new chat with a KARP friend.</div></div>';
}
list.innerHTML=html;
list.querySelectorAll('[data-conv]').forEach(x=>x.onclick=()=>openConversation(x.dataset.conv));
list.querySelectorAll('[data-person]').forEach(x=>x.onclick=()=>startDirect(x.dataset.person));
list.querySelectorAll('[data-accept]').forEach(x=>x.onclick=()=>acceptRequest(x.dataset.accept));
list.querySelectorAll('[data-reject]').forEach(x=>x.onclick=()=>rejectRequest(x.dataset.reject));
}
async function openConversation(id){
  const c=conversations.find(x=>x.id===id);
  if(!c)return;
  selected=c;
  if(unsubMsg)unsubMsg();
  document.getElementById('headName').textContent=c.type==='group'?c.name:(people.get(otherId(c))?.name||'KARP Member');
  const p=c.type==='direct'?people.get(otherId(c)):null;
  document.getElementById('headAvatar').outerHTML=avatar(c.type==='group'?c.name:(p?.name||'K'),c.type==='direct'?p?.photoURL:'','chat-avatar');
  document.getElementById('headStatus').textContent=c.type==='group'?((c.members?.length||0)+' members'):'Private conversation';
  document.getElementById('composer').disabled=false;
  document.getElementById('send').disabled=false;
  document.getElementById('chat-window').classList.remove('mobile-list');
  const mq=window.matchMedia('(max-width:700px)');
  if(mq.matches)document.getElementById('backMobile').style.display='grid';

  try{
    await updateDoc(doc(db,'conversations',id),{['unread_'+user.uid]:0});
  }catch(e){console.warn('mark conversation read',e)}
  conversations=conversations.map(x=>x.id===id?{...x,['unread_'+user.uid]:0}:x);
  unsubMsg=onSnapshot(query(collection(db,'conversations',id,'messages'),orderBy('createdAt','asc'),limit(500)),s=>{
    messages=s.docs.map(d=>({id:d.id,...d.data()}));
    renderMessages();
    updateDoc(doc(db,'conversations',id),{['unread_'+user.uid]:0}).catch(()=>{});
  },e=>console.error('message listener',e));
  renderList().catch(()=>{});
}
function renderMessages(){
  const e=document.getElementById('messages');
  if(!messages.length){
    e.innerHTML='<div class="empty-chat"><div><strong>No messages yet</strong>Start the conversation.</div></div>';
    return;
  }
  const first=messages[0];
  const firstDate=first.createdAt?.toDate?first.createdAt.toDate():new Date(first.createdAt||Date.now());
  const dateLabel=Number.isNaN(firstDate.getTime())?'':firstDate.toLocaleDateString([], {day:'numeric',month:'long',year:'numeric'});
  e.innerHTML=(dateLabel?'<div class="day-divider conversation-date">'+esc(dateLabel)+'</div>':'')+
    messages.map(m=>{
      const mine=m.senderId===user.uid;
      return '<div class="msg '+(mine?'mine':'')+'">'+
        (!mine&&selected?.type==='group'?'<div class="msg-author">'+esc(m.senderName||'KARP Member')+'</div>':'')+
        '<div class="msg-text">'+esc(m.deletedAt?'This message was deleted':(m.text||''))+'</div>'+
        '<div class="msg-meta">'+esc(fmt(m.createdAt))+'</div>'+
        (mine&&!m.deletedAt?'<button class="msg-delete" title="Delete message" data-delete-msg="'+m.id+'">×</button>':'')+
      '</div>';
    }).join('');
  e.querySelectorAll('[data-delete-msg]').forEach(b=>b.onclick=()=>deleteMessage(b.dataset.deleteMsg));
  e.scrollTop=e.scrollHeight;
}
async function deleteMessage(messageId){
  if(!requireUser()||!selected||!messageId)return;
  const index=messages.findIndex(x=>x.id===messageId);
  const m=messages[index];
  if(!m||m.senderId!==user.uid)return;
  try{
    await deleteDoc(doc(db,'conversations',selected.id,'messages',messageId));
    if(index===messages.length-1){
      const previous=messages[index-1];
      await updateDoc(doc(db,'conversations',selected.id),{
        lastMessage:previous?.text?String(previous.text).slice(0,180):'',
        lastSenderId:previous?.senderId||'',
        updatedAt:new Date().toISOString()
      }).catch(()=>{});
    }
  }catch(e){alert(e.message||'Could not delete message.')}
}

async function sendMessage(){
  if(!requireUser()||!selected)return;
  const e=document.getElementById('composer'),text=e.value.trim();
  if(!text)return;
  e.value='';
  try{
    await addDoc(collection(db,'conversations',selected.id,'messages'),{
      senderId:user.uid,senderName:displayName(),senderPhoto:photo(),text,createdAt:serverTimestamp()
    });
    const updateData={
      lastMessage:text.slice(0,180),
      lastSenderId:user.uid,
      updatedAt:new Date().toISOString()
    };
    (selected.members||[]).filter(uid=>uid!==user.uid).forEach(uid=>{
      updateData['unread_'+uid]=increment(1);
    });
    await updateDoc(doc(db,'conversations',selected.id),updateData);
  }catch(err){
    e.value=text;
    alert(err.message||'Could not send message.');
  }
}
document.getElementById('send').onclick=sendMessage;document.getElementById('composer').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};document.getElementById('chatSearch').oninput=renderList;
async function startDirect(uid){
  if(!requireUser()||!uid)return;
  await loadFriends();
  const friend=friends.some(f=>f.status==='accepted'&&f.members?.includes(uid));
  if(!friend){
    modal('Connect first','<p style="font-size:11px;line-height:1.6;color:#555d65">You can message members after you are connected.</p>','<button class="text-btn" id="modalFind">Find & connect</button>');
    document.getElementById('modalFind').onclick=()=>openNewChat();
    return;
  }
  try{
    const id=await ensureDirectConversation(uid);
    const local={id,type:'direct',status:'accepted',members:[user.uid,uid].sort(),updatedAt:new Date().toISOString(),lastMessage:''};
    const existingIndex=conversations.findIndex(x=>x.id===id);
    if(existingIndex>=0)conversations[existingIndex]={...conversations[existingIndex],...local};
    else conversations.unshift(local);
    await renderList();
    await openConversation(id);
  }catch(e){
    console.error('start direct chat',e);
    alert(e.message||'Could not start chat.');
  }
}
async function acceptRequest(id){
  if(!requireUser())return;
  const r=incoming.find(x=>x.id===id);
  if(!r)return;
  const members=[user.uid,r.fromUid].sort();
  const fid=members.join('_');
  const now=new Date().toISOString();
  let stage='saving the friendship record';
  try{
    const existingFriend=friends.find(f=>f.id===fid&&f.status==='accepted'&&Array.isArray(f.members)&&members.every(x=>f.members.includes(x)));
    if(!existingFriend){
      await setDoc(doc(db,'friendships',fid),{members,status:'accepted',requestId:id,createdAt:now},{merge:true});
    }
    stage='creating the private conversation';
    await ensureDirectConversation(r.fromUid);

    // Update the local UI immediately; Firestore listeners will reconcile it afterward.
    const localFriend={id:fid,members,status:'accepted',requestId:id,createdAt:now};
    const friendIndex=friends.findIndex(x=>x.id===fid);
    if(friendIndex>=0)friends[friendIndex]={...friends[friendIndex],...localFriend};
    else friends.unshift(localFriend);

    const localConversation={
      id:fid,
      type:'direct',
      status:'accepted',
      members,
      updatedAt:now,
      lastMessage:''
    };
    const conversationIndex=conversations.findIndex(x=>x.id===fid);
    if(conversationIndex>=0)conversations[conversationIndex]={...conversations[conversationIndex],...localConversation};
    else conversations.unshift(localConversation);

    stage='marking the invitation as accepted';
    await updateDoc(doc(db,'friendRequests',id),{status:'accepted',respondedAt:now});
    stage='refreshing contacts and conversations';
    await Promise.all([loadFriends(),loadConversations(),refreshRequestsFromServer()]);
    listMode='chats';
    document.querySelectorAll('.chat-tab').forEach(b=>b.classList.toggle('active',b.dataset.list==='chats'));
    await renderList();
    await openConversation(fid);
  }catch(e){
    console.error('accept request failed during '+stage,e);
    alert('Could not complete the connection ('+stage+'). Details: '+(e.message||'Missing or insufficient permissions.'));
  }
}
async function rejectRequest(id){const r=incoming.find(x=>x.id===id);if(!r)return;try{await updateDoc(doc(db,'friendRequests',id),{status:'rejected',respondedAt:new Date().toISOString()});await refreshRequestsFromServer()}catch(e){console.error('reject request',e);alert(e.message||'Could not decline request.')}}
async function openNewChat(){if(!requireUser())return;modal('New conversation','<input id="peopleSearch" class="modal-search" placeholder="Search KARP members by name…"><div id="peopleResults"><div style="font-size:10px;color:#7b8289">Search for a member to connect.</div></div>');const input=document.getElementById('peopleSearch');let timer;input.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>searchPeople(input.value),180)};input.focus();searchPeople('')}
async function searchPeople(term){const box=document.getElementById('peopleResults');if(!box)return;try{const s=await getDocs(query(collection(db,'publicProfiles'),limit(200)));const q=term.trim().toLowerCase();const arr=s.docs.map(d=>({uid:d.id,...d.data()})).filter(p=>p.uid!==user.uid&&(!q||String(p.name||'').toLowerCase().includes(q)||String(p.email||'').toLowerCase().includes(q))).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'en',{sensitivity:'base'})).slice(0,50);const friendIds=new Set(friends.flatMap(f=>f.members||[]));box.innerHTML=arr.length?arr.map(p=>{const isFriend=friendIds.has(p.uid),pendingIn=incoming.some(r=>r.fromUid===p.uid),pendingOut=outgoing.some(r=>r.toUid===p.uid);return '<div class="contact">'+avatar(p.name,p.photoURL)+'<div class="contact-main"><strong>'+esc(p.name||'KARP Member')+'</strong><small>KARP member</small></div><div class="contact-actions">'+(isFriend?'<button class="text-btn primary" data-open-person="'+p.uid+'">Message</button>':pendingIn?'<button class="text-btn" data-accept="'+(incoming.find(r=>r.fromUid===p.uid)?.id||'')+'">Accept</button>':pendingOut?'<button class="text-btn">Invited</button>':'<button class="text-btn primary" data-add="'+p.uid+'">Connect</button>')+'</div></div>'}).join(''):'<div style="padding:18px;text-align:center;font-size:10px;color:#7b8289">No members found.</div>';box.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>sendRequest(b.dataset.add));box.querySelectorAll('[data-open-person]').forEach(b=>{closeModal();startDirect(b.dataset.openPerson)});box.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>{closeModal();acceptRequest(b.dataset.accept)})}catch(e){box.innerHTML='<div style="font-size:10px;color:#9b2c2c">Could not load members.</div>'}}
async function sendRequest(uid){
  if(!requireUser()||!uid||uid===user.uid)return;
  if(outgoing.some(r=>r.toUid===uid)){await searchPeople(document.getElementById('peopleSearch')?.value||'');return}
  const id=user.uid+'_'+uid+'_'+Date.now().toString(36);
  try{
    await setDoc(doc(db,'friendRequests',id),{fromUid:user.uid,toUid:uid,status:'pending',createdAt:new Date().toISOString()});
  }catch(e){
    console.error('send KARP connection request',e);
    alert('Could not send the connection request: '+(e.message||'Permission denied'));
    return;
  }
  // A successful write is already persisted; refresh failures must not show a false send-error.
  await refreshRequestsFromServer().catch(e=>console.warn('refresh after sending request',e));
}
function invite(){const url=location.origin+'/signup.html?invite='+encodeURIComponent(user?.uid||'');navigator.clipboard?.writeText(url).then(()=>alert('Invite link copied.')).catch(()=>window.prompt('Copy this invite link:',url))}
function openGroup(initial=[]){if(!requireUser())return;const friendIds=[...new Set(friends.flatMap(f=>f.members||[]).filter(id=>id!==user.uid))];modal('New group','<input id="groupName" class="modal-search" placeholder="Group name"><div class="group-picks">'+friendIds.map(id=>{const p=people.get(id)||{};return '<label class="group-pick">'+avatar(p.name,p.photoURL)+'<span style="font-size:10px;font-weight:750">'+esc(p.name||'KARP Member')+'</span><input type="checkbox" value="'+id+'" '+(initial.includes(id)?'checked':'')+'></label>'}).join('')+'</div>','<button class="text-btn" id="groupCancel">Cancel</button><button class="text-btn primary" id="groupCreate">Create group</button>');document.getElementById('groupCancel').onclick=closeModal;document.getElementById('groupCreate').onclick=async()=>{const name=document.getElementById('groupName').value.trim();const ids=[...document.querySelectorAll('.group-pick input:checked')].map(x=>x.value);if(!name||!ids.length)return;const members=[user.uid,...ids];try{const r=await addDoc(collection(db,'conversations'),{type:'group',status:'accepted',members,createdBy:user.uid,name,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),lastMessage:''});closeModal();await loadConversations();await renderList();openConversation(r.id)}catch(e){alert(e.message||'Could not create group.')}}}
document.getElementById('newChat').onclick=openNewChat;document.getElementById('inviteBtn').onclick=invite;document.getElementById('profileBtn').onclick=()=>{if(!signedIn())return requireUser();modal('Your KARP profile','<div class="profile-card" style="border:0">'+avatar(displayName(),photo())+'<div class="profile-name">'+esc(displayName())+'</div><div class="profile-sub">'+esc(user.email||'')+'</div></div>','<button class="text-btn" id="closeProfile">Close</button>');document.getElementById('closeProfile').onclick=closeModal};document.getElementById('backMobile').onclick=()=>document.getElementById('chat-window').classList.add('mobile-list');
document.querySelectorAll('.chat-tab').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.chat-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');listMode=b.dataset.list;await renderList()});
au.onAuthStateChanged(auth,async u=>{
  if(unsubIncoming){unsubIncoming();unsubIncoming=null}
  if(unsubOutgoing){unsubOutgoing();unsubOutgoing=null}
  if(unsubConv){unsubConv();unsubConv=null}
  if(unsubMsg){unsubMsg();unsubMsg=null}
  user=u||null;updateChatNav(user);
  if(!user){
    meProfile={};conversations=[];friends=[];incoming=[];outgoing=[];selected=null;messages=[];
    document.getElementById('composer').disabled=true;document.getElementById('send').disabled=true;
    document.getElementById('chatList').innerHTML='<div class="empty-chat"><div><strong>Sign in to KARP</strong>Sign in to connect with other members.</div></div>';
    return;
  }
  await loadProfile();
  await loadFriends();
  await loadRequests();
  await loadConversations();
  await repairAcceptedRelationships();
  await Promise.all([loadFriends(),loadConversations()]);
  await renderList();
});
})();
</script>
