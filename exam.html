<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Exam</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>
window.MathJax={
  tex:{
    inlineMath:[["\\(","\\)"],["$","$"]],
    displayMath:[["\\[","\\]"],["$$","$$"]],
    processEnvironments:true,
    processEscapes:true
  },
  svg:{fontCache:"global"},
  startup:{typeset:false}
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
.exam-page{min-height:100vh;background:var(--bg);color:var(--text)}
.exam-hero{padding:78px 24px 52px;text-align:center}
.exam-hero-inner{width:min(1400px,96vw);margin:0 auto}
.exam-hero .eyebrow{margin-bottom:13px}
.exam-hero h1{font-family:'Space Grotesk';font-size:clamp(46px,6vw,82px);line-height:.96;letter-spacing:-4px;margin:0}
.exam-hero-meta{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.6}
.exam-review-wrap,.exam-active-wrap{width:min(1400px,96vw);margin:0 auto 90px}
.exam-review,.exam-paper{background:var(--panel);border-radius:22px;padding:34px 54px}
.exam-review-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:10px}
.exam-review-kicker,.exam-active-kicker{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:var(--muted)}
.exam-question{width:100%;max-width:none;box-sizing:border-box;padding:34px 0;border-top:1px solid var(--line)}
.exam-question:first-child{border-top:0}
.problem-number{font-family:'Space Grotesk';font-size:15px;font-weight:800;letter-spacing:.2px;margin-bottom:15px}
.question-text{width:100%;max-width:none;min-width:0;font-size:20px;line-height:1.9;white-space:normal;overflow-wrap:normal;word-break:normal}
.question-text p{width:100%;max-width:none;margin:0 0 18px}
.question-text p:last-child{margin-bottom:0}
.question-text mjx-container{max-width:100%!important}
.question-text mjx-container[display="true"]{display:block!important;max-width:100%!important;overflow-x:auto!important;overflow-y:hidden!important;padding:3px 0}
.question-text img{display:block;max-width:100%!important;height:auto;margin:30px auto;border-radius:12px}
.exam-solution{margin-top:20px}
.exam-solution-body{display:none;margin-top:14px;font-size:17px;line-height:1.9}
.exam-solution-body.open{display:block}
.exam-active-shell{min-height:100vh;background:var(--bg)}
.exam-active-top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:18px 24px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.exam-active-title{grid-column:1;grid-row:1;justify-self:start;min-width:0}
.exam-active-title h1{font-family:'Space Grotesk';font-size:23px;line-height:1.1;letter-spacing:-.8px;margin:4px 0 0}
.exam-active-timer{grid-column:2;grid-row:1;justify-self:center;font-family:'Space Grotesk';font-variant-numeric:tabular-nums;font-size:52px;font-weight:800;line-height:1;white-space:nowrap}
.exam-active-lang{grid-column:3;grid-row:1;justify-self:end;align-self:end;margin-bottom:-2px}
.exam-active-body{width:min(1400px,96vw);margin:0 auto;padding:28px 0 70px}
.exam-active-paper{background:var(--panel);border-radius:22px;padding:34px 54px}
.exam-active-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:24px}
.exam-enter{min-height:100vh;display:grid;place-items:center;padding:30px}
.exam-enter-card{width:min(620px,100%);background:var(--panel);border-radius:22px;padding:40px;text-align:center}
.exam-enter-card h1{font-family:'Space Grotesk';font-size:38px;letter-spacing:-1.4px;margin:8px 0 14px}
.exam-enter-card p{color:var(--muted);font-size:12px;line-height:1.7;margin-bottom:22px}
.exam-enter-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.exam-error{min-height:100vh;display:grid;place-items:center;padding:30px;text-align:center}
.exam-error-card{width:min(650px,100%)}
@media(max-width:800px){
  .exam-review,.exam-paper,.exam-active-paper{padding:25px 22px}
  .exam-active-top{grid-template-columns:1fr auto;gap:12px;padding:15px 16px}
  .exam-active-title{grid-column:1;grid-row:1}
  .exam-active-timer{grid-column:2;grid-row:1;font-size:32px}
  .exam-active-lang{grid-column:2;grid-row:2;justify-self:end;align-self:start;margin-top:2px}
  .exam-active-title h1{font-size:18px}
  .question-text{font-size:18px;line-height:1.8}
}
@media(max-width:520px){
  .exam-hero{padding:55px 18px 38px}
  .exam-hero h1{letter-spacing:-2.5px}
  .exam-active-body{width:calc(100% - 28px)}
  .exam-active-paper{padding:21px 17px}
  .exam-review-wrap{width:calc(100% - 28px)}
  .exam-review{padding:21px 17px}
}
html[data-theme="light"] .exam-page,html[data-theme="light"] .exam-active-shell,html[data-theme="light"] .exam-enter{background:#f7f7f5!important;color:#17191c!important}
</style>
</head>
<body>
<script>
(async()=>{
  const id=new URLSearchParams(location.search).get('id'),reviewMode=new URLSearchParams(location.search).get('review')==='1';
  if(!id){location.href='/exams.html';return}
  let timer=null,finished=false,fullscreenCleanup=null,activityCleanup=null,sessionCleanup=null,sessionStartedAt=null,examGuardCleanup=null,focusLost=false,currentAttemptId=null,lastTrackedQuestion=0;

  try{
    function parseExamInstant(value,offset=4){
  const raw=String(value||'').trim();
  if(!raw)return NaN;
  if(/(?:Z|[+-]\d{2}:?\d{2})$/i.test(raw))return Date.parse(raw);
  const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(m)return Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0))-Number(offset??4)*3600000;
  return Date.parse(raw);
}
    const user=await me();
    const data=await api('/api/exams/'+encodeURIComponent(id));
    const exam=data.exam;
    if(!exam){location.href='/exams.html';return}
    const history=reviewMode&&user?(await api('/api/exams/history').catch(()=>({history:[]}))).history||[]:[];
    const previous=history.find(x=>x.examId===id);
    const title=localized(exam,'title')||'Exam';
    const questions=Array.isArray(exam.questions)?exam.questions:[];
    const durationMinutes=Number(exam.durationMinutes||60);
    const timezoneOffset=Number(exam.timezoneOffset??4);
    const availableTimezoneOffset=Number(exam.availableTimezoneOffset??timezoneOffset);
    const examDateMs=parseExamInstant(exam.date,timezoneOffset);
    const availableAtMs=parseExamInstant(exam.availableAt||exam.date,availableTimezoneOffset);
    const examStatus=String(exam.status||'').toLowerCase();
    const availabilityReached=!Number.isNaN(availableAtMs)?availableAtMs<=Date.now():['open','active','finished'].includes(examStatus);
    function examStartText(){
      if(Number.isNaN(availableAtMs))return 'This exam is not available yet.';
      const off=Number(exam.availableTimezoneOffset??timezoneOffset);
      const adjusted=new Date(availableAtMs+off*3600000);
      const day=adjusted.toLocaleString('en-GB',{timeZone:'UTC',dateStyle:'medium'});
      const clock=adjusted.toLocaleTimeString('en-US',{timeZone:'UTC',hour:'numeric',minute:'2-digit',hour12:true});
      return 'This exam will become available on '+day+' at '+clock+' (UTC'+(off>=0?'+':'')+off+').';
    }

    async function writeExamSession(patch={}){
      try{
        const user=await me();if(!user)return;
        const {db}=await fb();
        const {doc,setDoc,updateDoc}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
        const sessionKey=id+'_'+user.id+'_'+(currentAttemptId||'legacy');
        const ref=doc(db,'examSessions',sessionKey);
        const now=new Date().toISOString();
        const base={examId:id,uid:user.id,attemptId:currentAttemptId||null,lastActivityAt:now};
        await setDoc(ref,{...base,...patch},{merge:true});
      }catch(e){console.warn('Exam session tracking failed:',e)}
    }
    function startExamSessionTracking(){
      const touch=()=>writeExamSession({lastActivityAt:new Date().toISOString(),lastKnownRemainingMs:Math.max(0,end-Date.now()),visibilityState:document.visibilityState,documentFocused:document.hasFocus()});
      const leave=()=>{const now=new Date().toISOString();writeExamSession({lastActivityAt:now,exitObservedAt:now,lastKnownRemainingMs:Math.max(0,end-Date.now()),visibilityState:document.visibilityState,documentFocused:false})};
      document.addEventListener('visibilitychange',touch);
      window.addEventListener('pagehide',touch);
      window.addEventListener('beforeunload',leave);
      return ()=>{document.removeEventListener('visibilitychange',touch);window.removeEventListener('pagehide',touch);window.removeEventListener('beforeunload',leave)};
    }

    function md(x){return richMarkdown(String(x||''))}
    function statement(q){return localized(q,'statement')||q.statementEn||q.statement||q.statementAz||q.text||''}
    function solution(q){return q.solution||q.solutionEn||q.solutionAz||''}
    function metaText(){
      const bits=[questions.length+' questions',formatDuration(durationMinutes)+' time'];
      if(!Number.isNaN(examDateMs)){
        const adjusted=new Date(examDateMs+timezoneOffset*3600000);
        const day=adjusted.toLocaleDateString('en-GB',{timeZone:'UTC',day:'numeric',month:'short',year:'numeric'});
        const clock=adjusted.toLocaleTimeString('en-US',{timeZone:'UTC',hour:'numeric',minute:'2-digit',hour12:true});
        bits.push(day+' · '+clock+' (UTC'+(timezoneOffset>=0?'+':'')+timezoneOffset+')');
      }
      return bits.join(' · ');
    }
    function questionHtml(q,i,withSolution){
      const sol=solution(q);
      return '<section class="exam-question" data-question="'+(i+1)+'"><div class="problem-number">Problem '+(i+1)+(q.code?' · '+escapeHtml(q.code):'')+'</div>'+(q.imageUrl?'<img class="detail-image" src="'+escapeHtml(q.imageUrl)+'" alt="Problem '+(i+1)+'">':'')+'<div class="question-text">'+md(statement(q))+'</div>'+(withSolution?'<div class="exam-solution"><button class="btn">Show solution</button><div class="exam-solution-body">'+(sol?md(sol):'<div style="color:var(--muted)">No supplied solution.</div>')+'</div></div>':'')+'</section>';
    }
    function bindSolutions(host){host.querySelectorAll('.exam-solution').forEach(box=>{const b=box.querySelector('button'),body=box.querySelector('.exam-solution-body');if(!b||!body)return;b.onclick=()=>{const open=body.classList.toggle('open');b.textContent=open?'Hide solution':'Show solution';if(open)typesetMath(body)}})}
    function clearTrackers(){activityCleanup?.();fullscreenCleanup=null;activityCleanup=null;examGuardCleanup=null;}
    function installActivity(){
      const host=document.getElementById('active-questions');if(!host)return;
      const update=()=>{const qs=[...host.querySelectorAll('.exam-question')];if(!qs.length)return;let best=0,bestDist=Infinity;qs.forEach((q,i)=>{const r=q.getBoundingClientRect(),d=Math.abs(r.top-125);if(r.bottom>85&&d<bestDist){best=i;bestDist=d}});const question=best+1;setKarpActivity({page:'Exam',label:'Taking exam',detail:title,question});if(question!==lastTrackedQuestion){lastTrackedQuestion=question;const seenAt=new Date().toISOString();writeExamSession({currentQuestion:question,lastQuestionSeenAt:seenAt,lastActivityAt:seenAt})}};
      const handler=()=>{clearTimeout(window.__karpExamActivityTimer);window.__karpExamActivityTimer=setTimeout(update,80)};
      window.addEventListener('scroll',handler,{passive:true});update();
      activityCleanup=()=>window.removeEventListener('scroll',handler);
    }
    function renderReview(){
      clearTrackers();setKarpActivity({page:'Exam Review',label:'Exam review',detail:title,question:null});
      const completedAt=previous?.submittedAt?new Date(previous.submittedAt).toLocaleString():'Completed exam';
      document.body.innerHTML='<main class="exam-page"><section class="exam-hero"><div class="exam-hero-inner"><div class="eyebrow">KARP · EXAM REVIEW</div><h1>'+escapeHtml(title)+'</h1><div class="exam-hero-meta">'+escapeHtml(metaText()+' · '+completedAt)+'</div></div></section><section class="exam-review-wrap"><section class="exam-review"><div class="exam-review-head"><div class="exam-review-kicker">COMPLETED EXAM</div><button class="btn" id="review-back">← Back to Exams</button></div><div id="review-questions">'+questions.map((q,i)=>questionHtml(q,i,true)).join('')+'</div></section></section></main>';
      document.getElementById('review-back').onclick=()=>location.href='/exams.html';
      const host=document.getElementById('review-questions');bindSolutions(host);typesetMath(host);
    }
    function renderFinishedOnly(){
      clearInterval(timer);clearTrackers();sessionCleanup?.();sessionCleanup=null;
      const finishedTitle=localized(exam,'title')||'Exam';
      document.body.innerHTML='<main class="exam-active-shell"><header class="exam-active-top exam-finished-only-top"><div></div><h1>'+escapeHtml(finishedTitle)+'</h1><div></div></header></main>';
      if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
    }
    if(reviewMode||data.completedByCurrentUser){renderFinishedOnly();return}
    if(!availabilityReached){
      const closedTitle='Exam not available yet';
      const closedText=examStartText();
      document.body.innerHTML='<main class="exam-enter"><section class="exam-enter-card"><div class="eyebrow">KARP · EXAM</div><h1>'+closedTitle+'</h1><p>'+escapeHtml(closedText)+'</p><div class="exam-enter-actions"><a class="btn primary" href="/exams.html">Back to Exams</a></div></section></main>';
      return;
    }
    if(!user){
      document.body.innerHTML='<main class="exam-enter"><section class="exam-enter-card"><div class="eyebrow">KARP · EXAM</div><h1>Sign in required</h1><p>Sign in to begin this exam.</p><div class="exam-enter-actions"><a class="btn primary" href="/login.html">Sign in</a><a class="btn" href="/exams.html">Back to Exams</a></div></section></main>';
      return;
    }

    const storageKey='able_exam_'+id;
    let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
    if(saved.submitted){renderFinishedOnly();return}
    let end=Number(saved.end)||0;
    currentAttemptId=saved.attemptId||null;
    const hasStarted=!!saved.startedAt&&!saved.submitted&&end>Date.now();
    const makeAttemptId=()=>crypto?.randomUUID?crypto.randomUUID():'attempt_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);

    async function beginExam(){
      const startedAt=new Date().toISOString();
      currentAttemptId=makeAttemptId();
      lastTrackedQuestion=0;
      sessionStartedAt=startedAt;
      end=Date.now()+durationMinutes*60000;
      localStorage.setItem(storageKey,JSON.stringify({startedAt,end,submitted:false,attemptId:currentAttemptId}));
      await markKarpExamEntry(id);
      await writeExamSession({status:'active',attemptId:currentAttemptId,startedAt,entryAt:startedAt,endedAt:null,exitAt:null,exitObservedAt:null,durationSeconds:0,lastKnownRemainingMs:durationMinutes*60000,entrySource:'start-button',lastActivityAt:startedAt});
      renderActive();startExamTimer();
    }
    async function resumeExam(){
      const current=JSON.parse(localStorage.getItem(storageKey)||'{}');
      currentAttemptId=current.attemptId||makeAttemptId();
      sessionStartedAt=current.startedAt||new Date().toISOString();
      end=Number(current.end)||end;
      localStorage.setItem(storageKey,JSON.stringify({...current,attemptId:currentAttemptId,end,submitted:false}));
      await markKarpExamEntry(id);
      const resumedAt=new Date().toISOString();
      await writeExamSession({status:'active',attemptId:currentAttemptId,startedAt:sessionStartedAt,entryAt:sessionStartedAt,resumedAt,lastActivityAt:resumedAt,exitObservedAt:null,exitAt:null,visibilityState:document.visibilityState});
      renderActive();startExamTimer();
    }
    function startExamTimer(){clearInterval(timer);tick();timer=setInterval(tick,500)}
    async function finishExam(reason){
      if(finished)return;finished=true;clearInterval(timer);clearTrackers();sessionCleanup?.();sessionCleanup=null;sessionCleanup?.();sessionCleanup=null;
      try{
        const current=JSON.parse(localStorage.getItem(storageKey)||'{}');
        const started=current.startedAt||sessionStartedAt||new Date().toISOString();
        currentAttemptId=current.attemptId||currentAttemptId||makeAttemptId();
        const endedAt=new Date(reason==='time'?Math.min(Date.now(),end||Date.now()):Date.now()).toISOString();
        const submittedAt=new Date().toISOString();
        const durationSeconds=Math.max(0,Math.min(durationMinutes*60,Math.round((Date.parse(endedAt)-Date.parse(started))/1000)));
        await api('/api/exams/'+encodeURIComponent(id)+'/submit',{method:'POST',body:JSON.stringify({answers:{},startedAt:started,endedAt,submittedAt,attemptId:currentAttemptId,durationSeconds,reason})});
        await writeExamSession({status:'completed',attemptId:currentAttemptId,startedAt:started,entryAt:started,endedAt,exitAt:endedAt,exitObservedAt:null,durationSeconds,lastActivityAt:submittedAt,submittedAt,exitReason:reason,lastKnownRemainingMs:0});
        localStorage.setItem(storageKey,JSON.stringify({startedAt:started,end,submitted:true,attemptId:currentAttemptId}));
        setKarpActivity({page:'Exam',label:'Exam finished',detail:title,question:null});
        renderFinishedOnly();
      }catch(e){
        if(/already completed/i.test(e.message||'')){
          try{const pending=JSON.parse(localStorage.getItem(storageKey)||'{}');localStorage.setItem(storageKey,JSON.stringify({...pending,submitted:true}))}catch{}
          renderFinishedOnly();return;
        }
        finished=false;
        if(end>Date.now())startExamTimer();
        toast(e.message||'Could not submit the exam.');
      }}
    async function enterExamFullscreen(){
      const el=document.documentElement;
      if(document.fullscreenElement===el)return true;
      if(!el.requestFullscreen){toast('Fullscreen is not supported by this browser.');return false}
      try{await el.requestFullscreen();return true}catch(e){console.error('Exam fullscreen error:',e);toast('Please allow fullscreen to start the exam.');return false}
    }
    function renderEntry(resume){
      document.body.innerHTML='<main class="exam-enter"><section class="exam-enter-card"><p class="exam-gate-text">This exam runs in fullscreen. Click below to begin.</p><button class="exam-continue" id="exam-continue" type="button">Continue in Fullscreen</button></section></main>';
      document.getElementById('exam-continue').onclick=async()=>{
        const ok=await enterExamFullscreen();
        if(!ok)return;
        if(resume)await resumeExam();else await beginExam();
      };
    }
    function renderActive(){
      clearTrackers();
      sessionCleanup?.();
      sessionCleanup=startExamSessionTracking();
      document.body.innerHTML='<main class="exam-active-shell"><header class="exam-active-top"><div class="exam-active-title"><h1>'+escapeHtml(localized(exam,'title')||'Exam')+'</h1></div><div class="exam-active-timer" id="exam-timer">'+timerText(end-Date.now())+'</div><div class="exam-active-lang">'+languageSwitch()+'</div></header><div class="exam-active-body"><section class="exam-active-paper"><div id="active-questions">'+questions.map((q,i)=>questionHtml(q,i,false)).join('')+'</div><div class="exam-active-actions"><button class="btn primary" id="finish-exam">Finish Exam</button></div></section></div></main>';
      document.getElementById('finish-exam').onclick=()=>{if(confirm('Finish this exam now?'))finishExam('manual')};
      bindLanguageSwitch(()=>renderActive());
      setKarpActivity({page:'Exam',label:'Taking exam',detail:localized(exam,'title')||'Exam',question:1});
      typesetMath(document.getElementById('active-questions'));installActivity();
    }
    function timerText(ms){const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
    function tick(){const el=document.getElementById('exam-timer');const left=end-Date.now();if(el)el.textContent=timerText(left);if(left<=0)finishExam('time')}

    if(saved.startedAt&&!saved.submitted){
      sessionStartedAt=saved.startedAt;
      currentAttemptId=saved.attemptId||makeAttemptId();
      if(!saved.attemptId){saved.attemptId=currentAttemptId;localStorage.setItem(storageKey,JSON.stringify(saved))}
      if(end<=Date.now()){await finishExam('time')}
      else renderEntry(true);
    }else renderEntry(false);
  }catch(err){console.error(err);document.body.innerHTML='<main class="exam-error"><section class="exam-error-card"><div class="eyebrow">KARP · EXAM</div><h1>Unable to load exam</h1><p style="color:var(--muted)">'+escapeHtml(err.message||'Something went wrong.')+'</p><a class="btn" href="/exams.html">← Back to Exams</a></section></main>'}
})();
</script>
<style>
/* Full page warm paper background */
.exam-page,.exam-active-shell,.exam-enter{background:#f7f7f5!important;color:#17191c!important}
.exam-active-body{background:#f7f7f5!important}.exam-active-top{background:#f7f7f5!important;border-bottom:1px solid #d9dad8!important}
.exam-active-paper{background:#f7f7f5!important;color:#17191c!important;box-shadow:none!important;border-radius:0!important}.exam-review,.exam-enter-card{background:#f7f7f5!important;color:#17191c!important;box-shadow:0 12px 38px rgba(69,52,34,.08)}
.exam-active-actions-top{justify-self:end;display:flex;align-items:center;gap:8px}.exam-fullscreen{width:42px;height:42px;padding:0;border-radius:11px;display:inline-grid;place-items:center;font-size:21px;background:#f7f7f5!important;color:#17191c!important;border:1px solid #d9dad8!important;cursor:pointer}
.exam-fullscreen-lock{position:fixed;inset:0;z-index:100000;display:none;place-items:center;padding:25px;background:rgba(247,247,245,.97);text-align:center}
.exam-fullscreen-lock.open{display:grid}.exam-fullscreen-lock-card{width:min(520px,100%);padding:40px 28px;border-radius:22px;background:#f7f7f5;box-shadow:0 18px 50px rgba(69,52,34,.12)}.exam-fullscreen-lock-card h2{font:800 30px/1.05 'Space Grotesk';margin:0 0 12px}.exam-fullscreen-lock-card p{font-size:11px;line-height:1.7;color:#666b73;margin:0 0 22px}.exam-fullscreen-lock-card .exam-fullscreen{width:52px;height:52px;margin:auto}
</style>
</body>
</html>

<style>
/* KARP exam review/active pages use the same continuous background */
.exam-review,.exam-review-wrap,.exam-active-body,.exam-active-paper,.exam-enter-card{
  background:var(--bg)!important;color:var(--text)!important;box-shadow:none!important;border-color:transparent!important
}
.exam-question{background:transparent!important}
</style>

<style>
/* Exact fullscreen gate: no extra copy/buttons and a blue action with black text. */
.exam-enter{background:#f7f7f5!important}
.exam-enter-card{
  background:#f7f7f5!important;
  border:0!important;
  box-shadow:none!important;
  padding:25px!important;
}
