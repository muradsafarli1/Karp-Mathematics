<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Exam</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script><style>
html[data-theme="light"] .exam-paper,
html[data-theme="light"] .exam-paper *,
html[data-theme="light"] .exam-question,
html[data-theme="light"] .exam-question * { color:#17191c !important; }
html[data-theme="light"] .exam-paper .btn,
html[data-theme="light"] .exam-paper .language-switch button.active { color:#fff !important; }
html[data-theme="light"] .exam-question { border-color:#dedfe2 !important; }
html[data-theme="light"] mjx-container { color:#17191c !important; }
.exam-paper-title{text-align:center}
.exam-paper-title h2,.exam-paper-title p,.exam-paper-title .eyebrow{text-align:center}
</style><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]]},svg:{fontCache:"global"}};</script><script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script></head><body><script>
(async()=>{const u=await requireUser();if(!u)return;const id=new URLSearchParams(location.search).get('id');if(!id){location.href='/exams.html';return}try{const d=await api('/api/exams/'+encodeURIComponent(id));const e=d.exam;if(!e){location.href='/exams.html';return}const hd=await api('/api/exams/history').catch(()=>({history:[]})),previous=(hd.history||[]).find(x=>x.examId===id),storageKey='able_exam_'+id;let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{};let startedAt=saved.startedAt||null,end=saved.end||null,finished=!!previous||!!saved.submitted,timer=null;
const fmt=ms=>{const total=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=total%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`};
const saveLocal=extra=>localStorage.setItem(storageKey,JSON.stringify({startedAt,end,submitted:finished,...extra}));
function renderReview(){const title=localized(e,'title');document.body.innerHTML=`<main class="exam-screen"><div class="exam-paper" id="exam-paper"><div style="display:flex;justify-content:flex-end">${languageSwitch()}</div><div class="exam-paper-title"><div class="eyebrow">COMPLETED EXAM</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(localized(e,'description'))}</p></div>${(e.questions||[]).map((q,i)=>`<section class="exam-question"><div class="problem-number">Problem ${i+1}${q.code?' · '+escapeHtml(q.code):''}</div>${q.imageUrl?`<img class="detail-image" src="${escapeHtml(q.imageUrl)}" alt="Problem ${i+1}" loading="lazy">`:''}<div class="question-text">${escapeHtml(localized(q,'statement'))}</div></section>`).join('')}<div class="exam-actions" style="margin-top:30px"><a class="btn" href="/exams.html">← Back to Exams</a><button class="btn primary" onclick="window.print()">Print Exam</button></div></div></main>`;bindLanguageSwitch(renderReview);typesetMath(document.getElementById('exam-paper'))}
async function finish(reason='manual'){if(finished)return;finished=true;clearInterval(timer);try{await api('/api/exams/'+encodeURIComponent(id)+'/submit',{method:'POST',body:JSON.stringify({answers:{},startedAt,reason})});saveLocal({submitted:true});if(document.fullscreenElement)await document.exitFullscreen().catch(()=>{});renderReview()}catch(err){finished=false;toast(err.message)}}
function renderActive(){const title=localized(e,'title');document.body.innerHTML=`<main class="exam-screen"><div class="exam-clock-only"><div class="exam-clock" id="timer">${fmt(end-Date.now())}</div></div><div class="exam-paper" id="exam-paper"><div style="display:flex;justify-content:flex-end">${languageSwitch()}</div><div class="exam-paper-title"><h2>${escapeHtml(title)}</h2><p>${escapeHtml(localized(e,'description'))}</p></div>${(e.questions||[]).map((q,i)=>`<section class="exam-question"><div class="problem-number">Problem ${i+1}${q.code?' · '+escapeHtml(q.code):''}</div>${q.imageUrl?`<img class="detail-image" src="${escapeHtml(q.imageUrl)}" alt="Problem ${i+1}" loading="lazy">`:''}<div class="question-text">${escapeHtml(localized(q,'statement'))}</div><div class="print-answer-space"></div></section>`).join('')}</div></main>`;bindLanguageSwitch(renderActive);typesetMath(document.getElementById('exam-paper'))}
if(finished){renderReview();return}startedAt=saved.startedAt||new Date().toISOString();end=saved.end||Date.now()+Number(e.durationMinutes||60)*60000;saveLocal({startedAt,end,submitted:false});renderActive();async function enterFullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch{}}await enterFullscreen();timer=setInterval(()=>{const left=end-Date.now(),el=document.getElementById('timer');if(el)el.textContent=fmt(left);if(left<=0)finish('time')},250);window.addEventListener('beforeunload',ev=>{if(!finished){saveLocal();ev.preventDefault();ev.returnValue=''}});document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&!finished){toast('Fullscreen is required for the exam.');setTimeout(enterFullscreen,300)}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!finished)toast('Please return to the exam. The timer continues running.')});document.addEventListener('contextmenu',ev=>{if(!finished)ev.preventDefault()});
}catch(err){console.error('Exam loading error:',err);document.body.innerHTML=`<div class="error-page"><h1>Unable to load exam</h1><p>${escapeHtml(err.message)}</p><a href="/exams.html">← Back to Exams</a></div>`}})();
</script></body></html>
