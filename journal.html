<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Journal</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<style>
.journal-page{min-height:calc(100vh - 76px);background:#f7f7f5}
.journal-hero{padding:62px 0 34px;border-bottom:1px solid #d9dad8;background:#f7f7f5}
.journal-hero h1{font-family:'Space Grotesk';font-size:clamp(42px,6vw,72px);letter-spacing:-3px;margin:7px 0 12px;color:#17191c}
.journal-hero p{max-width:720px;color:#666b73;font-size:13px;line-height:1.8;margin:0}
.journal-layout{width:min(calc(100% - 42px),1240px);margin:0 auto;padding:30px 0 90px}
.journal-issues{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.journal-list{display:grid;gap:9px;position:sticky;top:96px}
.journal-issue-card{width:100%;text-align:left;border:1px solid #d5d5d1;background:#eeeeeb;border-radius:14px;padding:14px 15px;cursor:pointer;color:#17191c}
.journal-issue-card:hover{background:#e5e5e1}.journal-issue-card.active{border-color:#17191c;background:#fff}
.journal-issue-card strong{display:block;font-size:13px;line-height:1.35}.journal-issue-card span{display:block;color:#666b73;font-size:9px;line-height:1.5;margin-top:5px}
.journal-viewer-shell{background:#eeeeeb;border:1px solid #d5d5d1;border-radius:18px;padding:17px}
.journal-viewer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
.journal-viewer-title h2{font-family:'Space Grotesk';font-size:24px;letter-spacing:-.5px;margin:0;color:#17191c}.journal-viewer-title p{font-size:10px;color:#666b73;margin:5px 0 0}
.journal-paper-wrap{background:#dcdcd8;border-radius:14px;padding:22px;display:grid;place-items:center;min-height:640px;overflow:auto}
.journal-paper{background:#fff;box-shadow:0 14px 35px rgba(0,0,0,.14);max-width:100%;transform-origin:left center}
#journal-canvas{display:block;max-width:100%;height:auto}
.journal-loading{min-height:640px;display:grid;place-items:center;color:#666b73;font-size:12px}
.journal-controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.journal-controls .btn{min-width:92px}.journal-page-count{min-width:110px;text-align:center;font-size:10px;color:#666b73;font-weight:800}
.journal-empty{padding:80px 20px;text-align:center;color:#666b73;font-size:12px;border:1px dashed #d5d5d1;border-radius:16px}
.journal-download{white-space:nowrap}
@keyframes journalNext{0%{transform:perspective(900px) rotateY(-3deg);opacity:.72}100%{transform:perspective(900px) rotateY(0);opacity:1}}
@keyframes journalPrev{0%{transform:perspective(900px) rotateY(3deg);opacity:.72}100%{transform:perspective(900px) rotateY(0);opacity:1}}
.journal-paper.flip-next{animation:journalNext .2s ease}.journal-paper.flip-prev{animation:journalPrev .2s ease}
@media(max-width:900px){.journal-issues{grid-template-columns:1fr}.journal-list{position:static;display:flex;overflow:auto;padding-bottom:3px}.journal-issue-card{min-width:235px}.journal-paper-wrap{min-height:460px;padding:12px}.journal-loading{min-height:460px}}
@media(max-width:620px){.journal-layout{width:calc(100% - 28px);padding-top:20px}.journal-hero{padding-top:45px}.journal-viewer-head{flex-direction:column}.journal-paper-wrap{min-height:390px}}
</style>
<script>
window.KARPPdfReady=import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs').then(pdfjsLib=>{
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
  return pdfjsLib;
});
</script>
</head>
<body>
<script>
(async()=>{
  const {db}=await fb();
  const {collection,getDocs}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
  const pdfjsLib=await window.KARPPdfReady;

  shell('Journal','Journal',
    '<main class="journal-page">'+
      '<section class="journal-hero"><div class="wrap"><h1>Journal</h1></div></section>'+
      '<section class="journal-layout"><div id="journal-root"><div class="journal-empty">Loading journals…</div></div></section>'+
    '</main>'
  );

  const root=document.getElementById('journal-root');
  let issues=[],current=null,pdf=null,page=1,scale=1;

  function b64ToBytes(base64){
    const binary=atob(base64),bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return bytes;
  }
  async function loadPdfBytes(issue){
    const snap=await getDocs(collection(db,'journalIssues',issue.id,'chunks'));
    const chunks=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>Number(a.index??a.id)-Number(b.index??b.id));
    if(!chunks.length)throw new Error('PDF data is missing.');
    const parts=chunks.map(x=>b64ToBytes(x.data));
    const total=parts.reduce((n,x)=>n+x.length,0);
    const out=new Uint8Array(total);let offset=0;
    parts.forEach(part=>{out.set(part,offset);offset+=part.length});
    return out.buffer;
  }
  function safeDate(v){const d=new Date(v||0);return isNaN(d)?'':d.toLocaleDateString()}
  function escLocal(v){return escapeHtml(String(v??''))}
  function renderIssueList(){
    const list=issues.map(x=>'<button class="journal-issue-card '+(current?.id===x.id?'active':'')+'" data-journal-id="'+escLocal(x.id)+'"><strong>'+escLocal(x.title||x.fileName||'Untitled Journal')+'</strong><span>'+escLocal(safeDate(x.createdAt))+' · '+(Number(x.size||0)/1024/1024).toFixed(2)+' MB</span></button>').join('');
    return '<aside class="journal-list">'+(list||'<div class="journal-empty">No journal issues published yet.</div>')+'</aside>';
  }
  function renderViewer(){
    if(!current)return '<section class="journal-viewer-shell"><div class="journal-empty">No journal selected.</div></section>';
    return '<section class="journal-viewer-shell">'+
      '<div class="journal-viewer-head"><div class="journal-viewer-title"><h2>'+escLocal(current.title||current.fileName||'Untitled Journal')+'</h2><p>'+escLocal(current.description||'')+'</p></div><button class="btn journal-download" id="journal-download" type="button">Download PDF</button></div>'+
      '<div class="journal-paper-wrap"><div id="journal-loading" class="journal-loading">Loading PDF…</div><div class="journal-paper" id="journal-paper" style="display:none"><canvas id="journal-canvas"></canvas></div></div>'+
      '<div class="journal-controls"><button class="btn" id="journal-prev" type="button">← Previous</button><span class="journal-page-count" id="journal-page-count">Page —</span><button class="btn" id="journal-next" type="button">Next →</button></div>'+
    '</section>';
  }
  function renderLayout(){
    root.innerHTML='<div class="journal-issues">'+renderIssueList()+renderViewer()+'</div>';
    root.querySelectorAll('[data-journal-id]').forEach(b=>b.onclick=()=>selectIssue(b.dataset.journalId));
    document.getElementById('journal-prev')?.addEventListener('click',()=>changePage(-1));
    document.getElementById('journal-next')?.addEventListener('click',()=>changePage(1));
    document.getElementById('journal-download')?.addEventListener('click',downloadCurrent);
  }
  async function renderPage(direction=1){
    if(!pdf)return;
    const canvas=document.getElementById('journal-canvas'),paper=document.getElementById('journal-paper'),loading=document.getElementById('journal-loading');
    const wrap=document.querySelector('.journal-paper-wrap');
    const maxWidth=Math.max(260,(wrap?.clientWidth||900)-44);
    const base=pdf.getPage(page);
    const p=await base;
    const unscaled=p.getViewport({scale:1});
    scale=Math.min(1.8,Math.max(.75,maxWidth/unscaled.width));
    const viewport=p.getViewport({scale});
    const ratio=Math.min(window.devicePixelRatio||1.5,2);
    canvas.width=Math.round(viewport.width*ratio);canvas.height=Math.round(viewport.height*ratio);
    canvas.style.width=Math.round(viewport.width)+'px';canvas.style.height=Math.round(viewport.height)+'px';
    const ctx=canvas.getContext('2d',{alpha:false});
    ctx.setTransform(ratio,0,0,ratio,0,0);
    await p.render({canvasContext:ctx,viewport}).promise;
    loading.style.display='none';paper.style.display='block';
    paper.classList.remove('flip-next','flip-prev');void paper.offsetWidth;paper.classList.add(direction>=0?'flip-next':'flip-prev');
    document.getElementById('journal-page-count').textContent='Page '+page+' / '+pdf.numPages;
    document.getElementById('journal-prev').disabled=page<=1;
    document.getElementById('journal-next').disabled=page>=pdf.numPages;
  }
  async function selectIssue(id){
    current=issues.find(x=>x.id===id)||null;pdf=null;page=1;renderLayout();
    if(!current)return;
    try{
      const bytes=await loadPdfBytes(current);
      pdf=await pdfjsLib.getDocument({data:bytes}).promise;
      await renderPage(1);
    }catch(e){
      const loading=document.getElementById('journal-loading');if(loading)loading.textContent=e.message||'Could not load this PDF.';
    }
  }
  async function changePage(delta){
    if(!pdf)return;
    const next=page+delta;if(next<1||next>pdf.numPages)return;
    page=next;await renderPage(delta);
  }
  async function downloadCurrent(){
    if(!current)return;
    try{
      const bytes=await loadPdfBytes(current);
      const blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=current.fileName||((current.title||'journal').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')+'.pdf');document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }catch(e){toast(e.message||'Could not download PDF.')}
  }

  try{
    const snap=await getDocs(collection(db,'journalIssues'));
    issues=snap.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.published!==false).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
    if(issues.length){current=issues[0];}
    renderLayout();
    if(current)await selectIssue(current.id);
    window.addEventListener('resize',()=>{if(pdf)renderPage(0).catch(()=>{})});
  }catch(e){
    console.error('KARP Journal load error',e);
    root.innerHTML='<div class="journal-empty"><strong>Journal is temporarily unavailable.</strong><br><span style="display:block;margin-top:8px">Please refresh the page. '+escLocal(e?.message||'')+'</span></div>';
  }
})();
</script>
</body>
</html>
