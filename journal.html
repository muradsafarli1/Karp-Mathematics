<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Journal</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<style>
html,body{margin:0!important;padding:0!important;width:100%;height:100%;overflow:hidden;background:#eef0f2!important}
.karp-pdf-browser{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff;color:#202124;font-family:Arial,sans-serif}
.karp-pdf-tabs{height:42px;display:flex;align-items:flex-end;background:#e9eaec;border-bottom:1px solid #c8cbd0;padding:0 8px;gap:3px}
.karp-pdf-tab{height:36px;min-width:180px;max-width:260px;padding:0 12px;display:flex;align-items:center;gap:8px;background:#dfe1e5;border:1px solid #c9cbd0;border-bottom:0;border-radius:9px 9px 0 0;cursor:pointer;color:#3c4043;font-size:12px}.karp-pdf-tab.active{background:#fff;color:#202124}.karp-pdf-tab .tab-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.karp-pdf-tab .tab-close{font-size:16px;color:#666}.karp-pdf-new{height:32px;width:32px;border:0;background:transparent;font-size:23px;color:#4b4f53;cursor:pointer;margin-bottom:2px}
.karp-pdf-bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid #d7d9dc}.karp-pdf-bar button{border:0;background:transparent;border-radius:6px;padding:7px 9px;color:#444;cursor:pointer;font-size:13px}.karp-pdf-bar button:hover{background:#f0f1f2}.pdf-title{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.karp-pdf-stage{position:relative;flex:1;min-height:0;background:#525659;overflow:auto;display:flex;justify-content:center;padding:24px}.karp-pdf-frame{width:min(100%,1100px);height:100%;min-height:700px;border:0;background:#525659}.karp-pdf-loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px}
.karp-pdf-picker{position:fixed;z-index:20;inset:88px 8% 8%;background:#fff;border:1px solid #c8cbd0;border-radius:10px;box-shadow:0 20px 60px #0004;display:none;overflow:auto;padding:28px}.karp-pdf-picker h2{margin:0 0 18px;font-size:22px}.karp-pdf-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}.karp-picker-card{border:1px solid #d5d7da;border-radius:8px;padding:10px;background:#fff;cursor:pointer;text-align:left}.karp-picker-card img{width:100%;aspect-ratio:.707;object-fit:cover;display:block}.karp-picker-card strong{display:block;font-size:11px;margin-top:8px}
</style>
<script>
window.KARPPdfReady=import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs').then(pdfjsLib=>{
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
  return pdfjsLib;
});
</script>
</head>
<body>
<script>
(async()=>{
 const {db}=await fb();const {doc,getDoc,getDocs,collection,updateDoc,increment}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
 const esc=x=>escapeHtml(String(x??''));const id=new URLSearchParams(location.search).get('id');
 if(!id){location.href='/journal.html';return}
 const snap=await getDoc(doc(db,'journalIssues',id));if(!snap.exists()){location.href='/journal.html';return}
 const current={id:snap.id,...snap.data()};
 document.body.innerHTML='<div class="karp-pdf-browser"><div class="karp-pdf-tabs" id="pdf-tabs"><button class="karp-pdf-new" id="pdf-new">+</button></div><div class="karp-pdf-bar"><button id="pdf-back">←</button><button id="pdf-home">⌂</button><span class="pdf-title" id="pdf-title"></span></div><div class="karp-pdf-stage"><div class="karp-pdf-loading" id="pdf-loading">Opening PDF…</div><iframe id="pdf-frame" class="karp-pdf-frame"></iframe></div><div class="karp-pdf-picker" id="picker"><h2>Journals</h2><div class="karp-pdf-picker-grid" id="picker-grid"></div></div></div>';
 const tabs=document.getElementById('pdf-tabs'),frame=document.getElementById('pdf-frame'),loading=document.getElementById('pdf-loading'),titleEl=document.getElementById('pdf-title'),picker=document.getElementById('picker'),pg=document.getElementById('picker-grid');let issues=[],states=new Map();
 const b64=x=>{const bin=atob(x),o=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)o[i]=bin.charCodeAt(i);return o};
 async function urlFor(issue){let st=states.get(issue.id);if(st?.url)return st.url;const ss=await getDocs(collection(db,'journalIssues',issue.id,'chunks'));const parts=ss.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>Number(a.index??a.id)-Number(b.index??b.id));const bytes=parts.reduce((acc,p)=>{const z=b64(p.data),n=new Uint8Array(acc.length+z.length);n.set(acc);n.set(z,acc.length);return n},new Uint8Array());const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));states.set(issue.id,{issue,url:u});return u}
 function addTab(issue){const x=document.createElement('button');x.className='karp-pdf-tab active';x.dataset.id=issue.id;x.innerHTML='<span class="tab-title">'+esc(issue.title||issue.fileName||'Journal')+'</span><span class="tab-close">×</span>';x.onclick=()=>open(issue.id);x.querySelector('.tab-close').onclick=e=>{e.stopPropagation();close(issue.id)};tabs.insertBefore(x,document.getElementById('pdf-new'));states.set(issue.id,{issue});}
 async function open(issueId){const issue=issues.find(x=>x.id===issueId)||current;if(!states.has(issue.id))addTab(issue);tabs.querySelectorAll('.karp-pdf-tab').forEach(x=>x.classList.toggle('active',x.dataset.id===issue.id));titleEl.textContent=issue.title||issue.fileName||'Journal';loading.style.display='grid';frame.src=await urlFor(issue);loading.style.display='none';picker.style.display='none';try{await updateDoc(doc(db,'journalIssues',issue.id),{readCount:increment(1)})}catch(e){}history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(issue.id))}
 function close(id){const st=states.get(id);if(st?.url)URL.revokeObjectURL(st.url);states.delete(id);tabs.querySelector('[data-id="'+CSS.escape(id)+'"]')?.remove();const next=[...states.keys()].at(-1);if(next)open(next);else location.href='/journal.html'}
 document.getElementById('pdf-new').onclick=()=>{picker.style.display='block';pg.innerHTML=issues.map(x=>'<button class="karp-picker-card" data-pick="'+esc(x.id)+'">'+(x.coverImage?'<img src="'+esc(x.coverImage)+'">':'<div style="aspect-ratio:.707;background:#eee;display:grid;place-items:center">PDF</div>')+'<strong>'+esc(x.title||x.fileName||'Journal')+'</strong></button>').join('');pg.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>open(x.dataset.pick))};
 document.getElementById('pdf-back').onclick=()=>history.back();document.getElementById('pdf-home').onclick=()=>location.href='/journal.html';
 const ss=await getDocs(collection(db,'journalIssues'));issues=ss.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.published!==false).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));await open(current.id);
})().catch(e=>{document.body.innerHTML='<div style="padding:40px;font:14px Arial;text-align:center">Could not open PDF: '+escapeHtml(e.message||'')+'</div>'});
</script>
</body>
</html>
