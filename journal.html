<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARP — Journal</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script><style>
.journal-page{min-height:100vh;background:#f7f7f5;color:#17191c}.journal-hero{padding:38px 24px 26px;text-align:center}.journal-hero h1{font-family:'Space Grotesk';font-size:clamp(46px,6vw,76px);line-height:1;letter-spacing:-3px;margin:0}.journal-search-wrap{width:min(560px,calc(100% - 28px));margin:14px auto 44px}.journal-search{width:100%;box-sizing:border-box;padding:13px 17px;border:1px solid #d9dad8;border-radius:12px;background:#eeeeeb;color:#17191c;font:500 13px 'Inter',sans-serif;outline:none}.journal-grid{width:min(1220px,calc(100% - 42px));margin:0 auto;padding:0 0 80px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:30px 24px}.journal-card{display:block;min-width:0;text-decoration:none;color:inherit}.journal-cover{position:relative;aspect-ratio:.7071;overflow:hidden;border:1px solid #cfd2ce;border-radius:0;background:#fff;box-shadow:0 9px 22px rgba(30,34,38,.08);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.journal-cover img{display:block;width:100%;height:100%;object-fit:cover;background:#fff}.journal-cover-fallback{position:absolute;inset:0;padding:24px 18px;display:flex;flex-direction:column;justify-content:space-between;background:#eeeeeb}.journal-cover-fallback h2{font-family:'Space Grotesk';font-size:21px;line-height:1.08;letter-spacing:-.7px;margin:0;color:#17191c;overflow-wrap:anywhere}.journal-cover-fallback small{font-size:8px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;color:#686d73}.journal-card:hover .journal-cover{transform:translateY(-4px);border-color:#aeb3af;box-shadow:0 13px 28px rgba(30,34,38,.13)}.journal-card-meta{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 4px 0}.journal-card-title{display:block;width:100%;font-size:14px;font-weight:700;line-height:1.38;overflow-wrap:anywhere;color:#2a2d31}.journal-views{display:inline-flex;align-items:center;justify-content:center;gap:5px;color:#666b73;font-size:10px}.journal-views svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}.journal-empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:#737a80;font-size:13px}@media(max-width:1120px){.journal-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 20px}}@media(max-width:900px){.journal-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 16px}}@media(max-width:680px){.journal-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 13px}.journal-card-title{font-size:12px}}@media(max-width:480px){.journal-grid{width:calc(100% - 28px)}.journal-search-wrap{margin-bottom:34px}}
.karp-pdf-browser{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff;color:#202124;font-family:Arial,sans-serif}.karp-pdf-tabs{height:42px;display:flex;align-items:flex-end;background:#e9eaec;border-bottom:1px solid #c8cbd0;padding:0 8px;gap:3px}.karp-pdf-tab{height:36px;min-width:180px;max-width:260px;padding:0 12px;display:flex;align-items:center;gap:8px;background:#dfe1e5;border:1px solid #c9cbd0;border-bottom:0;border-radius:9px 9px 0 0;cursor:pointer;color:#3c4043;font-size:12px}.karp-pdf-tab.active{background:#fff;color:#202124}.karp-pdf-tab .tab-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.karp-pdf-tab .tab-close{font-size:16px;color:#666}.karp-pdf-new{height:32px;width:32px;border:0;background:transparent;font-size:23px;color:#4b4f53;cursor:pointer;margin-bottom:2px}.karp-pdf-bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid #d7d9dc}.karp-pdf-bar button{border:0;background:transparent;border-radius:6px;padding:7px 9px;color:#444;cursor:pointer;font-size:13px}.karp-pdf-bar button:hover{background:#f0f1f2}.pdf-title{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.karp-pdf-stage{position:relative;flex:1;min-height:0;background:#525659;overflow:auto;display:flex;justify-content:center;padding:24px}.karp-pdf-frame{width:min(100%,1100px);height:100%;min-height:700px;border:0;background:#525659}.karp-pdf-loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px}.karp-pdf-picker{position:fixed;z-index:20;inset:88px 8% 8%;background:#fff;border:1px solid #c8cbd0;border-radius:10px;box-shadow:0 20px 60px #0004;display:none;overflow:auto;padding:28px}.karp-pdf-picker h2{margin:0 0 18px;font-size:22px}.karp-pdf-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}.karp-picker-card{border:1px solid #d5d7da;border-radius:8px;padding:10px;background:#fff;cursor:pointer;text-align:left}.karp-picker-card img{width:100%;aspect-ratio:.707;object-fit:cover;display:block}.karp-picker-card strong{display:block;font-size:11px;margin-top:8px}
</style></head><body><script>if(new URLSearchParams(location.search).get('id')){(async()=>{const {db}=await fb();const {doc,getDoc,getDocs,collection,updateDoc,increment}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');const esc=x=>escapeHtml(String(x??''));const id=new URLSearchParams(location.search).get('id');const snap=await getDoc(doc(db,'journalIssues',id));if(!snap.exists()){location.href='/journal.html';return}const current={id:snap.id,...snap.data()};document.body.innerHTML='<div class="karp-pdf-browser"><div class="karp-pdf-tabs" id="pdf-tabs"><button class="karp-pdf-new" id="pdf-new">+</button></div><div class="karp-pdf-bar"><button id="pdf-back">←</button><button id="pdf-home">⌂</button><span class="pdf-title" id="pdf-title"></span></div><div class="karp-pdf-stage"><div class="karp-pdf-loading" id="pdf-loading">Opening PDF…</div><iframe id="pdf-frame" class="karp-pdf-frame"></iframe></div><div class="karp-pdf-picker" id="picker"><h2>Journals</h2><div class="karp-pdf-picker-grid" id="picker-grid"></div></div></div>';const tabs=document.getElementById('pdf-tabs'),frame=document.getElementById('pdf-frame'),loading=document.getElementById('pdf-loading'),titleEl=document.getElementById('pdf-title'),picker=document.getElementById('picker'),pg=document.getElementById('picker-grid');let issues=[],states=new Map();const b64=x=>{const bin=atob(x),o=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)o[i]=bin.charCodeAt(i);return o};async function urlFor(issue){let st=states.get(issue.id);if(st?.url)return st.url;const ss=await getDocs(collection(db,'journalIssues',issue.id,'chunks'));const parts=ss.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>Number(a.index??a.id)-Number(b.index??b.id));const bytes=parts.reduce((acc,p)=>{const z=b64(p.data),n=new Uint8Array(acc.length+z.length);n.set(acc);n.set(z,acc.length);return n},new Uint8Array());const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));states.set(issue.id,{issue,url:u});return u}function addTab(issue){const x=document.createElement('button');x.className='karp-pdf-tab active';x.dataset.id=issue.id;x.innerHTML='<span class="tab-title">'+esc(issue.title||issue.fileName||'Journal')+'</span><span class="tab-close">×</span>';x.onclick=()=>open(issue.id);x.querySelector('.tab-close').onclick=e=>{e.stopPropagation();close(issue.id)};tabs.insertBefore(x,document.getElementById('pdf-new'));states.set(issue.id,{issue})}async function open(issueId){const issue=issues.find(x=>x.id===issueId)||current;if(!states.has(issue.id))addTab(issue);tabs.querySelectorAll('.karp-pdf-tab').forEach(x=>x.classList.toggle('active',x.dataset.id===issue.id));titleEl.textContent=issue.title||issue.fileName||'Journal';loading.style.display='grid';frame.src=await urlFor(issue);loading.style.display='none';picker.style.display='none';try{await updateDoc(doc(db,'journalIssues',issue.id),{readCount:increment(1)})}catch(e){}history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(issue.id))}function close(id){const st=states.get(id);if(st?.url)URL.revokeObjectURL(st.url);states.delete(id);tabs.querySelector('[data-id="'+CSS.escape(id)+'"]')?.remove();const next=[...states.keys()].at(-1);if(next)open(next);else location.href='/journal.html'}document.getElementById('pdf-new').onclick=()=>{picker.style.display='block';pg.innerHTML=issues.map(x=>'<button class="karp-picker-card" data-pick="'+esc(x.id)+'">'+(x.coverImage?'<img src="'+esc(x.coverImage)+'">':'<div style="aspect-ratio:.707;background:#eee;display:grid;place-items:center">PDF</div>')+'<strong>'+esc(x.title||x.fileName||'Journal')+'</strong></button>').join('');pg.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>open(x.dataset.pick))};document.getElementById('pdf-back').onclick=()=>history.back();document.getElementById('pdf-home').onclick=()=>location.href='/journal.html';const ss=await getDocs(collection(db,'journalIssues'));issues=ss.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.published!==false).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));await open(current.id)})().catch(e=>{document.body.innerHTML='<div style="padding:40px;font:14px Arial;text-align:center">Could not open Journal: '+escapeHtml(e.message||'')+'</div>'})()}else{(async()=>{try{const {db}=await fb();const {collection,getDocs}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');shell('Journal','Journal','<main class="journal-page"><section class="journal-hero"><div class="wrap"><h1>Journal</h1></div></section><div class="journal-search-wrap"><input id="journal-search" class="journal-search" type="search" placeholder="Search journals..." autocomplete="off"></div><section id="journal-grid" class="journal-grid"><div class="journal-empty">Loading journals…</div></section></main>');const grid=document.getElementById('journal-grid'),search=document.getElementById('journal-search');let issues=[];const esc=x=>escapeHtml(String(x??''));const eye='<svg viewBox="0 0 24 24"><path d="M2.4 12s3.6-5.2 9.6-5.2S21.6 12 21.6 12 18 17.2 12 17.2 2.4 12 2.4 12Z"></path><circle cx="12" cy="12" r="2.7"></circle></svg>';const fmt=n=>{n=Math.max(0,Number(n||0));return n>=1000000?(n/1000000).toFixed(1).replace(/\.0$/,'')+'M':n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'K':String(n)};function render(){const q=String(search.value||'').trim().toLowerCase();const filtered=issues.filter(x=>String(x.title||x.fileName||'').toLowerCase().includes(q));grid.innerHTML=filtered.length?filtered.map(x=>{const title=x.title||x.fileName||'Untitled Journal';return '<a class="journal-card" href="/journal.html?id='+encodeURIComponent(x.id)+'"><div class="journal-cover">'+(x.coverImage?'<img src="'+esc(x.coverImage)+'" alt="">':'<div class="journal-cover-fallback"><small>KARP · OLYMPIAD MATHEMATICS</small><h2>'+esc(title)+'</h2><small>JOURNAL ISSUE</small></div>')+'</div><div class="journal-card-meta"><span class="journal-card-title">'+esc(title)+'</span><span class="journal-views">'+eye+esc(fmt(x.readCount))+'</span></div></a>'}).join(''):'<div class="journal-empty">'+(q?'No journals match your search.':'No journal issues have been published yet.')+'</div>'}search.addEventListener('input',render);const snap=await getDocs(collection(db,'journalIssues'));issues=snap.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.published!==false).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));render()}catch(e){document.body.innerHTML='<div class="error-page"><h1>Unable to load Journal</h1><p>'+escapeHtml(e.message||'Something went wrong.')+'</p><a href="/">← Back to KARP</a></div>'}})()}</script></body></html>
