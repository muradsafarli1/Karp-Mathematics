<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Journal</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<style>
html,body{margin:0!important;padding:0!important;width:100%;height:100%;overflow:hidden;background:#525659!important}
.karp-pdf-browser{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff;color:#202124;font-family:Arial,sans-serif}
.karp-pdf-tabs{height:42px;display:flex;align-items:flex-end;background:#dee0e3;border-bottom:1px solid #bfc2c7;padding:0 8px;gap:3px;flex:0 0 auto;overflow-x:auto}
.karp-pdf-tab{height:36px;min-width:180px;max-width:280px;padding:0 11px;display:flex;align-items:center;gap:8px;background:#cfd2d7;border:1px solid #b8bbc0;border-bottom:0;border-radius:9px 9px 0 0;cursor:pointer;color:#3c4043;font-size:12px;box-sizing:border-box}
.karp-pdf-tab.active{background:#fff;color:#202124}
.karp-pdf-tab .tab-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.karp-pdf-tab .tab-close{font-size:17px;color:#666;line-height:1}
.karp-pdf-new{height:32px;width:34px;border:0;background:transparent;font-size:23px;color:#4b4f53;cursor:pointer;margin-bottom:2px;flex:0 0 auto}
.karp-pdf-bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid #d7d9dc;flex:0 0 auto}
.karp-pdf-bar button{border:0;background:transparent;border-radius:6px;padding:7px 9px;color:#444;cursor:pointer;font-size:13px}
.karp-pdf-bar button:hover{background:#f0f1f2}
.karp-pdf-bar .pdf-title{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.karp-pdf-bar #pdf-download{margin-left:auto;white-space:nowrap;border:1px solid #d5d7da;background:#f7f8f9;font-weight:600;color:#34383d}
.karp-pdf-bar #pdf-download:disabled{opacity:.55;cursor:wait}
.karp-pdf-stage{position:relative;flex:1;min-height:0;background:#525659;overflow:hidden}
.karp-pdf-frame{display:block;width:100%;height:100%;border:0;background:#525659}
.karp-pdf-loading{position:absolute;z-index:2;inset:0;display:grid;place-items:center;background:#525659;color:#fff;font-size:13px;pointer-events:none}
.karp-journal-picker{position:fixed;z-index:20;inset:88px 8% 8%;background:#fff;border:1px solid #c8cbd0;border-radius:10px;box-shadow:0 20px 60px #0004;display:none;overflow:auto;padding:28px}
.karp-journal-picker h2{margin:0 0 14px;font-size:22px}
.karp-journal-picker-search{display:block;width:min(520px,100%);box-sizing:border-box;padding:11px 13px;margin:0 0 20px;border:1px solid #d5d7da;border-radius:8px;background:#f7f8f9;color:#202124;font-size:13px;outline:none}
.karp-journal-picker-search:focus{border-color:#9aa0a6;box-shadow:0 0 0 2px #2021240b}
.karp-journal-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.karp-picker-card{border:1px solid #d5d7da;border-radius:8px;padding:10px;background:#fff;cursor:pointer;text-align:left}
.karp-picker-card img{width:100%;aspect-ratio:.707;object-fit:cover;display:block}
.karp-picker-card strong{display:block;font-size:11px;margin-top:8px}
@media(max-width:700px){.karp-pdf-tab{min-width:130px}.karp-journal-picker{inset:70px 3% 3%}}
</style>
</head>
<body>
<script>
(async()=>{
  const params=new URLSearchParams(location.search),initialId=params.get('id');
  if(!initialId){location.replace('/journal.html');return}
  try{
    const {db}=await fb();
    const {doc,getDoc,getDocs,collection,setDoc,updateDoc,runTransaction}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
    const authUser=await authReady();
    const initialSnap=await getDoc(doc(db,'journalIssues',initialId));
    if(!initialSnap.exists()){location.replace('/journal.html');return}
    const current={id:initialSnap.id,...initialSnap.data()};
    document.title='KARP — '+(current.title||current.fileName||'Journal');
    document.body.innerHTML='<div class="karp-pdf-browser">'+
      '<div class="karp-pdf-tabs" id="pdf-tabs"><button class="karp-pdf-new" id="pdf-new" title="New tab">+</button></div>'+
      '<div class="karp-pdf-bar"><button id="pdf-back" title="Back">←</button><button id="pdf-home" title="Journals">⌂</button><span class="pdf-title" id="pdf-title"></span><button id="pdf-download" type="button" title="Download this PDF">Download PDF</button></div>'+
      '<div class="karp-pdf-stage"><div id="pdf-frames" style="position:absolute;inset:0;overflow:hidden;background:#525659"></div><div class="karp-pdf-loading" id="pdf-loading">Opening PDF…</div></div>'+
      '<div class="karp-journal-picker" id="journal-picker"><h2>Journals</h2><input id="journal-picker-search" class="karp-journal-picker-search" type="search" placeholder="Search journals by title…" autocomplete="off"><div class="karp-journal-picker-grid" id="journal-picker-grid"></div></div>'+
    '</div>';

    const tabs=document.getElementById('pdf-tabs'),frameHost=document.getElementById('pdf-frames'),titleEl=document.getElementById('pdf-title');
    const loading=document.getElementById('pdf-loading'),picker=document.getElementById('journal-picker'),pickerGrid=document.getElementById('journal-picker-grid'),pickerSearch=document.getElementById('journal-picker-search');
    let journals=[];
    const tabStates=new Map();
    let activeSession=null,activeBookId=current.id,sessionStarting=false;

    function makeId(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
    const visitorId=(()=>{if(authUser?.uid)return authUser.uid;let id='';try{id=localStorage.getItem('karp_journal_viewer_id')||''}catch{}if(!id){id=makeId();try{localStorage.setItem('karp_journal_viewer_id',id)}catch{}}return 'guest_'+id})();
    const visitor={uid:authUser?.uid||null,displayName:authUser?.displayName||'',email:authUser?.email||'',userType:authUser?.uid?'account':'guest',viewerId:visitorId};

    function esc(x){return escapeHtml(String(x??''))}
    function tabButton(journal){
      const b=document.createElement('button');
      b.className='karp-pdf-tab';b.dataset.id=journal.id;
      b.innerHTML='<span class="tab-title">'+esc(journal.title||journal.fileName||'Journal')+'</span><span class="tab-close" aria-label="Close">×</span>';
      b.onclick=()=>openJournal(journal.id);
      b.querySelector('.tab-close').onclick=e=>{e.stopPropagation();closeTab(journal.id)};
      return b;
    }
    function addTab(journal){
      if(tabStates.has(journal.id))return;
      const b=tabButton(journal);
      tabs.insertBefore(b,document.getElementById('pdf-new'));
      tabStates.set(journal.id,{journal,url:null,frame:null});
    }
    function activateTab(id){
      tabs.querySelectorAll('.karp-pdf-tab').forEach(x=>x.classList.toggle('active',x.dataset.id===id));
      tabStates.forEach((st,key)=>{
        if(!st.frame)return;
        const active=key===id;
        st.frame.style.visibility=active?'visible':'hidden';
        st.frame.style.opacity=active?'1':'0';
        st.frame.style.pointerEvents=active?'auto':'none';
        st.frame.style.zIndex=active?'1':'0';
      });
    }
    function ensureFrame(journal){
      const st=tabStates.get(journal.id);
      if(!st)throw new Error('PDF tab state is missing.');
      if(st.frame)return st.frame;
      const frame=document.createElement('iframe');
      frame.className='karp-pdf-frame';
      frame.title='KARP PDF viewer — '+(journal.title||journal.fileName||'Journal');
      frame.setAttribute('allow','fullscreen');
      frame.style.cssText='position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#525659;visibility:hidden;opacity:0;pointer-events:none;z-index:0';
      frameHost.appendChild(frame);
      st.frame=frame;
      return frame;
    }
    async function getPdfUrl(journal){
      const st=tabStates.get(journal.id);
      if(st?.url)return st.url;
      const snap=await getDocs(collection(db,'journalIssues',journal.id,'chunks'));
      const parts=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>Number(a.index??a.id)-Number(b.index??b.id));
      if(!parts.length)throw new Error('PDF data is missing.');
      const bytesParts=parts.map(p=>{
        const bin=atob(p.data),out=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
        return out;
      });
      const total=bytesParts.reduce((n,x)=>n+x.length,0),bytes=new Uint8Array(total);
      let off=0;for(const p of bytesParts){bytes.set(p,off);off+=p.length}
      const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
      const st2=tabStates.get(journal.id);if(st2)st2.url=url;
      return url;
    }

    async function countViewOnce(journal){
      const journalRef=doc(db,'journalIssues',journal.id),viewRef=doc(db,'journalIssues',journal.id,'views',visitor.viewerId);
      await runTransaction(db,async tx=>{
        const existing=await tx.get(viewRef);
        if(existing.exists())return false;
        const bookSnap=await tx.get(journalRef);
        if(!bookSnap.exists())throw new Error('This journal is no longer available.');
        const data=bookSnap.data()||{};
        tx.set(viewRef,{viewerId:visitor.viewerId,uid:visitor.uid,displayName:visitor.displayName,email:visitor.email,createdAt:new Date().toISOString()});
        tx.update(journalRef,{viewCount:Math.max(0,Number(data.viewCount||0))+1});
        return true;
      });
    }
    async function startViewSession(journal){
      if(document.hidden||activeSession||sessionStarting||!journal)return;
      sessionStarting=true;
      try{
        const id=makeId(),startedMs=Date.now(),startedAt=new Date(startedMs).toISOString();
        const ref=doc(db,'journalIssues',journal.id,'viewSessions',id);
        await setDoc(ref,{sessionId:id,journalId:journal.id,viewerId:visitor.viewerId,uid:visitor.uid,displayName:visitor.displayName,email:visitor.email,userType:visitor.userType,startedAt,endedAt:null,durationSeconds:0,status:'active'},{merge:false});
        activeSession={id,ref,journalId:journal.id,startedMs};
        if(document.hidden||activeBookId!==journal.id)await stopViewSession();
      }catch(e){console.warn('Journal view session could not be recorded:',e)}
      finally{sessionStarting=false}
    }
    async function stopViewSession(){
      const s=activeSession;if(!s)return;
      activeSession=null;
      const endedMs=Date.now(),durationSeconds=Math.max(0,Math.round((endedMs-s.startedMs)/1000));
      try{await updateDoc(s.ref,{endedAt:new Date(endedMs).toISOString(),durationSeconds,status:'ended'})}
      catch(e){console.warn('Journal view session end could not be recorded:',e)}
    }
    async function recordDownload(journal){
      const id=makeId(),journalRef=doc(db,'journalIssues',journal.id),downloadRef=doc(db,'journalIssues',journal.id,'downloads',id);
      await runTransaction(db,async tx=>{
        const snap=await tx.get(journalRef);
        if(!snap.exists())throw new Error('This journal is no longer available.');
        const data=snap.data()||{};
        tx.set(downloadRef,{downloadId:id,journalId:journal.id,viewerId:visitor.viewerId,uid:visitor.uid,displayName:visitor.displayName,email:visitor.email,userType:visitor.userType,fileName:journal.fileName||((journal.title||'KARP Journal')+'.pdf'),createdAt:new Date().toISOString()});
        tx.update(journalRef,{downloadCount:Math.max(0,Number(data.downloadCount||0))+1});
      });
    }
    async function downloadBook(journal){
      const button=document.getElementById('pdf-download');if(button)button.disabled=true;
      try{
        const url=await getPdfUrl(journal),a=document.createElement('a');
        const desired=String(journal.fileName||((journal.title||'KARP Journal')+'.pdf')).split('/').join('-').replace(/[\\:*?"<>|]+/g,'-');
        a.href=url;a.download=/\.pdf$/i.test(desired)?desired:(desired+'.pdf');
        document.body.appendChild(a);a.click();a.remove();
        try{await recordDownload(journal)}catch(e){console.warn('Journal download event could not be saved:',e)}
      }catch(e){console.error(e);alert('Could not download this PDF. Please try again.')}
      finally{if(button)button.disabled=false}
    }
    async function openJournal(journalId){
      const journal=journals.find(x=>x.id===journalId)||current;
      await stopViewSession();
      activeBookId=journal.id;
      addTab(journal);
      const st=tabStates.get(journal.id);
      const firstOpen=!st.frame;
      titleEl.textContent=journal.title||journal.fileName||'Journal';
      document.title='KARP — '+(journal.title||journal.fileName||'Journal');
      activateTab(journal.id);
      picker.style.display='none';
      if(firstOpen){
        loading.style.display='grid';
        loading.textContent='Opening PDF…';
        try{
          const frame=ensureFrame(journal);
          frame.src=await getPdfUrl(journal);
          await new Promise(resolve=>setTimeout(resolve,120));
          try{await countViewOnce(journal)}catch(e){console.warn('Journal unique view count failed:',e)}
          if(!document.hidden)await startViewSession(journal);
        }catch(e){console.error(e);loading.textContent='Unable to open PDF'}
        finally{loading.style.display='none'}
      }else{
        try{await countViewOnce(journal)}catch(e){console.warn('Journal unique view count failed:',e)}
        if(!document.hidden)await startViewSession(journal);
      }
      history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(journal.id));
    }
    function closeTab(id){
      const st=tabStates.get(id);
      if(!st)return;
      const wasActive=id===activeBookId;
      if(st.url)URL.revokeObjectURL(st.url);
      st.frame?.remove();
      tabStates.delete(id);
      tabs.querySelector('[data-id="'+CSS.escape(id)+'"]')?.remove();
      if(!wasActive)return;
      const next=[...tabStates.keys()].at(-1);
      if(next)openJournal(next);else location.replace('/journal.html');
    }
    function renderPicker(){
      const q=String(pickerSearch.value||'').trim().toLowerCase();
      const filtered=journals.filter(x=>String(x.title||x.fileName||'Journal').toLowerCase().includes(q));
      pickerGrid.innerHTML=filtered.map(x=>'<button class="karp-picker-card" data-pick="'+esc(x.id)+'">'+
        (x.coverImage?'<img src="'+esc(x.coverImage)+'" alt="">':'<div style="aspect-ratio:.707;background:#eee;display:grid;place-items:center">PDF</div>')+
        '<strong>'+esc(x.title||x.fileName||'Journal')+'</strong></button>').join('')||
        '<div style="grid-column:1/-1;padding:25px 0;color:#73777c;font-size:13px">No journals match your search.</div>';
      pickerGrid.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>openJournal(x.dataset.pick));
    }
    document.getElementById('pdf-new').onclick=()=>{
      picker.style.display='block';pickerSearch.value='';renderPicker();pickerSearch.focus();
    };
    pickerSearch.addEventListener('input',renderPicker);
    document.getElementById('pdf-download').onclick=()=>downloadBook(journals.find(x=>x.id===activeBookId)||current);
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)stopViewSession();
      else startViewSession(journals.find(x=>x.id===activeBookId)||current);
    });
    window.addEventListener('pagehide',()=>{stopViewSession()});
    window.addEventListener('beforeunload',()=>{stopViewSession()});
    document.getElementById('pdf-back').onclick=()=>history.back();
    document.getElementById('pdf-home').onclick=()=>location.replace('/journal.html');

    const snapBooks=await getDocs(collection(db,'journalIssues'));
    journals=snapBooks.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
    await openJournal(current.id);
  }catch(e){
    document.body.innerHTML='<div style="font:14px system-ui;padding:40px;text-align:center"><h2>Unable to open this journal</h2><p>'+escapeHtml(e.message||'Something went wrong.')+'</p><a href="/journal.html">← Back to Journals</a></div>';
  }
})();
</script>
</body>
</html>
