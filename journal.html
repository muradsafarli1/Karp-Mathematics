<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Journal</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<style>
.journal-page{min-height:100vh;background:#f7f7f5}
.journal-hero{padding:38px 24px 12px!important;border:0!important;text-align:center;background:#f7f7f5}
.journal-hero h1{font-family:'Space Grotesk';font-size:clamp(46px,6vw,76px);line-height:1;letter-spacing:-3px;margin:0}
.journal-search-wrap{width:min(560px,calc(100% - 28px));margin:4px auto 30px}
.journal-search{width:100%;box-sizing:border-box;padding:13px 17px;border:1px solid #d9dad8;border-radius:12px;background:#eeeeeb;color:#17191c;font:500 13px 'Inter',sans-serif;outline:none}
.journal-search:focus{border-color:#b8bbb8;box-shadow:0 0 0 3px rgba(47,120,183,.08)}
.journal-grid{width:min(1220px,calc(100% - 42px));margin:0 auto;padding:0 0 80px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:28px 20px}
.journal-card{display:block;min-width:0;text-decoration:none;color:inherit}
.journal-cover{position:relative;aspect-ratio:.7071;overflow:hidden;border:1px solid #cfd2ce;border-radius:0;background:#fff;box-shadow:0 9px 22px rgba(30,34,38,.08);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.journal-cover img{display:block;width:100%;height:100%;object-fit:cover;background:#fff}
.journal-cover-fallback{position:absolute;inset:0;padding:24px 18px;display:flex;flex-direction:column;justify-content:space-between;background:#eeeeeb}
.journal-cover-fallback h2{font-family:'Space Grotesk';font-size:21px;line-height:1.08;letter-spacing:-.7px;margin:0;color:#17191c;overflow-wrap:anywhere}
.journal-cover-fallback small{font-size:8px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;color:#686d73}
.journal-card:hover .journal-cover{transform:translateY(-4px);border-color:#aeb3af;box-shadow:0 13px 28px rgba(30,34,38,.13)}
.journal-card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px 0}
.journal-card-title{font-size:11px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2a2d31}
.journal-views{font-size:10px;color:#666b73;white-space:nowrap}
.journal-empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:#737a80;font-size:13px}
@media(max-width:1120px){.journal-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:26px 18px}}
@media(max-width:900px){.journal-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px}}
@media(max-width:680px){.journal-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 13px}}
@media(max-width:480px){.journal-grid{grid-template-columns:repeat(2,minmax(0,1fr));width:calc(100% - 28px)}.journal-search-wrap{margin-bottom:24px}}
</style>
<script>
window.KARPPdfReady=import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs').then(pdfjsLib=>{
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
  return pdfjsLib;
});
</script>
</head>
<body>
<script>
(async()=>{
  const {db}=await fb();
  const {collection,getDocs,doc,getDoc,updateDoc,increment}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
  shell('Journal','Journal',
    '<main class="journal-page">'+
      '<section class="journal-hero"><div class="wrap"><h1>Journal</h1></div></section>'+
      '<div class="journal-search-wrap"><input id="journal-search" class="journal-search" type="search" placeholder="Search journals..." autocomplete="off"></div>'+
      '<section id="journal-grid" class="journal-grid"><div class="journal-empty">Loading journals…</div></section>'+
    '</main>'
  );
  const grid=document.getElementById('journal-grid'),search=document.getElementById('journal-search');
  let issues=[];
  const esc=x=>escapeHtml(String(x??''));
  function fmt(n){n=Math.max(0,Number(n||0));return n>=1000000?(n/1000000).toFixed(1).replace(/\.0$/,'')+'M':n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'K':String(n)}
  function render(){
    const q=String(search.value||'').trim().toLowerCase();
    const filtered=issues.filter(x=>String(x.title||x.fileName||'').toLowerCase().includes(q));
    grid.innerHTML=filtered.length?filtered.map(x=>{
      const title=x.title||x.fileName||'Untitled Journal';
      const cover=x.coverImage
        ? '<img src="'+esc(x.coverImage)+'" alt="">'
        : '<div class="journal-cover-fallback"><small>KARP · MATHEMATICS</small><h2>'+esc(title)+'</h2><small>PDF JOURNAL</small></div>';
      return '<a class="journal-card" href="/journal.html?id='+encodeURIComponent(x.id)+'" target="_blank" rel="noopener" aria-label="Open '+esc(title)+'">'+
        '<div class="journal-cover">'+cover+'</div>'+
        '<div class="journal-card-meta"><span class="journal-card-title">'+esc(title)+'</span><span class="journal-views">'+fmt(x.readCount)+' reads</span></div>'+
      '</a>';
    }).join(''):'<div class="journal-empty">'+(q?'No journals match your search.':'No journal issues have been published yet.')+'</div>';
  }
  search.addEventListener('input',render);
  const snap=await getDocs(collection(db,'journalIssues'));
  issues=snap.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.published!==false).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
  render();

  const id=new URLSearchParams(location.search).get('id');
  if(id){
    const s=await getDoc(doc(db,'journalIssues',id));
    if(!s.exists()){location.href='/journal.html';return}
    const issue={id:s.id,...s.data()};
    try{await updateDoc(doc(db,'journalIssues',id),{readCount:increment(1)})}catch(e){}
    const chunks=await getDocs(collection(db,'journalIssues',id,'chunks'));
    const parts=chunks.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>Number(a.index??a.id)-Number(b.index??b.id));
    const b64=base64=>{const bin=atob(base64),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out};
    const bytes=parts.reduce((acc,p)=>{const b=b64(p.data),next=new Uint8Array(acc.length+b.length);next.set(acc);next.set(b,acc.length);return next},new Uint8Array());
    location.replace(URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})));
  }
})();
</script>
</body>
</html>
