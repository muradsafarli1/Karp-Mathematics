<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARP — Videos</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script><style>
.videos-wrap{max-width:1200px;margin:0 auto;padding:54px 24px 80px}.videos-wrap h1{font-size:clamp(42px,6vw,72px);letter-spacing:-3px;margin:0 0 28px}.video-search{width:100%;max-width:650px;display:block;margin:0 0 42px;padding:16px 20px;border-radius:12px;border:1px solid var(--line,#30343d);background:var(--panel,#101216);color:var(--text,#f4f5f7);font-size:16px;outline:none}.videos-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.video-card{display:block;overflow:hidden;border-radius:18px;background:var(--panel,#101216);border:1px solid var(--line,#292d34);text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s,border-color .2s}.video-card:hover{transform:translateY(-5px);box-shadow:0 16px 40px #0004;border-color:#555}.video-thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#181a1f}.video-info{padding:20px 22px 22px}.video-info h2{margin:0;font-size:21px;line-height:1.25}.video-info p{margin:9px 0 0;opacity:.68;line-height:1.5}.empty{text-align:center;opacity:.65;padding:70px 20px;grid-column:1/-1}@media(max-width:900px){.videos-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.videos-wrap{padding:38px 18px 60px}.videos-grid{grid-template-columns:1fr}}
html[data-theme="light"] .video-search{background:#fff;color:#17191c;border-color:#d4d7da}html[data-theme="light"] .video-card{background:#fff;border-color:#dedfe2;box-shadow:0 12px 35px rgba(0,0,0,.05)}
</style></head><body><script>shell('Videos','Videos',`<main class="videos-wrap"><div class="eyebrow">05 — Videos</div><h1>Videos</h1><input id="search" class="video-search" placeholder="Search videos..." autocomplete="off"><section id="grid" class="videos-grid"></section></main>`);</script><script>
let videos=[];function renderVideos(){const q=document.getElementById('search').value.trim().toLowerCase();const list=videos.filter(v=>[v.title,v.titleEn,v.titleAz,v.description,v.descriptionEn,v.descriptionAz].filter(Boolean).join(' ').toLowerCase().includes(q));const g=document.getElementById('grid');g.innerHTML=list.length?list.map(v=>`<a class="video-card" href="${escapeHtml(v.youtubeUrl||'#')}" target="_blank" rel="noopener noreferrer"><img class="video-thumb" src="${escapeHtml(v.thumbnail||'')}" alt="${escapeHtml(v.titleEn||v.titleAz||'Video')}"><div class="video-info"><h2>${escapeHtml(currentLanguage()==='az'?(v.titleAz||v.titleEn||v.title):(v.titleEn||v.titleAz||v.title||'Untitled video'))}</h2>${(v.descriptionEn||v.descriptionAz||v.description)?`<p>${escapeHtml(localized(v,'description'))}</p>`:''}</div></a>`).join(''):'<div class="empty">No videos found.</div>'}async function loadVideos(){try{const d=await api('/api/content');videos=d.videos||[];renderVideos()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">Could not load videos.</div>'}}document.getElementById('search').addEventListener('input',renderVideos);loadVideos();</script></body></html>
