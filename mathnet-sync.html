<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — MathNet Sync</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<style>
.sync-wrap{width:min(calc(100% - 42px),980px);margin:0 auto}
.sync-card{background:var(--panel);border-radius:22px;padding:30px}
.sync-head h1{font-family:'Space Grotesk';font-size:40px;letter-spacing:-1.6px;margin:8px 0}
.sync-head p{color:var(--muted);line-height:1.7}
.sync-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}
.sync-stat{background:var(--panel2);border-radius:14px;padding:16px}.sync-stat b{display:block;font-size:24px}.sync-stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.sync-bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.sync-bar i{display:block;height:100%;width:0;background:var(--text);transition:width .2s}
.sync-log{margin-top:18px;padding:15px;background:var(--panel2);border-radius:14px;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;max-height:300px;overflow:auto}
@media(max-width:800px){.sync-stats{grid-template-columns:1fr 1fr}.sync-card{padding:21px}}
</style>
</head>
<body>
<script>
(async()=>{
  const admin=await requireAdmin();
  if(!admin){return;}
  shell('Admin','MathNet Sync','<main class="page"><section class="section"><div class="sync-wrap"><section class="sync-card"><div class="sync-head"><div class="eyebrow">KARP · FIREBASE</div><h1>MathNet Sync</h1><p>Import the English proof archive from Hugging Face into Firestore. This is a one-time/refresh operation. After the sync, KARP runtime uses Firebase only.</p></div><div class="sync-stats"><div class="sync-stat"><b id="fetched">0</b><span>Rows scanned</span></div><div class="sync-stat"><b id="accepted">0</b><span>Accepted</span></div><div class="sync-stat"><b id="written">0</b><span>Problems written</span></div><div class="sync-stat"><b id="pages">0</b><span>Pages</span></div></div><div class="sync-bar"><i id="bar"></i></div><div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap"><button id="start" class="btn primary">Start / Resume Sync</button><button id="repair" class="btn">Repair titles &amp; P-numbers</button><a class="btn" href="/admin.html">Back to Admin</a></div><div id="status" style="margin-top:14px;color:var(--muted);font-size:12px">Ready.</div><div id="log" class="sync-log"></div></section></div></section></main>');
  const {db}=await fb();
  const fs=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
  const {doc,getDoc,setDoc,writeBatch,collection,getDocs,updateDoc}=fs;

  const MATHNET_FIRESTORE={problems:'mathnetProblemsV2',shards:'mathnetIndexShardsV2',pools:'mathnetPools',meta:'mathnetMeta',state:'state'};
  const DATASET='ShadenA/MathNet',CONFIG='all',SPLIT='train',PAGE=100,CONCURRENCY=4;
  const VERSION='firebase-'+new Date().toISOString().slice(0,10)+'-'+Date.now();
  const state={running:false,completePages:new Set(),total:0,fetched:0,accepted:0,written:0,items:[],pools:new Map()};
  const log=(x)=>{const el=document.getElementById('log');el.textContent+=x+'\n';el.scrollTop=el.scrollHeight};
  const num=(id,v)=>document.getElementById(id).textContent=Number(v||0).toLocaleString();
  const progress=()=>{document.getElementById('bar').style.width=(state.total?Math.min(100,state.fetched/state.total*100):0)+'%'};

  function englishSet(text){
    const t=String(text||'').toLowerCase();
    if(/[\u0400-\u04ff\u0370-\u03ff\u0600-\u06ff\u4e00-\u9fff]/.test(t))return false;
    const foreign=/\b(der|die|das|und|ist|sind|eine|einer|nicht|für|mit|von|zu|que|para|por|una|uno|los|las|del|como|pero|esta|este|son|des|le|la|les|dans|avec|pour|une|et|est|sont|sur|ce|ces|cette|mais|alors|es|se|não|nao|uma|um|dos|das|em|quando|seu|sua)\b/gi;
    const eng=/\b(the|and|are|assume|because|consider|find|given|if|is|let|of|prove|show|that|the|then|therefore|this|to|we|which|with|where|when|for|from)\b/gi;
    const f=(t.match(foreign)||[]).length,e=(t.match(eng)||[]).length;
    return !(f>=2&&f>e);
  }

  function clean(x){return normalizeMathMarkdown(String(x||'')).trim();}
  function yearFor(r){
    if(r.year!=null&&String(r.year).trim())return String(r.year).trim();
    const s=[r.source_booklet,r.booklet_source,r.competition].map(x=>String(x||'')).join(' ');
    const m=s.match(/(?:^|[^0-9])(19\d{2}|20\d{2})(?:[^0-9]|$)/);return m?m[1]:'';
  }
  function pnoFor(r){
    const raw=String(r?.problem_number??r?.problemNumber??'').trim();
    if(raw){
      let m=raw.match(/^(?:problem|question)\s*(?:no\.?|number)?\s*#?\s*([A-Za-z]?\d+(?:[.\-][A-Za-z]?\d+)*)$/i);
      if(m)return'P'+m[1];
      m=raw.match(/^P\s*#?\s*([A-Za-z]?\d+(?:[.\-][A-Za-z]?\d+)*)$/i);
      if(m)return'P'+m[1];
      m=raw.match(/^#?\s*([A-Za-z]?\d+(?:[.\-][A-Za-z]?\d+)*)$/i);
      if(m)return'P'+m[1];
      return raw;
    }
    return numberFromStatement(r?.problem_markdown||'');
  }
  function numberFromStatement(value){
    const head=String(value||'').replace(/<[^>]+>/g,' ').slice(0,1800);
    const ps=[
      /(?:^|[\n\r])\s*(?:#+\s*)?(?:problem|question)\s*#?\s*([1-9]\d?)\b/i,
      /(?:^|[\n\r])\s*([1-9]\d?)\s*[.)]\s+/i
    ];
    for(const re of ps){const m=head.match(re);if(m)return'P'+m[1]}
    return'';
  }
  function categoryFor(r){
    const t=((Array.isArray(r.topics_flat)?r.topics_flat:[]).join(' ')+' '+String(r.problem_markdown||'')).toLowerCase();
    if(/geometry|triangle|circle|angle|polygon|quadrilateral|concyclic|incircle|circumcircle/.test(t))return'G';
    if(/number theory|divisib|prime|integer|diophant|congruence|modular|gcd|lcm|factor|remainder/.test(t))return'N';
    if(/combinatorics|counting|graph theory|permutation|combination|pigeonhole|invariant|coloring|probability/.test(t))return'C';
    return'A';
  }
  function difficultyFor(r){
    const score=Math.min(4,Math.floor(String(r.problem_markdown||'').length/900))
      +Math.min(2,Math.max(0,(Array.isArray(r.topics_flat)?r.topics_flat.length:0)-1))
      +(/imo|shortlist|tst|olympiad/i.test(String(r.competition||''))?1:0);
    return score>=3?'hard':'easy';
  }
  function safeId(sourceId){return 'mn_'+btoa(unescape(encodeURIComponent(sourceId))).replace(/[+/=]/g,'_');}
  function title(r){
    return String(r.competition||'MathNet').trim()||'MathNet';
  }
  function images(r){
    return Array.isArray(r.images)?r.images.map(x=>typeof x==='string'?x:x?.src||'').filter(Boolean):[];
  }
  function replaceImages(md,imgs){
    return md.replace(/!\[([^\]]*)\]\(attached_image_(\d+)\.png\)/g,(_,alt,n)=>imgs[Number(n)-1]?'!['+(alt||'Figure')+']('+imgs[Number(n)-1]+')':'');
  }
  function normalizeRow(raw){
    const r=raw?.row||raw||{},statement=replaceImages(clean(r.problem_markdown||''),images(r));
    const sols=Array.isArray(r.solutions_markdown)?r.solutions_markdown.map(clean).filter(Boolean):[];
    const lang=String(r.language||'').trim().toLowerCase(),type=String(r.problem_type||'').trim().toLowerCase();
    if(!(lang==='english'||lang==='en'||lang.startsWith('en-')))return null;
    if(!['proof','proof only','proof and answer'].includes(type))return null;
    if(!statement||!englishSet(statement)||!sols.length||!sols.every(englishSet))return null;
    const sourceId=String(r.unique_id||r.id||('row-'+raw.row_idx));
    const id=safeId(sourceId),year=yearFor(r),problemNumber=pnoFor(r),competition=String(r.competition||'').trim()||'MathNet',category=categoryFor(r),difficulty=difficultyFor(r);
    return {
      id,sourceId,sourceIndex:Number(raw.row_idx??-1),country:String(r.country||'').trim(),competition,year,
      section:String(r.section||'').trim(),problemNumber,sourceBooklet:String(r.source_booklet||'').trim(),
      bookletSource:String(r.booklet_source||'').trim(),language:'English',problemType:String(r.problem_type||'').trim(),
      category,difficulty,title:competition,
      statement,solutions:sols,finalAnswer:r.final_answer==null?'':String(r.final_answer||''),hasImages:images(r).length>0,
      version:VERSION,randomKey:Math.random(),randomBucket:Math.floor(Math.random()*100),poolKey:category+'-'+difficulty
    };
  }

  async function fetchJson(u,attempts=3){
    let lastErr;
    for(let i=0;i<attempts;i++){
      try{
        const r=await fetch(u.toString(),{headers:{Accept:'application/json'}});
        if(r.ok)return await r.json();
        lastErr=new Error('Hugging Face HTTP '+r.status);
        if(r.status>=400&&r.status<500&&r.status!==429)break;
      }catch(e){lastErr=e}
      await new Promise(r=>setTimeout(r,800*Math.pow(2,i)));
    }
    throw lastErr||new Error('Hugging Face request failed');
  }

  async function fetchPage(offset,attempts=7){
    let lastErr=null;
    for(let i=0;i<attempts;i++){
      try{
        const u=new URL('https://datasets-server.huggingface.co/rows');
        u.searchParams.set('dataset','ShadenA/MathNet');
        u.searchParams.set('config','all');
        u.searchParams.set('split','train');
        u.searchParams.set('offset',String(offset));
        u.searchParams.set('length','100');
        const r=await fetch(u.toString(),{headers:{Accept:'application/json'},cache:'no-store'});
        if(r.ok)return await r.json();
        lastErr=new Error('Hugging Face HTTP '+r.status);
      }catch(e){lastErr=e}
      await new Promise(r=>setTimeout(r,1000*Math.min(10,2**i)));
    }
    throw lastErr||new Error('Hugging Face rows request failed');
  }

  async function writePage(rows){
    if(!rows.length)return;
    const batch=writeBatch(db);
    rows.forEach(q=>{
      const out={...q};
      batch.set(doc(db,MATHNET_FIRESTORE.problems,q.id),out,{merge:true});
    });
    await batch.commit();
    rows.forEach(q=>{
      const meta={id:q.id,sourceId:q.sourceId,sourceIndex:q.sourceIndex,country:q.country,competition:q.competition,year:q.year,
        section:q.section,problemNumber:q.problemNumber,sourceBooklet:q.sourceBooklet,bookletSource:q.bookletSource,
        language:q.language,problemType:q.problemType,category:q.category,difficulty:q.difficulty,title:q.title,hasImages:q.hasImages,version:VERSION};
      state.items.push(meta);state.written++;
      const any=state.pools.get(q.category+'-any')||[];any.push(q.id);state.pools.set(q.category+'-any',any);
      const key=q.category+'-'+q.difficulty;const arr=state.pools.get(key)||[];arr.push(q.id);state.pools.set(key,arr);
    });
  }

  async function finalize(){
    const shardSize=300;
    for(let i=0,s=0;i<state.items.length;i+=shardSize,s++){
      await setDoc(doc(db,MATHNET_FIRESTORE.shards,'shard-'+String(s).padStart(4,'0')),{version:VERSION,index:s,items:state.items.slice(i,i+shardSize)});
    }
    // Mock generation uses the per-problem randomKey field directly.
    // Avoids large pool documents and keeps each Firestore document small.
    await setDoc(doc(db,MATHNET_FIRESTORE.meta,MATHNET_FIRESTORE.state),{
      ready:true,version:VERSION,count:state.items.length,source:DATASET,
      shardCount:Math.ceil(state.items.length/shardSize),updatedAt:new Date().toISOString()
    },{merge:true});
  }

  function normKey(x){
    return String(x||'').toLowerCase()
      .replace(/\\/g,'').replace(/<[^>]+>/g,' ')
      .replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
  }
  function storedProblemNumber(p){
    const fields=[
      p?.statement,p?.problem_markdown,p?.section,
      p?.sourceBooklet,p?.bookletSource,p?.competition,p?.title
    ];
    for(const value of fields){
      const s=String(value||'');
      const head=s.slice(0,2500);
      const patterns=[
        /(?:^|[\\n\\r])\\s*(?:#+\\s*)?(?:Problem|Question)\\s*#?\\s*0*([1-9]\\d?)\\b/i,
        /(?:^|[\\n\\r])\\s*[*_]{0,2}0*([1-9]\\d?)\\s*[.)-]\\s+/i,
        /\\b(?:Problem|Question)\\s*#?\\s*0*([1-9]\\d?)\\b/i,
        /\\bP\\s*0*([1-9]\\d?)\\b/i
      ];
      for(const re of patterns){
        const m=head.match(re);
        if(m)return'P'+m[1];
      }
    }
    return '';
  }
  function cleanSourceTitle(value){
    let s=String(value||'').trim();
    if(!s)return '';
    s=s.replace(/\\s*(?:—|–|-|:)\\s*(?:Problem|P)\\s*#?\\s*0*[1-9]\\d?\\s*$/i,'').trim();
    s=s.replace(/\\s+(?:Problem|P)\\s*#?\\s*0*[1-9]\\d?\\s*$/i,'').trim();
    return s;
  }
  async function repairMetadata(){
    if(state.running)return;
    const startBtn=document.getElementById('start'),repair=document.getElementById('repair');
    startBtn.disabled=true;repair.disabled=true;
    document.getElementById('status').textContent='Repairing stored MathNet metadata…';
    log('SAFE REPAIR: no Hugging Face requests. Reading only the existing Firebase MathNet documents.');
    try{
      const snap=await getDocs(collection(db,MATHNET_FIRESTORE.problems));
      const docs=snap.docs.map(s=>({...s.data(),id:s.id}));
      log('Existing Firebase problems found: '+docs.length.toLocaleString());

      const changes=new Map();
      let numbered=0,cleaned=0;
      for(const ex of docs){
        const pno=storedProblemNumber(ex);
        const sourceFields=[ex.sourceBooklet,ex.bookletSource,ex.competition,ex.title].map(v=>String(v||'').trim()).filter(Boolean);
        const sourceCandidate=sourceFields.find(v=>/(?:Problem|P)\s*#?\s*\d+\b/i.test(v)) || sourceFields.sort((a,b)=>b.length-a.length)[0] || 'MathNet';
        const cleanedTitle=cleanSourceTitle(sourceCandidate)||String(ex.competition||ex.title||'MathNet').trim();
        const fields={};
        if(cleanedTitle && String(ex.title||'')!==cleanedTitle)fields.title=cleanedTitle;
        if(pno && String(ex.problemNumber||'')!==pno){fields.problemNumber=pno;numbered++;}
        if(Object.keys(fields).length){changes.set(ex.id,fields);if(fields.title)cleaned++;}
      }

      const updates=[...changes.entries()];
      for(let i=0;i<updates.length;i+=400){
        const batch=writeBatch(db);
        updates.slice(i,i+400).forEach(([id,fields])=>batch.update(doc(db,MATHNET_FIRESTORE.problems,id),fields));
        await batch.commit();
      }

      const shardSnap=await getDocs(collection(db,MATHNET_FIRESTORE.shards));
      const stateSnap=await getDoc(doc(db,MATHNET_FIRESTORE.meta,MATHNET_FIRESTORE.state));
      const oldState=stateSnap.exists()?stateSnap.data():{};
      const newVersion=String(oldState.version||VERSION)+'-meta-'+Date.now();

      for(let i=0;i<shardSnap.docs.length;i+=400){
        const batch=writeBatch(db);
        shardSnap.docs.slice(i,i+400).forEach(s=>{
          const d=s.data();
          const items=Array.isArray(d.items)?d.items.map(item=>{
            const ch=changes.get(item.id);
            return ch?{...item,...ch,version:newVersion}:{...item,version:newVersion};
          }):[];
          batch.set(doc(db,MATHNET_FIRESTORE.shards,s.id),{...d,version:newVersion,items},{merge:true});
        });
        await batch.commit();
      }

      await setDoc(doc(db,MATHNET_FIRESTORE.meta,MATHNET_FIRESTORE.state),{
        ready:true,version:newVersion,count:Number(oldState.count||docs.length),source:DATASET,
        shardCount:shardSnap.size,updatedAt:new Date().toISOString()
      },{merge:true});

      document.getElementById('bar').style.width='100%';
      document.getElementById('status').textContent='METADATA REPAIR COMPLETE';
      log('Updated existing problem metadata documents: '+updates.length.toLocaleString());
      log('Titles cleaned: '+cleaned.toLocaleString());
      log('P-numbers added/fixed: '+numbered.toLocaleString()+'.');
      log('No statements, solutions, images, or problem IDs were replaced.');
    }catch(e){
      document.getElementById('status').textContent='Metadata repair failed: '+e.message;
      log('REPAIR STOPPED: '+e.stack);
    }finally{
      state.running=false;startBtn.disabled=false;repair.disabled=false;
    }
  }

  async function run(){
    if(state.running)return;
    state.running=true;
    document.getElementById('start').disabled=true;
    document.getElementById('status').textContent='Building clean MathNet V2…';
    log('CLEAN REBUILD: complete MathNet rows endpoint only. Existing database is untouched.');
    try{
      const first=await fetchPage(0);
      state.total=Number(first.num_rows_total||0);
      num('pages',Math.ceil(state.total/100));
      log('Complete MathNet dataset: '+state.total.toLocaleString()+' rows.');

      let cursor=0;
      async function worker(){
        while(true){
          const offset=cursor*100;cursor++;
          if(offset>=state.total)return;
          const payload=offset===0?first:await fetchPage(offset);
          const raw=payload.rows||[];
          state.fetched+=raw.length;
          const good=raw.map(normalizeRow).filter(Boolean);
          state.accepted+=good.length;

          for(let i=0;i<good.length;i+=100){
            const batch=writeBatch(db);
            good.slice(i,i+100).forEach(q=>batch.set(doc(db,MATHNET_FIRESTORE.problems,q.id),q,{merge:true}));
            await batch.commit();
          }
          good.forEach(q=>state.items.push({
            id:q.id,sourceId:q.sourceId,sourceIndex:q.sourceIndex,country:q.country,competition:q.competition,year:q.year,
            section:q.section,problemNumber:q.problemNumber,sourceProblemNumber:q.sourceProblemNumber,
            sourceBooklet:q.sourceBooklet,bookletSource:q.bookletSource,language:q.language,problemType:q.problemType,
            category:q.category,difficulty:q.difficulty,title:q.title,sourceLabel:q.sourceLabel,hasImages:q.hasImages,version:'rebuild-v2'
          }));
          state.written+=good.length;
          num('fetched',state.fetched);num('accepted',state.accepted);num('written',state.written);progress();
          document.getElementById('status').textContent='Scanned '+state.fetched.toLocaleString()+' / '+state.total.toLocaleString();
        }
      }
      await Promise.all(Array.from({length:4},worker));

      state.items.sort((a,b)=>{
        const y=Number(b.year||0)-Number(a.year||0);
        return y||String(a.country).localeCompare(String(b.country))||String(a.competition).localeCompare(String(b.competition))||Number(a.sourceIndex)-Number(b.sourceIndex);
      });

      for(let i=0,s=0;i<state.items.length;i+=300,s++){
        await setDoc(doc(db,MATHNET_FIRESTORE.shards,'shard-'+String(s).padStart(4,'0')),{
          version:'rebuild-v2',index:s,items:state.items.slice(i,i+300)
        });
      }
      const shardCount=Math.ceil(state.items.length/300);
      if(!state.items.length)throw new Error('No accepted problems. Existing database remains untouched.');

      await setDoc(doc(db,MATHNET_FIRESTORE.meta,MATHNET_FIRESTORE.state),{
        ready:true,version:'rebuild-v2-'+Date.now(),activeNamespace:'v2',
        count:state.items.length,source:'ShadenA/MathNet',shardCount,updatedAt:new Date().toISOString()
      },{merge:true});

      document.getElementById('bar').style.width='100%';
      document.getElementById('status').textContent='COMPLETE — fresh MathNet V2 is ready.';
      log('DONE. Fresh database contains '+state.items.length.toLocaleString()+' accepted English proof problems.');
      log('Existing MathNet database was NOT deleted.');
      log('KARP is now marked to use V2; old data can be cleaned after verification.');
    }catch(e){
      document.getElementById('status').textContent='Rebuild failed: '+e.message;
      log('STOPPED: '+e.stack);
      log('Existing MathNet database was NOT deleted.');
    }finally{
      state.running=false;
      document.getElementById('start').disabled=false;
    }
  }
  document.getElementById('start').onclick=run;
  document.getElementById('repair').onclick=repairMetadata;
})();
</script>
</body>
</html>
