<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Messages</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js?v=20260929"></script>
<style>
:root{--msg-accent:#149653;--msg-soft:#edf8f2;--msg-mine:#eaf8ef}
.msg-page{height:calc(100vh - 76px);min-height:650px;display:grid;grid-template-columns:390px minmax(0,1fr);overflow:hidden;background:#fff}
.msg-sidebar{border-right:1px solid #e4e7eb;background:#fff;display:flex;flex-direction:column;min-width:0}
.msg-sidebar-head{height:78px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8ebee}
.msg-sidebar-title{font:800 28px/1 'Space Grotesk';letter-spacing:-1.3px}.msg-head-actions{display:flex;gap:7px}
.msg-icon{width:40px;height:40px;border:1px solid #e4e7eb;border-radius:50%;display:grid;place-items:center;background:#f7f8f9;color:#20242a;cursor:pointer;font-size:17px;transition:.18s}
.msg-icon:hover{background:var(--msg-soft);border-color:#cfe8d8;color:var(--msg-accent);transform:translateY(-1px)}
.msg-search-wrap{padding:14px 15px 9px;border-bottom:1px solid #eef0f2}.msg-search-box{height:44px;border-radius:14px;background:#f5f6f7;display:flex;align-items:center;gap:10px;padding:0 13px;border:1px solid transparent}.msg-search-box:focus-within{background:#fff;border-color:#d8dde3;box-shadow:0 0 0 3px rgba(20,150,83,.06)}
.msg-search-box svg{width:17px;height:17px;opacity:.55}.msg-search-box input{border:0;outline:0;background:transparent;color:#20242a;width:100%;font:500 12px/1.2 inherit}.msg-search-box input::placeholder{color:#98a0a9}
.msg-tabs{display:flex;gap:4px;padding:11px 14px;border-bottom:1px solid #eef0f2}.msg-tab{border:0;background:transparent;color:#717984;font-size:10px;font-weight:800;padding:8px 11px;border-radius:10px;cursor:pointer}.msg-tab.active{background:var(--msg-soft);color:var(--msg-accent)}
.msg-count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:4px;border-radius:10px;background:var(--msg-accent);color:#fff;font-size:9px}
.msg-list{flex:1;overflow:auto;padding:7px}.msg-item{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#20242a;text-align:left;padding:12px 10px;border-radius:14px;cursor:pointer;transition:.15s}.msg-item:hover{background:#f7f8f9}.msg-item.active{background:var(--msg-soft)}
.msg-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#f1f3f5;color:#5e6872;display:grid;place-items:center;flex:0 0 48px;font-size:13px;font-weight:800;overflow:hidden;border:1px solid #e6e9ec}.msg-avatar.group{border-radius:16px;background:var(--msg-soft);color:var(--msg-accent);border-color:#d9eee1}
.msg-main{min-width:0;flex:1}.msg-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.msg-preview{font-size:10px;color:#7b848e;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.msg-time{font-size:9px;color:#9aa2ab;align-self:flex-start;padding-top:2px;white-space:nowrap}
.msg-empty{padding:38px 22px;text-align:center;color:#8b949e;font-size:11px;line-height:1.8}.req-card{padding:11px;border-radius:14px;background:#fff;border:1px solid #e6e9ed;display:flex;align-items:center;gap:10px;margin:7px 3px;box-shadow:0 5px 20px rgba(30,38,45,.035)}.req-actions{margin-left:auto;display:flex;gap:5px}.req-actions .btn{padding:7px 9px;font-size:9px}
.msg-search-result{display:flex;align-items:center;gap:10px;padding:11px;border-radius:14px;background:#fff;margin:7px 4px 0;border:1px solid #e5e8ec;box-shadow:0 5px 20px rgba(30,38,45,.035)}.msg-search-result .who{min-width:0;flex:1}.msg-search-result .btn{font-size:9px;padding:8px 11px}
.msg-content{min-width:0;display:flex;flex-direction:column;background:#fff}.msg-chat-empty{height:100%;display:grid;place-items:center;text-align:center;color:#8b949e;padding:30px}.msg-empty-mark{width:78px;height:78px;border-radius:24px;display:grid;place-items:center;margin:0 auto 17px;background:var(--msg-soft);color:var(--msg-accent);font-size:30px;box-shadow:0 16px 35px rgba(20,150,83,.08)}
.msg-chat-empty strong{display:block;color:#20242a;font:800 27px/1.1 'Space Grotesk';letter-spacing:-.9px;margin-bottom:8px}.msg-chat-empty p{max-width:450px;font-size:11px;line-height:1.75}
.chat-panel{display:flex;flex-direction:column;min-width:0;height:100%}.chat-top{height:76px;flex:0 0 76px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid #e8ebee;background:#fff}.chat-back{display:none}.chat-top-info{min-width:0}.chat-top-info h2{font-family:'Space Grotesk';font-size:17px;letter-spacing:-.4px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-top-info p{font-size:9px;color:#858e98;margin:4px 0 0}.chat-members{margin-left:auto;color:#89929b;font-size:9px}
.chat-messages{flex:1;overflow:auto;padding:28px clamp(18px,4vw,76px);display:flex;flex-direction:column;gap:8px;background:radial-gradient(circle at 25px 25px,rgba(100,110,120,.06) 1px,transparent 1.5px) 0 0/30px 30px,#fafbfc}
.bubble-row{display:flex;margin:2px 0}.bubble-row.mine{justify-content:flex-end}.bubble-wrap{max-width:min(72%,720px)}.bubble-sender{font-size:8px;color:var(--msg-accent);font-weight:800;margin:0 0 4px 6px}
.bubble{position:relative;padding:10px 12px 21px;border-radius:17px;background:#fff;font-size:11px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #e4e8eb;box-shadow:0 3px 12px rgba(27,35,42,.045)}
.bubble-row:not(.mine) .bubble{border-top-left-radius:6px}.bubble-row.mine .bubble{background:var(--msg-mine);border-color:#cfe8d8;border-top-right-radius:6px}
.message-meta{position:absolute;right:10px;bottom:5px;font-size:7px;color:#8c969f;display:flex;gap:5px;align-items:center}.message-check{font-size:8px;color:var(--msg-accent);letter-spacing:-2px}
.chat-compose{display:flex;align-items:flex-end;gap:9px;padding:12px 18px 15px;border-top:1px solid #e8ebee;background:#fff}.compose-icon{width:42px;height:42px;flex:0 0 42px;border:1px solid #e4e8eb;border-radius:50%;background:#f7f8f9;color:#737d86;cursor:pointer;display:grid;place-items:center;font-size:17px}.compose-icon:hover{color:var(--msg-accent);background:var(--msg-soft);border-color:#cfe8d8}.chat-compose textarea{min-height:44px;max-height:140px;resize:none;border-radius:15px;padding:12px 14px;border:1px solid #dfe4e8;background:#fff}.chat-compose textarea:focus{border-color:#b9ddc7;box-shadow:0 0 0 3px rgba(20,150,83,.07)}
.chat-send{width:46px;height:46px;min-width:46px;padding:0;border-radius:15px;display:grid;place-items:center;font-size:0;box-shadow:0 7px 18px rgba(20,150,83,.16)}.chat-send::before{content:'➤';font-size:15px;transform:translateX(1px)}
.modal-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(18,23,28,.55);backdrop-filter:blur(8px);display:none;place-items:center;padding:20px}.modal-backdrop.open{display:grid}.modal-card{width:min(560px,100%);max-height:min(760px,90vh);overflow:auto;background:#fff;border-radius:20px;padding:24px;border:1px solid #e1e5e9;box-shadow:0 25px 70px rgba(0,0,0,.16)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.modal-head h2{font-family:'Space Grotesk';font-size:25px;letter-spacing:-1px;margin:0}.modal-head p{color:#7e8790;font-size:10px;line-height:1.7;margin:5px 0 0}.modal-close{border:0;background:transparent;color:#7d8790;font-size:25px;cursor:pointer}.group-form{margin-top:19px}.group-friends{display:grid;gap:7px;margin-top:11px}.friend-pick{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#f6f8f9;cursor:pointer}.friend-pick input{accent-color:var(--msg-accent)}.friend-pick .friend-label{min-width:0;flex:1}.friend-pick strong{display:block;font-size:11px}.friend-pick small{display:block;color:#7f8992;font-size:8px;margin-top:2px}.group-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}
@media(max-width:900px){.msg-page{height:auto;min-height:calc(100vh - 76px);display:block;overflow:visible}.msg-sidebar{width:100%;height:auto;min-height:0;border-right:0}.msg-list{max-height:calc(100vh - 280px)}.msg-content{display:none;min-height:calc(100vh - 76px)}.msg-page.chat-open .msg-sidebar{display:none}.msg-page.chat-open .msg-content{display:flex}.chat-back{display:grid}.chat-messages{padding:20px 12px}.bubble-wrap{max-width:84%}}
@media(max-width:520px){.msg-sidebar-head{height:68px;padding:0 13px}.msg-sidebar-title{font-size:24px}.msg-search-wrap{padding:10px 10px 7px}.msg-tabs{padding:8px 9px}.msg-tab{padding:7px 9px}.msg-list{padding:4px}.msg-item{padding:11px 8px}.msg-avatar{width:46px;height:46px;flex-basis:46px}.chat-top{height:66px;flex-basis:66px;padding:0 10px}.chat-compose{padding:8px}.chat-compose textarea{font-size:11px}.chat-send{width:44px;height:44px;min-width:44px}}
</style>
</head>
<body>
<div id="modal-root"></div>
<script>
(async()=>{
 const user=await requireUser();if(!user)return;
 const {db}=await fb();
 const fs=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
 const {doc,getDoc,getDocs,setDoc,collection,collectionGroup,query,where,limit,onSnapshot,Timestamp,writeBatch}=fs;
 const uid=user.id;
 const state={tab:'chats',selected:null,conversations:[],friends:[],incoming:[],searchResults:[],searchTimer:0,chatUnsub:null,convUnsub:null,friendUnsub:null,requestUnsub:null};
 const esc=x=>escapeHtml(x==null?'':String(x));
 const avatar=(p,group=false)=>p?.photoURL?'<img class="msg-avatar '+(group?'group':'')+'" src="'+esc(p.photoURL)+'" alt="">':'<div class="msg-avatar '+(group?'group':'')+'">'+esc(group?'👥':String(p?.name||'K').trim().charAt(0).toUpperCase())+'</div>';
 const fid=(a,b)=>a<b?a+'_'+b:b+'_'+a; const rid=(a,b)=>a+'_'+b;
 const timeValue=v=>v?.toMillis?v.toMillis():Number(new Date(v))||0;
 const timeText=v=>{if(!v)return '';const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'':d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});};
 const dateText=v=>{if(!v)return '';const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'':d.toLocaleDateString([], {day:'2-digit',month:'short',year:'numeric'});};
 async function profile(id){if(!id)return{uid:'',name:'KARP Member',photoURL:''};const s=await getDoc(doc(db,'publicProfiles',id));return s.exists()?{uid:id,...s.data()}:{uid:id,name:'KARP Member',photoURL:''};}
 async function ensureProfile(){await setDoc(doc(db,'publicProfiles',uid),{uid,name:user.name||'KARP Member',nameLower:String(user.name||'KARP Member').trim().toLowerCase(),photoURL:user.photoURL||'',updatedAt:Timestamp.now()},{merge:true});}
 async function refreshFriends(docs){
   const rows=[];
   for(const s of docs){const m=s.data(),other=(m.members||[]).find(x=>x!==uid);if(other)rows.push(await profile(other));}
   rows.sort((a,b)=>String(a.name).localeCompare(String(b.name)));state.friends=rows;renderSidebar();
 }
 async function refreshConversations(docs){
   const rows=[];
   for(const s of docs){
     const d=s.data(); if(d.status!=='accepted')continue;
     const members=Array.isArray(d.members)?d.members:[];const other=members.find(x=>x!==uid);
     if(d.type==='group'){rows.push({id:s.id,type:'group',name:d.name||'Group',members,lastMessage:d.lastMessage||'',lastMessageAt:d.lastMessageAt,lastMessageSenderId:d.lastMessageSenderId||''});continue;}
     if(!other)continue;
     const p=await profile(other);
     rows.push({id:s.id,type:d.type||'direct',otherUid:other,profile:p,name:p.name||'KARP Member',members,lastMessage:d.lastMessage||'',lastMessageAt:d.lastMessageAt,lastMessageSenderId:d.lastMessageSenderId||''});
   }
   rows.sort((a,b)=>timeValue(b.lastMessageAt)-timeValue(a.lastMessageAt));state.conversations=rows;renderSidebar();
   if(state.selected){const fresh=rows.find(x=>x.id===state.selected.id);if(fresh)state.selected={...state.selected,...fresh};}
 }
 function renderList(){
   const el=document.getElementById('msg-list');if(!el)return;
   if(state.tab==='chats'){
     if(!state.conversations.length){el.innerHTML='<div class="msg-empty">No conversations yet.<br>Accept a friend request or create a group.</div>';return;}
     el.innerHTML=state.conversations.map(x=>{
       const active=state.selected?.id===x.id,p=x.type==='group'?{name:x.name}:x.profile;
       const label=x.type==='support'?'Admin support':x.name;
       const preview=x.lastMessage?(x.lastMessageSenderId===uid?'You: ':'')+x.lastMessage:(x.type==='support'?'Contact KARP support':'No messages yet');
       return '<button class="msg-item '+(active?'active':'')+'" data-open="'+esc(x.id)+'">'+avatar(p,x.type==='group')+'<span class="msg-main"><span class="msg-name">'+esc(label)+'</span><span class="msg-preview">'+esc(preview)+'</span></span><span class="msg-time">'+esc(timeText(x.lastMessageAt))+'</span></button>';
     }).join('');
     el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openConversation(state.conversations.find(x=>x.id===b.dataset.open)));
   } else if(state.tab==='friends'){
     if(!state.friends.length){el.innerHTML='<div class="msg-empty">No friends yet.<br>Search for another KARP member above.</div>';return;}
     el.innerHTML=state.friends.map(p=>'<button class="msg-item" data-friend="'+esc(p.uid)+'">'+avatar(p)+'<span class="msg-main"><span class="msg-name">'+esc(p.name||'KARP Member')+'</span><span class="msg-preview">Open conversation</span></span></button>').join('');
     el.querySelectorAll('[data-friend]').forEach(b=>b.onclick=async()=>{const p=state.friends.find(x=>x.uid===b.dataset.friend);if(p)await openFriend(p);});
   } else {
     const incoming=state.incoming;
     el.innerHTML=incoming.length?incoming.map(x=>'<div class="req-card">'+avatar({name:x.fromName,photoURL:x.fromPhotoURL})+'<div class="msg-main"><div class="msg-name">'+esc(x.fromName||'KARP Member')+'</div><div class="msg-preview">Wants to be your friend</div></div><div class="req-actions"><button class="btn primary" data-accept="'+esc(x.id)+'">Accept</button><button class="btn" data-reject="'+esc(x.id)+'">Reject</button></div></div>').join(''):'<div class="msg-empty">No pending requests.</div>';
     el.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{const x=state.incoming.find(y=>y.id===b.dataset.accept);if(!x)return;try{await acceptRequest(x)}catch(e){console.error(e);toast(e?.code==='permission-denied'?'Firebase rules have not been deployed yet.':'Could not accept request.')}});
     el.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{const x=state.incoming.find(y=>y.id===b.dataset.reject);if(!x)return;try{await updateRequest(x,'rejected')}catch(e){console.error(e);toast('Could not update request.')}});
   }
 }
 function renderSidebar(){document.querySelectorAll('.msg-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));const c=document.getElementById('request-count');if(c)c.textContent=state.incoming.length?String(state.incoming.length):'';renderList();}
 function renderSearch(){
   let host=document.getElementById('msg-search-results');if(!host)return;
   if(!state.searchResults.length){host.innerHTML='';return;}
   host.innerHTML=state.searchResults.map(p=>'<div class="msg-search-result">'+avatar(p)+'<div class="who"><div class="msg-name">'+esc(p.name||'KARP Member')+'</div><div class="msg-preview">KARP member</div></div><button class="btn primary" data-send="'+esc(p.uid)+'">Add friend</button></div>').join('');
   host.querySelectorAll('[data-send]').forEach(b=>b.onclick=async()=>{const p=state.searchResults.find(x=>x.uid===b.dataset.send);if(p)await sendRequest(p)});
 }
 async function sendRequest(p){
   if(!p||p.uid===uid)return;
   if(state.friends.some(x=>x.uid===p.uid)){toast('You are already friends.');return;}
   try{
     const reverse=await getDoc(doc(db,'friendRequests',rid(p.uid,uid)));
     if(reverse.exists()&&reverse.data()?.status==='pending'){await acceptRequest({id:reverse.id,...reverse.data()});return;}
     const ref=doc(db,'friendRequests',rid(uid,p.uid));const mine=await getDoc(ref);
     if(mine.exists()&&mine.data()?.status==='pending'){toast('Friend request already sent.');return;}
     await setDoc(ref,{fromUid:uid,toUid:p.uid,fromName:user.name||'KARP Member',fromPhotoURL:user.photoURL||'',toName:p.name||'User',toPhotoURL:p.photoURL||'',status:'pending',createdAt:Timestamp.now()});
     toast('Friend request sent.');
     state.searchResults=[];renderSearch();
   }catch(e){console.error('Friend request error:',e);toast(e?.code==='permission-denied'?'Firebase rules have not been deployed yet.':'Could not send friend request.');}
 }
 async function acceptRequest(x){
   await setDoc(doc(db,'friendRequests',x.id),{status:'accepted',respondedAt:Timestamp.now()},{merge:true});
   const friendship=fid(x.fromUid,x.toUid),members=[x.fromUid,x.toUid].sort();
   await setDoc(doc(db,'friendships',friendship),{id:friendship,members,status:'accepted',requestId:x.id,createdAt:x.createdAt||Timestamp.now(),updatedAt:Timestamp.now()},{merge:true});
   await setDoc(doc(db,'conversations',friendship),{id:friendship,type:'direct',members,status:'accepted',createdBy:x.toUid,lastMessage:'',lastMessageAt:null,updatedAt:Timestamp.now()},{merge:true});
   toast('Friend request accepted.');
 }
 async function updateRequest(x,status){await setDoc(doc(db,'friendRequests',x.id),{status,respondedAt:Timestamp.now()},{merge:true});}
 async function openFriend(p){
   const id=fid(uid,p.uid);
   const s=await getDoc(doc(db,'conversations',id));
   if(!s.exists())await setDoc(doc(db,'conversations',id),{id,type:'direct',members:[uid,p.uid].sort(),status:'accepted',createdBy:uid,lastMessage:'',lastMessageAt:null,updatedAt:Timestamp.now()});
   await openConversation({id,type:'direct',name:p.name,profile:p,otherUid:p.uid,members:[uid,p.uid]});
 }
 function chatMarkup(item){
   const p=item.type==='group'?{name:item.name}:item.profile;
   return '<section class="chat-panel"><header class="chat-top"><button class="msg-icon chat-back" id="chat-back" aria-label="Back">‹</button>'+avatar(p,item.type==='group')+'<div class="chat-top-info"><h2>'+esc(item.type==='support'?'Admin support':item.name)+'</h2><p>'+esc(item.type==='group'?('KARP group · '+(item.members?.length||2)+' members'):item.type==='support'?'Direct support from KARP':'KARP member')+'</p></div><div class="chat-members">'+esc(item.type==='group'?'Group chat':item.type==='support'?'Support':'Private chat')+'</div></header><div id="chat-messages" class="chat-messages"></div><form id="chat-compose" class="chat-compose"><button type="button" id="emoji-btn" class="compose-icon" title="Add emoji">☺</button><textarea id="chat-input" class="textarea" maxlength="4000" rows="1" placeholder="Write a message…"></textarea><button class="btn primary chat-send" type="submit" aria-label="Send message" title="Send"></button></form></section>';
 }
 async function openConversation(item){
   if(!item)return;
   state.selected=item;document.querySelector('.msg-page')?.classList.add('chat-open');document.getElementById('chat-host').innerHTML=chatMarkup(item);renderSidebar();
   if(state.chatUnsub){state.chatUnsub();state.chatUnsub=null;}
   const list=document.getElementById('chat-messages');
   const q=query(collection(db,'conversations',item.id,'messages'));
   state.chatUnsub=onSnapshot(q,snap=>{
     const docs=snap.docs.slice().sort((a,b)=>timeValue(a.data().createdAt)-timeValue(b.data().createdAt));
     let lastDay='';
     list.innerHTML=docs.map(s=>{
       const m=s.data(),mine=m.senderId===uid,day=dateText(m.createdAt);let sep='';
       if(day&&day!==lastDay){lastDay=day;sep='<div style="display:flex;justify-content:center;margin:10px 0 5px"><span style="padding:6px 10px;border-radius:99px;background:#edf0f2;color:#7c858e;font-size:8px;font-weight:700">'+esc(day)+'</span></div>';}
       return sep+'<div class="bubble-row '+(mine?'mine':'')+'"><div class="bubble-wrap">'+((item.type==='group'&&!mine)?'<div class="bubble-sender">'+esc(m.senderName||'KARP member')+'</div>':'')+'<div class="bubble">'+esc(m.text||'')+'<span class="message-meta">'+esc(timeText(m.createdAt))+(mine?'<span class="message-check">✓✓</span>':'')+'</span></div></div></div>';
     }).join('')||'<div class="msg-empty" style="margin:auto">No messages yet. Say hello.</div>';
     list.scrollTop=list.scrollHeight;
   },e=>{console.error('KARP messages snapshot error:',e);list.innerHTML='<div class="msg-empty" style="margin:auto">Messages could not be loaded. Please deploy the latest Firestore rules and refresh the page.</div>';});
   const input=document.getElementById('chat-input');
   const resize=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px';};
   input.addEventListener('input',resize);
   input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('chat-compose').requestSubmit();}});
   document.getElementById('emoji-btn').onclick=()=>{input.value+=(input.value?' ':'')+'🙂';input.focus();resize();};
   document.getElementById('chat-compose').onsubmit=async e=>{
     e.preventDefault();const text=input.value.trim();if(!text)return;
     const send=document.querySelector('.chat-send');if(send)send.disabled=true;
     try{
       const now=Timestamp.now(),messageRef=doc(collection(db,'conversations',item.id,'messages')),batch=writeBatch(db);
       batch.set(messageRef,{senderId:uid,senderName:user.name||'KARP Member',text,createdAt:now});
       batch.update(doc(db,'conversations',item.id),{lastMessage:text.slice(0,140),lastMessageSenderId:uid,lastMessageAt:now,updatedAt:now});
       await batch.commit();input.value='';resize();input.focus();
     }catch(err){console.error('Message send error:',err);toast(err?.code==='permission-denied'?'Firebase rules have not been deployed yet.':'Message could not be sent.');}
     finally{if(send)send.disabled=false;}
   };
 }
 function showGroupModal(){
   if(!state.friends.length){toast('Add friends before creating a group.');return;}
   document.getElementById('modal-root').innerHTML='<div class="modal-backdrop open" id="group-modal"><div class="modal-card"><div class="modal-head"><div><h2>Create a group</h2><p>Choose friends and give the conversation a name.</p></div><button class="modal-close" id="group-close">×</button></div><div class="group-form"><label class="mock-label">Group name</label><input id="group-name" class="input" placeholder="e.g. Geometry Team"><div class="mock-label" style="margin-top:16px">Friends</div><div class="group-friends">'+state.friends.map(p=>'<label class="friend-pick"><input type="checkbox" value="'+esc(p.uid)+'"><span>'+avatar(p)+' </span><span class="friend-label"><strong>'+esc(p.name||'KARP Member')+'</strong><small>Friend</small></span></label>').join('')+'</div><div class="group-actions"><button class="btn" id="group-cancel">Cancel</button><button class="btn primary" id="group-create">Create group</button></div></div></div></div>';
   const close=()=>document.getElementById('group-modal')?.remove();document.getElementById('group-close').onclick=close;document.getElementById('group-cancel').onclick=close;
   document.getElementById('group-create').onclick=async()=>{
     const name=document.getElementById('group-name').value.trim()||'KARP Group',picked=[uid,...[...document.querySelectorAll('#group-modal input[type=checkbox]:checked')].map(x=>x.value)];
     if(picked.length<2){toast('Choose at least one friend.');return;}
     try{const ref=doc(collection(db,'conversations'));await setDoc(ref,{id:ref.id,type:'group',name,members:[...new Set(picked)],status:'accepted',createdBy:uid,lastMessage:'',lastMessageAt:null,createdAt:Timestamp.now(),updatedAt:Timestamp.now()});close();toast('Group created.');}catch(e){console.error(e);toast(e?.code==='permission-denied'?'Firebase rules have not been deployed yet.':'Could not create group.');}
   };
 }
 async function searchPeople(){
   const qv=document.getElementById('people-search').value.trim().toLowerCase();state.searchResults=[];renderSearch();
   if(qv.length<2)return;
   try{
     const snap=await getDocs(query(collection(db,'publicProfiles'),where('nameLower','>=',qv),where('nameLower','<=',qv+'\\uf8ff'),limit(12)));
     state.searchResults=snap.docs.map(s=>({uid:s.id,...s.data()})).filter(x=>x.uid!==uid);renderSearch();
   }catch(e){console.error('Search error:',e);toast(e?.code==='permission-denied'?'Firebase rules have not been deployed yet.':'Could not search members.');}
 }
 function installListeners(){
   state.friendUnsub=onSnapshot(query(collection(db,'friendships'),where('members','array-contains',uid)),snap=>refreshFriends(snap.docs),e=>{console.error(e);toast('Friends could not be loaded. Please deploy the latest rules.');});
   state.requestUnsub=onSnapshot(query(collection(db,'friendRequests'),where('toUid','==',uid)),snap=>{state.incoming=snap.docs.map(s=>({id:s.id,...s.data()})).filter(x=>x.status==='pending');renderSidebar()},e=>{console.error(e);toast('Requests could not be loaded. Please deploy the latest rules.');});
   state.convUnsub=onSnapshot(query(collection(db,'conversations'),where('members','array-contains',uid)),snap=>refreshConversations(snap.docs),e=>{console.error(e);toast('Chats could not be loaded. Please deploy the latest rules.');});
 }
 shell('','Messages','<main class="msg-page"><aside class="msg-sidebar"><div class="msg-sidebar-head"><div class="msg-sidebar-title">Messages</div><div class="msg-head-actions"><button class="msg-icon" id="new-group" title="Create group">＋</button></div></div><div class="msg-search-wrap"><div class="msg-search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="people-search" placeholder="Search KARP members"></div><div id="msg-search-results"></div></div><div class="msg-tabs"><button class="msg-tab active" data-tab="chats">Chats</button><button class="msg-tab" data-tab="friends">Friends</button><button class="msg-tab" data-tab="requests">Requests <span id="request-count" class="msg-count"></span></button></div><div id="msg-list" class="msg-list"></div></aside><section class="msg-content" id="chat-host"><div class="msg-chat-empty"><div><div class="msg-empty-mark">✦</div><strong>Your KARP inbox</strong><p>Accept a friend request, start a private conversation, or create a group. Messages sync in real time across your devices.</p></div></div></section></main>');
 document.querySelectorAll('.msg-tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderSidebar();});
 document.getElementById('new-group').onclick=showGroupModal;
 document.getElementById('people-search').addEventListener('input',()=>{clearTimeout(state.searchTimer);state.searchTimer=setTimeout(searchPeople,220)});
 await ensureProfile();installListeners();
 window.addEventListener('beforeunload',()=>{state.chatUnsub?.();state.convUnsub?.();state.friendUnsub?.();state.requestUnsub?.()});
})();
</script>
</body></html>
