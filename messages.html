<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Messages</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js"></script>
<style>
:root{--msg-accent:#16a05d;--msg-soft:color-mix(in srgb,var(--msg-accent) 11%,var(--panel));--msg-mine:color-mix(in srgb,var(--msg-accent) 17%,var(--panel))}
.msg-page{height:calc(100vh - 76px);min-height:620px;display:flex;overflow:hidden;background:var(--bg)}
.msg-sidebar{width:390px;flex:0 0 390px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.msg-sidebar-head{height:72px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.msg-sidebar-title{font:700 25px/1 'Space Grotesk';letter-spacing:-1px}.msg-head-actions{display:flex;gap:6px}
.msg-icon{width:39px;height:39px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--text);cursor:pointer;font-size:18px}
.msg-icon:hover{background:var(--msg-soft);color:var(--msg-accent)}
.msg-search-wrap{padding:12px 14px 8px;border-bottom:1px solid var(--line)}.msg-search-box{height:42px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;gap:9px;padding:0 12px}
.msg-search-box svg{width:17px;height:17px;opacity:.62}.msg-search-box input{border:0;outline:0;background:transparent;color:var(--text);width:100%;font:500 12px/1.2 inherit}.msg-search-box input::placeholder{color:var(--muted)}
.msg-tabs{display:flex;gap:5px;padding:10px 14px;border-bottom:1px solid var(--line)}.msg-tab{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:800;padding:8px 12px;border-radius:10px;cursor:pointer}.msg-tab.active{background:var(--msg-soft);color:var(--msg-accent)}
.msg-count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;margin-left:4px;border-radius:10px;background:var(--msg-accent);color:#fff;font-size:9px}
.msg-list{flex:1;overflow:auto;padding:4px 6px 18px}.msg-item{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--text);text-align:left;padding:12px 11px;border-radius:12px;cursor:pointer}.msg-item:hover{background:var(--panel2)}.msg-item.active{background:var(--msg-soft)}
.msg-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--panel2);display:grid;place-items:center;flex:0 0 48px;font-size:13px;font-weight:800;overflow:hidden}.msg-avatar.group{border-radius:16px;background:var(--msg-soft);color:var(--msg-accent)}
.msg-main{min-width:0;flex:1}.msg-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.msg-preview{font-size:10px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.msg-time{font-size:9px;color:var(--muted);align-self:flex-start;padding-top:2px;white-space:nowrap}
.msg-empty{padding:34px 22px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}.msg-section-label{padding:8px 2px 4px;font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:800}
.msg-search-result{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;background:var(--panel);margin-top:5px;border:1px solid var(--line)}.msg-search-result .who{min-width:0;flex:1}.msg-search-result .btn{font-size:9px;padding:8px 10px}
.req-card{padding:11px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:10px;margin:7px 4px}.req-actions{margin-left:auto;display:flex;gap:5px}.req-actions .btn{padding:7px 9px;font-size:9px}
.msg-content{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}.msg-chat-empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.msg-empty-mark{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:var(--msg-soft);color:var(--msg-accent);font-size:30px}
.msg-chat-empty strong{display:block;color:var(--text);font:700 25px/1.1 'Space Grotesk';letter-spacing:-.8px;margin-bottom:7px}.msg-chat-empty p{max-width:450px;font-size:11px;line-height:1.7}
.chat-panel{display:flex;flex-direction:column;min-width:0;height:100%}.chat-top{height:70px;flex:0 0 70px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.chat-back{display:none}.chat-top-info{min-width:0}.chat-top-info h2{font-family:'Space Grotesk';font-size:17px;letter-spacing:-.4px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-top-info p{font-size:9px;color:var(--muted);margin:4px 0 0}.chat-members{margin-left:auto;color:var(--muted);font-size:9px}
.chat-messages{flex:1;overflow:auto;padding:26px clamp(15px,4vw,62px);display:flex;flex-direction:column;gap:5px;background:radial-gradient(circle at 25px 25px,color-mix(in srgb,var(--muted) 5%,transparent) 1px,transparent 1.5px) 0 0/28px 28px,var(--bg)}
.bubble-row{display:flex;margin:1px 0}.bubble-row.mine{justify-content:flex-end}.bubble-wrap{max-width:min(70%,680px)}
.bubble{position:relative;padding:8px 10px 17px;border-radius:12px;background:var(--panel);font-size:11px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);box-shadow:0 1px 1px rgba(0,0,0,.04)}
.bubble-row:not(.mine) .bubble{border-top-left-radius:4px}.bubble-row.mine .bubble{background:var(--msg-mine);border-color:color-mix(in srgb,var(--msg-accent) 18%,transparent);border-top-right-radius:4px}
.bubble-sender{font-size:8px;color:var(--msg-accent);font-weight:800;margin:0 0 4px 3px}.message-meta{position:absolute;right:8px;bottom:4px;font-size:7px;color:var(--muted);display:flex;gap:4px;align-items:center}.message-check{font-size:8px;color:var(--msg-accent);letter-spacing:-2px}
.chat-compose{display:flex;align-items:flex-end;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--line);background:var(--panel)}.compose-icon{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:50%;background:var(--panel2);color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:17px}.compose-icon:hover{color:var(--msg-accent);background:var(--msg-soft)}
.chat-compose textarea{min-height:42px;max-height:120px;resize:none;border-radius:12px;padding:12px 13px}.chat-send{width:42px;height:42px;min-width:42px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:0}.chat-send::before{content:'➤';font-size:15px;transform:translateX(1px)}
.modal-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.62);backdrop-filter:blur(7px);display:none;place-items:center;padding:20px}.modal-backdrop.open{display:grid}.modal-card{width:min(560px,100%);max-height:min(760px,90vh);overflow:auto;background:var(--panel);border-radius:18px;padding:23px;border:1px solid var(--line)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.modal-head h2{font-family:'Space Grotesk';font-size:25px;letter-spacing:-1px;margin:0}.modal-head p{color:var(--muted);font-size:10px;line-height:1.7;margin:5px 0 0}.modal-close{border:0;background:transparent;color:var(--muted);font-size:25px;cursor:pointer}.group-form{margin-top:19px}.group-friends{display:grid;gap:7px;margin-top:11px}.friend-pick{display:flex;align-items:center;gap:10px;padding:9px;border-radius:11px;background:var(--panel2);cursor:pointer}.friend-pick input{accent-color:var(--msg-accent)}.friend-pick .friend-label{min-width:0;flex:1}.friend-pick strong{display:block;font-size:11px}.friend-pick small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.group-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}
@media(max-width:900px){.msg-page{height:auto;min-height:calc(100vh - 76px);display:block;overflow:visible}.msg-sidebar{width:100%;height:auto;min-height:0;border-right:0}.msg-list{max-height:calc(100vh - 275px)}.msg-content{display:none;min-height:calc(100vh - 76px)}.msg-page.chat-open .msg-sidebar{display:none}.msg-page.chat-open .msg-content{display:flex}.chat-back{display:grid}.chat-messages{padding:20px 11px}.bubble-wrap{max-width:84%}}
@media(max-width:520px){.msg-sidebar-head{height:64px;padding:0 13px}.msg-sidebar-title{font-size:23px}.msg-search-wrap{padding:10px 10px 7px}.msg-tabs{padding:8px 10px}.msg-tab{padding:7px 10px}.msg-list{padding:3px}.msg-item{padding:11px 8px}.msg-avatar{width:46px;height:46px;flex-basis:46px}.chat-top{height:64px;flex-basis:64px;padding:0 11px}.chat-compose{padding:8px}.chat-compose textarea{font-size:11px}}
</style>
</head>
<body>
<div id="modal-root"></div>
<script>
(async()=>{
const user=await requireUser();if(!user)return;
const {db}=await fb();
const fs=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
const {doc,getDoc,getDocs,setDoc,updateDoc,collection,query,where,orderBy,startAt,endAt,limit,onSnapshot,Timestamp}=fs;
const uid=user.id;
const state={tab:'chats',selected:null,conversations:[],friends:[],incoming:[],outgoing:[],searchTimer:0,msgUnsub:null};
const esc=x=>escapeHtml(x==null?'':String(x));
const avatar=(p,group=false)=>p?.photoURL?'<img class="msg-avatar '+(group?'group':'')+'" src="'+esc(p.photoURL)+'" alt="">':'<div class="msg-avatar '+(group?'group':'')+'">'+esc(group?'👥':String(p?.name||'K').trim().charAt(0).toUpperCase())+'</div>';
const fid=(a,b)=>a<b?a+'_'+b:b+'_'+a;const rid=(a,b)=>a+'_'+b;
const timeValue=v=>v?.toMillis?v.toMillis():Number(new Date(v))||0;
const timeText=v=>{if(!v)return '';const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'':d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});};
const dateText=v=>{if(!v)return '';const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'':d.toLocaleDateString([], {day:'2-digit',month:'short',year:'numeric'});};
async function profile(id){if(!id)return{uid:'',name:'KARP Member',photoURL:''};const s=await getDoc(doc(db,'publicProfiles',id));return s.exists()?{uid:id,...s.data()}:{uid:id,name:'KARP Member',photoURL:''};}
async function ensureProfile(){await setDoc(doc(db,'publicProfiles',uid),{uid,name:user.name||'KARP Member',nameLower:String(user.name||'KARP Member').trim().toLowerCase(),photoURL:user.photoURL||'',updatedAt:Timestamp.now()},{merge:true});}
async function loadFriends(){const snap=await getDocs(query(collection(db,'friendships'),where('members','array-contains',uid)));const rows=[];for(const s of snap.docs){const m=s.data(),other=(m.members||[]).find(x=>x!==uid);if(other)rows.push(await profile(other));}rows.sort((a,b)=>String(a.name).localeCompare(String(b.name)));state.friends=rows;}
async function loadRequests(){const incoming=await getDocs(query(collection(db,'friendRequests'),where('toUid','==',uid)));state.incoming=incoming.docs.map(s=>({id:s.id,...s.data()})).filter(x=>x.status==='pending');state.outgoing=[];}
async function loadConversations(){const snap=await getDocs(query(collection(db,'conversations'),where('members','array-contains',uid)));const rows=[];for(const s of snap.docs){const d=s.data();if(d.status!=='accepted')continue;if(d.type==='group')rows.push({id:s.id,type:'group',name:d.name||'Group',members:d.members||[],lastMessage:d.lastMessage||'',lastMessageAt:d.lastMessageAt,lastMessageSenderId:d.lastMessageSenderId||''});else{const other=(d.members||[]).find(x=>x!==uid);if(!other)continue;const p=await profile(other);rows.push({id:s.id,type:'direct',otherUid:other,profile:p,name:p.name||'KARP Member',members:d.members||[],lastMessage:d.lastMessage||'',lastMessageAt:d.lastMessageAt,lastMessageSenderId:d.lastMessageSenderId||''});}}rows.sort((a,b)=>timeValue(b.lastMessageAt)-timeValue(a.lastMessageAt));state.conversations=rows;}
function renderList(){const el=document.getElementById('msg-list');if(!el)return;if(state.tab==='chats'){if(!state.conversations.length){el.innerHTML='<div class="msg-empty">No conversations yet.<br>Accept a friend request or create a group.</div>';return;}el.innerHTML=state.conversations.map(x=>{const active=state.selected?.id===x.id,p=x.type==='group'?{name:x.name}:x.profile,preview=x.lastMessage?(x.lastMessageSenderId===uid?'You: ':'')+x.lastMessage:'No messages yet';return '<button class="msg-item '+(active?'active':'')+'" data-open="'+esc(x.id)+'">'+avatar(p,x.type==='group')+'<span class="msg-main"><span class="msg-name">'+esc(x.name)+'</span><span class="msg-preview">'+esc(preview)+'</span></span><span class="msg-time">'+esc(timeText(x.lastMessageAt))+'</span></button>';}).join('');el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openConversation(state.conversations.find(x=>x.id===b.dataset.open)));}else if(state.tab==='friends'){if(!state.friends.length){el.innerHTML='<div class="msg-empty">No friends yet.<br>Search for another KARP member above.</div>';return;}el.innerHTML=state.friends.map(p=>'<button class="msg-item" data-friend="'+esc(p.uid)+'">'+avatar(p)+'<span class="msg-main"><span class="msg-name">'+esc(p.name||'KARP Member')+'</span><span class="msg-preview">Start a conversation</span></span></button>').join('');el.querySelectorAll('[data-friend]').forEach(b=>b.onclick=async()=>{const p=state.friends.find(x=>x.uid===b.dataset.friend);if(p)await openFriend(p);});}else{const incoming=state.incoming;el.innerHTML=incoming.length?incoming.map(x=>'<div class="req-card">'+avatar({name:x.fromName,photoURL:x.fromPhotoURL})+'<div class="msg-main"><div class="msg-name">'+esc(x.fromName||'KARP Member')+'</div><div class="msg-preview">Wants to be your friend</div></div><div class="req-actions"><button class="btn primary" data-accept="'+esc(x.id)+'">Accept</button><button class="btn" data-reject="'+esc(x.id)+'">Reject</button></div></div>').join(''):'<div class="msg-empty">No pending requests.</div>';el.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{const x=state.incoming.find(y=>y.id===b.dataset.accept);if(x)try{await acceptRequest(x);}catch(e){console.error(e);toast('Could not accept request.');}});el.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{const x=state.incoming.find(y=>y.id===b.dataset.reject);if(x)try{await updateRequest(x,'rejected');}catch(e){console.error(e);toast('Could not update request.');}});}}
function renderSidebar(){document.querySelectorAll('.msg-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));document.getElementById('request-count').textContent=state.incoming.length?String(state.incoming.length):'';renderList();}
async function sendRequest(p){if(!p||p.uid===uid)return;if(state.friends.some(x=>x.uid===p.uid)){toast('You are already friends.');return;}try{const reverse=await getDoc(doc(db,'friendRequests',rid(p.uid,uid)));if(reverse.exists()&&reverse.data()?.status==='pending'){await acceptRequest({id:reverse.id,...reverse.data()});return;}const ref=doc(db,'friendRequests',rid(uid,p.uid));const mine=await getDoc(ref);if(mine.exists()&&mine.data()?.status==='pending'){toast('Friend request already sent.');return;}await setDoc(ref,{fromUid:uid,toUid:p.uid,fromName:user.name||'KARP Member',fromPhotoURL:user.photoURL||'',toName:p.name||'User',toPhotoURL:p.photoURL||'',status:'pending',createdAt:Timestamp.now()});toast('Friend request sent.');await loadRequests();renderSidebar();}catch(e){console.error('Friend request error:',e);toast(e?.code==='permission-denied'?'Friend request is blocked by Firebase security rules.':'Could not send friend request.');}}
async function acceptRequest(x){await updateDoc(doc(db,'friendRequests',x.id),{status:'accepted',respondedAt:Timestamp.now()});const friendship=fid(x.fromUid,x.toUid),members=[x.fromUid,x.toUid].sort();await setDoc(doc(db,'friendships',friendship),{id:friendship,members,status:'accepted',requestId:x.id,createdAt:x.createdAt||Timestamp.now(),updatedAt:Timestamp.now()},{merge:true});await setDoc(doc(db,'conversations',friendship),{id:friendship,type:'direct',members,status:'accepted',createdBy:x.toUid,lastMessage:'',lastMessageAt:null,updatedAt:Timestamp.now()},{merge:true});await loadRequests();await loadFriends();await loadConversations();renderSidebar();toast('Friend request accepted.');}
async function updateRequest(x,status){await updateDoc(doc(db,'friendRequests',x.id),{status,respondedAt:Timestamp.now()});await loadRequests();renderSidebar();}
async function openFriend(p){const id=fid(uid,p.uid),s=await getDoc(doc(db,'conversations',id));if(!s.exists())await setDoc(doc(db,'conversations',id),{id,type:'direct',members:[uid,p.uid].sort(),status:'accepted',createdBy:uid,lastMessage:'',lastMessageAt:null,updatedAt:Timestamp.now()});await loadConversations();await openConversation(state.conversations.find(x=>x.id===id)||{id,type:'direct',name:p.name,profile:p,otherUid:p.uid,members:[uid,p.uid]});}
function chatMarkup(item){const p=item.type==='group'?{name:item.name}:item.profile;return '<section class="chat-panel"><header class="chat-top"><button class="msg-icon chat-back" id="chat-back" aria-label="Back">‹</button>'+avatar(p,item.type==='group')+'<div class="chat-top-info"><h2>'+esc(item.name)+'</h2><p>'+esc(item.type==='group'?('KARP group · '+(item.members?.length||2)+' members'):item.type==='support'?'KARP admin support':'KARP member')+'</p></div><div class="chat-members">'+esc(item.type==='group'?'Group chat':'Direct message')+'</div></header><div id="chat-messages" class="chat-messages"></div><form id="chat-compose" class="chat-compose"><button type="button" id="emoji-btn" class="compose-icon" title="Add emoji">☺</button><textarea id="chat-input" class="textarea" maxlength="4000" rows="1" placeholder="Type a message"></textarea><button class="btn primary chat-send" type="submit" aria-label="Send message" title="Send"></button></form></section>';}
async function openConversation(item){if(!item)return;state.selected=item;document.querySelector('.msg-page')?.classList.add('chat-open');document.getElementById('chat-host').innerHTML=chatMarkup(item);renderSidebar();if(state.msgUnsub){state.msgUnsub();state.msgUnsub=null;}const list=document.getElementById('chat-messages');state.msgUnsub=onSnapshot(query(collection(db,'conversations',item.id,'messages'),orderBy('createdAt','asc')),snap=>{let lastDay='';list.innerHTML=snap.docs.map(s=>{const m=s.data(),mine=m.senderId===uid,day=dateText(m.createdAt);let sep='';if(day&&day!==lastDay){lastDay=day;sep='<div style="display:flex;justify-content:center;margin:7px 0 4px"><span style="padding:5px 9px;border-radius:8px;background:var(--panel2);color:var(--muted);font-size:8px">'+esc(day)+'</span></div>';}return sep+'<div class="bubble-row '+(mine?'mine':'')+'"><div class="bubble-wrap">'+((item.type==='group'&&!mine)?'<div class="bubble-sender">'+esc(m.senderName||'KARP member')+'</div>':'')+'<div class="bubble">'+esc(m.text||'')+'<span class="message-meta">'+esc(timeText(m.createdAt))+(mine?'<span class="message-check">✓✓</span>':'')+'</span></div></div></div>';}).join('')||'<div class="msg-empty" style="margin:auto">No messages yet. Say hello.</div>';list.scrollTop=list.scrollHeight;},e=>{console.error('KARP messages snapshot error:',e);toast('Messages could not be loaded.');});const input=document.getElementById('chat-input');const resize=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';};input.addEventListener('input',resize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('chat-compose').requestSubmit();}});document.getElementById('emoji-btn').onclick=()=>{input.value+=(input.value?' ':'')+'🙂';input.focus();resize();};document.getElementById('chat-back').onclick=()=>{document.querySelector('.msg-page')?.classList.remove('chat-open');state.selected=null;if(state.msgUnsub){state.msgUnsub();state.msgUnsub=null;}document.getElementById('chat-host').innerHTML='<div class="msg-chat-empty"><div><div class="msg-empty-mark">✦</div><strong>Your messages</strong><p>Choose a friend on the left to start a conversation.</p></div></div>';renderSidebar();};document.getElementById('chat-compose').onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;const now=Timestamp.now();try{await setDoc(doc(collection(db,'conversations',item.id,'messages')),{senderId:uid,senderName:user.name||'KARP member',text,createdAt:now});await updateDoc(doc(db,'conversations',item.id),{lastMessage:text.slice(0,140),lastMessageSenderId:uid,lastMessageAt:now,updatedAt:now});input.value='';resize();input.focus();}catch(err){console.error(err);toast('Message could not be sent.');}};setTimeout(()=>input.focus(),80);}
async function searchPeople(){const val=document.getElementById('people-search').value.trim().toLowerCase(),el=document.getElementById('search-results');if(val.length<2){el.innerHTML='';return;}try{const snap=await getDocs(query(collection(db,'publicProfiles'),orderBy('nameLower'),startAt(val),endAt(val+'\uf8ff'),limit(12)));const rows=snap.docs.map(s=>({uid:s.id,...s.data()})).filter(x=>x.uid!==uid);el.innerHTML='<div class="msg-section-label">People</div>'+(rows.length?rows.map(p=>'<div class="msg-search-result">'+avatar(p)+'<div class="who"><div class="msg-name">'+esc(p.name||'KARP Member')+'</div><div class="msg-preview">KARP member</div></div><button class="btn" data-add="'+esc(p.uid)+'">Add</button></div>').join(''):'<div class="msg-empty" style="padding:15px 2px">No members found.</div>');el.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{const p=rows.find(x=>x.uid===b.dataset.add);if(p)try{await sendRequest(p);}catch(e){console.error(e);toast('Could not send friend request.');}});}catch(e){console.error(e);el.innerHTML='<div class="msg-empty" style="padding:15px 2px">Search is temporarily unavailable.</div>';}}
async function showGroupModal(){await loadFriends();const modal=document.getElementById('group-modal');modal.classList.add('open');const list=document.getElementById('group-friends');list.innerHTML=state.friends.length?state.friends.map(p=>'<label class="friend-pick">'+avatar(p)+'<span class="friend-label"><strong>'+esc(p.name)+'</strong><small>Select for this group</small></span><input type="checkbox" value="'+esc(p.uid)+'"></label>').join(''):'<div class="msg-empty">Add friends first.</div>';}
function closeGroupModal(){document.getElementById('group-modal').classList.remove('open');}
async function createGroup(){const name=document.getElementById('group-name').value.trim()||'KARP Group';const selected=[...document.querySelectorAll('#group-friends input:checked')].map(x=>x.value);if(!selected.length){toast('Select at least one friend.');return;}if(selected.length>19){toast('A group can have up to 20 members.');return;}const members=[...new Set([uid,...selected])];try{const id=doc(collection(db,'conversations')).id,now=Timestamp.now();await setDoc(doc(db,'conversations',id),{id,type:'group',name,members,status:'accepted',createdBy:uid,lastMessage:'',lastMessageAt:null,createdAt:now,updatedAt:now});closeGroupModal();document.getElementById('group-name').value='';await loadConversations();state.tab='chats';renderSidebar();await openConversation(state.conversations.find(x=>x.id===id));}catch(e){console.error(e);toast('Group could not be created.');}}
const empty='<div class="msg-chat-empty"><div><div class="msg-empty-mark">✦</div><strong>Your messages</strong><p>Choose a friend on the left to start a conversation. Friend requests must be accepted before messaging.</p></div></div>';
let loadError=null;
try{await ensureProfile();await loadFriends();await loadRequests();await loadConversations();}catch(e){console.error('KARP messages load error:',e);loadError=e;}
shell('Messages','Messages','<main class="msg-page"><aside class="msg-sidebar"><div class="msg-sidebar-head"><div class="msg-sidebar-title">Messages</div><div class="msg-head-actions"><button id="new-group" class="msg-icon" title="Create group">＋</button></div></div><div class="msg-search-wrap"><div class="msg-search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="people-search" placeholder="Search people"></div><div id="search-results"></div></div><div class="msg-tabs"><button class="msg-tab active" data-tab="chats">Chats</button><button class="msg-tab" data-tab="friends">Friends</button><button class="msg-tab" data-tab="requests">Requests <span id="request-count" class="msg-count"></span></button></div><div id="msg-list" class="msg-list"></div></aside><section id="chat-host" class="msg-content">'+empty+'</section></main><div id="group-modal" class="modal-backdrop"><section class="modal-card"><div class="modal-head"><div><h2>Create a group</h2><p>Choose friends to include. Everyone in the group can message the group.</p></div><button class="modal-close" id="close-group">×</button></div><div class="group-form"><label class="mock-label">Group name</label><input id="group-name" class="input" maxlength="80" placeholder="e.g. IMO Training Group"><div class="group-friends" id="group-friends"></div><div class="group-actions"><button class="btn" id="cancel-group">Cancel</button><button class="btn primary" id="create-group">Create group</button></div></div></section></div>');
document.querySelectorAll('.msg-tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderSidebar();});
document.getElementById('people-search').addEventListener('input',()=>{clearTimeout(state.searchTimer);state.searchTimer=setTimeout(searchPeople,180);});
document.getElementById('new-group').onclick=()=>showGroupModal().catch(e=>{console.error(e);toast('Could not load friends.');});
document.getElementById('close-group').onclick=closeGroupModal;document.getElementById('cancel-group').onclick=closeGroupModal;document.getElementById('create-group').onclick=()=>createGroup();
renderSidebar();
if(loadError)console.error('Messages initial load error:',loadError);
window.addEventListener('beforeunload',()=>{if(state.msgUnsub)state.msgUnsub();});
})();
</script>
</body></html>
