<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Messages</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<style>
.msg-shell{height:calc(100vh - 76px);min-height:620px;background:var(--bg);display:flex;overflow:hidden}
.msg-sidebar{width:360px;flex:0 0 360px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.msg-side-top{padding:24px 20px 14px}.msg-side-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.msg-side-title h1{font-family:'Space Grotesk';font-size:28px;letter-spacing:-1px;margin:0}
.icon-btn{width:38px;height:38px;border:0;border-radius:10px;background:var(--panel2);color:var(--text);font-size:20px;line-height:1;cursor:pointer}.icon-btn:hover{transform:translateY(-1px)}
.msg-search{padding:0 20px 12px}.msg-search .input{height:42px;border-radius:11px}
.msg-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 20px 14px}.msg-tab{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:800;padding:9px 7px;border-radius:9px;cursor:pointer}.msg-tab.active{background:var(--panel2);color:var(--text)}
.msg-count{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;margin-left:4px;border-radius:99px;background:var(--text);color:var(--bg);font-size:8px}
.msg-list{flex:1;overflow:auto;padding:0 10px 16px}
.msg-item{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--text);text-align:left;padding:11px 10px;border-radius:12px;cursor:pointer}.msg-item:hover{background:var(--panel2)}.msg-item.active{background:var(--panel2)}
.msg-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--panel2);display:grid;place-items:center;flex:0 0 42px;font-size:12px;font-weight:800}
.msg-avatar.group{border-radius:12px;font-size:16px}
.msg-main{min-width:0;flex:1}.msg-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.msg-preview{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.msg-time{font-size:9px;color:var(--muted);align-self:flex-start;padding-top:2px}
.msg-empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}
.msg-content{flex:1;min-width:0;background:var(--bg);display:flex;flex-direction:column}
.msg-chat-empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.msg-chat-empty strong{display:block;color:var(--text);font-family:'Space Grotesk';font-size:27px;letter-spacing:-1px;margin-bottom:7px}
.msg-chat-empty p{max-width:420px;font-size:12px;line-height:1.7}
.chat-panel{display:flex;flex-direction:column;min-width:0;height:100%}
.chat-top{height:76px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--panel)}
.chat-top-info{min-width:0}.chat-top-info h2{font-family:'Space Grotesk';font-size:18px;letter-spacing:-.5px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-top-info p{font-size:9px;color:var(--muted);margin:3px 0 0}
.chat-members{margin-left:auto;color:var(--muted);font-size:10px}
.chat-messages{flex:1;overflow:auto;padding:28px clamp(18px,5vw,70px);display:flex;flex-direction:column;gap:9px}
.bubble-row{display:flex}.bubble-row.mine{justify-content:flex-end}.bubble-wrap{max-width:min(75%,720px)}.bubble{padding:10px 13px;border-radius:15px;background:var(--panel);font-size:12px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line)}.mine .bubble{background:var(--text);color:var(--bg);border-color:transparent}.bubble-sender{font-size:9px;color:var(--muted);margin:0 0 3px 4px}.message-time{font-size:8px;color:var(--muted);margin:3px 4px 0}.mine .message-time{text-align:right}
.chat-compose{display:flex;gap:9px;padding:15px 28px 18px;border-top:1px solid var(--line);background:var(--panel)}.chat-compose .textarea{min-height:46px;max-height:130px;resize:vertical}.chat-send{align-self:flex-end;height:46px}
.modal-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.62);backdrop-filter:blur(9px);display:none;place-items:center;padding:20px}.modal-backdrop.open{display:grid}.modal-card{width:min(560px,100%);max-height:min(760px,90vh);overflow:auto;background:var(--panel);border-radius:20px;padding:24px}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.modal-head h2{font-family:'Space Grotesk';font-size:26px;letter-spacing:-1px;margin:0}.modal-head p{color:var(--muted);font-size:11px;line-height:1.7;margin:5px 0 0}.modal-close{border:0;background:transparent;color:var(--muted);font-size:25px;cursor:pointer}.group-form{margin-top:20px}.group-friends{display:grid;gap:7px;margin-top:12px}.friend-pick{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;background:var(--panel2);cursor:pointer}.friend-pick:hover{transform:translateY(-1px)}.friend-pick input{accent-color:currentColor}.friend-pick .friend-label{min-width:0;flex:1}.friend-pick strong{display:block;font-size:12px}.friend-pick small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.friend-action{margin-left:auto;font-size:9px}
.group-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.req-card{padding:12px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;gap:10px;margin-bottom:7px}.req-actions{margin-left:auto;display:flex;gap:5px}.req-actions .btn{padding:7px 9px;font-size:9px}
.search-result{display:flex;align-items:center;gap:10px;padding:11px;border-radius:11px;background:var(--panel2);margin-bottom:6px}.search-result .user-info{min-width:0;flex:1}.search-result .btn{font-size:9px;padding:7px 9px}
.section-mini{padding:13px 10px 7px;font-size:9px;text-transform:uppercase;letter-spacing:1.7px;font-weight:800;color:var(--muted)}
@media(max-width:900px){
  .msg-shell{height:auto;min-height:calc(100vh - 76px);display:block;overflow:visible}
  .msg-sidebar{width:100%;height:auto;min-height:0;border-right:0;border-bottom:1px solid var(--line)}
  .msg-list{max-height:330px}
  .msg-content{min-height:620px}
  .chat-messages{padding:20px 16px}.chat-compose{padding:12px 16px}
}
@media(max-width:520px){
  .msg-side-top{padding:18px 14px 12px}.msg-search,.msg-tabs{padding-left:14px;padding-right:14px}.msg-item{padding:10px 6px}
  .chat-top{height:68px;padding:0 15px}.chat-members{display:none}.bubble-wrap{max-width:88%}
}
</style>
</head>
<body>
<div id="modal-root"></div>
<script>
(async()=>{
  const user=await requireUser();if(!user)return;
  const {db}=await fb();
  const fs=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
  const {doc,getDoc,getDocs,setDoc,updateDoc,collection,query,where,orderBy,startAt,endAt,limit,onSnapshot,Timestamp}=fs;
  const uid=user.id;
  const state={tab:'chats',selected:null,conversations:[],friends:[],incoming:[],outgoing:[],searchTimer:0,msgUnsub:null,convUnsub:null};

  const esc=x=>escapeHtml(x==null?'':String(x));
  const avatar=(p,group=false)=>p?.photoURL?'<img class="msg-avatar '+(group?'group':'')+'" src="'+esc(p.photoURL)+'" alt="">':'<div class="msg-avatar '+(group?'group':'')+'">'+esc(group?'✦':String(p?.name||'K').trim().charAt(0).toUpperCase())+'</div>';
  const fid=(a,b)=>a<b?a+'_'+b:b+'_'+a;
  const rid=(a,b)=>a+'_'+b;
  const timeValue=v=>v?.toMillis?v.toMillis():Number(new Date(v))||0;
  const timeText=v=>{const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'':d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})};

  async function profile(id){
    const s=await getDoc(doc(db,'publicProfiles',id));
    return s.exists()?{uid:id,...s.data()}:{uid:id,name:'KARP Member',photoURL:''};
  }

  async function ensureProfile(){
    await setDoc(doc(db,'publicProfiles',uid),{uid,name:user.name||'KARP Member',nameLower:String(user.name||'KARP Member').trim().toLowerCase(),photoURL:user.photoURL||'',updatedAt:Timestamp.now()},{merge:true});
  }

  async function loadFriends(){
    const snap=await getDocs(query(collection(db,'friendships'),where('members','array-contains',uid)));
    const rows=[];
    for(const s of snap.docs){
      const m=s.data(),other=(m.members||[]).find(x=>x!==uid);
      if(other)rows.push(await profile(other));
    }
    state.friends=rows;
  }

  async function loadRequests(){
    const [incoming,outgoing]=await Promise.all([
      getDocs(query(collection(db,'friendRequests'),where('toUid','==',uid))),
      getDocs(query(collection(db,'friendRequests'),where('fromUid','==',uid)))
    ]);
    state.incoming=incoming.docs.map(s=>({id:s.id,...s.data()})).filter(x=>x.status==='pending');
    state.outgoing=outgoing.docs.map(s=>({id:s.id,...s.data()})).filter(x=>x.status==='pending');
  }

  async function loadConversations(){
    const snap=await getDocs(query(collection(db,'conversations'),where('members','array-contains',uid)));
    const rows=[];
    for(const s of snap.docs){
      const d=s.data();
      if(d.status!=='accepted')continue;
      if(d.type==='group'){
        rows.push({id:s.id,type:'group',name:d.name||'Group',members:d.members||[],lastMessage:d.lastMessage||'',lastMessageAt:d.lastMessageAt});
      }else{
        const other=(d.members||[]).find(x=>x!==uid);
        const p=await profile(other);
        rows.push({id:s.id,type:'direct',otherUid:other,profile:p,name:p.name,members:d.members||[],lastMessage:d.lastMessage||'',lastMessageAt:d.lastMessageAt});
      }
    }
    rows.sort((a,b)=>timeValue(b.lastMessageAt)-timeValue(a.lastMessageAt));
    state.conversations=rows;
  }

  function renderList(){
    const el=document.getElementById('msg-list');if(!el)return;
    if(state.tab==='chats'){
      if(!state.conversations.length){el.innerHTML='<div class="msg-empty">No conversations yet.<br>Accept a friend request or create a group.</div>';return}
      el.innerHTML=state.conversations.map(x=>{
        const active=state.selected?.id===x.id;
        const p=x.type==='group'?{name:x.name}:x.profile;
        return '<button class="msg-item '+(active?'active':'')+'" data-open="'+esc(x.id)+'">'+avatar(p,x.type==='group')+'<span class="msg-main"><span class="msg-name">'+esc(x.name)+'</span><span class="msg-preview">'+esc(x.lastMessage||'No messages yet')+'</span></span><span class="msg-time">'+esc(timeText(x.lastMessageAt))+'</span></button>';
      }).join('');
      el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openConversation(state.conversations.find(x=>x.id===b.dataset.open)));
    }else if(state.tab==='friends'){
      if(!state.friends.length){el.innerHTML='<div class="msg-empty">No friends yet.<br>Use the search above to find KARP members.</div>';return}
      el.innerHTML=state.friends.map(p=>'<button class="msg-item" data-friend="'+esc(p.uid)+'">'+avatar(p)+'<span class="msg-main"><span class="msg-name">'+esc(p.name)+'</span><span class="msg-preview">Open conversation</span></span></button>').join('');
      el.querySelectorAll('[data-friend]').forEach(b=>b.onclick=async()=>{const p=state.friends.find(x=>x.uid===b.dataset.friend);if(p)await openFriend(p)});
    }else{
      const incoming=state.incoming;
      el.innerHTML=(incoming.length?incoming.map(x=>'<div class="req-card">'+avatar({name:x.fromName,photoURL:x.fromPhotoURL})+'<div class="msg-main"><div class="msg-name">'+esc(x.fromName)+'</div><div class="msg-preview">Wants to be your friend</div></div><div class="req-actions"><button class="btn primary" data-accept="'+esc(x.id)+'">Accept</button><button class="btn" data-reject="'+esc(x.id)+'">Reject</button></div></div>').join(''):'<div class="msg-empty">No pending requests.</div>');
      el.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{const x=state.incoming.find(y=>y.id===b.dataset.accept);if(x)await acceptRequest(x)});
      el.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{const x=state.incoming.find(y=>y.id===b.dataset.reject);if(x)await updateRequest(x,'rejected')});
    }
  }

  function renderSidebar(){
    document.getElementById('msg-list').innerHTML='';
    document.querySelectorAll('.msg-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
    document.getElementById('request-count').textContent=state.incoming.length?String(state.incoming.length):'';
    renderList();
  }

  async function sendRequest(p){
    if(!p||p.uid===uid)return;
    const fsSnap=await getDoc(doc(db,'friendships',fid(uid,p.uid)));
    if(fsSnap.exists()){toast('You are already friends.');return}
    const reverse=await getDoc(doc(db,'friendRequests',rid(p.uid,uid)));
    if(reverse.exists()&&reverse.data()?.status==='pending'){await acceptRequest({id:reverse.id,...reverse.data()});return}
    const ref=doc(db,'friendRequests',rid(uid,p.uid)),snap=await getDoc(ref);
    if(snap.exists()&&snap.data()?.status==='pending'){toast('Friend request already sent.');return}
    await setDoc(ref,{fromUid:uid,toUid:p.uid,fromName:user.name||'KARP Member',fromPhotoURL:user.photoURL||'',toUid:p.uid,toName:p.name||'User',toPhotoURL:p.photoURL||'',status:'pending',createdAt:Timestamp.now()});
    toast('Friend request sent.');
    await loadRequests();renderSidebar();
  }

  async function acceptRequest(x){
    await updateDoc(doc(db,'friendRequests',x.id),{status:'accepted',respondedAt:Timestamp.now()});
    const friendship=fid(x.fromUid,x.toUid),members=[x.fromUid,x.toUid].sort();
    await setDoc(doc(db,'friendships',friendship),{id:friendship,members,status:'accepted',requestId:x.id,createdAt:x.createdAt||Timestamp.now(),updatedAt:Timestamp.now()},{merge:true});
    await setDoc(doc(db,'conversations',friendship),{id:friendship,type:'direct',members,status:'accepted',createdBy:x.toUid,lastMessage:'',lastMessageAt:null,updatedAt:Timestamp.now()},{merge:true});
    await loadRequests();await loadFriends();await loadConversations();renderSidebar();toast('Friend request accepted.');
  }

  async function updateRequest(x,status){
    await updateDoc(doc(db,'friendRequests',x.id),{status,respondedAt:Timestamp.now()});
    await loadRequests();renderSidebar();
  }

  async function openFriend(p){
    const id=fid(uid,p.uid);
    let s=await getDoc(doc(db,'conversations',id));
    if(!s.exists()){
      await setDoc(doc(db,'conversations',id),{id,type:'direct',members:[uid,p.uid].sort(),status:'accepted',createdBy:uid,lastMessage:'',lastMessageAt:null,updatedAt:Timestamp.now()});
    }
    await loadConversations();
    openConversation(state.conversations.find(x=>x.id===id)||{id,type:'direct',name:p.name,profile:p,otherUid:p.uid,members:[uid,p.uid]});
  }

  async function openConversation(item){
    if(!item)return;
    state.selected=item;renderSidebar();
    if(state.msgUnsub){state.msgUnsub();state.msgUnsub=null}
    const p=item.type==='group'?{name:item.name}:{...item.profile};
    const host=document.getElementById('chat-host');
    host.innerHTML='<section class="chat-panel"><header class="chat-top">'+avatar(p,item.type==='group')+'<div class="chat-top-info"><h2>'+esc(item.name)+'</h2><p>'+(item.type==='group'?'KARP group':'Direct message')+'</p></div><div class="chat-members">'+(item.members?.length||2)+' members</div></header><div id="chat-messages" class="chat-messages"></div><form id="chat-compose" class="chat-compose"><textarea id="chat-input" class="textarea" maxlength="4000" placeholder="Message '+esc(item.name)+'…"></textarea><button class="btn primary chat-send" type="submit">Send</button></form></section>';
    const list=document.getElementById('chat-messages');
    state.msgUnsub=onSnapshot(query(collection(db,'conversations',item.id,'messages'),orderBy('createdAt','asc')),(snap)=>{
      list.innerHTML=snap.docs.map(s=>{
        const m=s.data(),mine=m.senderId===uid;
        const sender=m.senderName||'KARP member';
        return '<div class="bubble-row '+(mine?'mine':'')+'"><div class="bubble-wrap">'+((item.type==='group'&&!mine)?'<div class="bubble-sender">'+esc(sender)+'</div>':'')+'<div class="bubble">'+esc(m.text)+'</div><div class="message-time">'+esc(timeText(m.createdAt))+'</div></div></div>';
      }).join('')||'<div class="msg-empty" style="margin:auto">No messages yet.</div>';
      list.scrollTop=list.scrollHeight;
    },e=>toast(e.message));
    document.getElementById('chat-compose').onsubmit=async e=>{
      e.preventDefault();
      const input=document.getElementById('chat-input'),text=input.value.trim();if(!text)return;
      await setDoc(doc(collection(db,'conversations',item.id,'messages')),{senderId:uid,senderName:user.name||'KARP member',text,createdAt:Timestamp.now()});
      await updateDoc(doc(db,'conversations',item.id),{lastMessage:text.slice(0,140),lastMessageAt:Timestamp.now(),updatedAt:Timestamp.now()});
      input.value='';input.focus();
    };
    setTimeout(()=>document.getElementById('chat-input')?.focus(),50);
  }

  async function searchPeople(){
    const val=document.getElementById('people-search').value.trim().toLowerCase(),el=document.getElementById('search-results');
    if(val.length<2){el.innerHTML='';return}
    const snap=await getDocs(query(collection(db,'publicProfiles'),orderBy('nameLower'),startAt(val),endAt(val+'\uf8ff'),limit(12)));
    const rows=snap.docs.map(s=>({uid:s.id,...s.data()})).filter(x=>x.uid!==uid);
    el.innerHTML=rows.length?('<div class="section-mini">People</div>'+rows.map(p=>'<div class="search-result">'+avatar(p)+'<div class="user-info"><div class="msg-name">'+esc(p.name)+'</div><div class="msg-preview">KARP member</div></div><button class="btn" data-add="'+esc(p.uid)+'">Add friend</button></div>').join('')):'<div class="msg-empty">No members found.</div>';
    el.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{const p=rows.find(x=>x.uid===b.dataset.add);if(p)await sendRequest(p)});
  }

  async function showGroupModal(){
    await loadFriends();
    const modal=document.getElementById('group-modal');modal.classList.add('open');
    const list=document.getElementById('group-friends');
    list.innerHTML=state.friends.length?state.friends.map(p=>'<label class="friend-pick">'+avatar(p)+'<span class="friend-label"><strong>'+esc(p.name)+'</strong><small>Select for this group</small></span><input type="checkbox" value="'+esc(p.uid)+'"></label>').join(''):'<div class="msg-empty">Add some friends first.</div>';
  }
  function closeGroupModal(){document.getElementById('group-modal').classList.remove('open')}
  async function createGroup(){
    const name=document.getElementById('group-name').value.trim()||'KARP Group';
    const selected=[...document.querySelectorAll('#group-friends input:checked')].map(x=>x.value);
    if(!selected.length){toast('Select at least one friend.');return}
    if(selected.length>19){toast('A group can have up to 20 members.');return}
    const members=[uid,...selected.filter(x=>x!==uid)];
    const id=doc(collection(db,'conversations')).id;
    await setDoc(doc(db,'conversations',id),{id,type:'group',name,members,status:'accepted',createdBy:uid,lastMessage:'',lastMessageAt:null,createdAt:Timestamp.now(),updatedAt:Timestamp.now()});
    closeGroupModal();document.getElementById('group-name').value='';
    await loadConversations();state.tab='chats';renderSidebar();openConversation(state.conversations.find(x=>x.id===id));
  }

  await ensureProfile();
  await loadFriends();await loadRequests();await loadConversations();

  shell('Messages','Messages',`<main class="msg-shell"><aside class="msg-sidebar"><div class="msg-side-top"><div class="msg-side-title"><h1>Messages</h1><button id="new-group" class="icon-btn" title="Create group">＋</button></div></div><div class="msg-search"><input id="people-search" class="input" placeholder="Search people…"><div id="search-results"></div></div><div class="msg-tabs"><button class="msg-tab active" data-tab="chats">Chats</button><button class="msg-tab" data-tab="friends">Friends</button><button class="msg-tab" data-tab="requests">Requests <span id="request-count" class="msg-count"></span></button></div><div id="msg-list" class="msg-list"></div></aside><section id="chat-host" class="msg-content"><div class="msg-chat-empty"><div><strong>Your messages</strong><p>Choose a friend on the left to start a conversation. Friend requests must be accepted before messaging.</p></div></div></section></main><div id="group-modal" class="modal-backdrop"><section class="modal-card"><div class="modal-head"><div><h2>Create a group</h2><p>Choose friends to include. Everyone in the group can message the group.</p></div><button class="modal-close" id="close-group">×</button></div><div class="group-form"><label class="mock-label">Group name</label><input id="group-name" class="input" maxlength="80" placeholder="e.g. IMO Training Group"><div class="group-friends" id="group-friends"></div><div class="group-actions"><button class="btn" id="cancel-group">Cancel</button><button class="btn primary" id="create-group">Create group</button></div></div></section></div>`);
  document.querySelectorAll('.msg-tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderSidebar()});
  document.getElementById('people-search').addEventListener('input',()=>{clearTimeout(state.searchTimer);state.searchTimer=setTimeout(searchPeople,180)});
  document.getElementById('new-group').onclick=showGroupModal;
  document.getElementById('close-group').onclick=closeGroupModal;
  document.getElementById('cancel-group').onclick=closeGroupModal;
  document.getElementById('create-group').onclick=createGroup;
  renderSidebar();
  window.addEventListener('beforeunload',()=>{if(state.msgUnsub)state.msgUnsub()});
})();
</script>
</body>
</html>
