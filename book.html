<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Book</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<style>
html,body{margin:0!important;padding:0!important;background:#fff!important}
body{min-height:100vh!important}
</style>
<script>
(async()=>{
  const params=new URLSearchParams(location.search),id=params.get('id');
  if(!id){location.href='/books.html';return}
  try{
    const {db}=await fb();
    const {doc,getDoc,getDocs,collection,updateDoc,increment}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
    const snap=await getDoc(doc(db,'books',id));
    if(!snap.exists()){location.href='/books.html';return}
    const book={id:snap.id,...snap.data()};
    document.title='KARP — '+(book.title||'Book');
    try{await updateDoc(doc(db,'books',id),{viewCount:increment(1)})}catch(e){console.warn('Book view count update failed:',e)}
    const snapChunks=await getDocs(collection(db,'books',id,'chunks'));
    const chunks=snapChunks.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>Number(a.index??a.id)-Number(b.index??b.id));
    if(!chunks.length)throw new Error('PDF data is missing.');
    const b64ToBytes=base64=>{
      const binary=atob(base64),bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      return bytes;
    };
    const parts=chunks.map(x=>b64ToBytes(x.data));
    const total=parts.reduce((n,x)=>n+x.length,0);
    const bytes=new Uint8Array(total);let offset=0;
    parts.forEach(part=>{bytes.set(part,offset);offset+=part.length});
    const blobUrl=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    location.replace(blobUrl);
  }catch(e){
    document.body.innerHTML='<div style="font:14px system-ui;padding:40px;text-align:center"><h2>Unable to open this book</h2><p>'+escapeHtml(e.message||'Something went wrong.')+'</p><a href="/books.html">← Back to Books</a></div>';
  }
})();
</script>
</head>
<body>
<script>
(async()=>{
  const params=new URLSearchParams(location.search),id=params.get('id');
  if(!id){location.href='/books.html';return}
  try{
    const {db}=await fb();
    const fs=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
    const {doc,getDoc,getDocs,collection,updateDoc,increment}=fs;
    const snap=await getDoc(doc(db,'books',id));
    if(!snap.exists()){location.href='/books.html';return}
    const book={id:snap.id,...snap.data()};
    document.title='KARP — '+(book.title||'Book');
    shell('Books',book.title||'Book',
      '<main class="book-page">'+
        '<div class="book-reader-head"><div class="book-reader-title">'+escapeHtml(book.title||book.fileName||'Untitled Book')+'</div><div class="book-reader-page" id="book-reader-page">Page 1</div><div class="book-reader-actions"><button class="btn" id="book-download" type="button">Download</button><a class="btn" href="/books.html">← Books</a></div></div>'+
        '<div class="book-viewer-shell"><div class="book-canvas-stage"><div class="book-loading" id="book-loading">Loading PDF…</div><div class="book-canvas-shell book-hidden" id="book-canvas-shell"><canvas id="book-canvas"></canvas></div></div></div>'+
        '<div class="book-tools"><button class="btn" id="book-prev" type="button">←</button><input class="book-page-input" id="book-page-input" type="number" min="1" value="1" aria-label="Page number"><span class="book-page-total" id="book-page-total">/ —</span><button class="btn" id="book-next" type="button">→</button><button class="btn" id="book-zoom-out" type="button">−</button><button class="btn" id="book-zoom-in" type="button">+</button><button class="btn" id="book-fit" type="button">Fit</button></div>'+
        '<aside class="book-rail"><div class="book-rail-scroll" id="book-rail-scroll" aria-label="Pages"></div></aside>'+
      '</main>'
    );
    setKarpActivity({page:'Books',label:'Reading book',detail:book.title||'Book',question:null});
    try{await updateDoc(doc(db,'books',id),{viewCount:increment(1)})}catch(e){console.warn('Book view count update failed:',e)}

    const pdfjsLib=await window.KARPPdfReady;
    let pdf=null,page=1,scale=1,baseBytes=null;
    const loading=document.getElementById('book-loading'),shellEl=document.getElementById('book-canvas-shell'),canvas=document.getElementById('book-canvas'),ctx=canvas.getContext('2d',{alpha:false}),pageInput=document.getElementById('book-page-input'),pageTotal=document.getElementById('book-page-total'),rail=document.getElementById('book-rail-scroll'),readerPage=document.getElementById('book-reader-page');

    const b64ToBytes=base64=>{
      const binary=atob(base64),bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      return bytes;
    };
    async function loadBytes(){
      const snap=await getDocs(collection(db,'books',id,'chunks'));
      const chunks=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>Number(a.index??a.id)-Number(b.index??b.id));
      if(!chunks.length)throw new Error('PDF data is missing.');
      const parts=chunks.map(x=>b64ToBytes(x.data));
      const total=parts.reduce((n,x)=>n+x.length,0);
      const out=new Uint8Array(total);let offset=0;
      parts.forEach(part=>{out.set(part,offset);offset+=part.length});
      return out;
    }
    function buildRail(total){
      rail.innerHTML=Array.from({length:total},(_,i)=>'<button class="book-rail-dot" type="button" data-page="'+(i+1)+'" title="Page '+(i+1)+'" aria-label="Page '+(i+1)+'"></button>').join('');
      rail.querySelectorAll('.book-rail-dot').forEach(dot=>dot.onclick=()=>go(Number(dot.dataset.page)));
    }
    function updateRail(){
      const active=rail.querySelector('.book-rail-dot.active');active?.classList.remove('active');
      const next=rail.querySelector('.book-rail-dot[data-page="'+page+'"]');next?.classList.add('active');
      next?.scrollIntoView({block:'nearest',inline:'nearest'});
    }
    async function renderPage(){
      if(!pdf)return;
      const p=await pdf.getPage(page);
      const base=p.getViewport({scale:1});
      const available=Math.max(300,document.querySelector('.book-canvas-stage').clientWidth);
      const availableHeight=Math.max(420,window.innerHeight-126);
      const fitByWidth=available/base.width;
      const fitByHeight=availableHeight/base.height;
      const applied=Math.max(.5,Math.min(2.3,Math.min(fitByWidth,fitByHeight)*scale));
      const viewport=p.getViewport({scale:applied});
      const ratio=window.devicePixelRatio||1;
      canvas.width=Math.floor(viewport.width*ratio);
      canvas.height=Math.floor(viewport.height*ratio);
      canvas.style.width=Math.floor(viewport.width)+'px';
      canvas.style.height=Math.floor(viewport.height)+'px';
      ctx.setTransform(ratio,0,0,ratio,0,0);
      await p.render({canvasContext:ctx,viewport}).promise;
      pageInput.value=String(page);
      pageTotal.textContent='/ '+pdf.numPages;
      readerPage.textContent='Page '+page+' / '+pdf.numPages;
      shellEl.classList.remove('book-hidden');
      loading.classList.add('book-hidden');
      updateRail();
    }
    async function go(n){if(!pdf)return;page=Math.max(1,Math.min(pdf.numPages,Math.floor(Number(n)||1)));await renderPage()}
    const change=delta=>go(page+delta);
    document.getElementById('book-prev').onclick=()=>change(-1);
    document.getElementById('book-next').onclick=()=>change(1);
    pageInput.onchange=()=>go(pageInput.value);
    document.getElementById('book-zoom-in').onclick=()=>{scale=Math.min(1.8,scale+.15);renderPage()};
    document.getElementById('book-zoom-out').onclick=()=>{scale=Math.max(.7,scale-.15);renderPage()};
    document.getElementById('book-fit').onclick=()=>{scale=1;renderPage()};
    window.addEventListener('resize',()=>{clearTimeout(window.__bookResize);window.__bookResize=setTimeout(()=>renderPage().catch(()=>{}),120)});
    document.getElementById('book-download').onclick=async()=>{
      try{
        const bytes=baseBytes||await loadBytes();
        baseBytes=bytes;
        await updateDoc(doc(db,'books',id),{downloadCount:increment(1)});
        const blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');
        a.href=url;a.download=book.fileName||((book.title||'book').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')+'.pdf');
        document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
      }catch(e){toast(e.message||'Could not download PDF.')}
    };
    baseBytes=await loadBytes();
    pdf=await pdfjsLib.getDocument({data:baseBytes}).promise;
    pageTotal.textContent='/ '+pdf.numPages;
    readerPage.textContent='Page 1 / '+pdf.numPages;
    buildRail(pdf.numPages);
    await renderPage();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<div class="error-page"><h1>Unable to open this book</h1><p>'+escapeHtml(e.message||'Something went wrong.')+'</p><a href="/books.html">← Back to Books</a></div>';
  }
})();
</script>
</body>
</html>
