<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Book</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<style>
html,body{margin:0!important;padding:0!important;width:100%;height:100%;overflow:hidden;background:#525659!important}
.karp-pdf-browser{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff;color:#202124;font-family:Arial,sans-serif}
.karp-pdf-tabs{height:42px;display:flex;align-items:flex-end;background:#dee0e3;border-bottom:1px solid #bfc2c7;padding:0 8px;gap:3px;flex:0 0 auto;overflow-x:auto}
.karp-pdf-tab{height:36px;min-width:180px;max-width:280px;padding:0 11px;display:flex;align-items:center;gap:8px;background:#cfd2d7;border:1px solid #b8bbc0;border-bottom:0;border-radius:9px 9px 0 0;cursor:pointer;color:#3c4043;font-size:12px;box-sizing:border-box}
.karp-pdf-tab.active{background:#fff;color:#202124}
.karp-pdf-tab .tab-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.karp-pdf-tab .tab-close{font-size:17px;color:#666;line-height:1}
.karp-pdf-new{height:32px;width:34px;border:0;background:transparent;font-size:23px;color:#4b4f53;cursor:pointer;margin-bottom:2px;flex:0 0 auto}
.karp-pdf-bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid #d7d9dc;flex:0 0 auto}
.karp-pdf-bar button{border:0;background:transparent;border-radius:6px;padding:7px 9px;color:#444;cursor:pointer;font-size:13px}
.karp-pdf-bar button:hover{background:#f0f1f2}
.karp-pdf-bar .pdf-title{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.karp-pdf-stage{position:relative;flex:1;min-height:0;background:#525659;overflow:hidden}
.karp-pdf-frame{display:block;width:100%;height:100%;border:0;background:#525659}
.karp-pdf-loading{position:absolute;z-index:2;inset:0;display:grid;place-items:center;background:#525659;color:#fff;font-size:13px;pointer-events:none}
.karp-book-picker{position:fixed;z-index:20;inset:88px 8% 8%;background:#fff;border:1px solid #c8cbd0;border-radius:10px;box-shadow:0 20px 60px #0004;display:none;overflow:auto;padding:28px}
.karp-book-picker h2{margin:0 0 18px;font-size:22px}
.karp-book-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.karp-picker-card{border:1px solid #d5d7da;border-radius:8px;padding:10px;background:#fff;cursor:pointer;text-align:left}
.karp-picker-card img{width:100%;aspect-ratio:.707;object-fit:cover;display:block}
.karp-picker-card strong{display:block;font-size:11px;margin-top:8px}
@media(max-width:700px){.karp-pdf-tab{min-width:130px}.karp-book-picker{inset:70px 3% 3%}}
</style>
</head>
<body>
<script>
(async()=>{
  const params=new URLSearchParams(location.search),initialId=params.get('id');
  if(!initialId){location.replace('/books.html');return}
  try{
    const {db}=await fb();
    const {doc,getDoc,getDocs,collection,updateDoc,setDoc,increment}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
    const initialSnap=await getDoc(doc(db,'books',initialId));
    if(!initialSnap.exists()){location.replace('/books.html');return}
    const current={id:initialSnap.id,...initialSnap.data()};
    document.title='KARP — '+(current.title||current.fileName||'Book');
    document.body.innerHTML='<div class="karp-pdf-browser">'+
      '<div class="karp-pdf-tabs" id="pdf-tabs"><button class="karp-pdf-new" id="pdf-new" title="New tab">+</button></div>'+
      '<div class="karp-pdf-bar"><button id="pdf-back" title="Back">←</button><button id="pdf-home" title="Books">⌂</button><span class="pdf-title" id="pdf-title"></span></div>'+
      '<div class="karp-pdf-stage"><div class="karp-pdf-loading" id="pdf-loading">Opening PDF…</div><iframe id="pdf-frame" class="karp-pdf-frame" title="KARP PDF viewer"></iframe></div>'+
      '<div class="karp-book-picker" id="book-picker"><h2>Books</h2><div class="karp-book-picker-grid" id="book-picker-grid"></div></div>'+
    '</div>';

    const tabs=document.getElementById('pdf-tabs'),frame=document.getElementById('pdf-frame'),titleEl=document.getElementById('pdf-title');
    const loading=document.getElementById('pdf-loading'),picker=document.getElementById('book-picker'),pickerGrid=document.getElementById('book-picker-grid');
    let books=[];
    const tabStates=new Map();

    function esc(x){return escapeHtml(String(x??''))}
    function tabButton(book){
      const b=document.createElement('button');
      b.className='karp-pdf-tab'; b.dataset.id=book.id;
      b.innerHTML='<span class="tab-title">'+esc(book.title||book.fileName||'Book')+'</span><span class="tab-close" aria-label="Close">×</span>';
      b.onclick=()=>openBook(book.id);
      b.querySelector('.tab-close').onclick=e=>{e.stopPropagation();closeTab(book.id)};
      return b;
    }
    function addTab(book){
      if(tabStates.has(book.id))return;
      const b=tabButton(book);
      tabs.insertBefore(b,document.getElementById('pdf-new'));
      tabStates.set(book.id,{book,url:null});
    }
    function activateTab(id){
      tabs.querySelectorAll('.karp-pdf-tab').forEach(x=>x.classList.toggle('active',x.dataset.id===id));
    }
    async function getPdfUrl(book){
      const st=tabStates.get(book.id);
      if(st?.url)return st.url;
      const snap=await getDocs(collection(db,'books',book.id,'chunks'));
      const parts=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>Number(a.index??a.id)-Number(b.index??b.id));
      if(!parts.length)throw new Error('PDF data is missing.');
      const bytesParts=parts.map(p=>{
        const bin=atob(p.data),out=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
        return out;
      });
      const total=bytesParts.reduce((n,x)=>n+x.length,0),bytes=new Uint8Array(total);
      let off=0; for(const p of bytesParts){bytes.set(p,off);off+=p.length}
      st.url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
      return st.url;
    }

    // One counted view per account. Guests/private browsing get a stable browser-local id,
    // so reopening the same book does not inflate the public counter.
    async function countViewOnce(book){
      try{
        const auth=(await fb()).auth;
        const uid=auth?.currentUser?.uid;
        let viewerId=uid;
        if(!viewerId){
          const key='karp_book_viewer_id';
          viewerId=localStorage.getItem(key);
          if(!viewerId){
            viewerId=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
            localStorage.setItem(key,viewerId);
          }
          viewerId='guest_'+viewerId;
        }
        const viewRef=doc(db,'books',book.id,'views',viewerId);
        const existing=await getDoc(viewRef);
        if(existing.exists())return;
        await setDoc(viewRef,{viewerId,uid:uid||null,createdAt:new Date().toISOString()},{merge:false});
        await updateDoc(doc(db,'books',book.id),{viewCount:increment(1)});
      }catch(e){console.warn('Book view count update failed:',e)}
    }

    async function openBook(bookId){
      const book=books.find(x=>x.id===bookId)||current;
      addTab(book);
      activateTab(book.id);
      titleEl.textContent=book.title||book.fileName||'Book';
      document.title='KARP — '+(book.title||book.fileName||'Book');
      loading.style.display='grid';
      try{
        frame.src=await getPdfUrl(book);
        await countViewOnce(book);
        history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(book.id));
      }finally{
        loading.style.display='none';
      }
      picker.style.display='none';
    }
    function closeTab(id){
      const st=tabStates.get(id);
      if(st?.url)URL.revokeObjectURL(st.url);
      tabStates.delete(id);
      tabs.querySelector('[data-id="'+CSS.escape(id)+'"]')?.remove();
      const next=[...tabStates.keys()].at(-1);
      if(next)openBook(next); else location.replace('/books.html');
    }
    document.getElementById('pdf-new').onclick=()=>{
      picker.style.display='block';
      pickerGrid.innerHTML=books.map(x=>'<button class="karp-picker-card" data-pick="'+esc(x.id)+'">'+
        (x.coverImage?'<img src="'+esc(x.coverImage)+'" alt="">':'<div style="aspect-ratio:.707;background:#eee;display:grid;place-items:center">PDF</div>')+
        '<strong>'+esc(x.title||x.fileName||'Book')+'</strong></button>').join('');
      pickerGrid.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>openBook(x.dataset.pick));
    };
    document.getElementById('pdf-back').onclick=()=>history.back();
    document.getElementById('pdf-home').onclick=()=>location.replace('/books.html');

    const snapBooks=await getDocs(collection(db,'books'));
    books=snapBooks.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
    await openBook(current.id);
  }catch(e){
    document.body.innerHTML='<div style="font:14px system-ui;padding:40px;text-align:center"><h2>Unable to open this book</h2><p>'+escapeHtml(e.message||'Something went wrong.')+'</p><a href="/books.html">← Back to Books</a></div>';
  }
})();
</script>
</body>
</html>
