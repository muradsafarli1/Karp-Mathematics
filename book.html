<style>
html,body{margin:0!important;padding:0!important;width:100%;height:100%;overflow:hidden;background:#525659!important}
.karp-pdf-browser{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff;color:#202124;font-family:Arial,sans-serif}
.karp-pdf-tabs{height:42px;display:flex;align-items:flex-end;background:#dee0e3;border-bottom:1px solid #bfc2c7;padding:0 8px;gap:3px;flex:0 0 auto;overflow-x:auto}
.karp-pdf-tab{height:36px;min-width:180px;max-width:280px;padding:0 11px;display:flex;align-items:center;gap:8px;background:#cfd2d7;border:1px solid #b8bbc0;border-bottom:0;border-radius:9px 9px 0 0;cursor:pointer;color:#3c4043;font-size:12px;box-sizing:border-box}
.karp-pdf-tab.active{background:#fff;color:#202124}
.karp-pdf-tab .tab-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.karp-pdf-tab .tab-close{font-size:17px;color:#666;line-height:1}
.karp-pdf-new{height:32px;width:34px;border:0;background:transparent;font-size:23px;color:#4b4f53;cursor:pointer;margin-bottom:2px;flex:0 0 auto}
.karp-pdf-bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid #d7d9dc;flex:0 0 auto}
.karp-pdf-bar button{border:0;background:transparent;border-radius:6px;padding:7px 9px;color:#444;cursor:pointer;font-size:13px}
.karp-pdf-bar button:hover{background:#f0f1f2}
.karp-pdf-bar .pdf-title{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.karp-pdf-bar #pdf-download{margin-left:auto;white-space:nowrap;border:1px solid #d5d7da;background:#f7f8f9;font-weight:600;color:#34383d}
.karp-pdf-bar #pdf-download:disabled{opacity:.55;cursor:wait}
.karp-pdf-stage{position:relative;flex:1;min-height:0;background:#525659;overflow:hidden}
.karp-pdf-doc{position:absolute;inset:0;overflow:auto;padding:26px 18px 60px;box-sizing:border-box;outline:0}
.karp-pdf-page{position:relative;width:max-content;min-width:320px;min-height:520px;margin:0 auto 24px;background:#fff;box-shadow:0 2px 18px rgba(0,0,0,.22);display:flex;justify-content:center;align-items:flex-start}
.karp-pdf-page-number{position:absolute;right:10px;top:7px;font:10px Arial,sans-serif;color:#9aa0a6;pointer-events:none}
.karp-pdf-canvas{display:block;background:#fff}
.karp-pdf-loading{position:absolute;z-index:30;inset:0;display:grid;place-items:center;background:#525659;color:#fff;font-size:13px;pointer-events:none}
.karp-book-picker{position:fixed;z-index:50;inset:88px 8% 8%;background:#fff;border:1px solid #c8cbd0;border-radius:10px;box-shadow:0 20px 60px #0004;display:none;overflow:auto;padding:28px}
.karp-book-picker h2{margin:0 0 14px;font-size:22px}
.karp-book-picker-search{display:block;width:min(520px,100%);box-sizing:border-box;padding:11px 13px;margin:0 0 20px;border:1px solid #d5d7da;border-radius:8px;background:#f7f8f9;color:#202124;font-size:13px;outline:none}
.karp-book-picker-search:focus{border-color:#9aa0a6;box-shadow:0 0 0 2px #2021240b}
.karp-book-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.karp-picker-card{border:1px solid #d5d7da;border-radius:8px;padding:10px;background:#fff;cursor:pointer;text-align:left}
.karp-picker-card img{width:100%;aspect-ratio:.707;object-fit:cover;display:block}
.karp-picker-card strong{display:block;font-size:11px;margin-top:8px}
@media(max-width:700px){.karp-pdf-tab{min-width:130px}.karp-book-picker{inset:70px 3% 3%}.karp-pdf-doc{padding:16px 8px 40px}.karp-pdf-page{min-width:280px}}
</style>

<script>
(async()=>{
  const params=new URLSearchParams(location.search),initialId=params.get('id');
  if(!initialId){location.replace('/books.html');return}
  try{
    const {db}=await fb();
    const {doc,getDoc,getDocs,collection,setDoc,updateDoc,runTransaction}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
    const authUser=await authReady();
    const initialSnap=await getDoc(doc(db,'books',initialId));
    if(!initialSnap.exists()){location.replace('/books.html');return}
    const current={id:initialSnap.id,...initialSnap.data()};
    document.title='KARP — '+(current.title||current.fileName||'Book');
    document.body.innerHTML='<div class="karp-pdf-browser">'+
      '<div class="karp-pdf-tabs" id="pdf-tabs"><button class="karp-pdf-new" id="pdf-new" title="New tab">+</button></div>'+
      '<div class="karp-pdf-bar"><button id="pdf-back" title="Back">←</button><button id="pdf-home" title="Books">⌂</button><span class="pdf-title" id="pdf-title"></span><button id="pdf-zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button><span id="pdf-zoom-label">100%</span><button id="pdf-zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button><button id="pdf-fit" type="button" title="Fit to page width">Fit</button><button id="pdf-download" type="button" title="Download this PDF">Download PDF</button></div>'+
      '<div class="karp-pdf-stage" id="pdf-stage"></div><div class="karp-pdf-floating-tools" id="pdf-tools"><button class="karp-pdf-tool" id="pdf-pen" type="button" title="Pen tools" aria-label="Pen" aria-pressed="false"><span>✎</span><small>Pen</small></button><button class="karp-pdf-tool" id="pdf-notebook" type="button" title="Notes for this PDF" aria-label="Notes" aria-pressed="false"><span>▤</span><small>Notes</small></button></div><div class="karp-pen-options" id="pdf-pen-options" role="toolbar" aria-label="PDF ink tools"><button class="karp-pen-mode active" id="pdf-mode-pen" type="button">Pen</button><button class="karp-pen-mode" id="pdf-mode-highlight" type="button">Highlight</button><button class="karp-pen-mode" id="pdf-mode-eraser" type="button">Eraser</button><label class="karp-pen-size-wrap" for="pdf-pen-size">Thickness <input id="pdf-pen-size" type="range" min="1" max="10" value="3"><span id="pdf-pen-size-label">3</span></label></div><aside class="karp-notebook-panel" id="pdf-notebook-panel"><div class="karp-notebook-head" id="pdf-notebook-head"><strong>Notes</strong><button id="pdf-notebook-close" type="button" title="Close notes" aria-label="Close notes">×</button></div><textarea id="pdf-notes" placeholder="Write notes for this PDF..."></textarea><div class="karp-notebook-hint">Saved automatically for this PDF.</div></aside>'+
      '<div class="karp-pdf-loading" id="pdf-loading">Opening PDF…</div>'+
      '<div class="karp-book-picker" id="book-picker"><h2>Books</h2><input id="book-picker-search" class="karp-book-picker-search" type="search" placeholder="Search books by title…" autocomplete="off"><div class="karp-book-picker-grid" id="book-picker-grid"></div></div>'+
    '</div>';

    const tabs=document.getElementById('pdf-tabs'),stage=document.getElementById('pdf-stage'),titleEl=document.getElementById('pdf-title');
    const loading=document.getElementById('pdf-loading'),picker=document.getElementById('book-picker'),pickerGrid=document.getElementById('book-picker-grid'),pickerSearch=document.getElementById('book-picker-search');
    let books=[];
    const tabStates=new Map();
    let activeSession=null,activeBookId=current.id,sessionStarting=false,pdfjsPromise=null,drawingEnabled=false,notesOpen=false,activePenMode='pen',penSize=3,notesDrag=null;

    function makeId(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
    const visitorId=(()=>{if(authUser?.uid)return authUser.uid;let id='';try{id=localStorage.getItem('karp_book_viewer_id')||''}catch{}if(!id){id=makeId();try{localStorage.setItem('karp_book_viewer_id',id)}catch{}}return 'guest_'+id})();
    const visitor={uid:authUser?.uid||null,displayName:authUser?.displayName||'',email:authUser?.email||'',userType:authUser?.uid?'account':'guest',viewerId:visitorId};
    function esc(x){return escapeHtml(String(x??''))}
 function toolStorageKey(st){const item=st.book||st.journal;return 'karp_pdf_tools_v1_books_'+item.id+'_'+visitor.viewerId}
 function savePdfTools(st){try{localStorage.setItem(toolStorageKey(st),JSON.stringify({notes:st.notes||'',annotations:st.annotations||{},notePosition:st.notePosition||null}))}catch(e){console.warn('KARP PDF notes could not be saved locally:',e)}}
 function clampNotesPosition(st,left,top,save=true){const p=document.getElementById('pdf-notebook-panel'),w=p?.offsetWidth||350,h=p?.offsetHeight||320,x=Math.max(0,Math.min(Math.max(0,innerWidth-w),left)),y=Math.max(0,Math.min(Math.max(0,innerHeight-h),top));st.notePosition={left:x,top:y};p.style.left=x+'px';p.style.top=y+'px';p.style.right='auto';p.style.bottom='auto';if(save)savePdfTools(st)}
 function refreshPdfTools(){const st=tabStates.get(activeBookId),pen=document.getElementById('pdf-pen'),nb=document.getElementById('pdf-notebook'),panel=document.getElementById('pdf-notebook-panel'),notes=document.getElementById('pdf-notes'),options=document.getElementById('pdf-pen-options');
  if(pen){pen.classList.toggle('active',drawingEnabled);pen.setAttribute('aria-pressed',String(drawingEnabled))}if(nb){nb.classList.toggle('active',notesOpen);nb.setAttribute('aria-pressed',String(notesOpen))}
  if(panel)panel.style.display=notesOpen?'flex':'none';if(options)options.style.display=drawingEnabled?'flex':'none';
  ['pen','highlight','eraser'].forEach(m=>{const q=document.getElementById('pdf-mode-'+m);if(q)q.classList.toggle('active',activePenMode===m)});
  const id=st?String((st.book||st.journal).id):'';if(notes&&notes.dataset.documentId!==id){notes.value=st?.notes||'';notes.dataset.documentId=id}
  const size=document.getElementById('pdf-pen-size'),label=document.getElementById('pdf-pen-size-label');if(size&&Number(size.value)!==penSize)size.value=String(penSize);if(label)label.textContent=String(penSize);
  if(panel){if(st?.notePosition){panel.style.left=st.notePosition.left+'px';panel.style.top=st.notePosition.top+'px';panel.style.right='auto';panel.style.bottom='auto'}else{panel.style.left='auto';panel.style.top='auto';panel.style.right='16px';panel.style.bottom='76px'}}
  if(stage)stage.querySelectorAll('.karp-pdf-ink').forEach(ink=>{const on=!!st&&ink.closest('.karp-pdf-doc')===st.holder;ink.style.pointerEvents=drawingEnabled&&on?'auto':'none';ink.style.cursor=drawingEnabled&&on?(activePenMode==='eraser'?'cell':'crosshair'):'default';ink.style.touchAction=drawingEnabled&&on?'none':'pan-y'});
 }
 function activeToolState(){return tabStates.get(activeBookId)}
 function eraseInkAt(st,n,p,ink){const all=st.annotations[String(n)]||[],r=Math.max(.004,penSize*2.4/Math.max(1,ink.clientWidth)),remaining=all.filter(z=>!(z.points||[]).some(q=>Math.hypot(q.x-p.x,q.y-p.y)<=r+(Number(z.width)||0)/2));if(remaining.length!==all.length){st.annotations[String(n)]=remaining;drawSavedInk(st,n,ink);return true}return false}
 function startNotesDrag(e){if(e.button!==0||e.target.closest('button'))return;const st=activeToolState(),p=document.getElementById('pdf-notebook-panel');if(!st||!p)return;const r=p.getBoundingClientRect();notesDrag={pointerId:e.pointerId,st,x:e.clientX,y:e.clientY,left:r.left,top:r.top};e.preventDefault();e.currentTarget.setPointerCapture?.(e.pointerId)}
 function moveNotesDrag(e){if(!notesDrag||e.pointerId!==notesDrag.pointerId)return;clampNotesPosition(notesDrag.st,notesDrag.left+e.clientX-notesDrag.x,notesDrag.top+e.clientY-notesDrag.y,false)}
 function finishNotesDrag(e){if(notesDrag&&e.pointerId===notesDrag.pointerId){savePdfTools(notesDrag.st);notesDrag=null}}

    function toolStorageKey(st){const item=st.book||st.journal;return 'karp_pdf_tools_v1_books_'+item.id+'_'+visitor.viewerId}
    function savePdfTools(st){
      try{localStorage.setItem(toolStorageKey(st),JSON.stringify({notes:st.notes||'',annotations:st.annotations||{}}));const status=document.getElementById('pdf-tool-status');if(status&&st===tabStates.get(activeBookId))status.textContent='Avtomatik yadda saxlanıldı ✓'}
      catch(e){console.warn('KARP PDF notes could not be saved locally:',e)}
    }
    function refreshPdfTools(){
      const st=tabStates.get(activeBookId),pen=document.getElementById('pdf-pen'),notebook=document.getElementById('pdf-notebook');
      const panel=document.getElementById('pdf-notebook-panel'),notes=document.getElementById('pdf-notes'),status=document.getElementById('pdf-tool-status'),zoomLabel=document.getElementById('pdf-zoom-label');
      if(pen){pen.classList.toggle('active',drawingEnabled);pen.setAttribute('aria-pressed',String(drawingEnabled))}
      if(notebook){notebook.classList.toggle('active',notesOpen);notebook.setAttribute('aria-pressed',String(notesOpen))}
      if(panel)panel.style.display=notesOpen?'flex':'none';
      const docId=st?String((st.book||st.journal).id):'';
      if(notes&&notes.dataset.documentId!==docId){notes.value=st?.notes||'';notes.dataset.documentId=docId}
      if(zoomLabel)zoomLabel.textContent=Math.round((st?.zoom||1)*100)+'%';
      if(status)status.textContent=drawingEnabled?'Qələm aktivdir — PDF üzərində çək; avtomatik saxlanılır.':'Qeydlər və çəkdiklərin bu PDF üçün avtomatik saxlanılır.';
      if(stage)stage.querySelectorAll('.karp-pdf-ink').forEach(ink=>{const active=!!st&&ink.closest('.karp-pdf-doc')===st.holder;ink.style.pointerEvents=drawingEnabled&&active?'auto':'none';ink.style.cursor=drawingEnabled&&active?'crosshair':'default'});
    }
    function activeToolState(){return tabStates.get(activeBookId)}

    async function getPdfJs(){
      if(!pdfjsPromise)pdfjsPromise=import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs').then(pdfjs=>{
        pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
        return pdfjs;
      });
      return pdfjsPromise;
    }
    function tabButton(book){
      const b=document.createElement('button');
      b.className='karp-pdf-tab';b.dataset.id=book.id;
      b.innerHTML='<span class="tab-title">'+esc(book.title||book.fileName||'Book')+'</span><span class="tab-close" aria-label="Close">×</span>';
      b.onclick=()=>openBook(book.id);
      b.querySelector('.tab-close').onclick=e=>{e.stopPropagation();closeTab(book.id)};
      return b;
    }
    function addTab(book){
      if(tabStates.has(book.id))return;
      const tab=tabButton(book);
      tabs.insertBefore(tab,document.getElementById('pdf-new'));
      const holder=document.createElement('div');
      holder.className='karp-pdf-doc';
      holder.dataset.id=book.id;
      holder.style.display='none';
      stage.appendChild(holder);
      const st={book,holder,pdf:null,bytes:null,loaded:false,rendered:new Map(),observer:null,scrollTop:0,zoom:1,renderVersion:0,notes:'',annotations:{},notePosition:null,renderQueue:new Set(),warmPages:new Set(),renderingPage:0,basePageSize:null,loading:false};
 try{const saved=JSON.parse(localStorage.getItem(toolStorageKey(st))||'{}');st.notes=typeof saved.notes==='string'?saved.notes:'';st.annotations=saved.annotations&&typeof saved.annotations==='object'?saved.annotations:{};st.notePosition=saved.notePosition&&Number.isFinite(saved.notePosition.left)&&Number.isFinite(saved.notePosition.top)?saved.notePosition:null}catch{}
 tabStates.set(book.id,st);
    }
    async function getPdfBytes(book){
      const st=tabStates.get(book.id);
      if(st?.bytes)return st.bytes;
      const snap=await getDocs(collection(db,'books',book.id,'chunks'));
      const parts=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>Number(a.index??a.id)-Number(b.index??b.id));
      if(!parts.length)throw new Error('PDF data is missing.');

    function drawSavedInk(st,n,ink){const w=ink.clientWidth||1,h=ink.clientHeight||1,dpr=ink.width/w,c=ink.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);for(const z of st.annotations[String(n)]||[]){const ps=z.points||[];if(!ps.length)continue;c.save();c.strokeStyle=z.color||'#202124';c.fillStyle=z.color||'#202124';c.lineWidth=Math.max(1.2,(Number(z.width)||.004)*w);c.lineCap='round';c.lineJoin='round';if(z.mode==='highlight'){c.globalAlpha=.36;c.lineWidth=Math.max(12,c.lineWidth*4)}if(ps.length===1){c.beginPath();c.arc(ps[0].x*w,ps[0].y*h,c.lineWidth/2,0,Math.PI*2);c.fill();c.restore();continue}c.beginPath();c.moveTo(ps[0].x*w,ps[0].y*h);for(let i=1;i<ps.length;i++)c.lineTo(ps[i].x*w,ps[i].y*h);c.stroke();c.restore()}}

      const seg=(a,b,z)=>{const w=ink.clientWidth||1,h=ink.clientHeight||1,dpr=ink.width/w,c=ink.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.save();c.strokeStyle=z.color;c.globalAlpha=z.mode==='highlight' ? .36 : 1;c.lineWidth=Math.max(1.2,(Number(z.width)||.004)*w)*(z.mode==='highlight'?4:1);c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(a.x*w,a.y*h);c.lineTo(b.x*w,b.y*h);c.stroke();c.restore()};

    function releasePage(st,n){const val=st.rendered.get(n);if(!val||val==='loading')return;const el=st.holder.querySelector('[data-page="'+n+'"]');if(!el){st.rendered.delete(n);return}el.querySelectorAll('canvas').forEach(c=>{c.width=0;c.height=0});el.innerHTML='<div class="karp-pdf-page-number">'+n+'</div>';st.rendered.delete(n)}
    function queuePageRender(st,n){if(!st.pdf||st.rendered.has(n))return;st.renderQueue.add(n);pumpPageRender(st)}
    async function pumpPageRender(st){if(st.renderingPage||!st.renderQueue.size||!st.pdf)return;const hr=st.holder.getBoundingClientRect(),center=hr.top+st.holder.clientHeight/2;let best=null,dist=Infinity;for(const n of st.renderQueue){const el=st.holder.querySelector('[data-page="'+n+'"]');if(!el||!st.warmPages.has(n)){st.renderQueue.delete(n);continue}const r=el.getBoundingClientRect(),d=Math.abs((r.top+r.bottom)/2-center);if(d<dist){best=n;dist=d}}if(best===null)return;st.renderQueue.delete(best);st.renderingPage=best;try{await renderPage(st,best)}finally{st.renderingPage=0;requestAnimationFrame(()=>pumpPageRender(st))}
    }
    async function renderPage(st,pageNumber){
      if(st.rendered.has(pageNumber)||!st.pdf)return;
      const renderVersion=st.renderVersion||0;st.rendered.set(pageNumber,'loading');
      try{
        const page=await st.pdf.getPage(pageNumber),wrap=st.holder.querySelector('[data-page="'+pageNumber+'"]');
        if(!wrap||renderVersion!==(st.renderVersion||0))return;
        const base=page.getViewport({scale:1}),available=Math.max(320,st.holder.clientWidth-40),fitScale=Math.max(.65,Math.min(2,available/base.width)),scale=fitScale*(st.zoom||1),viewport=page.getViewport({scale});

        canvas.width=Math.max(1,Math.ceil(viewport.width*outputScale));canvas.height=Math.max(1,Math.ceil(viewport.height*outputScale));canvas.style.width=Math.ceil(viewport.width)+'px';canvas.style.height=Math.ceil(viewport.height)+'px';
        const ctx=canvas.getContext('2d',{alpha:false});ctx.setTransform(outputScale,0,0,outputScale,0,0);await page.render({canvasContext:ctx,viewport}).promise;

        const label=document.createElement('div');label.className='karp-pdf-page-number';label.textContent=String(pageNumber);
        wrap.style.width=canvas.style.width;wrap.style.height=canvas.style.height;wrap.style.minHeight='0';wrap.innerHTML='';wrap.appendChild(canvas);wrap.appendChild(ink);wrap.appendChild(label);
        drawSavedInk(st,pageNumber,ink);attachInkHandlers(st,pageNumber,ink);st.rendered.set(pageNumber,canvas);refreshPdfTools();if(st.warmPages&&!st.warmPages.has(pageNumber))releasePage(st,pageNumber);

    }
    function observePages(st){st.observer?.disconnect();st.observer=new IntersectionObserver(entries=>{for(const e of entries){const n=Number(e.target.dataset.page);if(e.isIntersecting){st.warmPages.add(n);queuePageRender(st,n)}else{st.warmPages.delete(n);st.renderQueue.delete(n);releasePage(st,n)}}},{root:st.holder,rootMargin:'420px 0px',threshold:.01});st.holder.querySelectorAll('[data-page]').forEach(x=>st.observer.observe(x))}
    async function loadPdf(st){
      if(st.loaded)return;
      st.loading=true;loading.style.display='grid';loading.textContent='Opening PDF…';
      try{
        const pdfjs=await getPdfJs(),bytes=await getPdfBytes(st.book);st.pdf=await pdfjs.getDocument({data:bytes}).promise;
        const first=await st.pdf.getPage(1),base=first.getViewport({scale:1});st.basePageSize={width:base.width,height:base.height};
        const fit=Math.max(.65,Math.min(2,Math.max(320,st.holder.clientWidth-40)/base.width)),initial=first.getViewport({scale:fit*(st.zoom||1)}),frag=document.createDocumentFragment();
        for(let i=1;i<=st.pdf.numPages;i++){const page=document.createElement('div');page.className='karp-pdf-page';page.dataset.page=i;page.style.width=Math.ceil(initial.width)+'px';page.style.height=Math.ceil(initial.height)+'px';page.innerHTML='<div class="karp-pdf-page-number">'+i+'</div>';frag.appendChild(page)}
        st.holder.appendChild(frag);
        st.loaded=true;
        observePages(st);
        st.holder.addEventListener('scroll',()=>{st.scrollTop=st.holder.scrollTop},{passive:true});
      }finally{
        st.loading=false;loading.style.display='none';
      }
    }
    function activateTab(id){tabs.querySelectorAll('.karp-pdf-tab').forEach(x=>x.classList.toggle('active',x.dataset.id===id));tabStates.forEach((st,key)=>{st.holder.style.display=key===id?'block':'none'});const st=tabStates.get(id);requestAnimationFrame(()=>{if(st){st.holder.scrollTop=st.scrollTop;st.holder.focus({preventScroll:true});if(st.pdf)observePages(st)}});refreshPdfTools()}
    function setActiveZoom(value){
      const st=activeToolState();if(!st||!st.pdf)return;const next=Math.max(.5,Math.min(4,Math.round(Number(value)*100)/100)),old=st.zoom||1;if(Math.abs(next-old)<.005)return;
      const pages=[...st.holder.querySelectorAll('[data-page]')],top=st.holder.scrollTop,current=pages.find(w=>w.offsetTop+w.offsetHeight>=top)||pages[0],ratio=current?Math.max(0,Math.min(1,(top-current.offsetTop)/Math.max(1,current.offsetHeight))):0;
      st.zoom=next;st.renderVersion=(st.renderVersion||0)+1;st.renderQueue.clear();st.rendered.clear();st.warmPages.clear();
      const base=st.basePageSize,fit=base?Math.max(.65,Math.min(2,Math.max(320,st.holder.clientWidth-40)/base.width)):1,w=base?Math.ceil(base.width*fit*next):null,h=base?Math.ceil(base.height*fit*next):null;
      pages.forEach(el=>{el.querySelectorAll('canvas').forEach(c=>{c.width=0;c.height=0});el.innerHTML='<div class="karp-pdf-page-number">'+el.dataset.page+'</div>';if(w)el.style.width=w+'px';if(h)el.style.height=h+'px';el.style.minHeight='0'});
      if(current)st.holder.scrollTop=current.offsetTop+ratio*current.offsetHeight;observePages(st);refreshPdfTools();

    async function countViewOnce(book){
      const bookRef=doc(db,'books',book.id),viewRef=doc(db,'books',book.id,'views',visitor.viewerId);
      try{
        await runTransaction(db,async tx=>{
          const existing=await tx.get(viewRef);
          if(existing.exists())return false;
          const bookSnap=await tx.get(bookRef);
          if(!bookSnap.exists())throw new Error('This book is no longer available.');
          const data=bookSnap.data()||{};
          tx.set(viewRef,{viewerId:visitor.viewerId,uid:visitor.uid,displayName:visitor.displayName,email:visitor.email,createdAt:new Date().toISOString()});
          tx.update(bookRef,{viewCount:Math.max(0,Number(data.viewCount||0))+1});
          return true;
        });
      }catch(e){console.warn('Book unique view count failed:',e)}
    }
    async function startViewSession(book){
      if(document.hidden||activeSession||sessionStarting||!book)return;
      sessionStarting=true;
      try{
        const id=makeId(),startedMs=Date.now(),startedAt=new Date(startedMs).toISOString();
        const ref=doc(db,'books',book.id,'viewSessions',id);
        await setDoc(ref,{sessionId:id,bookId:book.id,viewerId:visitor.viewerId,uid:visitor.uid,displayName:visitor.displayName,email:visitor.email,userType:visitor.userType,startedAt,endedAt:null,durationSeconds:0,status:'active'},{merge:false});
        activeSession={id,ref,bookId:book.id,startedMs};
        if(document.hidden||activeBookId!==book.id)await stopViewSession();
      }catch(e){console.warn('Book view session could not be recorded:',e)}
      finally{sessionStarting=false}
    }
    async function stopViewSession(){
      const s=activeSession;if(!s)return;
      activeSession=null;
      const endedMs=Date.now(),durationSeconds=Math.max(0,Math.round((endedMs-s.startedMs)/1000));
      try{await updateDoc(s.ref,{endedAt:new Date(endedMs).toISOString(),durationSeconds,status:'ended'})}catch(e){console.warn('Book view session end could not be recorded:',e)}
    }
    async function recordDownload(book){
      const id=makeId(),bookRef=doc(db,'books',book.id),downloadRef=doc(db,'books',book.id,'downloads',id);
      try{
        await runTransaction(db,async tx=>{
          const snap=await tx.get(bookRef);
          if(!snap.exists())throw new Error('This book is no longer available.');
          const data=snap.data()||{};
          tx.set(downloadRef,{downloadId:id,bookId:book.id,viewerId:visitor.viewerId,uid:visitor.uid,displayName:visitor.displayName,email:visitor.email,userType:visitor.userType,fileName:book.fileName||((book.title||'KARP Book')+'.pdf'),createdAt:new Date().toISOString()});
          tx.update(bookRef,{downloadCount:Math.max(0,Number(data.downloadCount||0))+1});
        });
      }catch(e){console.warn('Book download analytics failed:',e)}
    }
    async function downloadBook(book){
      const button=document.getElementById('pdf-download');if(button)button.disabled=true;
      try{
        const bytes=await getPdfBytes(book),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
        const desired=String(book.fileName||((book.title||'KARP Book')+'.pdf')).replace(/[\\:*?"<>|]+/g,'-');
        const a=document.createElement('a');a.href=url;a.download=/\.pdf$/i.test(desired)?desired:(desired+'.pdf');document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1500);recordDownload(book);
      }catch(e){console.error(e);alert('Could not download this PDF. Please try again.')}
      finally{if(button)button.disabled=false}
    }
    async function openBook(bookId){
      const book=books.find(x=>x.id===bookId)||current;
      await stopViewSession();activeBookId=book.id;addTab(book);
      titleEl.textContent=book.title||book.fileName||'Book';document.title='KARP — '+(book.title||book.fileName||'Book');
      activateTab(book.id);picker.style.display='none';
      const st=tabStates.get(book.id);
      try{await loadPdf(st);countViewOnce(book);startViewSession(book)}catch(e){console.error(e);loading.textContent='Unable to open PDF';loading.style.display='grid'}
      history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(book.id));
    }
    function closeTab(id){
      const st=tabStates.get(id);if(!st)return;
      const wasActive=id===activeBookId;if(st.observer)st.observer.disconnect();tabs.querySelector('[data-id="'+CSS.escape(id)+'"]')?.remove();st.holder.remove();tabStates.delete(id);
      if(!wasActive)return;
      const next=[...tabStates.keys()].at(-1);if(next)openBook(next);else location.replace('/books.html');
    }
    function renderPicker(){
      const q=String(pickerSearch.value||'').trim().toLowerCase(),filtered=books.filter(x=>String(x.title||x.fileName||'Book').toLowerCase().includes(q));
      pickerGrid.innerHTML=filtered.map(x=>'<button class="karp-picker-card" data-pick="'+esc(x.id)+'">'+(x.coverImage?'<img src="'+esc(x.coverImage)+'" alt="">':'<div style="aspect-ratio:.707;background:#eee;display:grid;place-items:center">PDF</div>')+'<strong>'+esc(x.title||x.fileName||'Book')+'</strong></button>').join('')||'<div style="grid-column:1/-1;padding:25px 0;color:#73777c;font-size:13px">No books match your search.</div>';
      pickerGrid.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>openBook(x.dataset.pick));
    }
    document.getElementById('pdf-new').onclick=()=>{picker.style.display='block';pickerSearch.value='';renderPicker();pickerSearch.focus()};
    pickerSearch.addEventListener('input',renderPicker);
    document.getElementById('pdf-zoom-out').onclick=()=>setActiveZoom((activeToolState()?.zoom||1)/1.2);
    document.getElementById('pdf-zoom-in').onclick=()=>setActiveZoom((activeToolState()?.zoom||1)*1.2);
    document.getElementById('pdf-fit').onclick=()=>setActiveZoom(1);
    stage.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const st=activeToolState();setActiveZoom((st?.zoom||1)*(e.deltaY<0?1.1:1/1.1))},{passive:false});

    document.getElementById('pdf-pen').onclick=()=>{drawingEnabled=!drawingEnabled;if(drawingEnabled)notesOpen=false;refreshPdfTools()};
    document.getElementById('pdf-notebook').onclick=()=>{notesOpen=!notesOpen;if(notesOpen)drawingEnabled=false;refreshPdfTools();if(notesOpen)document.getElementById('pdf-notes').focus()};
    document.getElementById('pdf-notebook-close').onclick=()=>{notesOpen=false;refreshPdfTools()};
    document.getElementById('pdf-mode-pen').onclick=()=>{activePenMode='pen';drawingEnabled=true;notesOpen=false;refreshPdfTools()};
    document.getElementById('pdf-mode-highlight').onclick=()=>{activePenMode='highlight';drawingEnabled=true;notesOpen=false;refreshPdfTools()};
    document.getElementById('pdf-mode-eraser').onclick=()=>{activePenMode='eraser';drawingEnabled=true;notesOpen=false;refreshPdfTools()};
    document.getElementById('pdf-pen-size').addEventListener('input',e=>{penSize=Number(e.target.value)||3;document.getElementById('pdf-pen-size-label').textContent=String(penSize)});

    window.addEventListener('pagehide',stopViewSession);window.addEventListener('beforeunload',stopViewSession);
    document.getElementById('pdf-back').onclick=()=>history.back();
    document.getElementById('pdf-home').onclick=()=>location.replace('/books.html');
    const snapBooks=await getDocs(collection(db,'books'));
    books=snapBooks.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
    await openBook(current.id);
  }catch(e){
    document.body.innerHTML='<div style="font:14px system-ui;padding:40px;text-align:center"><h2>Unable to open this book</h2><p>'+escapeHtml(e.message||'Something went wrong.')+'</p><a href="/books.html">← Back to Books</a></div>';
  }
})();
