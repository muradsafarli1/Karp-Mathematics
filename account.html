<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Account</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js?v=20261006c"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]]},svg:{fontCache:"global"},startup:{typeset:false}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
.account-page{min-height:calc(100vh - 76px)}
.account-profile{text-align:center;padding:72px 20px 44px}
.profile-avatar-wrap{width:158px;margin:0 auto 18px;display:flex;flex-direction:column;align-items:center;gap:9px}
.profile-avatar{width:158px;height:158px;border-radius:50%;object-fit:cover;display:block;background:var(--panel2)}
.profile-edit{width:31px;height:31px;border:1px solid #d5d5d1;background:#eeeeeb;color:#17191c;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:14px;line-height:1}
.profile-edit:hover{background:#e2e2de}
.profile-initial{display:grid;place-items:center;font-size:52px;font-weight:800;color:var(--text)}
.profile-name{font-size:19px;font-weight:800}.profile-email{margin-top:5px;font-size:12px;color:var(--muted)}
.account-wrap{width:min(calc(100% - 42px),1220px);margin:0 auto;padding-bottom:90px}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.kpi{background:var(--panel2);border-radius:14px;padding:17px;text-align:center}.kpi strong{display:block;font-family:'Space Grotesk';font-size:30px;line-height:1}.kpi span{display:block;margin-top:6px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.dashboard{background:var(--panel);border-radius:20px;padding:25px;margin-bottom:14px}
.dashboard-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.dashboard-head h2{font-family:'Space Grotesk';font-size:27px;letter-spacing:-1px;margin:0}.dashboard-head p{font-size:11px;color:var(--muted);margin:5px 0 0}
.switch{display:flex;background:var(--panel2);padding:3px;border-radius:9px;gap:2px}.switch button{border:0;background:transparent;color:var(--muted);padding:7px 11px;border-radius:7px;font-size:10px;font-weight:800;cursor:pointer}.switch button.active{background:var(--text);color:var(--bg)}
.chart{height:235px;display:flex;align-items:flex-end;gap:8px;padding:6px 0}.bar-col{height:100%;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar-value{font-size:9px;color:var(--muted);height:12px}.bar-track{height:180px;width:100%;display:flex;align-items:flex-end;justify-content:center}.bar{width:min(34px,72%);min-height:2px;background:var(--text);border-radius:6px 6px 2px 2px}.bar-label{font-size:8px;color:var(--muted);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic-chart{display:grid;gap:11px}.topic-line{display:grid;grid-template-columns:125px 1fr 34px;align-items:center;gap:10px}.topic-label{font-size:11px;color:var(--muted)}.topic-track{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}.topic-fill{height:100%;background:var(--text);border-radius:99px}.topic-number{font-size:10px;text-align:right;color:var(--muted)}
.topic-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:18px}.topic-card{background:var(--panel2);border-radius:13px;padding:15px}.topic-card small{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}.topic-card strong{display:block;font-family:'Space Grotesk';font-size:29px;margin-top:5px}
.history-box{background:var(--panel);border-radius:20px;padding:25px;margin-top:14px}.history-box h2{font-family:'Space Grotesk';font-size:28px;letter-spacing:-1px;margin:0}.history-note{font-size:11px;color:var(--muted);margin:5px 0 16px}
.history-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.history-card{background:var(--panel2);border-radius:14px;padding:17px}.history-card-title{font-size:13px;font-weight:800}.history-card-meta{font-size:10px;color:var(--muted);margin-top:6px}.history-card-actions{margin-top:13px;display:flex;justify-content:flex-end;gap:6px}.history-card-actions .btn{font-size:10px!important;padding:7px 10px!important}
.review-panel{display:none;margin-top:12px;padding:16px 0 0;border-top:1px solid var(--line)}.review-panel.open{display:block}.review-question{padding:15px 0;border-top:1px solid var(--line)}.review-question:first-child{border-top:0}.review-qtitle{font-family:'Space Grotesk';font-size:13px;font-weight:800;margin-bottom:8px}.review-body{font-size:15px;line-height:1.8}.review-answer{margin-top:6px;font-size:10px;color:var(--muted)}.review-solution{margin-top:8px}.review-solution-body{display:none;margin-top:9px;font-size:14px;line-height:1.8}.review-solution-body.open{display:block}
.empty{color:var(--muted);font-size:12px;padding:8px 0}.account-bottom{display:flex;justify-content:center;margin-top:25px}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.topic-cards{grid-template-columns:1fr 1fr}.history-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.account-profile{padding-top:50px}.profile-avatar-wrap{width:132px}.profile-avatar{width:132px;height:132px}.account-wrap{width:calc(100% - 28px)}.kpi-grid{grid-template-columns:1fr 1fr}.dashboard,.history-box{padding:19px}.dashboard-head{align-items:flex-start;flex-direction:column}.switch{width:100%}.switch button{flex:1}.chart{height:210px;gap:4px}.bar-track{height:160px}.topic-cards{grid-template-columns:1fr 1fr}.topic-line{grid-template-columns:100px 1fr 28px}.history-grid{grid-template-columns:1fr}}
 .account-security{max-width:420px;margin:20px auto 0;text-align:center}.security-toggle{border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.security-toggle:hover{color:var(--text)}.password-panel{margin-top:12px;padding:17px;background:var(--panel);border-radius:14px;text-align:left}.password-panel .field{margin-bottom:10px}.password-panel .submit{width:100%;margin-top:4px}.password-panel .notice{margin-top:10px}.password-mail-note{margin:10px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);line-height:1.6}.password-mail-note strong{color:var(--text)}
</style>
</head>
<body>
<script>
(async()=>{
  const u=await requireUser(); if(!u)return;
  try{
    const {db}=await fb();
    const {doc,setDoc}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
    const now=new Date().toISOString();
    await setDoc(doc(db,'publicProfiles',u.id),{uid:u.id,name:u.name||'KARP Member',nameLower:String(u.name||'KARP Member').trim().toLowerCase(),photoURL:u.photoURL||'',updatedAt:now},{merge:true});
  }catch(e){console.warn('Could not sync public profile',e)}
  await karpMigrateLocalState();
  const cloudState=await karpUserState().catch(e=>{console.warn('KARP account cloud state unavailable:',e);return {solved:{},saved:{},mocks:[],activeMock:null};});
  const solved=Object.values(cloudState.solved||{});
  const saved=Object.values(cloudState.saved||{});
  const mocks=Array.isArray(cloudState.mocks)?cloudState.mocks:[];
  const exams=(await api('/api/exams/history').catch(()=>({history:[]}))).history||[];

  const topicName=v=>({A:'Algebra',C:'Combinatorics',G:'Geometry',N:'Number Theory'}[String(v||'').toUpperCase()]||String(v||''));
  function problemHref(p){if(p.sourceType==='custom'||p.customId)return '/problem.html?custom='+encodeURIComponent(p.customId||p.id);return '/problem.html?id='+encodeURIComponent(p.id)+(p.sourceConfig?'&config='+encodeURIComponent(p.sourceConfig):'')+(p.sourceIndex!=null?'&offset='+encodeURIComponent(p.sourceIndex):'');}
  function meta(p){return [p.country,p.competition,p.year,p.problemNumber].filter(Boolean).join(' · ')||topicName(p.category||p.topic)||'Problem';}
  function dateText(v){const d=v?new Date(v):null;return d&&!isNaN(d)?d.toLocaleString():'—';}
  function md(x){return DOMPurify.sanitize(marked.parse(String(x||''),{breaks:true}));}

  const solvedDates=solved.flatMap(p=>Array.isArray(p.dates)?p.dates:[]);
  const days=new Set(solvedDates.map(v=>{const d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,10)}).filter(Boolean));
  let streak=0;for(let d=new Date();days.has(d.toISOString().slice(0,10));d.setDate(d.getDate()-1))streak++;

  function dataFor(mode){
    const now=new Date(),a=[];
    if(mode==='daily'){for(let i=13;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);const key=d.toISOString().slice(0,10);a.push({label:i===0?'Today':String(d.getDate()),value:solvedDates.filter(v=>String(v).slice(0,10)===key).length});}}
    else if(mode==='monthly'){for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);a.push({label:d.toLocaleString(undefined,{month:'short'}),value:solvedDates.filter(v=>{const x=new Date(v);return !isNaN(x)&&x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()}).length});}}
    else{for(let i=4;i>=0;i--){const y=now.getFullYear()-i;a.push({label:String(y),value:solvedDates.filter(v=>{const x=new Date(v);return !isNaN(x)&&x.getFullYear()===y}).length});}}
    return a;
  }
  function chartHtml(mode){
    const data=dataFor(mode),max=Math.max(1,...data.map(x=>x.value));
    if(!data.some(x=>x.value))return '<div class="chart"><div style="margin:auto;color:var(--muted);font-size:12px">No solved activity yet.</div></div>';
    return '<div class="chart">'+data.map(x=>'<div class="bar-col"><div class="bar-value">'+x.value+'</div><div class="bar-track"><div class="bar" style="height:'+Math.max(2,x.value/max*100)+'%"></div></div><div class="bar-label">'+escapeHtml(x.label)+'</div></div>').join('')+'</div>';
  }

  const totals={A:0,C:0,G:0,N:0};
  solved.forEach(x=>{const k=String(x.category||'').toUpperCase();if(totals[k]!=null)totals[k]++;else{const n=topicName(x.topic).toLowerCase();if(n==='algebra')totals.A++;else if(n==='combinatorics')totals.C++;else if(n==='geometry')totals.G++;else if(n==='number theory')totals.N++;}});
  const maxTopic=Math.max(1,...Object.values(totals));

  const body='<main class="account-page"><section class="account-profile">'+
    '<div class="profile-avatar-wrap">'+
      '<img class="profile-avatar" id="account-avatar" src="'+escapeHtml(u.photoURL||'')+'" style="'+(u.photoURL?'':'display:none')+'" alt="">'+
      '<div class="profile-avatar profile-initial" id="account-initial" style="'+(u.photoURL?'display:none':'')+'">'+escapeHtml((u.name||'K').charAt(0).toUpperCase())+'</div>'+
      '<button class="profile-edit" id="profile-edit" type="button" aria-label="Change profile picture" title="Change profile picture">✎</button>'+
      '<input id="profile-picker" type="file" accept="image/*" hidden>'+
    '</div>'+
    '<div class="profile-name">'+escapeHtml(u.name||'KARP Member')+'</div><div class="profile-email">'+escapeHtml(u.email||'')+'</div>'+
    '</section><section class="account-wrap">'+
    '<div class="kpi-grid"><div class="kpi"><strong>'+solved.length+'</strong><span>Solved</span></div><div class="kpi"><strong>'+streak+'</strong><span>Day streak</span></div><div class="kpi"><strong>'+saved.length+'</strong><span>Saved</span></div><div class="kpi"><strong>'+exams.length+'</strong><span>Exams</span></div><div class="kpi"><strong>'+mocks.length+'</strong><span>Mocks</span></div></div>'+
    '<section class="dashboard"><div class="dashboard-head"><div><h2>Solved activity</h2><p>Daily, monthly and yearly progress.</p></div><div class="switch" id="activity-switch"><button class="active" data-mode="daily">Daily</button><button data-mode="monthly">Monthly</button><button data-mode="yearly">Yearly</button></div></div><div id="activity-chart">'+chartHtml('daily')+'</div></section>'+
    '<section class="dashboard"><div class="dashboard-head"><div><h2>Topic distribution</h2><p>How your solved problems are distributed across olympiad topics.</p></div></div>'+
      '<div class="topic-cards"><div class="topic-card"><small>Algebra</small><strong>'+totals.A+'</strong></div><div class="topic-card"><small>Geometry</small><strong>'+totals.G+'</strong></div><div class="topic-card"><small>Combinatorics</small><strong>'+totals.C+'</strong></div><div class="topic-card"><small>Number Theory</small><strong>'+totals.N+'</strong></div></div>'+
      '<div class="topic-chart">'+[['A','Algebra'],['G','Geometry'],['C','Combinatorics'],['N','Number Theory']].map(x=>'<div class="topic-line"><div class="topic-label">'+x[1]+'</div><div class="topic-track"><div class="topic-fill" style="width:'+(totals[x[0]]/maxTopic*100)+'%"></div></div><div class="topic-number">'+totals[x[0]]+'</div></div>').join('')+'</div>'+
    '</section>'+
    '<section class="history-box"><h2>Solved</h2><div class="history-note">Small cards. Click Open to return to the exact problem.</div><div id="solved-list" class="history-grid"></div></section>'+
    '<section class="history-box"><h2>Saved</h2><div class="history-note">Your saved problems, each linked directly to its problem page.</div><div id="saved-list" class="history-grid"></div></section>'+
    '<section class="history-box"><h2>Exam History</h2><div class="history-note">Open Review to see the selected exam in this section.</div><div id="exam-list" class="history-grid"></div></section>'+
    '<section class="history-box"><h2>Mock History</h2><div class="history-note">Open Review to see that mock. Questions and solutions stay collapsed until you open them.</div><div id="mock-list" class="history-grid"></div></section>'+
    `<section class="account-security">
      <button class="security-toggle" id="password-toggle" type="button">Change password</button>
      <div class="password-panel" id="password-panel" style="display:none">
        <div class="field"><label>Current password</label><input class="input" id="current-password" type="password" autocomplete="current-password"></div>
        <div class="field"><label>New password</label><input class="input" id="new-password" type="password" autocomplete="new-password" minlength="6"></div>
        <div class="field"><label>Confirm new password</label><input class="input" id="confirm-password" type="password" autocomplete="new-password" minlength="6"></div>
        <button class="submit" id="password-save" type="button">Update password</button>
        <div class="small password-mail-note">If you use <strong>Forgot password?</strong> on the login page, also check your <strong>Spam</strong> or <strong>Junk</strong> folder for the reset email.</div><div class="notice" id="password-notice"></div>
      </div>
    </section>`+
    '<div class="account-bottom">'+(u.role==='admin'?'<a class="btn" href="/admin.html">Admin</a>':'')+' <button class="btn" onclick="logout()">Log out</button></div>'+
    '</section></main>';
  shell('','Account',body);

  const passwordToggle=document.getElementById('password-toggle');
  const passwordPanel=document.getElementById('password-panel');
  const passwordSave=document.getElementById('password-save');
  const passwordNotice=document.getElementById('password-notice');
  const passwordCurrent=document.getElementById('current-password');
  const passwordNew=document.getElementById('new-password');
  const passwordConfirm=document.getElementById('confirm-password');
  const passwordProvider=(u.providerData||[]).find(p=>p.providerId==='password');
  if(!passwordProvider){passwordToggle.style.display='none';}
  passwordToggle.onclick=()=>{passwordPanel.style.display=passwordPanel.style.display==='none'?'block':'none';};
  passwordSave.onclick=async()=>{
    const current=passwordCurrent.value,newPass=passwordNew.value,confirmPass=passwordConfirm.value;
    passwordNotice.className='notice';
    if(!current||!newPass||!confirmPass){passwordNotice.className='notice error';passwordNotice.textContent='Please fill in all password fields.';return}
    if(newPass.length<6){passwordNotice.className='notice error';passwordNotice.textContent='New password must be at least 6 characters.';return}
    if(newPass!==confirmPass){passwordNotice.className='notice error';passwordNotice.textContent='New passwords do not match.';return}
    passwordSave.disabled=true;passwordSave.textContent='Updating…';
    try{
      const {auth}=await fb();
      const {EmailAuthProvider,reauthenticateWithCredential,updatePassword}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js');
      const credential=EmailAuthProvider.credential(auth.currentUser.email,current);
      await reauthenticateWithCredential(auth.currentUser,credential);
      await updatePassword(auth.currentUser,newPass);
      passwordNotice.className='notice success';passwordNotice.textContent='Password updated successfully.';
      passwordCurrent.value='';passwordNew.value='';passwordConfirm.value='';
    }catch(e){
      passwordNotice.className='notice error';
      passwordNotice.textContent=e.code==='auth/invalid-credential'?'Current password is incorrect.':e.code==='auth/weak-password'?'New password is too weak.':(e.message||'Could not update your password.');
    }finally{passwordSave.disabled=false;passwordSave.textContent='Update password';}
  };

  const avatarPicker=document.getElementById('profile-picker');
  const avatarEdit=document.getElementById('profile-edit');
  const avatarImg=document.getElementById('account-avatar');
  const avatarInitial=document.getElementById('account-initial');

  async function compressAvatar(file){
    if(!file||!file.type.startsWith('image/')) throw new Error('Please choose an image file.');
    let raw;
    if(window.createImageBitmap) raw=await createImageBitmap(file);
    else raw=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=reader.result;};
      reader.onerror=reject;reader.readAsDataURL(file);
    });
    const maxSide=256;
    const scale=Math.min(1,maxSide/Math.max(raw.width,raw.height));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(raw.width*scale));
    canvas.height=Math.max(1,Math.round(raw.height*scale));
    const ctx=canvas.getContext('2d');
    ctx.drawImage(raw,0,0,canvas.width,canvas.height);
    raw.close?.();
    let quality=.78;
    let url=canvas.toDataURL('image/jpeg',quality);
    while(url.length>240000&&quality>.48){
      quality-=.06;
      url=canvas.toDataURL('image/jpeg',quality);
    }
    if(url.length>260000) throw new Error('Image is too large after compression. Please choose another image.');
    return url;
  }

  avatarEdit.onclick=()=>avatarPicker.click();
  avatarPicker.onchange=async()=>{
    const file=avatarPicker.files?.[0];
    if(!file)return;
    avatarEdit.disabled=true;
    avatarEdit.textContent='…';
    try{
      const photoURL=await compressAvatar(file);
      const {db}=await fb();
      const {doc,setDoc}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
      await setDoc(doc(db,'users',u.id),{photoURL,updatedAt:new Date().toISOString()},{merge:true});
      await setDoc(doc(db,'publicProfiles',u.id),{uid:u.id,name:u.name||'KARP Member',nameLower:String(u.name||'KARP Member').trim().toLowerCase(),photoURL,updatedAt:new Date().toISOString()},{merge:true});
      u.photoURL=photoURL;
      avatarImg.src=photoURL;
      avatarImg.style.display='block';
      avatarInitial.style.display='none';
      document.querySelectorAll('.nav-profile').forEach(el=>{el.innerHTML='<img src="'+escapeHtml(photoURL)+'" alt="" class="nav-profile-img">';});
      toast('Profile picture updated.');
    }catch(e){toast(e.message||'Could not update profile picture.');}
    finally{avatarEdit.disabled=false;avatarEdit.textContent='✎';avatarPicker.value='';}
  };

  const fillSimple=(id,items)=>{
    const host=document.getElementById(id);
    if(!items.length){host.innerHTML='<div class="empty">Nothing here yet.</div>';return;}
    host.innerHTML=items.map((p,i)=>'<div class="history-card"><div class="history-card-title">'+escapeHtml(p.title||p.competition||'MathNet Problem')+'</div><div class="history-card-meta">'+escapeHtml(meta(p))+'</div><div class="history-card-actions"><a class="btn" href="'+problemHref(p)+'">Open</a></div></div>').join('');
  };
  fillSimple('solved-list',solved.slice().reverse());
  fillSimple('saved-list',saved.slice().reverse());

  const examList=document.getElementById('exam-list');
  if(!exams.length)examList.innerHTML='<div class="empty">No completed exams yet.</div>';
  else examList.innerHTML=exams.map((e,i)=>'<div class="history-card"><div class="history-card-title">'+escapeHtml(e.titleEn||e.title||'Exam')+'</div><div class="history-card-meta">'+escapeHtml(dateText(e.submittedAt))+'</div><div class="history-card-actions"><a class="btn" href="/exam.html?id='+encodeURIComponent(e.examId||e.id||'')+'&review=1">Review</a></div></div>').join('');

  const mockList=document.getElementById('mock-list');
  if(!mocks.length)mockList.innerHTML='<div class="empty">No mocks yet.</div>';
  else mockList.innerHTML=mocks.map((m,i)=>{const done=!!m.completedAt||m.status==='completed';return '<div class="history-card"><div class="history-card-title">'+escapeHtml(m.title||('Mock '+(mocks.length-i)))+'</div><div class="history-card-meta">'+escapeHtml(done?dateText(m.completedAt):'Saved draft · '+dateText(m.savedAt||m.createdAt))+' · '+escapeHtml((m.questions?.length||0)+' questions · '+(m.minutes||0)+' min')+'</div><div class="history-card-actions"><a class="btn" href="/mock.html?'+(done?'review=':'saved=')+encodeURIComponent(m.id||'')+'">'+(done?'Review':'Open')+'</a><button class="btn danger" data-delete-mock="'+escapeHtml(m.id||'')+'">Delete</button></div></div>'}).join('');

  document.querySelectorAll('#mock-list [data-delete-mock]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this mock permanently?'))return;try{await karpDeleteUserRecord('mockHistory',String(b.dataset.deleteMock));b.closest('.history-card')?.remove();toast('Mock deleted.');}catch(e){toast(e.message||'Could not delete mock.')}});
  document.querySelectorAll('#activity-switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#activity-switch button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('activity-chart').innerHTML=chartHtml(b.dataset.mode);});
})();
</script>
</body>
</html>
