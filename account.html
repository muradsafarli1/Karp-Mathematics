<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Account</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
<style>
.account-simple{min-height:calc(100vh - 76px)}
.account-identity{text-align:center;padding:72px 20px 50px}
.account-identity h1{font-family:'Space Grotesk';font-size:clamp(52px,7vw,88px);line-height:.95;letter-spacing:-4px;margin:0 0 24px}
.account-avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:1px solid var(--line);background:var(--panel2)}
.account-avatar-initial{display:grid;place-items:center;font-size:36px;font-weight:800;color:var(--text)}
.account-name{font-size:16px;font-weight:800}.account-email{font-size:12px;color:var(--muted);margin-top:4px}
.account-content{width:min(calc(100% - 42px),1180px);margin:0 auto;padding-bottom:70px}
.account-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.account-stat-button{border:1px solid transparent;border-radius:16px;background:var(--panel2);color:var(--text);padding:22px 14px;text-align:center;cursor:pointer;transition:transform .15s,background .15s}
.account-stat-button:hover{transform:translateY(-2px);background:var(--panel2)}
.account-stat-button.active{outline:2px solid var(--text);outline-offset:-2px}
.account-stat-number{font-family:'Space Grotesk';font-size:34px;font-weight:800;line-height:1}
.account-stat-label{font-size:11px;color:var(--muted);margin-top:7px}
.account-panel{display:none;margin-top:16px;padding:26px;border-radius:18px;background:var(--panel2)}
.account-panel.open{display:block}
.account-panel-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:15px}
.account-panel-head h2{font-family:'Space Grotesk';font-size:27px;letter-spacing:-1px;margin:0}
.account-panel-head span{font-size:11px;color:var(--muted)}
.account-row{display:flex;align-items:center;gap:15px;padding:16px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--text)}
.account-row:first-child{border-top:0}.account-row-main{min-width:0;flex:1}.account-row-title{font-size:14px;font-weight:800}.account-row-meta{font-size:11px;color:var(--muted);margin-top:5px}.account-row-arrow{font-size:14px;color:var(--muted)}
.mock-review{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.mock-review-question{padding:18px 0;border-top:1px solid var(--line)}
.mock-review-question:first-child{border-top:0}
.mock-review-statement{font-size:17px;line-height:1.85}
.mock-review-solution{margin-top:8px}.mock-review-solution button{font-size:11px}
.mock-review-body{display:none;margin-top:10px;font-size:16px;line-height:1.85}.mock-review-body.open{display:block}
.account-bottom{display:flex;justify-content:center;margin-top:22px;gap:8px;flex-wrap:wrap}
@media(max-width:900px){.account-stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.account-identity{padding-top:52px}.account-content{width:calc(100% - 28px)}.account-stats{grid-template-columns:repeat(2,1fr)}.account-panel{padding:20px}}
</style>
</head>
<body>
<script>
(async()=>{
  const u=await requireUser();
  if(!u)return;

  const solvedMap=()=>{
    try{
      const a=JSON.parse(localStorage.getItem('able_solved_problems')||'{}');
      const b=JSON.parse(localStorage.getItem('karp_solved_mathnet')||'{}');
      return {...a,...b};
    }catch{return {}}
  };
  const savedMap=()=>{
    try{return JSON.parse(localStorage.getItem('karp_saved_mathnet')||'{}')}catch{return {}}
  };
  const mockHistory=()=>{
    try{return JSON.parse(localStorage.getItem('karp_mock_history')||'[]')}catch{return []}
  };
  const solved=Object.entries(solvedMap()).map(([id,v])=>({id,...v}));
  const saved=Object.values(savedMap());
  const exams=(await api('/api/exams/history').catch(()=>({history:[]}))).history||[];
  const mocks=mockHistory();
  const dates=solved.flatMap(x=>Array.isArray(x.dates)?x.dates:[]).map(x=>new Date(x)).filter(x=>!isNaN(x));
  const dayKeys=new Set(dates.map(d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()));
  let streak=0;for(let d=new Date();dayKeys.has(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime());d.setDate(d.getDate()-1))streak++;

  function labelTopic(p){
    const m={A:'Algebra',C:'Combinatorics',G:'Geometry',N:'Number Theory'};
    return p.topic||p.category&&m[p.category]||'Problem';
  }
  function problemHref(p){
    return '/problem.html?id='+encodeURIComponent(p.id)+(p.sourceConfig?'&config='+encodeURIComponent(p.sourceConfig):'')+(p.sourceIndex!=null?'&offset='+encodeURIComponent(p.sourceIndex):'');
  }
  function meta(p){
    return [p.country,p.competition,p.year,p.problemNumber].filter(Boolean).join(' · ');
  }
  function row(p,arrow=true){
    return '<a class="account-row" href="'+problemHref(p)+'"><div class="account-row-main"><div class="account-row-title">'+escapeHtml(p.title||p.competition||'MathNet Problem')+'</div><div class="account-row-meta">'+escapeHtml(meta(p)||labelTopic(p))+'</div></div>'+(arrow?'<span class="account-row-arrow">→</span>':'')+'</a>';
  }

  function panel(id,title,count,body){
    return '<section id="panel-'+id+'" class="account-panel"><div class="account-panel-head"><h2>'+title+'</h2><span>'+count+'</span></div>'+body+'</section>';
  }

  shell('','Account',`
    <main class="account-simple">
      <section class="account-identity">
        <h1>Account</h1>
        <img id="avatar-img" class="account-avatar" src="${escapeHtml(u.photoURL||'')}" style="${u.photoURL?'':'display:none'}" alt="">
        <div id="avatar-initial" class="account-avatar account-avatar-initial" style="${u.photoURL?'display:none':''}">${escapeHtml((u.name||'K').charAt(0).toUpperCase())}</div>
        <div class="account-name">${escapeHtml(u.name||'KARP Member')}</div>
        <div class="account-email">${escapeHtml(u.email||'')}</div>
      </section>

      <section class="account-content">
        <div class="account-stats">
          <button class="account-stat-button" data-panel="solved"><div class="account-stat-number">${solved.length}</div><div class="account-stat-label">Solved</div></button>
          <button class="account-stat-button" data-panel="saved"><div class="account-stat-number">${saved.length}</div><div class="account-stat-label">Saved</div></button>
          <button class="account-stat-button" data-panel="exams"><div class="account-stat-number">${exams.length}</div><div class="account-stat-label">Exams</div></button>
          <button class="account-stat-button" data-panel="mocks"><div class="account-stat-number">${mocks.length}</div><div class="account-stat-label">Mocks</div></button>
          <button class="account-stat-button" data-panel="streak"><div class="account-stat-number">${streak}</div><div class="account-stat-label">Day streak</div></button>
        </div>

        <div id="panels"></div>
        <div class="account-bottom">
          ${u.role==='admin'?'<a class="btn" href="/admin.html">Admin</a>':''}
          <button class="btn" onclick="logout()">Log out</button>
        </div>
      </section>
    </main>`);

  const panels=document.getElementById('panels');
  const solvedRows=solved.slice().reverse().map(row).join('')||'<div class="empty">No solved problems yet.</div>';
  const savedRows=saved.slice().reverse().map(row).join('')||'<div class="empty">No saved problems yet.</div>';
  const examRows=exams.map(e=>'<a class="account-row" href="/exam.html?id='+encodeURIComponent(e.examId||e.id||'')+'"><div class="account-row-main"><div class="account-row-title">'+escapeHtml(e.titleEn||e.title||'Exam')+'</div><div class="account-row-meta">Submitted · '+escapeHtml(e.submittedAt?new Date(e.submittedAt).toLocaleString():'—')+'</div></div><span class="account-row-arrow">→</span></a>').join('')||'<div class="empty">No completed exams yet.</div>';
  const mockRows=mocks.map(m=>'<div class="account-row"><div class="account-row-main"><div class="account-row-title">'+escapeHtml(m.questions?.length||0)+'-question mock · '+escapeHtml(String(m.minutes||0))+' min</div><div class="account-row-meta">'+escapeHtml(m.completedAt?new Date(m.completedAt).toLocaleString():'—')+'</div></div></div>').join('')||'<div class="empty">No completed mocks yet.</div>';

  panels.innerHTML=
    panel('solved','Solved',solved.length,solvedRows)+
    panel('saved','Saved',saved.length,savedRows)+
    panel('exams','Exams',exams.length,examRows)+
    panel('mocks','Mocks',mocks.length,mockRows)+
    panel('streak','Study streak',streak,(streak?'<div class="account-row"><div class="account-row-main"><div class="account-row-title">'+streak+' consecutive day'+(streak===1?'':'s')+'</div><div class="account-row-meta">Based on your solved-problem activity.</div></div></div>':'<div class="empty">Solve a problem today to start your streak.</div>'));

  document.querySelectorAll('.account-stat-button').forEach(btn=>btn.onclick=()=>{
    const id=btn.dataset.panel;
    const p=document.getElementById('panel-'+id);
    const was=p.classList.contains('open');
    document.querySelectorAll('.account-panel').forEach(x=>x.classList.remove('open'));
    document.querySelectorAll('.account-stat-button').forEach(x=>x.classList.remove('active'));
    if(!was){p.classList.add('open');btn.classList.add('active');p.scrollIntoView({behavior:'smooth',block:'nearest'});}
  });

  const mockPanel=document.getElementById('panel-mocks');
  mocks.slice(0,1).forEach(m=>{
    if(!mockPanel)return;
    const review=document.createElement('div');review.className='mock-review';
    review.innerHTML='<div class="account-panel-head"><h2>Latest mock</h2><span>Solutions</span></div>';
    (m.questions||[]).forEach((q,i)=>{
      const sec=document.createElement('div');sec.className='mock-review-question';
      sec.innerHTML='<div class="mock-review-statement"><strong>Question '+(i+1)+'</strong><div>'+String(q.statement||'')+'</div></div>';
      const wrap=document.createElement('div');wrap.className='mock-review-solution';
      const b=document.createElement('button');b.className='btn';b.textContent='Show solution';
      const body=document.createElement('div');body.className='mock-review-body';
      body.innerHTML=(q.solutions||[]).map((s,j)=>'<div style="margin-top:8px"><div style="font-size:10px;letter-spacing:1px;color:var(--muted)">SOLUTION '+(j+1)+'</div>'+String(s)+'</div>').join('');
      b.onclick=()=>{const open=body.classList.toggle('open');b.textContent=open?'Hide solution':'Show solution';if(open)typesetMath(body)};
      wrap.appendChild(b);wrap.appendChild(body);sec.appendChild(wrap);review.appendChild(sec);
    });
    mockPanel.appendChild(review);
    typesetMath(review);
  });
})();
</script>
</body>
</html>
