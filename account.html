<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARP — Account</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const u = await requireUser();
  if (!u) return;

  const {db,storage} = await fb();
  const fs = await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
  const {doc,setDoc} = fs;
  const st = await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js');
  const {ref,uploadBytes,getDownloadURL} = st;

  let history=[];
  let content={problems:[],articles:[],contests:[],videos:[]};
  try { history=(await api('/api/exams/history')).history||[]; } catch {}
  try { content=await api('/api/content'); } catch {}

  function solvedMap(){
    try{
      const legacy=JSON.parse(localStorage.getItem('able_solved_problems')||'{}');
      const modern=JSON.parse(localStorage.getItem('karp_solved_mathnet')||'{}');
      return {...legacy,...modern};
    }catch{return {}}
  }
  function savedMap(){
    try{return JSON.parse(localStorage.getItem('karp_saved_mathnet')||'{}')}catch{return {}}
  }
  function solvedEntries(){
    return Object.entries(solvedMap()).map(([id,v])=>({
      id,topic:v?.topic||v?.category||'Other',title:v?.title||'',country:v?.country||'',
      competition:v?.competition||'',year:v?.year||'',problemNumber:v?.problemNumber||'',
      sourceIndex:v?.sourceIndex||0,dates:Array.isArray(v?.dates)?v.dates:[]
    }));
  }
  function events(){
    return solvedEntries().flatMap(x=>x.dates.map(d=>({
      id:x.id,topic:x.topic,date:new Date(d)
    }))).filter(x=>!Number.isNaN(x.date.getTime()));
  }
  function savedProblems(){
    const mathnet=Object.values(savedMap());
    const legacy=(content.problems||[]).filter(p=>localStorage.getItem('able_saved_problem_'+p.id)==='1');
    const seen=new Set();
    return [...mathnet,...legacy].filter(p=>{if(seen.has(p.id))return false;seen.add(p.id);return true;});
  }

  const solved=solvedEntries(), solvedEvents=events(), saved=savedProblems();
  const solvedCount=solved.length, savedCount=saved.length, completed=history.length;
  const totalProblems=0;

  const now=new Date();
  const startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const tomorrow=new Date(startToday);tomorrow.setDate(tomorrow.getDate()+1);
  const weekStart=new Date(startToday);weekStart.setDate(weekStart.getDate()-6);
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const yearStart=new Date(now.getFullYear(),0,1);

  function countRange(start,end){return solvedEvents.filter(e=>e.date>=start&&e.date<end).length}
  const todayCount=countRange(startToday,tomorrow);
  const weekCount=countRange(weekStart,tomorrow);
  const monthCount=countRange(monthStart,tomorrow);
  const yearCount=countRange(yearStart,tomorrow);

  function dateKey(d){
    const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    return x.getTime();
  }
  const activeDays=new Set(solvedEvents.map(e=>dateKey(e.date)));
  let streak=0;
  for(let d=new Date(startToday);;d.setDate(d.getDate()-1)){
    if(activeDays.has(dateKey(d))) streak++;
    else break;
    if(streak>366) break;
  }

  function topicMatch(topic,key){
    const t=String(topic||'').toLowerCase();
    return t===key.toLowerCase() || t.includes(key.toLowerCase()) ||
      (key==='Algebra' && (t.includes('functional equation')||t.includes('algebra')));
  }
  const topicDefs=[['Algebra','Algebra'],['Number Theory','Number Theory'],['Geometry','Geometry'],['Combinatorics','Combinatorics']];
  const topicStats=topicDefs.map(([label,key])=>{
    const items=(content.problems||[]).filter(p=>topicMatch(p.topic,key));
    const solvedN=solved.filter(s=>topicMatch(s.topic,key)).length;
    return {label,total:items.length,solved:solvedN,pct:items.length?Math.min(100,Math.round(solvedN/items.length*100)):0};
  });

  function series(mode){
    const arr=[];
    if(mode==='week'){
      for(let i=6;i>=0;i--){
        const d=new Date(startToday);d.setDate(d.getDate()-i);
        const n=new Date(d);n.setDate(n.getDate()+1);
        arr.push({label:d.toLocaleDateString(undefined,{weekday:'short'}),count:countRange(d,n)});
      }
    }else if(mode==='month'){
      const days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
      for(let i=1;i<=days;i++){
        const a=new Date(now.getFullYear(),now.getMonth(),i),b=new Date(a);b.setDate(b.getDate()+1);
        arr.push({label:String(i),count:countRange(a,b)});
      }
    }else{
      for(let i=0;i<12;i++){
        const a=new Date(now.getFullYear(),i,1),b=new Date(now.getFullYear(),i+1,1);
        arr.push({label:a.toLocaleDateString(undefined,{month:'short'}),count:countRange(a,b)});
      }
    }
    return arr;
  }

  function chart(mode){
    const data=series(mode),max=Math.max(1,...data.map(x=>x.count));
    return '<div class="trend-chart">'+data.map(x=>'<div class="trend-col"><div class="trend-value">'+(x.count||'')+'</div><div class="trend-bar-wrap"><div class="trend-bar" style="height:'+Math.max(4,Math.round(x.count/max*100))+'%"></div></div><div class="trend-label">'+escapeHtml(x.label)+'</div></div>').join('')+'</div>';
  }

  function heatmap(){
    const counts={};
    solvedEvents.forEach(e=>{
      const k=dateKey(e.date);
      counts[k]=(counts[k]||0)+1;
    });
    const days=[];
    const start=new Date(startToday);start.setDate(start.getDate()-83);
    for(let i=0;i<84;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);
      const c=counts[dateKey(d)]||0;
      const level=c===0?0:c===1?1:c===2?2:3;
      days.push('<span class="heat-cell level-'+level+'" title="'+c+' solved · '+d.toLocaleDateString()+'"></span>');
    }
    return days.join('');
  }

  function relativeDate(d){
    const x=new Date(d), diff=Math.floor((Date.now()-x.getTime())/86400000);
    if(diff<=0)return 'Today';
    if(diff===1)return 'Yesterday';
    if(diff<7)return diff+' days ago';
    return x.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  }

  function topicForProblem(p){
    const labels={A:'Algebra',C:'Combinatorics',G:'Geometry',N:'Number Theory'};
    return p.topic || labels[p.category] || 'Problem';
  }

  function render(mode='week'){
    const initial=escapeHtml((u.name||'A').trim().charAt(0).toUpperCase());
    shell('', 'Account', `
      <main class="account-page">
        <section class="account-hero">
          <div class="wrap">
            <div class="account-hero-grid">
              <div>
                <div class="eyebrow">KARP ACCOUNT</div>
                <h1>Your mathematics dashboard</h1>
                <p class="lead">Track your problems, study rhythm, exam history and olympiad progress from one focused workspace.</p>
              </div>
              <div class="hero-profile">
                <div class="hero-avatar-wrap">
                  <img id="hero-photo" class="profile-avatar-large" src="${escapeHtml(u.photoURL||'')}" alt="" style="${u.photoURL?'':'display:none'}">
                  <div id="hero-initial" class="profile-avatar-large profile-initial" style="${u.photoURL?'display:none':''}">${initial}</div>
                </div>
                <div class="hero-profile-name">${escapeHtml(u.name||'KARP Member')}</div>
                <div class="hero-profile-email">${escapeHtml(u.email||'')}</div>
              </div>
            </div>
          </div>
        </section>

        <section class="section account-dashboard">
          <div class="wrap">
            <div class="account-stats">
              <div class="account-stat stat-featured"><span class="stat-icon">✓</span><div><div class="account-stat-value">${solvedCount}</div><div class="account-stat-label">Solved problems</div></div><small</small></div>
              <div class="account-stat"><span class="stat-icon">↗</span><div><div class="account-stat-value">${completed}</div><div class="account-stat-label">Completed exams</div></div></div>
              <div class="account-stat"><span class="stat-icon">☆</span><div><div class="account-stat-value">${savedCount}</div><div class="account-stat-label">Saved problems</div></div></div>
              <div class="account-stat"><span class="stat-icon">◷</span><div><div class="account-stat-value">${streak}</div><div class="account-stat-label">Day streak</div></div></div>
            </div>

            <div class="account-grid">
              <section class="account-card activity-card">
                <div class="account-card-head">
                  <div><div class="tag">ACTIVITY</div><h2>Problem-solving rhythm</h2><p class="card-subtitle">Your solved-problem activity over time.</p></div>
                  <span id="trend-total" class="small"></span>
                </div>
                <div class="trend-tabs">
                  <button class="trend-tab ${mode==='week'?'active':''}" data-mode="week">Week</button>
                  <button class="trend-tab ${mode==='month'?'active':''}" data-mode="month">Month</button>
                  <button class="trend-tab ${mode==='year'?'active':''}" data-mode="year">Year</button>
                </div>
                <div id="trend-chart">${chart(mode)}</div>
                <div class="activity-summary">
                  <div><strong>${todayCount}</strong><span>today</span></div>
                  <div><strong>${weekCount}</strong><span>last 7 days</span></div>
                  <div><strong>${monthCount}</strong><span>this month</span></div>
                </div>
              </section>

              <section class="account-card profile-card">
                <div class="tag">PROFILE</div>
                <div class="profile-photo-stack">
                  <img id="profile-photo" class="profile-avatar" src="${escapeHtml(u.photoURL||'')}" alt="Profile photo" style="${u.photoURL?'':'display:none'}">
                  <div id="profile-initial" class="profile-avatar profile-initial" style="${u.photoURL?'display:none':''}">${initial}</div>
                </div>
                <h2>${escapeHtml(u.name||'KARP Member')}</h2>
                <p class="small">${escapeHtml(u.email||'')}</p>
                <label class="btn profile-upload" for="profile-file">Change profile photo</label>
                <input id="profile-file" type="file" accept="image/png,image/jpeg,image/webp" style="display:none">
                <div class="profile-meta">
                  <div><span>Role</span><strong>${escapeHtml(u.role||'user')}</strong></div>
                  <div><span>Member since</span><strong>${u.createdAt?new Date(u.createdAt).toLocaleDateString():'—'}</strong></div>
                </div>
                <div class="profile-actions">${u.role==='admin'?'<a class="btn primary" href="/admin.html">Admin Panel</a>':''}<button class="btn" onclick="logout()">Log out</button></div>
                <div id="photo-status" class="notice"></div>
              </section>
            </div>

            <div class="dashboard-two-col">
              <section class="account-card account-section-card">
                <div class="account-card-head">
                  <div><div class="tag">CONSISTENCY</div><h2>Study activity</h2><p class="card-subtitle">Your last 12 weeks, day by day.</p></div>
                  <span class="heat-legend"><i></i>Less <b></b>More</span>
                </div>
                <div class="heatmap">${heatmap()}</div>
                <div class="heat-footer"><span>84-day window</span><strong>${solvedEvents.length} total solve events</strong></div>
              </section>

              <section class="account-card account-section-card">
                <div class="account-card-head">
                  <div><div class="tag">PACE</div><h2>Your pace</h2><p class="card-subtitle">A compact view of your current momentum.</p></div>
                </div>
                <div class="pace-grid">
                  <div><strong>${todayCount}</strong><span>Today</span></div>
                  <div><strong>${weekCount}</strong><span>7 days</span></div>
                  <div><strong>${monthCount}</strong><span>This month</span></div>
                  <div><strong>${yearCount}</strong><span>This year</span></div>
                </div>
              </section>
            </div>

            <section class="account-card account-section-card">
              <div class="account-card-head">
                <div><div class="tag">TOPICS</div><h2>Where you are solving</h2><p class="card-subtitle">Solved problems grouped against the current archive.</p></div>
              </div>
              <div class="topic-grid">
                ${topicStats.map(t=>'<div class="topic-card"><div class="topic-ring" style="--pct:'+t.pct+'%"><span>'+t.solved+'</span></div><div class="topic-name">'+t.label+'</div><div class="topic-line"><span>'+t.solved+' solved</span><span>'+t.total+' in archive</span></div><div class="topic-progress"><i style="width:'+t.pct+'%"></i></div></div>').join('')}
              </div>
            </section>

            <div class="dashboard-two-col lower-grid">
              <section class="account-card account-section-card">
                <div class="account-card-head">
                  <div><div class="tag">SAVED</div><h2>Your saved problems</h2></div>
                  <a class="text-link" href="/problems.html">Browse archive →</a>
                </div>
                ${saved.length?saved.slice(0,5).map(p=>'<a class="saved-row" href="/problem.html?id='+encodeURIComponent(p.id)+(p.sourceIndex!=null?'&offset='+encodeURIComponent(p.sourceIndex):'')+'"><div><strong>'+escapeHtml(localized(p,'title'))+'</strong><span>'+escapeHtml(topicForProblem(p))+(p.difficulty?' · '+escapeHtml(p.difficulty):'')+'</span></div><span class="saved-check">Saved ✓</span></a>').join(''):'<div class="empty account-empty">No saved problems yet. Open a problem and press Save.</div>'}
              </section>

              <section class="account-card account-section-card">
                <div class="account-card-head">
                  <div><div class="tag">RECENT</div><h2>Recently solved</h2></div>
                  <a class="text-link" href="/problems.html">All problems →</a>
                </div>
                ${solvedEvents.length?[...solvedEvents].sort((a,b)=>b.date-a.date).slice(0,5).map(e=>{
                  const p=(content.problems||[]).find(x=>x.id===e.id);
                  return '<a class="recent-row" href="/problem.html?id='+encodeURIComponent(e.id)+(e.sourceIndex!=null?'&offset='+encodeURIComponent(e.sourceIndex):'')+'"><span class="recent-dot"></span><div><strong>'+escapeHtml(p?localized(p,'title'):(e.title||'Problem'))+'</strong><span>'+escapeHtml(e.topic)+' · '+relativeDate(e.date)+'</span></div><span class="recent-arrow">→</span></a>';
                }).join(''):'<div class="empty account-empty">No solved problems yet.</div>'}
              </section>
            </div>

            <section class="account-card account-section-card">
              <div class="account-card-head">
                <div><div class="tag">EXAMS</div><h2>Exam history</h2><p class="card-subtitle">Your completed KARP exams.</p></div>
                <a class="text-link" href="/exams.html">View exams →</a>
              </div>
              ${history.length?history.slice(0,8).map(h=>'<div class="exam-history-row"><div><strong>'+escapeHtml(h.titleEn||h.title||'Exam')+'</strong><span class="small">Submitted '+(h.submittedAt?new Date(h.submittedAt).toLocaleString():'—')+'</span></div><a class="btn" href="/exam.html?id='+encodeURIComponent(h.examId)+'">Review</a></div>').join(''):'<div class="empty account-empty">No completed exams yet.</div>'}
            </section>
          </div>
        </section>
      </main>

      <style>
        .account-page{min-height:70vh}
        .account-hero{padding:62px 0 50px;border-bottom:1px solid var(--line,#292d34);background:radial-gradient(circle at 82% 0,rgba(100,110,220,.13),transparent 35%),radial-gradient(circle at 8% 100%,rgba(60,210,230,.06),transparent 30%)}
        .account-hero-grid{display:flex;align-items:center;justify-content:space-between;gap:42px}
        .account-hero h1{font-family:'Space Grotesk';font-size:clamp(46px,6vw,78px);line-height:.98;letter-spacing:-4px;margin:8px 0 16px;max-width:760px}
        .hero-profile{text-align:right;min-width:220px}.hero-avatar-wrap{display:flex;justify-content:flex-end}.profile-avatar-large{width:92px;height:92px;border-radius:50%;object-fit:cover;border:1px solid var(--line,#292d34);box-shadow:0 12px 35px rgba(0,0,0,.16)}
        .profile-initial{display:grid;place-items:center;background:#20242b;font-size:30px;font-weight:800;color:#fff}.hero-profile-name{margin-top:12px;font-weight:800;font-size:16px}.hero-profile-email{font-size:12px;color:#7d838e;margin-top:3px}
        .account-dashboard{padding-top:44px}
        .account-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.account-stat{position:relative;display:flex;align-items:center;gap:13px;min-height:104px;padding:20px 21px;border:1px solid var(--line,#292d34);background:var(--panel,#101216);border-radius:18px;overflow:hidden}
        .account-stat:after{content:"";position:absolute;right:-25px;top:-25px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,rgba(150,160,255,.13),transparent 67%);pointer-events:none}
        .account-stat.stat-featured{border-color:#3c4354}.stat-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--line,#292d34);background:rgba(255,255,255,.03);font-size:16px}.account-stat-value{font-size:32px;font-weight:800;letter-spacing:-1.2px;line-height:1}.account-stat-label{margin-top:5px;color:#858b96;font-size:12px}.account-stat small{position:absolute;right:15px;bottom:12px;color:#69707b;font-size:10px}
        .account-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.72fr);gap:18px}.dashboard-two-col{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:18px}
        .account-card{border:1px solid var(--line,#292d34);background:var(--panel,#101216);border-radius:18px;padding:26px}.account-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}.account-card h2{font-family:'Space Grotesk';font-size:27px;letter-spacing:-.9px;margin:7px 0 0}.card-subtitle{margin:6px 0 0;color:#747b86;font-size:12px}.account-section-card{margin-top:18px}
        .trend-tabs{display:flex;gap:6px;margin-bottom:18px}.trend-tab{border:1px solid var(--line,#292d34);background:transparent;color:#8d94a0;border-radius:9px;padding:7px 12px;font-size:12px}.trend-tab.active{background:#fff;color:#15171a;border-color:#fff}
        .trend-chart{height:250px;display:flex;align-items:stretch;gap:7px;padding:12px 0 0;border-top:1px solid var(--line,#292d34)}.trend-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;gap:6px}.trend-value{font-size:10px;color:#7f8792;height:14px}.trend-bar-wrap{height:172px;width:100%;display:flex;align-items:flex-end}.trend-bar{width:100%;max-width:30px;margin:auto;background:#eef0ff;border-radius:7px 7px 3px 3px;min-height:3px;transition:height .25s ease}.trend-label{font-size:10px;color:#747a84}.activity-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.activity-summary>div{padding:12px;border:1px solid var(--line,#292d34);border-radius:12px}.activity-summary strong{display:block;font-size:18px}.activity-summary span{display:block;color:#747a84;font-size:11px;margin-top:2px}
        .profile-card{text-align:center}.profile-photo-stack{min-height:84px;display:grid;place-items:center}.profile-avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;margin:2px auto 15px;border:1px solid #343943}.profile-card h2{font-size:25px}.profile-card p{margin:5px 0 15px}.profile-upload{display:inline-block;margin-bottom:8px}.profile-meta{border-top:1px solid var(--line,#292d34);border-bottom:1px solid var(--line,#292d34);padding:14px 0;margin:16px 0}.profile-meta div{display:flex;justify-content:space-between;gap:15px;text-align:left;padding:5px 0}.profile-meta span{color:#747a84}.profile-meta strong{font-size:13px}.profile-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.notice{min-height:18px}
        .heatmap{display:grid;grid-template-columns:repeat(21,1fr);gap:5px;padding:10px 0}.heat-cell{aspect-ratio:1;border-radius:4px;border:1px solid rgba(255,255,255,.035);background:#1b1e23}.heat-cell.level-1{background:#565d79}.heat-cell.level-2{background:#8b95c7}.heat-cell.level-3{background:#eef0ff}.heat-footer{display:flex;justify-content:space-between;gap:15px;color:#737a84;font-size:11px}.heat-footer strong{color:var(--text)}
        .heat-legend{display:flex;align-items:center;gap:5px;color:#737a84;font-size:10px;white-space:nowrap}.heat-legend i,.heat-legend b{display:block;width:10px;height:10px;border-radius:3px;background:#1b1e23}.heat-legend b{background:#eef0ff}
        .pace-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pace-grid>div{padding:19px;border:1px solid var(--line,#292d34);border-radius:14px;text-align:center}.pace-grid strong{display:block;font-size:29px;letter-spacing:-1px}.pace-grid span{display:block;color:#747a84;font-size:11px;margin-top:4px}
        .topic-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.topic-card{padding:20px;border:1px solid var(--line,#292d34);border-radius:14px;background:rgba(255,255,255,.016)}.topic-ring{--pct:0%;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;margin:0 auto 13px;background:conic-gradient(#eef0ff var(--pct),#282d35 0);position:relative}.topic-ring:after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel,#101216)}.topic-ring span{position:relative;z-index:1;color:var(--text);font-size:20px;font-weight:800}.topic-name{text-align:center;font-weight:800;font-size:14px}.topic-line{display:flex;justify-content:space-between;gap:10px;margin-top:7px;color:#747a84;font-size:10px}.topic-progress{height:4px;background:#252930;border-radius:99px;overflow:hidden;margin-top:13px}.topic-progress i{display:block;height:100%;background:#eef0ff;border-radius:99px}
        .text-link{color:#aeb7ff;font-size:12px;font-weight:700;margin-top:4px;white-space:nowrap}.saved-row,.recent-row{display:flex;align-items:center;gap:12px;padding:15px 0;border-top:1px solid var(--line,#292d34)}.saved-row>div,.recent-row>div{min-width:0;flex:1}.saved-row strong,.recent-row strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved-row span,.recent-row span{display:block;color:#747a84;font-size:11px;margin-top:4px}.saved-check{color:#aeb7ff!important;font-weight:700;white-space:nowrap}.recent-dot{width:8px;height:8px;border-radius:50%;background:#eef0ff;box-shadow:0 0 0 4px rgba(238,240,255,.08)}.recent-arrow{font-size:14px!important;color:#858c97!important}
        .exam-history-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 0;border-top:1px solid var(--line,#292d34)}.exam-history-row strong{display:block;font-size:13px}.exam-history-row .small{display:block;margin-top:4px}.account-empty{padding:16px 0}.empty{color:#747a84}
        html[data-theme="light"] .account-stat,html[data-theme="light"] .account-card{background:#fff;border-color:#dedfe2}.account-stat.stat-featured{background:linear-gradient(145deg,var(--panel,#101216),rgba(150,160,255,.06))}html[data-theme="light"] .account-stat.stat-featured{background:linear-gradient(145deg,#fff,#f7f7ff)}
        html[data-theme="light"] .profile-initial{background:#eef0f2;color:#17191c;border-color:#d9dbde}html[data-theme="light"] .trend-tab.active{background:#17191c;color:#fff;border-color:#17191c}html[data-theme="light"] .trend-bar{background:#17191c}html[data-theme="light"] .heat-cell{background:#eceef0;border-color:#e0e1e4}html[data-theme="light"] .heat-cell.level-1{background:#b9bdc6}html[data-theme="light"] .heat-cell.level-2{background:#777e8b}html[data-theme="light"] .heat-cell.level-3{background:#17191c}html[data-theme="light"] .topic-ring{background:conic-gradient(#17191c var(--pct),#e4e6e8 0)}html[data-theme="light"] .topic-ring:after{background:#fff}html[data-theme="light"] .topic-progress{background:#e3e5e7}html[data-theme="light"] .topic-progress i{background:#17191c}
        @media(max-width:950px){.account-stats{grid-template-columns:repeat(2,1fr)}.account-grid,.dashboard-two-col{grid-template-columns:1fr}.topic-grid{grid-template-columns:repeat(2,1fr)}.account-hero-grid{align-items:flex-start}.hero-profile{min-width:180px}}
        @media(max-width:600px){.account-stats,.topic-grid{grid-template-columns:1fr}.account-card,.account-stat{padding:20px}.account-hero{padding:48px 0 36px}.account-hero-grid{flex-direction:column}.hero-profile{text-align:left;width:100%}.hero-avatar-wrap{justify-content:flex-start}.trend-chart{gap:3px}.trend-value{font-size:9px}.heatmap{gap:3px}.account-card-head{gap:10px}.activity-summary{grid-template-columns:1fr 1fr 1fr}}
      </style>
    `);

    const totalLabel=document.getElementById('trend-total');
    if(totalLabel) totalLabel.textContent=(mode==='week'?weekCount:mode==='month'?monthCount:yearCount)+' solved';

    document.querySelectorAll('.trend-tab').forEach(b=>b.onclick=()=>render(b.dataset.mode));

    const file=document.getElementById('profile-file');
    if(file) file.onchange=async e=>{
      const image=e.target.files?.[0];
      if(!image)return;
      const status=document.getElementById('photo-status');
      if(image.size>5*1024*1024){status.className='notice error';status.textContent='Please choose an image under 5 MB.';return}
      status.className='notice';status.textContent='Uploading…';
      try{
        const imageRef=ref(storage,'users/'+u.id+'/profile/avatar');
        await uploadBytes(imageRef,image,{contentType:image.type});
        const url=await getDownloadURL(imageRef);
        await setDoc(doc(db,'users',u.id),{photoURL:url},{merge:true});
        ['profile-photo','hero-photo'].forEach(id=>{const el=document.getElementById(id);if(el){el.src=url;el.style.display=''}})
        ['profile-initial','hero-initial'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='none'})
        status.className='notice success';status.textContent='Profile photo updated.';
      }catch(err){status.className='notice error';status.textContent=err.message}
    };
  }

  render('week');
});
</script>
</body>
</html>
