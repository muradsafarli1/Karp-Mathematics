<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — GeoGebra</title><link rel="stylesheet" href="/style.css"><script src="/app.js"></script><style>
.tool-page{height:calc(100vh - 76px);min-height:0;padding:0;background:var(--bg,#08090b);overflow:hidden}
.tool-inner{width:100%;height:100%;margin:0}
.tool-frame{width:100%;height:100%;border:0;border-radius:0;overflow:hidden;background:#fff;box-shadow:none}
#desmos-calculator,#ggb-element{width:100%;height:100%}
html[data-theme="light"] .tool-page{background:#f7f7f5}
@media(max-width:700px){.tool-page{height:calc(100vh - 76px);padding:0}.tool-frame{border-radius:0}}
</style><script src="https://www.geogebra.org/apps/deployggb.js"></script></head><body><script>
shell('Tools','GeoGebra',`<main class="tool-page"><div class="tool-inner"><div class="tool-frame"><div id="ggb-element"></div></div></div></main>`);
window.addEventListener('load',()=>{const el=document.getElementById('ggb-element');if(el&&window.GGBApplet){const params={appName:'graphing',width:el.clientWidth,height:el.clientHeight,showToolBar:true,showAlgebraInput:true,showMenuBar:true,showFullscreenButton:true,showResetIcon:true,enableShiftDragZoom:true};const applet=new GGBApplet(params,true);applet.inject('ggb-element');}});
</script></body></html>
