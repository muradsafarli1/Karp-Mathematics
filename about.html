<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KARP — About Us</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
<style>
.founder-block{max-width:1240px;margin:0 auto 34px;text-align:center;padding:0 21px}
.founder-kicker{font-size:11px;letter-spacing:2.3px;text-transform:uppercase;font-weight:800;color:#6f665d;margin-bottom:12px}
.founder-image{display:block;width:min(520px,100%);max-height:520px;object-fit:cover;margin:0 auto 18px;border-radius:18px}
.founder-block h2{font-family:'Space Grotesk';font-size:34px;letter-spacing:-1px;margin:0}
</style></head>
<body>
<script>
document.addEventListener('DOMContentLoaded', () => {
  shell('About','About Us',`
    <section class="pagehero">
      <div class="wrap">
        <h1>About Us</h1>
      </div>
    </section>
    <section class="section"><div class="wrap"><div class="about-grid">
      <article class="bigcard"><div class="tag">WHY KARP</div><h2>For people who actually want to solve.</h2><p>The goal is not to add another gamified dashboard. KARP is intentionally calmer: strong problem archives, useful handouts, contest collections, clean solutions and a library you can return to.</p></article>
      <article class="bigcard"><div class="tag">THE LIBRARY</div><h2>Built to keep growing.</h2><p>Problems, contests, articles, PDFs and LaTeX are separated into their own pages so the platform can become large without making every click a long scroll.</p></article>
      <article class="bigcard"><div class="tag">TECHNIQUE</div><h2>Ideas should travel.</h2><p>Some methods deserve to be remembered across many problems. Lambda substitution is one example: KARP can turn these recurring ideas into focused handouts rather than burying them inside solutions.</p></article>
      <article class="bigcard"><div class="tag">COMMUNITY</div><h2>Join Us.</h2><p>Create an account to keep your place in the platform. Later, the same account layer can power saved problems, submissions, contributor access and more.</p><a class="btn primary" href="/signup.html">Create an account</a></article>
    </div></div></section>
  `);
});
</script>
</body>
</html>
