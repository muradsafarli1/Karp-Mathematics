<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KARP — About Us</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
  <style>
.team-page{padding:82px 0 90px}
.team-hero{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(0,1.7fr);align-items:center;gap:clamp(38px,7vw,100px);max-width:1160px;margin:0 auto 72px}
.team-heading{text-align:left;margin:0}.team-heading h1{font-family:'Space Grotesk';font-size:clamp(34px,4vw,48px);line-height:1.08;letter-spacing:-2px;margin:0;white-space:nowrap}
.team-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:none;margin:0}.team-card{min-width:0;text-align:left}
.team-photo,.team-photo-placeholder{width:100%;aspect-ratio:4/4.2;max-height:390px;object-fit:cover;display:block;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.team-photo-placeholder{display:grid;place-items:center;color:var(--muted)}.team-card h2{font-family:'Space Grotesk';font-size:21px;letter-spacing:-.6px;margin:13px 0 1px}.team-role{color:var(--muted);font-size:14px;margin:0}
.founder-note{max-width:1120px;margin:0 auto 52px;padding:30px 34px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.founder-note .tag{margin-bottom:12px}.founder-note h2{font-family:'Space Grotesk';font-size:clamp(27px,4vw,40px);letter-spacing:-1.6px;margin:0 0 12px}.founder-note p{white-space:pre-line;color:var(--muted);font-size:15px;line-height:1.85;margin:0}
.about-grid{max-width:1120px;margin:0 auto}.about-card-image{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:14px;margin:0 0 22px}.about-grid .bigcard h2{margin-top:10px}.about-card-copy{white-space:pre-line}
@media(max-width:760px){.team-page{padding:54px 0 65px}.team-hero{grid-template-columns:1fr;gap:28px;margin-bottom:48px}.team-heading h1{font-size:clamp(34px,9vw,44px);letter-spacing:-2px}.team-grid{gap:16px}.team-photo,.team-photo-placeholder{max-height:320px}.team-card h2{font-size:18px}.founder-note{padding:23px 20px}}
@media(max-width:440px){.team-grid{grid-template-columns:1fr;gap:30px}.team-photo,.team-photo-placeholder{max-height:420px}}
  </style>
</head>
<body>
<script>
document.addEventListener('DOMContentLoaded', async ()=>{
  const defaultCards=[
    {tag:'WHY KARP',title:'For people who actually want to solve.',text:'The goal is not to add another gamified dashboard. KARP is intentionally calmer: strong problem archives, useful handouts, contest collections, clean solutions and a library you can return to.',imageUrl:'',showImage:false},
    {tag:'THE LIBRARY',title:'Built to keep growing.',text:'Problems, contests, articles, PDFs and LaTeX are separated into their own pages so the platform can become large without making every click a long scroll.',imageUrl:'',showImage:false},
    {tag:'TECHNIQUE',title:'Ideas should travel.',text:'Some methods deserve to be remembered across many problems. Lambda substitution is one example: KARP can turn these recurring ideas into focused handouts rather than burying them inside solutions.',imageUrl:'',showImage:false},
    {tag:'COMMUNITY',title:'Join Us.',text:'Create an account to keep your place in the platform. Later, the same account layer can power saved problems, submissions, contributor access and more.',imageUrl:'',showImage:false}
  ];
  let about={};try{about=(await api('/api/content')).about||{}}catch(e){about={}}
  const cards=Array.isArray(about.cards)&&about.cards.length?about.cards:defaultCards;
  const team=Array.isArray(about.team)&&about.team.length?about.team:[{name:'Murad Safarli',role:'Founder',image:''},{name:'Nuran Nurmammadov',role:'Marketing',image:''}];
  shell('About','Our Team',`
    <main class="about-page"><section class="section team-page"><div class="wrap">
      <div class="team-hero"><header class="team-heading"><h1>Our Team</h1></header>
      <div class="team-grid">${team.map(p=>'<article class="team-card">'+(String(p.image||'').trim()?'<img class="team-photo" src="'+escapeHtml(p.image)+'" alt="'+escapeHtml(p.name||'KARP team member')+'">':'<div class="team-photo-placeholder">Team photo</div>')+'<h2>'+escapeHtml(p.name||'')+'</h2><p class="team-role">'+escapeHtml(p.role||'')+'</p></article>').join('')}</div></div>
      ${String(about.founderText||'').trim()?'<section class="founder-note"><div class="tag">FROM FOUNDER</div><h2>'+escapeHtml(about.founderTitle||'')+'</h2><p>'+escapeHtml(about.founderText)+'</p></section>':''}
      <div class="about-grid">${cards.map(card=>'<article class="bigcard">'+(card.showImage&&String(card.imageUrl||'').trim()?'<img class="about-card-image" src="'+escapeHtml(card.imageUrl)+'" alt="'+escapeHtml(card.title||'')+'">':'')+(card.tag?'<div class="tag">'+escapeHtml(card.tag)+'</div>':'')+'<h2>'+escapeHtml(card.title||'')+'</h2><p class="about-card-copy">'+escapeHtml(card.text||'')+'</p></article>').join('')}</div>
    </div></section></main>
  `);
});
</script>
</body>
</html>
